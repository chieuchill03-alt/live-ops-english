"hook rate"],"rel":["warm-up","scroll-stopper","viewer retention"]},{"t":"pain point","p":"n","vi":"nỗi đau, vấn đề của khách","d":"Vấn đề hoặc khó chịu khách đang gặp mà sản phẩm giải quyết được, ví dụ da dầu, tóc rụng, nhà nhỏ thiếu chỗ cất đồ.","c":"Viết kịch bản, nội dung, quảng cáo.","ex":[["Talk about the pain point first, then show the solution.","Nói về nỗi đau của khách trước rồi mới đưa giải pháp."],["Oily skin in hot weather is a big pain point for our customers.","Da dầu khi trời nóng là nỗi đau lớn của khách mình."]],"col":["address a pain point","customer pain point","solve"],"rel":["benefit","customer persona","insight"]},{"t":"feature","p":"n","vi":"đặc điểm, tính năng","d":"Đặc tính kỹ thuật của sản phẩm: thành phần, chất liệu, dung tích, công suất. Khách ít mua vì tính năng, mà vì lợi ích tính năng mang lại.","c":"Viết mô tả sản phẩm, kịch bản.","ex":[["The feature is 5% niacinamide; the benefit is brighter skin.","Đặc điểm là 5% niacinamide, lợi ích là da sáng hơn."]],"col":["key features","product features","spec"],"rel":["benefit","selling point"],"tip":"Công thức hay dùng: Feature → Benefit (tính năng → nên khách được gì)."},{"t":"benefit","p":"n","vi":"lợi ích","d":"Điều khách nhận được nhờ tính năng sản phẩm: tiết kiệm thời gian, đẹp hơn, khỏe hơn. Host giỏi nói về lợi ích nhiều hơn tính năng.","c":"Kịch bản, mô tả, quảng cáo.","ex":[["Don't just list ingredients, explain the benefits.","Đừng chỉ liệt kê thành phần, hãy giải thích lợi ích."]],"col":["key benefit","emotional benefit","functional benefit"],"rel":["feature","pain point","value proposition"]},{"t":"selling point","p":"n","vi":"điểm bán hàng, điểm nổi bật","d":"Lý do thuyết phục khách mua. Điểm khác biệt nhất so với đối thủ gọi là USP.","c":"Brief cho host, viết kịch bản.","ex":[["The main selling point is that it lasts all day.","Điểm bán chính là giữ được cả ngày."],["Give the host three selling points per product.","Đưa cho host ba điểm bán cho mỗi sản phẩm."]],"col":["key selling point","KSP"],"rel":["USP","benefit"]},{"t":"product demo","f":"demonstration","p":"n","vi":"trình diễn sản phẩm","d":"Cho người xem thấy sản phẩm hoạt động thật: thoa kem, đổ nước vào túi chống thấm, kéo giãn vải. Demo là cách thuyết phục mạnh nhất trong live.","c":"Kịch bản, chuẩn bị đạo cụ.","ex":[["The demo of the waterproof bag got the most orders.","Đoạn demo túi chống thấm ra nhiều đơn nhất."],["Prepare a water spray for the product demo.","Chuẩn bị bình xịt nước cho phần demo."]],"col":["live demo","demo the product","show, don't tell"],"rel":["swatch","before and after","close-up"]},{"t":"swatch","p":"n, v","vi":"quẹt màu thử","d":"Quẹt thử màu son, phấn mắt, kem nền lên da để khách thấy màu thật. Cũng là mẫu vải nhỏ trong thời trang.","c":"Live mỹ phẩm, thời trang.","ex":[["Swatch all six shades on your arm.","Quẹt cả sáu màu lên tay."],["Viewers keep asking for a swatch of shade 03.","Người xem cứ hỏi quẹt thử màu 03."]],"col":["arm swatch","shade","try-on"],"rel":["try-on","product demo","white balance"]},{"t":"try-on","p":"n","vi":"mặc thử, thử trực tiếp","d":"Host mặc thử hoặc dùng thử sản phẩm trên người để khách thấy độ vừa, màu và cách phối.","c":"Live thời trang, phụ kiện, mỹ phẩm.","ex":[["Do a try-on in size S and M so viewers can compare.","Mặc thử size S và M để người xem so sánh."]],"col":["try-on haul","fit check"],"rel":["swatch","product demo"]},{"t":"before and after","p":"n","vi":"trước và sau","d":"So sánh trạng thái trước và sau khi dùng sản phẩm. Rất thuyết phục nhưng phải trung thực và đúng quy định quảng cáo.","c":"Demo, nội dung, quảng cáo.","ex":[["Show a before and after on half of the face.","Làm trước và sau trên nửa khuôn mặt."]],"col":["before-and-after photo","side-by-side"],"rel":["product claims","social proof"],"tip":"Nhiều nền tảng và quy định quảng cáo mỹ phẩm hạn chế ảnh trước sau chỉnh sửa. Cẩn thận vi phạm."},{"t":"social proof","p":"n","vi":"bằng chứng xã hội","d":"Tâm lý tin vào điều nhiều người khác đã chọn: số lượng đã bán, đánh giá 5 sao, bình luận khách thật, KOL dùng.","c":"Kịch bản chốt đơn, mô tả sản phẩm.","ex":[["Read customer reviews on air as social proof.","Đọc đánh giá của khách trên sóng làm bằng chứng xã hội."],["Over 10,000 sold is strong social proof.","Hơn 10.000 sản phẩm đã bán là bằng chứng xã hội mạnh."]],"col":["show social proof","reviews","sold count"],"rel":["testimonial","FOMO"]},{"t":"urgency","p":"n","vi":"sự gấp gáp (về thời gian)","d":"Tạo cảm giác phải mua ngay vì ưu đãi sắp hết hạn: đếm ngược, chỉ còn 5 phút, giá chỉ áp dụng trong live.","c":"Kỹ thuật chốt đơn.","ex":[["Create urgency with a five-minute countdown.","Tạo gấp gáp bằng đồng hồ đếm ngược năm phút."]],"col":["create urgency","sense of urgency","time-limited"],"rel":["scarcity","countdown","FOMO"],"tip":"Urgency là giới hạn thời gian; scarcity là giới hạn số lượng."},{"t":"scarcity","p":"n","vi":"sự khan hiếm (về số lượng)","d":"Nhấn mạnh hàng có hạn: chỉ còn 20 suất, phiên bản giới hạn. Khan hiếm làm sản phẩm có vẻ giá trị hơn.","c":"Kỹ thuật chốt đơn.","ex":[["Only 20 sets left, that's real scarcity, mention it.","Chỉ còn 20 set, khan hiếm thật, nhắc đi."]],"col":["limited stock","limited edition","only X left"],"rel":["urgency","flash sale"]},{"t":"FOMO","f":"Fear Of Missing Out","p":"abbr","vi":"sợ bỏ lỡ","d":"Tâm lý lo mình bị bỏ lại khi người khác đang có cơ hội tốt. Kết hợp urgency, scarcity và social proof để tạo FOMO.","c":"Kịch bản, quảng cáo, chiến dịch.","ex":[["Seeing the order notifications creates FOMO.","Thấy thông báo người khác đặt đơn tạo cảm giác sợ bỏ lỡ."]],"col":["create FOMO","FOMO marketing"],"rel":["urgency","scarcity","social proof"]},{"t":"price anchoring","p":"n","vi":"neo giá","d":"Nêu một mức giá cao trước (giá gốc, giá ngoài cửa hàng) để giá khuyến mãi trông rẻ hơn hẳn.","c":"Kịch bản báo giá.","ex":[["Mention the retail price of 599k first, then reveal the live price of 299k.","Nói giá bán lẻ 599k trước, rồi mới báo giá live 299k."]],"col":["anchor price","reference price","price reveal"],"rel":["RRP","discount","price reveal"],"tip":"Giá gốc phải có thật, khai khống giá gốc có thể vi phạm quy định sàn và luật."},{"t":"price reveal","p":"n","vi":"màn công bố giá","d":"Khoảnh khắc host công bố giá deal sau khi đã giới thiệu sản phẩm và neo giá. Thường kèm đếm ngược để tạo kịch tính.","c":"Kịch bản từng vòng sản phẩm.","ex":[["Build up the excitement before the price reveal.","Đẩy không khí lên trước khi công bố giá."]],"col":["reveal the price","countdown"],"rel":["price anchoring","countdown"]},{"t":"countdown","p":"n","vi":"đếm ngược","d":"Đếm ngược thời gian trước khi mở deal hoặc đóng deal. Có thể hiển thị bằng đồng hồ trên màn hình hoặc host đếm bằng lời.","c":"Tạo gấp gáp, phối hợp mở link.","ex":[["Start the countdown, we open the link at zero.","Đếm ngược đi, về không thì mở link."]],"col":["countdown timer","3, 2, 1"],"rel":["urgency","flash sale","cue"]},{"t":"objection handling","p":"n","vi":"xử lý từ chối, xử lý băn khoăn","d":"Cách trả lời khi khách lo lắng hoặc chần chừ: giá đắt, sợ hàng giả, sợ không hợp da, sợ size không vừa. Host chuẩn bị sẵn câu trả lời cho các phản đối hay gặp.","c":"Đào tạo host, viết kịch bản Q&A.","ex":[["Add objection handling for 'Is it authentic?' to the script.","Thêm câu xử lý cho câu hỏi “Có phải hàng thật không?” vào kịch bản."],["Good objection handling can double the conversion rate.","Xử lý băn khoăn tốt có thể tăng gấp đôi chuyển đổi."]],"col":["handle objections","common objections","overcome"],"rel":["Q&A","closing"]},{"t":"closing","p":"n","vi":"chốt đơn","d":"Phần thúc khách ra quyết định mua. Động từ là close (close the sale). Câu chốt gọi là closing line.","c":"Kỹ năng bán hàng.","ex":[["The host is great at storytelling but weak at closing.","Host kể chuyện hay nhưng chốt đơn yếu."],["Close the sale before you move to the next product.","Chốt đơn xong rồi mới chuyển sản phẩm."]],"col":["close the sale","closing line","closing rate"],"rel":["call to action","urgency"]},{"t":"call to action","f":"CTA","p":"n","vi":"lời kêu gọi hành động","d":"Câu yêu cầu người xem làm một việc cụ thể ngay: bấm vào giỏ hàng số 1, bình luận số 1, nhấn theo dõi. CTA càng rõ càng hiệu quả.","c":"Kịch bản live, quảng cáo, nội dung.","ex":[["The host needs a clear CTA every five minutes.","Host cần lời kêu gọi rõ ràng mỗi năm phút."],["Our CTA is: tap the orange bag and choose product number 3.","Lời kêu gọi là: bấm túi cam và chọn sản phẩm số 3."]],"col":["clear CTA","CTA button","strong CTA"],"rel":["closing","comment prompt"]},{"t":"comment prompt","p":"n","vi":"câu kêu gọi bình luận","d":"Câu khuyến khích người xem bình luận, ví dụ “Ai muốn link thì comment 1”. Tăng tương tác giúp thuật toán đẩy phòng live.","c":"Kịch bản tăng tương tác.","ex":[["Use a comment prompt like 'Type 1 if you want this color'.","Dùng câu kêu gọi kiểu “Gõ 1 nếu bạn muốn màu này”."]],"col":["engagement prompt","type 1"],"rel":["engagement rate","call to action"]},{"t":"add-on deal","p":"n","vi":"deal mua kèm","d":"Ưu đãi khi mua thêm một sản phẩm khác với giá đặc biệt, ví dụ mua serum thêm 49k được kem dưỡng. Tăng giá trị đơn.","c":"Thiết kế deal, kịch bản.","ex":[["Add an add-on deal to push the AOV above 400k.","Thêm deal mua kèm để đẩy giá trị đơn lên trên 400k."]],"col":["add-on purchase","buy more save more"],"rel":["upsell","cross-sell","AOV"]},{"t":"upsell","p":"v, n","vi":"bán nâng cấp","d":"Gợi ý khách mua phiên bản đắt hơn, dung tích lớn hơn hoặc số lượng nhiều hơn của cùng sản phẩm.","c":"Kỹ thuật tăng giá trị đơn.","ex":[["Upsell the 200 ml size, it's only 30k more.","Gợi ý chai 200 ml, chỉ thêm 30k."]],"col":["upsell to","upselling"],"rel":["cross-sell","AOV"]},{"t":"cross-sell","p":"v, n","vi":"bán chéo","d":"Gợi ý khách mua thêm sản phẩm khác liên quan, ví dụ mua serum thì gợi ý kem chống nắng.","c":"Kỹ thuật tăng giá trị đơn.","ex":[["Cross-sell the sunscreen when people buy the serum.","Bán chéo kem chống nắng khi khách mua serum."]],"col":["cross-selling","complementary products"],"rel":["upsell","bundle"]},{"t":"gift with purchase","f":"GWP","p":"n","vi":"quà tặng kèm khi mua","d":"Tặng quà khi khách mua sản phẩm hoặc đạt mức chi tiêu nhất định. Thường là mẫu thử, minisize.","c":"Thiết kế ưu đãi.","ex":[["Every order over 300k gets a free GWP pouch.","Đơn trên 300k được tặng túi quà."]],"col":["free gift","GWP"],"rel":["minimum spend","bundle"]},{"t":"testimonial","p":"n","vi":"lời chứng thực","d":"Chia sẻ của khách hàng thật hoặc chuyên gia về trải nghiệm sản phẩm.","c":"Kịch bản, quảng cáo, trang sản phẩm.","ex":[["We can show a video testimonial from a dermatologist.","Có thể chiếu video chứng thực của bác sĩ da liễu."]],"col":["customer testimonial","video testimonial"],"rel":["social proof","UGC"]},{"t":"storytelling","p":"n","vi":"kể chuyện","d":"Dùng câu chuyện (trải nghiệm thật, câu chuyện brand, câu chuyện khách hàng) để kết nối cảm xúc và thuyết phục.","c":"Kịch bản, nội dung.","ex":[["The host shared her own acne story, great storytelling.","Host kể chuyện bị mụn của chính mình, kể chuyện rất hay."]],"col":["brand story","tell a story"],"rel":["pain point","brand voice"]},{"t":"Q&A","f":"Questions and Answers","p":"n","vi":"hỏi đáp","d":"Phần trả lời câu hỏi người xem trong live. Team nên chuẩn bị sẵn danh sách câu hỏi thường gặp.","c":"Kịch bản, đào tạo host.","ex":[["Leave ten minutes for Q&A before the wrap-up.","Chừa mười phút hỏi đáp trước phần kết."]],"col":["Q&A session","answer questions"],"rel":["objection handling","FAQ"]},{"t":"rapport","p":"n","vi":"sự thân thiết, kết nối","d":"Mối quan hệ tin tưởng, thân thiện giữa host và người xem. Rapport tốt làm người xem quay lại các phiên sau.","c":"Đánh giá kỹ năng host.","ex":[["She builds rapport by remembering regular viewers' names.","Cô ấy tạo kết nối bằng cách nhớ tên người xem quen."]],"col":["build rapport","establish rapport"],"rel":["shout-out","repeat customer"]},{"t":"pacing","p":"n","vi":"nhịp độ","d":"Tốc độ và nhịp chuyển của phiên live: bao lâu cho mỗi sản phẩm, khi nào tăng tốc, khi nào dừng để demo.","c":"Góp ý host và kịch bản.","ex":[["The pacing was too slow in the second hour.","Nhịp độ giờ thứ hai quá chậm."]],"col":["keep the pace","slow pacing"],"rel":["dead air","run of show"]},{"t":"energy","p":"n","vi":"năng lượng, độ sôi nổi","d":"Mức độ nhiệt tình, hào hứng của host trên sóng. Energy thấp thường làm CCU tụt.","c":"Góp ý host.","ex":[["Keep your energy up even when CCU is low.","Giữ năng lượng kể cả khi ít người xem."]],"col":["high energy","energy drop"],"rel":["host","viewer retention"]},{"t":"sales pitch","p":"n","vi":"lời chào hàng","d":"Đoạn nói thuyết phục khách mua một sản phẩm. Elevator pitch là lời chào hàng cực ngắn khoảng 30 giây.","ex":[["Keep the sales pitch under two minutes.","Giữ lời chào hàng dưới hai phút."]],"c":"Kịch bản, đào tạo host.","col":["elevator pitch","pitch a product"],"rel":["live script","closing"]},{"t":"value stacking","p":"n","vi":"cộng dồn giá trị","d":"Liệt kê lần lượt mọi thứ khách nhận được (sản phẩm, quà, freeship, bảo hành) để tổng giá trị trông lớn hơn nhiều so với giá trả.","ex":[["Use value stacking: serum, mini toner, pouch and free shipping, all for 299k.","Cộng dồn giá trị: serum, toner mini, túi và freeship, tất cả chỉ 299k."]],"c":"Kỹ thuật báo giá.","col":["stack the value"],"rel":["price anchoring","gift with purchase"]},{"t":"price breakdown","p":"n","vi":"chia nhỏ giá","d":"Quy giá ra đơn vị nhỏ để trông rẻ hơn, ví dụ “chỉ 3.000 đồng mỗi ngày”.","ex":[["Do a price breakdown: less than a coffee a week.","Chia nhỏ giá: chưa bằng một ly cà phê mỗi tuần."]],"c":"Kỹ thuật báo giá.","col":["cost per use","per day"],"rel":["price anchoring"]},{"t":"cost per use","p":"n","vi":"chi phí mỗi lần dùng","d":"Giá sản phẩm chia cho số lần dùng được. Cách nói giúp sản phẩm đắt trông hợp lý.","ex":[["At 120 uses per bottle, the cost per use is only 2,500 VND.","120 lần dùng mỗi chai, mỗi lần chỉ 2.500 đồng."]],"c":"Thuyết phục khách với sản phẩm giá cao.","col":["CPU"],"rel":["price breakdown"]},{"t":"comparison","p":"n","vi":"so sánh","d":"So sánh với sản phẩm khác, với giá ngoài cửa hàng hoặc trước và sau. Không được nêu tên và chê đối thủ nếu vi phạm quy định.","ex":[["Show a comparison between our price and the store price.","So sánh giá live với giá ở cửa hàng."]],"c":"Kịch bản.","col":["side-by-side comparison","compare with"],"rel":["price anchoring","before and after"]},{"t":"reassurance","p":"n","vi":"trấn an, tạo yên tâm","d":"Câu nói giúp khách bớt lo: hàng chính hãng, đổi trả 7 ngày, có hóa đơn.","ex":[["Add reassurance about the 7-day return policy.","Thêm câu trấn an về chính sách đổi trả 7 ngày."]],"c":"Xử lý băn khoăn.","col":["reassure customers","peace of mind"],"rel":["objection handling","guarantee"]},{"t":"guarantee","p":"n, v","vi":"cam kết, bảo đảm","d":"Lời hứa về chất lượng hoặc hoàn tiền, ví dụ money-back guarantee (hoàn tiền nếu không hài lòng).","ex":[["We offer a 30-day money-back guarantee.","Bên mình cam kết hoàn tiền trong 30 ngày."]],"c":"Tạo niềm tin.","col":["money-back guarantee","authenticity guarantee"],"rel":["reassurance","warranty"]},{"t":"authenticity","p":"n","vi":"tính chính hãng","d":"Việc sản phẩm là hàng thật. Host thường cho xem tem, mã vạch, giấy phân phối.","ex":[["Show the authenticity sticker to the camera.","Đưa tem chính hãng lên camera."]],"c":"Xử lý câu hỏi “hàng thật không?”.","col":["authentic","genuine","certificate"],"rel":["authorized distributor","counterfeit"]},{"t":"trust signal","p":"n","vi":"dấu hiệu tạo tin tưởng","d":"Những thứ khiến khách tin: nhãn Mall, số lượng đã bán, đánh giá, chứng nhận, chính sách đổi trả.","ex":[["Mention trust signals like 'Official Store' and 50,000 sold.","Nhắc các dấu hiệu tin tưởng như “Gian hàng chính hãng” và 50.000 đã bán."]],"c":"Tối ưu trang sản phẩm và kịch bản.","col":["build trust"],"rel":["social proof","authenticity"]},{"t":"tease","p":"v, n","vi":"nhá hàng","d":"Hé lộ một phần deal hoặc sản phẩm sắp tới để giữ người xem ở lại.","ex":[["Tease the 9 PM mystery deal every 15 minutes.","Nhá deal bí mật lúc 9 giờ mỗi 15 phút."]],"c":"Giữ chân người xem.","col":["teaser","sneak peek"],"rel":["hook","viewer retention"]},{"t":"sneak peek","p":"n","vi":"xem trước, hé lộ","d":"Cho người xem thấy trước một chút sản phẩm hoặc deal chưa mở.","ex":[["Here's a sneak peek of tomorrow's new collection.","Đây là hé lộ bộ sưu tập mới ngày mai."]],"c":"Kịch bản, nội dung trước live.","col":["give a sneak peek"],"rel":["tease"]},{"t":"mystery deal","p":"n","vi":"deal bí mật","d":"Ưu đãi không công bố trước, chỉ hé lộ ở một thời điểm trong live, khiến người xem ở lại chờ.","ex":[["The mystery deal drops at 10 PM, stay tuned!","Deal bí mật mở lúc 10 giờ, ở lại nhé!"]],"c":"Giữ chân người xem.","col":["mystery box","secret deal"],"rel":["tease"]},{"t":"mystery box","p":"n","vi":"hộp bí ẩn","d":"Hộp chứa sản phẩm ngẫu nhiên với tổng giá trị cao hơn giá bán. Tạo tò mò và giúp xả hàng tồn.","ex":[["Each mystery box is worth at least 500k.","Mỗi hộp bí ẩn trị giá ít nhất 500k."]],"c":"Thiết kế deal.","col":["lucky bag","blind box"],"rel":["mystery deal","clearance sale"]},{"t":"stay tuned","p":"phrase","vi":"đừng rời đi, tiếp tục theo dõi","d":"Câu kêu gọi người xem ở lại vì có điều sắp xảy ra.","ex":[["Stay tuned, the biggest deal is coming up next!","Ở lại nhé, deal lớn nhất sắp tới!"]],"c":"Câu của host.","col":["don't go anywhere"],"rel":["tease","viewer retention"]},{"t":"recap the deal","p":"phrase","vi":"nhắc lại deal","d":"Tóm tắt lại ưu đãi cho người mới vào phòng: sản phẩm, giá, quà, cách mua.","ex":[["Recap the deal every time CCU jumps.","Nhắc lại deal mỗi khi CCU tăng."]],"c":"Kịch bản vòng lặp.","col":["deal recap"],"rel":["loop","call to action"]},{"t":"buying guide","p":"n","vi":"hướng dẫn mua hàng","d":"Hướng dẫn từng bước cách đặt đơn, chọn phân loại, áp voucher. Rất cần cho người xem mới.","ex":[["Do a quick buying guide for first-time buyers.","Hướng dẫn nhanh cách mua cho người mua lần đầu."]],"c":"Kịch bản, ghim bình luận.","col":["how to order","step by step"],"rel":["call to action","voucher stacking"]},{"t":"size guide","p":"n","vi":"hướng dẫn chọn size","d":"Bảng hoặc lời tư vấn chọn size theo số đo, chiều cao, cân nặng.","ex":[["If you're 1m60 and 50 kg, take size M.","Nếu bạn cao 1m60 nặng 50 kg thì lấy size M."]],"c":"Live thời trang.","col":["size chart","true to size","size up"],"rel":["try-on"]},{"t":"shade matching","p":"n","vi":"chọn tông màu hợp da","d":"Tư vấn chọn màu kem nền, che khuyết điểm, son phù hợp tông da khách.","ex":[["Comment your skin tone and I'll help with shade matching.","Bình luận tông da để mình chọn màu giúp nhé."]],"c":"Live mỹ phẩm.","col":["find your shade","undertone"],"rel":["swatch"]},{"t":"customer pain","p":"n","vi":"khó khăn khách gặp","d":"Cách nói khác của pain point khi kể chuyện bán hàng.","ex":[["Start each segment with a customer pain.","Mở đầu mỗi đoạn bằng một khó khăn của khách."]],"c":"Kịch bản.","col":["address"],"rel":["pain point"]},{"t":"problem-solution","p":"n","vi":"vấn đề và giải pháp","d":"Cấu trúc kịch bản: nêu vấn đề, khuếch đại nỗi lo, rồi đưa sản phẩm làm giải pháp (PAS: Problem, Agitate, Solution).","ex":[["Use the problem-solution format for this product.","Dùng cấu trúc vấn đề và giải pháp cho sản phẩm này."]],"c":"Viết kịch bản, video ngắn.","col":["PAS formula","problem-agitate-solution"],"rel":["pain point","AIDA"]},{"t":"emotional selling","p":"n","vi":"bán bằng cảm xúc","d":"Thuyết phục bằng cảm xúc (tự tin, yêu thương, an tâm) thay vì chỉ thông số.","ex":[["Gift sets sell better with emotional selling.","Set quà bán chạy hơn khi bán bằng cảm xúc."]],"c":"Kịch bản, đào tạo host.","col":["emotional appeal","rational appeal"],"rel":["storytelling","benefit"]},{"t":"impulse buying","p":"n","vi":"mua bốc đồng","d":"Mua hàng không có kế hoạch, do cảm xúc lúc đó. Live bán hàng tận dụng tâm lý này nhưng cũng dẫn tới hủy đơn, hoàn hàng cao.","ex":[["Flash sales drive impulse buying.","Flash sale thúc đẩy mua bốc đồng."]],"c":"Phân tích hành vi.","col":["impulse purchase","impulse buyer"],"rel":["urgency","failed delivery"]},{"t":"decision fatigue","p":"n","vi":"mệt mỏi khi phải chọn","d":"Khi có quá nhiều lựa chọn, khách khó quyết định và dễ bỏ đi.","ex":[["Too many SKUs cause decision fatigue, recommend just one.","Quá nhiều mã gây mệt mỏi khi chọn, chỉ nên gợi ý một."]],"c":"Thiết kế lineup.","col":["choice overload"],"rel":["product lineup"]},{"t":"best-seller","p":"n","vi":"sản phẩm bán chạy nhất","d":"Sản phẩm có doanh số cao nhất. Nhắc best-seller là một dạng bằng chứng xã hội.","ex":[["This is our best-seller, over 30,000 sold.","Đây là sản phẩm bán chạy nhất, hơn 30.000 đã bán."]],"c":"Kịch bản, mô tả.","col":["best-selling","top seller"],"rel":["hero product","social proof"]},{"t":"must-have","p":"n, adj","vi":"món nhất định phải có","d":"Sản phẩm được giới thiệu như thiết yếu, không thể thiếu.","ex":[["This sunscreen is a summer must-have.","Kem chống nắng này là món phải có mùa hè."]],"c":"Ngôn ngữ quảng bá.","col":["essential","holy grail"],"rel":["best-seller"]},{"t":"holy grail","p":"n","vi":"sản phẩm “chân ái”","d":"Sản phẩm tốt nhất, dùng mãi không đổi. Từ hay dùng trong cộng đồng làm đẹp.","ex":[["This cleanser is my holy grail.","Sữa rửa mặt này là chân ái của mình."]],"c":"Review, live mỹ phẩm.","col":["HG product","ride or die"],"rel":["must-have"]},{"t":"dupe","p":"n","vi":"sản phẩm thay thế giá rẻ","d":"Sản phẩm giống hoặc tương đương sản phẩm đắt tiền nhưng rẻ hơn. Không được nói sai sự thật hay dùng tên thương hiệu khác trái phép.","ex":[["Viewers call it a dupe of a luxury cushion.","Người xem gọi nó là bản thay thế của một cushion cao cấp."]],"c":"Nội dung làm đẹp, thời trang.","col":["budget dupe"],"rel":["comparison"]},{"t":"value for money","p":"n","vi":"đáng đồng tiền","d":"Chất lượng tương xứng hoặc vượt so với giá. Tính từ: good value.","ex":[["It's the best value for money in this range.","Đây là sản phẩm đáng tiền nhất trong tầm giá."]],"c":"Thuyết phục khách.","col":["good value","bang for your buck","worth it"],"rel":["price breakdown"]},{"t":"limited time offer","p":"n","vi":"ưu đãi có thời hạn","d":"Ưu đãi chỉ áp dụng trong khoảng thời gian ngắn.","ex":[["This is a limited time offer, only during tonight's live.","Đây là ưu đãi có thời hạn, chỉ trong live tối nay."]],"c":"Tạo gấp gáp.","col":["LTO","today only"],"rel":["urgency","flash sale"]},{"t":"exclusive deal","p":"n","vi":"ưu đãi độc quyền","d":"Ưu đãi chỉ có ở phiên live hoặc kênh này, không có ở nơi khác.","ex":[["This price is an exclusive deal for our live viewers.","Giá này là ưu đãi độc quyền cho người xem live."]],"c":"Kịch bản, đàm phán với brand.","col":["live-exclusive","only here"],"rel":["limited time offer"]},{"t":"add to cart now","p":"phrase","vi":"thêm vào giỏ ngay","d":"Lời kêu gọi giữ suất trước khi thanh toán, phổ biến khi deal sắp mở.","ex":[["Add to cart now so you're ready when the price drops.","Thêm vào giỏ trước để sẵn sàng khi giá giảm."]],"c":"Câu của host.","col":["cart it"],"rel":["call to action","add-to-cart"]},{"t":"lock in","p":"v","vi":"giữ, chốt (giá, suất)","d":"Đảm bảo có được mức giá hoặc suất mua trước khi thay đổi.","ex":[["Check out now to lock in the live price.","Thanh toán ngay để giữ giá live."]],"c":"Câu chốt đơn.","col":["lock in the price"],"rel":["closing"]},{"t":"last call","p":"n","vi":"lời gọi cuối","d":"Thông báo cơ hội cuối trước khi đóng deal.","ex":[["Last call for the flash sale, 30 seconds left!","Cơ hội cuối cho flash sale, còn 30 giây!"]],"c":"Câu của host.","col":["final call","last chance"],"rel":["urgency","countdown"]},{"t":"hard sell","p":"n","vi":"bán ép, bán dồn dập","d":"Cách bán hàng ép buộc, nói liên tục về giá. Ngược lại là soft sell, bán nhẹ nhàng qua nội dung, chia sẻ.","ex":[["Too much hard sell makes viewers leave.","Bán ép quá khiến người xem bỏ đi."]],"c":"Góp ý phong cách host.","col":["soft sell"],"rel":["pacing","rapport"]},{"t":"conversational selling","p":"n","vi":"bán hàng qua trò chuyện","d":"Bán bằng cách trò chuyện, trả lời từng câu hỏi như đang tư vấn riêng.","ex":[["Conversational selling works better for high-price items.","Bán qua trò chuyện hiệu quả hơn với hàng giá cao."]],"c":"Phong cách host.","col":["consultative selling"],"rel":["rapport","Q&A"]},{"t":"upgrade","p":"v, n","vi":"nâng cấp","d":"Chuyển sang bản tốt hơn hoặc lớn hơn.","ex":[["Upgrade to the set for just 50k more.","Nâng lên bộ đầy đủ chỉ thêm 50k."]],"c":"Kỹ thuật bán hàng.","col":["trade up"],"rel":["upsell"]},{"t":"reason to buy","p":"n","vi":"lý do để mua","d":"Bằng chứng hoặc lý do cụ thể khiến khách tin và mua: thành phần, chứng nhận, kết quả thử nghiệm.","ex":[["Give the host three reasons to buy.","Đưa host ba lý do để mua."]],"f":"RTB","c":"Brief sản phẩm.","col":["RTB"],"rel":["selling point"]},{"t":"hero moment","p":"n","vi":"khoảnh khắc đỉnh","d":"Khoảnh khắc ấn tượng nhất trong phiên, như màn demo hoặc màn hạ giá.","ex":[["The waterproof test is our hero moment.","Màn thử chống nước là khoảnh khắc đỉnh của phiên."]],"c":"Thiết kế kịch bản.","col":["wow moment"],"rel":["product demo"]},{"t":"wow factor","p":"n","vi":"yếu tố gây ấn tượng","d":"Điểm khiến người xem trầm trồ.","ex":[["The color-changing lipstick has a wow factor.","Son đổi màu có yếu tố gây ấn tượng."]],"c":"Kịch bản, sản phẩm.","col":["wow","eye-catching"],"rel":["hero moment"]}]},{"id":"livekpi","code":"LIVE-KPI","group":"Livestream","en":"Live Metrics & Analytics","vi":"Chỉ số phiên live","intro":"Các con số đọc trên dashboard và viết trong báo cáo live: người xem, giữ chân, tương tác, chuyển đổi và doanh thu.","terms":[{"t":"GMV","f":"Gross Merchandise Value","p":"abbr","vi":"tổng giá trị hàng hóa bán ra","d":"Tổng giá trị các đơn đặt trong một khoảng thời gian, tính theo giá khách trả, thường chưa trừ đơn hủy, đơn hoàn, phí sàn. Là chỉ số chính đánh giá phiên live và chiến dịch, nhưng không phải doanh thu thực nhận.","c":"Báo cáo, đặt KPI, thương lượng với brand.","fm":"GMV = Σ (giá bán × số lượng) của các đơn đã đặt","ex":[["Last night's live reached 500 million VND in GMV.","Phiên live tối qua đạt 500 triệu GMV."],["GMV is high, but after cancellations net revenue is 20% lower.","GMV cao nhưng sau khi trừ hủy thì doanh thu thuần thấp hơn 20%."]],"col":["hit / reach GMV","GMV target","live GMV"],"rel":["net revenue","GPM","AOV"],"tip":"GMV ≠ revenue. Khi brand hỏi doanh thu, nên hỏi rõ đang nói GMV hay doanh thu thuần."},{"t":"GPM","f":"GMV Per Mille","p":"abbr","vi":"GMV trên 1.000 lượt xem","d":"GMV tạo ra cho mỗi 1.000 lượt xem phòng live. Đo khả năng kiếm tiền của phòng live, giúp so sánh công bằng giữa các phiên có lượng xem khác nhau. Hay dùng trên TikTok Shop.","c":"So sánh host, khung giờ, kịch bản.","fm":"GPM = GMV ÷ số lượt xem × 1.000","ex":[["Our GPM is higher in the evening slot.","GPM khung tối của mình cao hơn."],["Views doubled but GPM dropped, so the traffic quality is lower.","Lượt xem tăng gấp đôi nhưng GPM giảm, tức chất lượng traffic kém đi."]],"col":["live GPM","improve GPM"],"rel":["GMV","views","conversion rate"]},{"t":"views","p":"n","vi":"lượt xem","d":"Tổng số lượt vào xem phòng live, một người vào nhiều lần có thể tính nhiều lượt.","c":"Báo cáo quy mô traffic.","ex":[["The session got 80,000 views but only 20,000 unique viewers.","Phiên có 80.000 lượt xem nhưng chỉ 20.000 người xem."]],"col":["total views","live views"],"rel":["unique viewers","impression"]},{"t":"unique viewers","f":"UV","p":"n","vi":"số người xem (không trùng)","d":"Số người khác nhau đã vào phòng live, mỗi người chỉ tính một lần.","c":"Đo độ phủ thực sự của phiên.","ex":[["UV is a better measure of reach than total views.","Số người xem không trùng phản ánh độ phủ tốt hơn tổng lượt xem."]],"col":["UV","reach"],"rel":["views","reach"]},{"t":"CCU","f":"Concurrent Users","p":"abbr","vi":"số người xem cùng lúc","d":"Số người đang ở trong phòng live tại một thời điểm. Theo dõi liên tục để biết nội dung có giữ được người xem.","c":"Theo dõi thời gian thực, báo host.","ex":[["CCU dropped below 200, start a mini game.","CCU tụt dưới 200, bắt đầu minigame đi."],["CCU spikes every time we drop a voucher.","CCU tăng vọt mỗi lần thả voucher."]],"col":["CCU drop","CCU spike","keep CCU"],"rel":["PCU","ACU"]},{"t":"PCU","f":"Peak Concurrent Users","p":"abbr","vi":"số người xem cùng lúc cao nhất","d":"Mốc cao nhất của CCU trong cả phiên.","c":"Báo cáo sau live, so sánh giữa các phiên, mốc khi chạy quảng cáo.","ex":[["Our PCU last night was 3,200 at 9:15 PM.","Đỉnh người xem cùng lúc tối qua là 3.200 lúc 9 giờ 15."]],"col":["peak viewers","hit a peak"],"rel":["CCU","ACU"]},{"t":"ACU","f":"Average Concurrent Users","p":"abbr","vi":"số người xem cùng lúc trung bình","d":"Trung bình CCU trong suốt phiên. Ổn định hơn PCU khi đánh giá phiên.","c":"Báo cáo, so sánh host.","ex":[["ACU was 850, up 20% from last week.","Người xem cùng lúc trung bình là 850, tăng 20% so với tuần trước."]],"col":["average CCU"],"rel":["CCU","PCU"]},{"t":"average watch time","p":"n","vi":"thời gian xem trung bình","d":"Trung bình một người xem ở lại phòng live bao lâu. Chỉ số giữ chân quan trọng, ảnh hưởng tới việc nền tảng có đẩy phòng live hay không.","c":"Phân tích nội dung, phần mở đầu.","fm":"Thời gian xem trung bình = tổng thời gian xem ÷ số lượt xem","ex":[["Average watch time is only 40 seconds, the opening needs work.","Thời gian xem trung bình chỉ 40 giây, phần mở đầu cần cải thiện."]],"col":["watch time","view duration","dwell time"],"rel":["viewer retention","hook"]},{"t":"viewer retention","p":"n","vi":"tỉ lệ giữ chân người xem","d":"Khả năng giữ người xem ở lại phòng hoặc ở lại video theo thời gian. Biểu đồ giữ chân cho thấy người xem rời đi ở đâu.","c":"Phân tích kịch bản, góp ý host.","ex":[["Retention drops sharply when the host talks about shipping.","Tỉ lệ giữ chân giảm mạnh khi host nói về vận chuyển."]],"col":["retention rate","retention curve"],"rel":["drop-off","average watch time"]},{"t":"drop-off","p":"n","vi":"điểm rời bỏ, sụt giảm","d":"Chỗ người xem rời đi nhiều, hoặc bước trong phễu mà khách rớt. Động từ là drop off.","c":"Phân tích replay, phân tích phễu.","ex":[["There's a big drop-off at minute 12.","Có điểm rời bỏ lớn ở phút thứ 12."],["Most buyers drop off at the payment step.","Phần lớn người mua bỏ ở bước thanh toán."]],"col":["drop-off rate","drop-off point"],"rel":["viewer retention","funnel"]},{"t":"entry rate","p":"n","vi":"tỉ lệ vào phòng","d":"Tỉ lệ người thấy phòng live (trên bảng tin, đề xuất) mà bấm vào xem. Phản ánh độ hấp dẫn của khung hình và tiêu đề live.","c":"Tối ưu ảnh bìa, khung hình mở đầu, tiêu đề.","fm":"Tỉ lệ vào phòng = lượt vào phòng ÷ lượt hiển thị phòng live","ex":[["Entry rate is low, the first frame doesn't look attractive.","Tỉ lệ vào phòng thấp, khung hình đầu không hấp dẫn."]],"col":["room entry rate","tap-through rate"],"rel":["impression","CTR"]},{"t":"traffic source","p":"n","vi":"nguồn người xem","d":"Người xem đến từ đâu: trang Dành cho bạn, video ngắn, theo dõi, tìm kiếm, quảng cáo, chia sẻ.","c":"Phân tích, phân bổ ngân sách.","ex":[["Most traffic came from short videos, not from the For You feed.","Phần lớn người xem đến từ video ngắn, không phải từ trang đề xuất."]],"col":["traffic breakdown","traffic mix"],"rel":["organic traffic","paid traffic"]},{"t":"organic traffic","p":"n","vi":"lượng xem tự nhiên","d":"Người xem đến mà không phải trả tiền quảng cáo: từ đề xuất, theo dõi, tìm kiếm, video ngắn.","c":"Đánh giá sức khỏe kênh.","ex":[["70% of viewers came from organic traffic.","70% người xem đến từ lượng tự nhiên."]],"col":["organic reach","natural traffic"],"rel":["paid traffic","algorithm"]},{"t":"paid traffic","p":"n","vi":"lượng xem từ quảng cáo","d":"Người xem đến nhờ quảng cáo trả phí.","c":"Đánh giá hiệu quả ads cho live.","ex":[["Paid traffic converts better but costs 3,000 VND per viewer.","Traffic quảng cáo chuyển đổi tốt hơn nhưng tốn 3.000 đồng mỗi người."]],"col":["paid views","ad traffic"],"rel":["organic traffic","LIVE Shopping Ads"]},{"t":"engagement rate","p":"n","vi":"tỉ lệ tương tác","d":"Mức độ người xem tương tác (bình luận, thả tim, chia sẻ, theo dõi) so với số người xem. Tương tác cao giúp thuật toán đẩy thêm người vào.","c":"Báo cáo, đánh giá host, nội dung.","fm":"Tỉ lệ tương tác = tổng tương tác ÷ số người xem (hoặc lượt hiển thị) × 100%","ex":[["Engagement rate doubled after we added comment prompts.","Tỉ lệ tương tác tăng gấp đôi khi thêm câu kêu gọi bình luận."]],"col":["likes, comments, shares","engagement"],"rel":["comment prompt","engagement"]},{"t":"new followers","p":"n","vi":"người theo dõi mới","d":"Số người bấm theo dõi kênh trong phiên. Người theo dõi sẽ nhận thông báo khi live, là nguồn traffic tự nhiên lâu dài.","c":"Báo cáo, mục tiêu tăng kênh.","ex":[["We gained 1,200 new followers from the giveaway.","Tăng được 1.200 người theo dõi mới nhờ minigame."]],"col":["follower growth","follow rate"],"rel":["organic traffic"]},{"t":"product click","p":"n","vi":"lượt nhấp sản phẩm","d":"Số lần người xem nhấp vào sản phẩm trong giỏ hàng live.","c":"Đánh giá sản phẩm hấp dẫn, host giới thiệu tốt không.","ex":[["The serum got 5,000 product clicks but only 200 orders.","Serum có 5.000 lượt nhấp nhưng chỉ 200 đơn."]],"col":["product CTR","click on the product"],"rel":["CTR","click-to-order rate"]},{"t":"click-to-order rate","p":"n","vi":"tỉ lệ từ nhấp đến đặt đơn","d":"Trong số người nhấp vào sản phẩm, bao nhiêu phần trăm đặt đơn. Thấp thường do giá, trang sản phẩm, đánh giá hoặc phí vận chuyển.","c":"Phân tích phễu sản phẩm.","fm":"Tỉ lệ nhấp ra đơn = số đơn ÷ số lượt nhấp sản phẩm × 100%","ex":[["Click-to-order rate is only 4%, maybe the shipping fee scares them.","Tỉ lệ nhấp ra đơn chỉ 4%, có thể phí ship làm khách ngại."]],"col":["CO rate","click-to-purchase"],"rel":["conversion rate","product click"]},{"t":"conversion rate","f":"CR","p":"n","vi":"tỉ lệ chuyển đổi","d":"Phần trăm người thực hiện hành động mong muốn (thường là mua hàng) trên tổng người xem hoặc người nhấp. Cần nói rõ chia cho cái gì.","c":"Đánh giá host, giá, kịch bản.","fm":"Tỉ lệ chuyển đổi = số người mua ÷ số người xem × 100%","ex":[["Our conversion rate is 3%, higher than last week.","Tỉ lệ chuyển đổi là 3%, cao hơn tuần trước."],["Which conversion rate do you mean, viewer to buyer or click to order?","Bạn đang nói tỉ lệ chuyển đổi nào, người xem ra người mua hay nhấp ra đơn?"]],"col":["improve conversion","convert","CVR"],"rel":["click-to-order rate","funnel"]},{"t":"units sold","p":"n","vi":"số sản phẩm bán ra","d":"Tổng số món hàng đã bán, khác với số đơn vì một đơn có thể nhiều món.","c":"Báo cáo, đối soát kho.","ex":[["We had 1,000 orders and 1,600 units sold.","Có 1.000 đơn và 1.600 sản phẩm bán ra."]],"col":["items sold","quantity sold"],"rel":["orders","AOV"]},{"t":"orders","p":"n","vi":"số đơn hàng","d":"Số đơn khách đặt. Thường báo cáo kèm đơn đã thanh toán (paid orders) và đơn hợp lệ sau khi trừ hủy.","c":"Báo cáo hằng ngày.","ex":[["We got 1,000 orders, 920 of them are paid.","Có 1.000 đơn, 920 đơn đã thanh toán."]],"col":["paid orders","valid orders","order count"],"rel":["units sold","cancellation rate"]},{"t":"buyers","p":"n","vi":"số người mua","d":"Số người khác nhau đã đặt đơn. Một người có thể đặt nhiều đơn.","c":"Tính chuyển đổi, phân tích khách.","ex":[["We had 800 buyers and 1,000 orders.","Có 800 người mua và 1.000 đơn."]],"col":["unique buyers","new buyers"],"rel":["conversion rate","repeat customer"]},{"t":"hourly GMV","p":"n","vi":"GMV theo giờ","d":"GMV chia theo từng giờ live, giúp so sánh hiệu quả các khung giờ và các host khác nhau.","c":"Tối ưu lịch live, chia ca host.","fm":"GMV/giờ = GMV phiên ÷ số giờ live","ex":[["Hourly GMV peaks between 9 and 10 PM.","GMV theo giờ cao nhất từ 9 đến 10 giờ tối."]],"col":["GMV per hour"],"rel":["GMV","prime time"]},{"t":"real-time dashboard","p":"n","vi":"bảng số liệu thời gian thực","d":"Màn hình hiển thị số liệu đang diễn ra trong live: CCU, GMV, đơn, nhấp sản phẩm. Live operator theo dõi để báo host.","c":"Vận hành trong phiên.","ex":[["Keep the real-time dashboard on the second monitor.","Để bảng số liệu thời gian thực trên màn hình thứ hai."]],"col":["live dashboard","real-time data","LIVE Dashboard"],"rel":["live operator","dashboard"]},{"t":"live funnel","p":"n","vi":"phễu chuyển đổi phiên live","d":"Các bước từ lúc phòng live được hiển thị đến khi có đơn: hiển thị → vào phòng → nhấp sản phẩm → đặt đơn → thanh toán. Xem tỉ lệ rơi ở từng bước để biết cần sửa gì.","c":"Phân tích hiệu quả, báo cáo.","ex":[["The live funnel shows the biggest loss between views and product clicks.","Phễu cho thấy hao hụt lớn nhất giữa lượt xem và lượt nhấp sản phẩm."]],"col":["funnel analysis","step-by-step conversion"],"rel":["funnel","entry rate","click-to-order rate"]},{"t":"live duration","p":"n","vi":"thời lượng live","d":"Tổng thời gian phát của phiên.","ex":[["Live duration was 4 hours and 20 minutes.","Thời lượng live là 4 tiếng 20 phút."]],"c":"Báo cáo, so sánh GMV theo giờ.","col":["session length"],"rel":["hourly GMV"]},{"t":"likes","p":"n","vi":"lượt thả tim","d":"Số lượt thích hoặc thả tim trong phòng live. Tín hiệu tương tác cho thuật toán.","ex":[["We passed 100,000 likes in the first hour.","Vượt 100.000 lượt thả tim trong giờ đầu."]],"c":"Báo cáo tương tác.","col":["tap-tap","like count"],"rel":["engagement rate"]},{"t":"comments","p":"n","vi":"lượt bình luận","d":"Số bình luận người xem gửi trong phiên. Bình luận có câu hỏi thường cho thấy ý định mua.","ex":[["Comments doubled during the mini game.","Bình luận tăng gấp đôi trong minigame."]],"c":"Báo cáo, đánh giá tương tác.","col":["comment rate","comment volume"],"rel":["comment prompt","engagement rate"]},{"t":"shares","p":"n","vi":"lượt chia sẻ","d":"Số lần người xem chia sẻ phòng live cho người khác. Mang lại traffic tự nhiên.","ex":[["Ask viewers to share the live with friends for a bonus voucher.","Mời người xem chia sẻ live cho bạn bè để nhận thêm voucher."]],"c":"Báo cáo tương tác.","col":["share rate"],"rel":["engagement rate","organic traffic"]},{"t":"follow rate","p":"n","vi":"tỉ lệ theo dõi","d":"Phần trăm người xem bấm theo dõi kênh trong phiên.","ex":[["Follow rate is low, remind viewers to follow every 10 minutes.","Tỉ lệ theo dõi thấp, nhắc theo dõi mỗi 10 phút."]],"c":"Đánh giá khả năng giữ khán giả lâu dài.","col":["follower conversion"],"rel":["new followers"],"fm":"Tỉ lệ theo dõi = người theo dõi mới ÷ người xem × 100%"},{"t":"impressions","p":"n","vi":"lượt hiển thị phòng live","d":"Số lần phòng live xuất hiện trên bảng tin hoặc đề xuất của người dùng, kể cả khi họ không bấm vào.","ex":[["Live impressions were 400,000 but entry rate was only 3%.","Phòng live hiển thị 400.000 lần nhưng tỉ lệ vào chỉ 3%."]],"c":"Đọc phễu live.","col":["LIVE impressions"],"rel":["entry rate","live funnel"]},{"t":"paid orders","p":"n","vi":"đơn đã thanh toán","d":"Đơn khách đã trả tiền (hoặc đã xác nhận COD). Phản ánh chính xác hơn số đơn đặt.","ex":[["We had 1,200 orders but 1,050 paid orders.","Có 1.200 đơn đặt nhưng 1.050 đơn đã thanh toán."]],"c":"Báo cáo, đối soát.","col":["paid GMV"],"rel":["orders","cancellation rate"]},{"t":"paid GMV","p":"n","vi":"GMV đã thanh toán","d":"Giá trị các đơn đã thanh toán, thấp hơn GMV đặt hàng.","ex":[["Paid GMV is the number the brand cares about.","GMV đã thanh toán mới là con số brand quan tâm."]],"c":"Báo cáo với brand.","col":["placed GMV vs paid GMV"],"rel":["GMV","net revenue"]},{"t":"GMV per viewer","p":"n","vi":"GMV trên mỗi người xem","d":"GMV chia cho số người xem không trùng. Cho biết trung bình mỗi người xem mang lại bao nhiêu tiền.","ex":[["GMV per viewer is 8,000 VND from ads and 12,000 from organic.","GMV mỗi người xem từ quảng cáo là 8.000 đồng, từ tự nhiên là 12.000."]],"c":"So sánh phiên, nguồn traffic.","col":["revenue per viewer"],"rel":["GPM","unique viewers"],"fm":"GMV mỗi người xem = GMV ÷ người xem không trùng"},{"t":"order conversion rate","p":"n","vi":"tỉ lệ ra đơn trên người xem","d":"Phần trăm người xem đặt ít nhất một đơn.","ex":[["Order conversion rate was 2.4% tonight.","Tỉ lệ ra đơn tối nay là 2,4%."]],"c":"Đánh giá hiệu quả bán.","col":["viewer-to-buyer rate"],"rel":["conversion rate","buyers"],"fm":"Tỉ lệ ra đơn = số người mua ÷ số người xem × 100%"},{"t":"product CTR","p":"n","vi":"tỉ lệ nhấp sản phẩm","d":"Phần trăm người xem nhấp vào sản phẩm trong giỏ live.","ex":[["Product CTR jumped when the host did the water test.","Tỉ lệ nhấp tăng vọt khi host làm thử nghiệm với nước."]],"c":"Đánh giá sức hút sản phẩm, lời giới thiệu.","col":["click rate"],"rel":["product click","CTR"],"fm":"Tỉ lệ nhấp sản phẩm = lượt nhấp ÷ người xem × 100%"},{"t":"sales per hour","p":"n","vi":"doanh số mỗi giờ","d":"Số đơn hoặc GMV mỗi giờ live. Dùng so sánh host, khung giờ.","ex":[["Host A averages 180 sales per hour.","Host A trung bình 180 đơn mỗi giờ."]],"c":"Đánh giá host.","col":["orders per hour"],"rel":["hourly GMV"]},{"t":"peak GMV minute","p":"n","vi":"phút có GMV cao nhất","d":"Thời điểm bán chạy nhất trong phiên, giúp hiểu khoảnh khắc nào hiệu quả nhất.","ex":[["The peak GMV minute was right after the price reveal.","Phút GMV cao nhất là ngay sau màn công bố giá."]],"c":"Phân tích replay.","col":["peak minute"],"rel":["order spike","price reveal"]},{"t":"retention curve","p":"n","vi":"đường giữ chân","d":"Biểu đồ số người còn xem theo thời gian. Chỗ đường dốc xuống là nơi người xem rời đi.","ex":[["The retention curve drops every time we talk about shipping.","Đường giữ chân giảm mỗi lần nói về vận chuyển."]],"c":"Phân tích kịch bản.","col":["audience retention graph"],"rel":["viewer retention","drop-off"]},{"t":"bounce","p":"n, v","vi":"rời ngay","d":"Người xem vào phòng rồi thoát chỉ sau vài giây. Bounce rate là tỉ lệ thoát nhanh.","ex":[["Most viewers bounce within 5 seconds.","Phần lớn người xem thoát trong 5 giây."]],"c":"Phân tích mở đầu, khung hình.","col":["bounce rate"],"rel":["drop-off","hook"]},{"t":"stickiness","p":"n","vi":"độ “dính”","d":"Khả năng giữ người xem ở lại và quay lại. Phòng live dính thì thời gian xem dài, nhiều người quay lại.","ex":[["Daily lives with the same host improve stickiness.","Live hằng ngày cùng một host làm tăng độ dính."]],"c":"Đánh giá chất lượng kênh.","col":["sticky content"],"rel":["viewer retention","repeat customer"]},{"t":"returning viewers","p":"n","vi":"người xem quay lại","d":"Người đã từng xem các phiên trước và quay lại.","ex":[["40% of tonight's viewers are returning viewers.","40% người xem tối nay là người quay lại."]],"c":"Đánh giá lòng trung thành.","col":["repeat viewers"],"rel":["stickiness","new followers"]},{"t":"live score","p":"n","vi":"điểm chất lượng phòng live","d":"Điểm nền tảng chấm cho phòng live dựa trên giữ chân, tương tác, chuyển đổi, vi phạm. Tên gọi khác nhau theo nền tảng.","ex":[["Our live score dropped after the warning.","Điểm phòng live giảm sau cảnh báo."]],"c":"Tối ưu phân phối.","col":["room score","live quality"],"rel":["algorithm","warning"]},{"t":"attribution report","p":"n","vi":"báo cáo phân bổ nguồn","d":"Báo cáo cho biết GMV đến từ live, video ngắn, quảng cáo, tìm kiếm hay affiliate.","ex":[["The attribution report shows 60% of GMV came from live.","Báo cáo phân bổ cho thấy 60% GMV đến từ live."]],"c":"Phân tích kênh.","col":["channel breakdown"],"rel":["attribution","traffic source"]},{"t":"content type","p":"n","vi":"loại nội dung (nguồn doanh số)","d":"Cách nền tảng chia doanh số theo nguồn: live, video, thẻ sản phẩm, trang shop.","ex":[["Break down GMV by content type: live, video and product card.","Tách GMV theo loại nội dung: live, video và thẻ sản phẩm."]],"c":"Đọc báo cáo TikTok Shop.","col":["LIVE, video, product card"],"rel":["attribution report"]},{"t":"benchmark range","p":"n","vi":"khoảng tham chiếu","d":"Khoảng giá trị được xem là bình thường cho một chỉ số trong ngành hàng, giúp biết mình đang tốt hay kém.","ex":[["Our entry rate is below the benchmark range for beauty.","Tỉ lệ vào phòng thấp hơn khoảng tham chiếu ngành làm đẹp."]],"c":"Đánh giá chỉ số.","col":["industry average"],"rel":["benchmark"]},{"t":"GMV target","p":"n","vi":"chỉ tiêu GMV","d":"Mức GMV cần đạt cho phiên, tháng hoặc chiến dịch.","ex":[["Tonight's GMV target is 300 million.","Chỉ tiêu GMV tối nay là 300 triệu."]],"c":"Đặt mục tiêu.","col":["daily target","session target"],"rel":["target","GMV"]},{"t":"gap to target","p":"n","vi":"khoảng cách tới chỉ tiêu","d":"Phần còn thiếu để đạt chỉ tiêu.","ex":[["We're 40 million short, the gap to target is closing.","Còn thiếu 40 triệu, khoảng cách đang thu hẹp."]],"c":"Theo dõi trong phiên.","col":["shortfall"],"rel":["GMV target"]},{"t":"real-time alert","p":"n","vi":"cảnh báo thời gian thực","d":"Thông báo tự động khi chỉ số vượt ngưỡng, ví dụ CCU giảm 30%.","ex":[["Set a real-time alert when stock drops below 20.","Cài cảnh báo khi tồn kho dưới 20."]],"c":"Giám sát live.","col":["threshold","notification"],"rel":["real-time dashboard"]},{"t":"threshold","p":"n","vi":"ngưỡng","d":"Mức giới hạn kích hoạt một hành động.","ex":[["If CCU falls under the threshold, drop a voucher.","Nếu CCU dưới ngưỡng thì thả voucher."]],"c":"Thiết lập cảnh báo, voucher.","col":["minimum threshold"],"rel":["real-time alert"]},{"t":"session comparison","p":"n","vi":"so sánh giữa các phiên","d":"Đặt các phiên live cạnh nhau để so chỉ số.","ex":[["Session comparison shows Thursday is our weakest day.","So sánh các phiên cho thấy thứ Năm yếu nhất."]],"c":"Báo cáo.","col":["compare sessions"],"rel":["benchmark"]}]},{"id":"host","code":"HOST","group":"Livestream","en":"Host Skills & On-camera","vi":"Kỹ năng host và lên hình","intro":"Từ vựng để nói về phong thái, giọng nói, ngôn ngữ cơ thể và cách phát triển một host livestream.","terms":[{"t":"on-camera presence","p":"n","vi":"thần thái trước ống kính","d":"Khả năng tự nhiên, cuốn hút khi đứng trước máy quay.","ex":[["She has a strong on-camera presence.","Cô ấy có thần thái rất tốt trước ống kính."]],"c":"Tuyển và đánh giá host.","col":["screen presence","camera-ready"],"rel":["host","energy"]},{"t":"charisma","p":"n","vi":"sức hút","d":"Sức cuốn hút cá nhân khiến người khác muốn nghe và tin.","ex":[["His charisma keeps viewers watching for hours.","Sức hút của anh ấy giữ người xem hàng giờ."]],"c":"Đánh giá host.","col":["natural charisma"],"rel":["on-camera presence"]},{"t":"eye contact","p":"n","vi":"giao tiếp bằng mắt","d":"Nhìn thẳng vào ống kính để người xem cảm thấy host đang nói với mình.","ex":[["Keep eye contact with the camera, not the screen.","Nhìn vào ống kính, đừng nhìn màn hình."]],"c":"Góp ý host.","col":["make eye contact","look into the lens"],"rel":["on-camera presence"]},{"t":"body language","p":"n","vi":"ngôn ngữ cơ thể","d":"Cử chỉ, tư thế, nét mặt truyền tải thông điệp ngoài lời nói.","ex":[["Open body language makes you look more confident.","Ngôn ngữ cơ thể cởi mở giúp bạn trông tự tin hơn."]],"c":"Đào tạo host.","col":["open posture","gestures"],"rel":["eye contact"]},{"t":"gesture","p":"n","vi":"cử chỉ tay","d":"Động tác tay khi nói, giúp nhấn mạnh hoặc chỉ vào sản phẩm.","ex":[["Use gestures to point at the price on screen.","Dùng tay chỉ vào giá trên màn hình."]],"c":"Góp ý host.","col":["hand gestures"],"rel":["body language"]},{"t":"facial expression","p":"n","vi":"biểu cảm khuôn mặt","d":"Nét mặt thể hiện cảm xúc: hào hứng, ngạc nhiên, hài lòng.","ex":[["Your facial expression should match the excitement of the deal.","Biểu cảm nên hợp với sự hào hứng của deal."]],"c":"Đào tạo host.","col":["expressive"],"rel":["body language"]},{"t":"tone of voice","p":"n","vi":"giọng điệu","d":"Cách nói (vui, nghiêm túc, gấp gáp) tạo cảm xúc cho người nghe.","ex":[["Change your tone of voice when you announce the flash sale.","Đổi giọng điệu khi công bố flash sale."]],"c":"Góp ý host.","col":["upbeat tone","calm tone"],"rel":["brand voice","energy"]},{"t":"vocal variety","p":"n","vi":"biến đổi giọng","d":"Thay đổi cao độ, tốc độ, âm lượng để bài nói không đều đều, buồn ngủ.","ex":[["Use more vocal variety, it sounds monotone.","Thay đổi giọng nhiều hơn, đang nghe đều đều."]],"c":"Đào tạo host.","col":["monotone","pitch","volume"],"rel":["tone of voice"]},{"t":"projection","p":"n","vi":"độ vang của giọng","d":"Khả năng nói rõ, đủ lớn mà không phải hét.","ex":[["Work on your projection so you don't rely on the mic.","Luyện độ vang để không phụ thuộc mic."]],"c":"Luyện giọng.","col":["project your voice"],"rel":["vocal variety"]},{"t":"articulation","p":"n","vi":"phát âm rõ ràng","d":"Nói rõ từng chữ, nhất là khi đọc giá và mã voucher.","ex":[["Slow down and focus on articulation when you read the code.","Nói chậm và rõ khi đọc mã."]],"c":"Góp ý host.","col":["enunciate","speak clearly"],"rel":["projection"]},{"t":"speaking pace","p":"n","vi":"tốc độ nói","d":"Nói nhanh hay chậm. Quá nhanh khó nghe, quá chậm gây chán.","ex":[["Your speaking pace is too fast during the price reveal.","Lúc công bố giá bạn nói quá nhanh."]],"c":"Góp ý host.","col":["speak slowly","words per minute"],"rel":["pacing"]},{"t":"ad-lib","p":"v, n","vi":"nói ứng biến","d":"Nói không theo kịch bản, tự nhiên theo tình huống.","ex":[["She ad-libbed a funny story when the link broke.","Cô ấy ứng biến kể chuyện vui khi link bị lỗi."]],"c":"Kỹ năng host.","col":["improvise","off script"],"rel":["filler talk"]},{"t":"improvise","p":"v","vi":"ứng biến","d":"Xử lý tình huống bất ngờ mà không chuẩn bị trước.","ex":[["Hosts must improvise when something goes wrong.","Host phải ứng biến khi có sự cố."]],"c":"Xử lý sự cố khi live.","col":["improvisation","think on your feet"],"rel":["ad-lib"]},{"t":"off script","p":"adj","vi":"ngoài kịch bản","d":"Nói hoặc làm khác với kịch bản đã duyệt. Có thể tốt (tự nhiên) hoặc rủi ro (nói sai công dụng).","ex":[["Don't go off script on product claims.","Đừng nói ngoài kịch bản khi nói về công dụng."]],"c":"Kiểm soát nội dung.","col":["go off script","stick to the script"],"rel":["live script","product claims"]},{"t":"read the room","p":"phrase","vi":"đọc không khí","d":"Nắm được tâm trạng người xem qua bình luận và số liệu để điều chỉnh cách nói.","ex":[["Read the room: if comments slow down, switch products.","Đọc không khí: bình luận chậm thì đổi sản phẩm."]],"c":"Kỹ năng host.","col":["read the chat"],"rel":["engagement rate"]},{"t":"crowd control","p":"n","vi":"điều khiển đám đông","d":"Kỹ năng điều hướng người xem khi phòng đông, xử lý bình luận tiêu cực, giữ trật tự.","ex":[["Good crowd control keeps trolls from taking over.","Điều khiển tốt giúp không bị anti chiếm sóng."]],"c":"Live đông người.","col":["manage the chat"],"rel":["moderator","troll"]},{"t":"troll","p":"n, v","vi":"người phá rối, anti","d":"Người cố tình bình luận khiêu khích, tiêu cực để gây chú ý.","ex":[["Don't feed the trolls, let the mod handle it.","Đừng đáp lại anti, để mod xử lý."]],"c":"Quản lý bình luận.","col":["don't feed the trolls","hater"],"rel":["moderator","crowd control"]},{"t":"hype","p":"n, v","vi":"khuấy động, tạo hưng phấn","d":"Tạo không khí sôi động, phấn khích. Hype up là làm cho mọi người phấn khích.","ex":[["Hype up the room before the flash sale.","Khuấy động phòng trước flash sale."]],"c":"Kịch bản, host.","col":["hype up","hype man"],"rel":["energy","warm-up"]},{"t":"hype man","p":"n","vi":"người khuấy động","d":"Người hỗ trợ tạo không khí: hò reo, phụ họa, nhấn mạnh deal. Thường là co-host.","ex":[["The co-host acts as a hype man during price reveals.","Co-host làm người khuấy động lúc công bố giá."]],"c":"Phân vai trong live.","col":["sidekick"],"rel":["co-host","hype"]},{"t":"catchphrase","p":"n","vi":"câu cửa miệng","d":"Câu nói đặc trưng lặp lại giúp người xem nhớ host, ví dụ câu chào hoặc câu chốt riêng.","ex":[["Her catchphrase is 'Grab it before it's gone!'.","Câu cửa miệng của cô ấy là “Nhanh tay kẻo hết!”."]],"c":"Xây dựng thương hiệu host.","col":["signature line"],"rel":["personal brand"]},{"t":"personal brand","p":"n","vi":"thương hiệu cá nhân","d":"Hình ảnh, phong cách riêng của một người được khán giả nhận ra và tin tưởng.","ex":[["Top hosts build a personal brand beyond one shop.","Host giỏi xây thương hiệu cá nhân vượt ra ngoài một shop."]],"c":"Phát triển host, KOL.","col":["build a personal brand"],"rel":["catchphrase","influencer"]},{"t":"persona","p":"n","vi":"hình tượng nhân vật","d":"Tính cách và phong cách host thể hiện trên sóng, ví dụ người chị thân thiện, chuyên gia nghiêm túc.","ex":[["Her on-air persona is the honest big sister.","Hình tượng trên sóng của cô ấy là người chị thẳng thắn."]],"c":"Định vị host.","col":["on-air persona"],"rel":["personal brand","brand voice"]},{"t":"authentic","p":"adj","vi":"chân thật","d":"Tự nhiên, thật lòng, không gượng ép. Khán giả ngày càng chuộng host chân thật.","ex":[["Viewers trust her because she's authentic.","Người xem tin cô ấy vì cô ấy chân thật."]],"c":"Đánh giá phong cách.","col":["authenticity","be yourself"],"rel":["rapport"]},{"t":"relatable","p":"adj","vi":"gần gũi, dễ đồng cảm","d":"Khiến người xem thấy giống mình, hiểu mình.","ex":[["Share relatable stories about your own skin problems.","Chia sẻ câu chuyện gần gũi về vấn đề da của chính bạn."]],"c":"Nội dung, kịch bản.","col":["relatable content"],"rel":["authentic","storytelling"]},{"t":"credibility","p":"n","vi":"độ tin cậy","d":"Mức người xem tin lời host nói. Kiến thức sản phẩm và sự trung thực tạo nên độ tin cậy.","ex":[["Exaggerated claims hurt your credibility.","Nói quá làm mất độ tin cậy."]],"c":"Đánh giá host.","col":["build credibility","credible"],"rel":["authentic","product claims"]},{"t":"stage fright","p":"n","vi":"sợ sân khấu, run","d":"Cảm giác lo lắng khi đứng trước người xem. Host mới hay gặp.","ex":[["Practice reduces stage fright.","Luyện tập giúp bớt run."]],"c":"Đào tạo host mới.","col":["nervous","butterflies"],"rel":["rehearsal"]},{"t":"warm-up exercises","p":"n","vi":"bài khởi động giọng","d":"Bài tập giọng, hơi thở, mặt trước khi lên sóng.","ex":[["Do five minutes of vocal warm-up exercises before going live.","Khởi động giọng năm phút trước khi live."]],"c":"Chuẩn bị trước live.","col":["vocal warm-up"],"rel":["projection"]},{"t":"stamina","p":"n","vi":"sức bền","d":"Khả năng giữ năng lượng trong thời gian dài, rất cần cho live nhiều giờ.","ex":[["A 4-hour live needs a lot of stamina.","Live 4 tiếng cần sức bền lớn."]],"c":"Đánh giá host.","col":["build stamina"],"rel":["energy","host rotation"]},{"t":"burnout","p":"n","vi":"kiệt sức","d":"Trạng thái mệt mỏi kéo dài do làm việc quá sức. Host live nhiều ca dễ gặp.","ex":[["Rotate hosts to avoid burnout.","Luân phiên host để tránh kiệt sức."]],"c":"Quản lý nhân sự.","col":["burned out","prevent burnout"],"rel":["stamina","workload"]},{"t":"host scorecard","p":"n","vi":"phiếu đánh giá host","d":"Bảng chấm điểm host theo tiêu chí: GMV, giữ chân, tuân thủ kịch bản, năng lượng.","ex":[["Fill in the host scorecard after every session.","Điền phiếu đánh giá host sau mỗi phiên."]],"c":"Đánh giá định kỳ.","col":["scorecard","evaluation"],"rel":["post-live report"]},{"t":"host fee","p":"n","vi":"phí host","d":"Tiền trả cho host, có thể theo giờ, theo phiên, cộng hoa hồng.","ex":[["The host fee is 500k per hour plus 2% commission.","Phí host 500k mỗi giờ cộng 2% hoa hồng."]],"c":"Thuê host.","col":["hourly rate","per session"],"rel":["commission-based"]},{"t":"talent","p":"n","vi":"người tài, nhân sự biểu diễn","d":"Trong ngành nội dung, talent chỉ host, người mẫu, diễn viên xuất hiện trên hình.","ex":[["We're casting new talent for the fashion lives.","Đang tuyển người mới cho các phiên live thời trang."]],"c":"Tuyển dụng, booking.","col":["casting","talent management"],"rel":["host","casting"]},{"t":"casting","p":"n","vi":"tuyển chọn người lên hình","d":"Quá trình thử vai, chọn host, người mẫu.","ex":[["The casting for new hosts is on Saturday.","Buổi tuyển host mới vào thứ Bảy."]],"c":"Tuyển dụng.","col":["audition","casting call"],"rel":["talent"]},{"t":"audition","p":"n, v","vi":"buổi thử vai","d":"Buổi ứng viên thể hiện kỹ năng để được chọn.","ex":[["Each candidate does a 5-minute mock live in the audition.","Mỗi ứng viên live thử 5 phút trong buổi thử vai."]],"c":"Tuyển host.","col":["mock live","screen test"],"rel":["casting"]},{"t":"mock live","p":"n","vi":"live thử, live giả lập","d":"Buổi live giả để luyện tập hoặc kiểm tra kỹ năng, không phát thật.","ex":[["New hosts do three mock lives before going on air.","Host mới live thử ba lần trước khi lên sóng thật."]],"c":"Đào tạo, tuyển dụng.","col":["practice session"],"rel":["rehearsal","audition"]},{"t":"coaching","p":"n","vi":"huấn luyện kèm","d":"Hướng dẫn trực tiếp, thường xuyên để cải thiện kỹ năng.","ex":[["She gets weekly coaching from a senior host.","Cô ấy được host lâu năm huấn luyện hằng tuần."]],"c":"Phát triển host.","col":["coach","one-on-one coaching"],"rel":["feedback"]},{"t":"wardrobe","p":"n","vi":"trang phục (cho lên hình)","d":"Quần áo host mặc khi live, cần hợp với brand và không trùng màu nền.","ex":[["Avoid green in the wardrobe if we use a green screen.","Tránh trang phục xanh lá nếu dùng phông xanh."]],"c":"Chuẩn bị live.","col":["outfit","styling"],"rel":["green screen","backdrop"]},{"t":"hair and makeup","p":"n","vi":"làm tóc và trang điểm","d":"Khâu chuẩn bị ngoại hình trước khi lên sóng. Viết tắt HMU.","ex":[["Hair and makeup starts at 6 PM.","Làm tóc trang điểm bắt đầu lúc 6 giờ."]],"c":"Lịch chuẩn bị.","col":["HMU","touch-up"],"rel":["wardrobe"]},{"t":"touch-up","p":"n","vi":"dặm lại","d":"Chỉnh sửa nhỏ lớp trang điểm hoặc tóc giữa phiên.","ex":[["Quick touch-up during the host rotation.","Dặm lại nhanh lúc đổi host."]],"c":"Live dài.","col":["powder touch-up"],"rel":["hair and makeup"]},{"t":"sign-off line","p":"n","vi":"câu kết của host","d":"Câu chào kết thúc đặc trưng.","ex":[["End with your sign-off line and the next live time.","Kết bằng câu chào quen thuộc và giờ live tiếp theo."]],"c":"Kịch bản.","col":["closing line"],"rel":["catchphrase","wrap-up"]}]},{"id":"platform","code":"PLATFORM","group":"Livestream","en":"Platform Features & Interaction","vi":"Tính năng nền tảng và tương tác","intro":"Tên các tính năng hay gặp trên TikTok, Shopee, Facebook khi live và cách người xem tương tác. Tên gọi cụ thể có thể thay đổi theo từng phiên bản ứng dụng.","terms":[{"t":"LIVE Center","p":"n","vi":"trung tâm LIVE","d":"Khu quản lý live trên TikTok cho người sáng tạo và người bán: công cụ, số liệu, quy định.","ex":[["Check eligibility in the LIVE Center.","Kiểm tra điều kiện trong trung tâm LIVE."]],"c":"Tìm công cụ, số liệu.","col":["LIVE Studio","LIVE tools"],"rel":["real-time dashboard"]},{"t":"LIVE Manager","p":"n","vi":"công cụ quản lý LIVE","d":"Bảng điều khiển trên máy tính để quản lý phiên live TikTok Shop: ghim sản phẩm, xem số liệu, quản lý bình luận.","ex":[["The operator pins products from LIVE Manager.","Người vận hành ghim sản phẩm từ LIVE Manager."]],"c":"Vận hành live trên máy tính.","col":["LIVE dashboard"],"rel":["live operator","pinned product"]},{"t":"showcase","p":"n","vi":"tủ hàng, giỏ hàng cá nhân","d":"Khu sản phẩm trên trang cá nhân của creator TikTok, nơi họ thêm sản phẩm affiliate để bán.","ex":[["Add our serum to your showcase.","Thêm serum của mình vào tủ hàng của bạn nhé."]],"c":"Affiliate TikTok Shop.","col":["product showcase"],"rel":["affiliate marketing","creator"]},{"t":"product card","p":"n","vi":"thẻ sản phẩm","d":"Khung hiển thị sản phẩm (ảnh, tên, giá) trong video, live hoặc trang tìm kiếm.","ex":[["The product card shows the old price, update it.","Thẻ sản phẩm đang hiện giá cũ, cập nhật đi."]],"c":"Tối ưu hiển thị.","col":["product anchor","product link"],"rel":["pinned product"]},{"t":"shopping bag","p":"n","vi":"giỏ hàng (biểu tượng túi)","d":"Biểu tượng túi trong live TikTok, chứa danh sách sản phẩm đang bán. Ở Việt Nam hay gọi là giỏ hàng.","ex":[["There are 20 products in the shopping bag tonight.","Tối nay có 20 sản phẩm trong giỏ."]],"c":"Câu kêu gọi.","col":["orange bag","yellow basket"],"rel":["pinned product","call to action"]},{"t":"product number","p":"n","vi":"số thứ tự sản phẩm","d":"Số của sản phẩm trong giỏ live. Host nói số này để khách dễ tìm.","ex":[["The serum is product number 5.","Serum là sản phẩm số 5."]],"c":"Câu của host.","col":["item number"],"rel":["shopping bag"]},{"t":"Shopee Live","p":"n","vi":"livestream trên Shopee","d":"Tính năng live bán hàng của Shopee.","ex":[["Shopee Live viewers are more ready to buy.","Người xem Shopee Live sẵn sàng mua hơn."]],"c":"Nói về kênh.","col":["Shopee Live Xtra"],"rel":["marketplace","live commerce"]},{"t":"TikTok Shop","p":"n","vi":"TikTok Shop","d":"Nền tảng thương mại trong TikTok, cho phép bán qua video, live và trang cửa hàng.","ex":[["TikTok Shop is our fastest-growing channel.","TikTok Shop là kênh tăng trưởng nhanh nhất."]],"c":"Nói về kênh.","col":["TikTok Shop Seller Center"],"rel":["social commerce"]},{"t":"shoppable video","p":"n","vi":"video gắn sản phẩm","d":"Video ngắn có gắn thẻ sản phẩm để người xem mua ngay.","ex":[["Each shoppable video drives about 50 orders.","Mỗi video gắn sản phẩm mang về khoảng 50 đơn."]],"c":"Nội dung bán hàng.","col":["video with product link"],"rel":["product card","short-form video"]},{"t":"gifts","p":"n","vi":"quà tặng ảo","d":"Vật phẩm ảo người xem mua bằng xu và tặng host. Creator có thể đổi thành tiền.","ex":[["Thank viewers when they send gifts.","Cảm ơn người xem khi họ tặng quà."]],"c":"Live giải trí, live tương tác.","col":["send a gift","virtual gift","coins"],"rel":["diamonds"]},{"t":"diamonds","p":"n","vi":"kim cương (đơn vị quy đổi)","d":"Đơn vị TikTok quy đổi từ quà người xem tặng, creator rút thành tiền.","ex":[["The host earned 10,000 diamonds last night.","Host nhận được 10.000 kim cương tối qua."]],"c":"Live giải trí.","col":["cash out"],"rel":["gifts"]},{"t":"coins","p":"n","vi":"xu","d":"Đơn vị tiền ảo người dùng nạp để mua quà hoặc dùng ưu đãi. Shopee Xu là xu hoàn tiền.","ex":[
