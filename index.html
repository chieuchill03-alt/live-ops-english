ideo.","Tạo sự kiện live và gắn vào mọi video."]],"c":"Tăng người xem đầu phiên.","col":["LIVE event","event reminder"],"rel":["live booking"]},{"t":"live preview","p":"n","vi":"xem trước phòng live","d":"Đoạn phòng live tự phát trên bảng tin khi người dùng lướt qua. Khung hình hấp dẫn giúp tăng tỉ lệ vào.","ex":[["The first frame matters because of the live preview.","Khung hình đầu quan trọng vì phòng live hiện xem trước trên bảng tin."]],"c":"Tối ưu khung hình.","col":["in-feed preview"],"rel":["entry rate","scroll-stopper"]},{"t":"live cover","p":"n","vi":"ảnh bìa phòng live","d":"Ảnh đại diện phòng live hiển thị trên trang khám phá.","ex":[["Use a bright live cover with the main deal.","Dùng ảnh bìa sáng có deal chính."]],"c":"Thiết kế.","col":["cover image","live thumbnail"],"rel":["thumbnail"]},{"t":"live title","p":"n","vi":"tiêu đề phòng live","d":"Dòng chữ tên phiên live, nên nêu ưu đãi hoặc chủ đề.","ex":[["Live title: 'Sunscreen 1k – only tonight'.","Tiêu đề live: “Kem chống nắng 1k – chỉ tối nay”."]],"c":"Cài đặt phiên.","col":["stream title"],"rel":["live cover"]},{"t":"keyword filter","p":"n","vi":"bộ lọc từ khóa","d":"Tính năng tự ẩn bình luận chứa từ khóa chỉ định (lời lẽ xấu, tên đối thủ, link lạ).","ex":[["Add competitor names to the keyword filter.","Thêm tên đối thủ vào bộ lọc từ khóa."]],"c":"Quản lý bình luận.","col":["comment filter","blocked words"],"rel":["moderator"]},{"t":"slow mode","p":"n","vi":"chế độ bình luận chậm","d":"Giới hạn mỗi người chỉ bình luận sau mỗi vài giây, giảm spam khi phòng đông.","ex":[["Turn on slow mode during the giveaway.","Bật chế độ chậm trong lúc minigame."]],"c":"Quản lý bình luận.","col":["comment cooldown"],"rel":["keyword filter"]},{"t":"spam","p":"n, v","vi":"tin rác, gửi tin rác","d":"Bình luận lặp lại, quảng cáo, link lạ.","ex":[["Mute anyone who spams links.","Chặn ai gửi link rác."]],"c":"Quản lý bình luận.","col":["spammer","spam comments"],"rel":["moderator","keyword filter"]},{"t":"mute a viewer","p":"phrase","vi":"chặn bình luận của người xem","d":"Tạm không cho một người bình luận trong phiên.","ex":[["Mute that viewer for 10 minutes.","Chặn bình luận người đó 10 phút."]],"c":"Quản lý bình luận.","col":["block","kick out"],"rel":["moderator"]},{"t":"viewer list","p":"n","vi":"danh sách người xem","d":"Danh sách người đang trong phòng, thường xếp theo mức tương tác hoặc quà tặng.","ex":[["Shout out the top three on the viewer list.","Gọi tên ba người đứng đầu danh sách người xem."]],"c":"Tương tác.","col":["top viewers","leaderboard"],"rel":["shout-out"]},{"t":"leaderboard","p":"n","vi":"bảng xếp hạng","d":"Bảng xếp hạng người xem tặng quà nhiều nhất, hoặc xếp hạng host, shop.","ex":[["Viewers compete to top the leaderboard.","Người xem thi nhau đứng đầu bảng xếp hạng."]],"c":"Live tương tác.","col":["ranking","top gifters"],"rel":["gifts"]},{"t":"eligibility","p":"n","vi":"điều kiện đủ","d":"Yêu cầu để dùng một tính năng, ví dụ số người theo dõi, tuổi tài khoản, không vi phạm.","ex":[["Check the eligibility for LIVE Shopping.","Kiểm tra điều kiện để bán hàng qua live."]],"c":"Mở tính năng live, RTMP, affiliate.","col":["eligible","meet the requirements"],"rel":["LIVE Center"]},{"t":"account health","p":"n","vi":"sức khỏe tài khoản","d":"Tình trạng tài khoản theo số lần vi phạm, điểm phạt. Tài khoản kém bị hạn chế tiếp cận.","ex":[["Our account health is good, no active violations.","Sức khỏe tài khoản tốt, không có vi phạm nào."]],"c":"Theo dõi vi phạm.","col":["account status"],"rel":["penalty points","live restriction"]},{"t":"shadowban","p":"n, v","vi":"bị bóp tương tác ngầm","d":"Nội dung bị giảm phân phối mà không có thông báo rõ. Thường do người dùng phỏng đoán, nền tảng ít khi xác nhận.","ex":[["Views dropped 80%, we might be shadowbanned.","Lượt xem tụt 80%, có thể bị bóp tương tác."]],"c":"Phân tích tụt lượt xem.","col":["reduced reach"],"rel":["account health","algorithm"]},{"t":"stream ended unexpectedly","p":"phrase","vi":"live bị ngắt bất ngờ","d":"Phiên live dừng không chủ ý do mạng, ứng dụng lỗi hoặc nền tảng tắt vì vi phạm.","ex":[["The stream ended unexpectedly at 9:42 PM.","Live bị ngắt bất ngờ lúc 9 giờ 42."]],"c":"Báo sự cố.","col":["stream dropped","disconnected"],"rel":["live incident"]},{"t":"co-live","p":"n","vi":"live chung","d":"Hai tài khoản (brand và KOL, hoặc hai shop) cùng live và cùng bán.","ex":[["We'll do a co-live with the KOL's account.","Mình sẽ live chung với tài khoản của KOL."]],"c":"Hợp tác kéo traffic.","col":["collab live","joint live"],"rel":["multi-guest","KOL"]},{"t":"live replay link","p":"n","vi":"link xem lại","d":"Link phát lại phiên live, chia sẻ cho brand hoặc khách.","ex":[["Attach the live replay link to the report.","Đính kèm link xem lại vào báo cáo."]],"c":"Gửi báo cáo.","col":["recording link"],"rel":["replay"]},{"t":"live notification","p":"n","vi":"thông báo live","d":"Thông báo đẩy tới người theo dõi khi tài khoản bắt đầu live.","ex":[["Followers get a live notification when we go live.","Người theo dõi nhận thông báo khi mình lên live."]],"c":"Kéo người xem đầu phiên.","col":["push notification"],"rel":["live event"]},{"t":"live gift box","p":"n","vi":"hộp quà trong live","d":"Tính năng thả quà hoặc xu ngẫu nhiên cho người xem ở lại đủ lâu, tùy nền tảng.","ex":[["Drop a live gift box at the 30-minute mark.","Thả hộp quà ở phút thứ 30."]],"c":"Giữ chân người xem.","col":["treasure box"],"rel":["giveaway"]},{"t":"pinned message","p":"n","vi":"tin nhắn ghim trong live","d":"Dòng thông báo cố định trên màn hình live.","ex":[["Update the pinned message with the next flash sale time.","Cập nhật tin ghim với giờ flash sale tiếp theo."]],"c":"Thông tin deal.","col":["announcement"],"rel":["pinned comment"]}]},{"id":"production","code":"PROD","group":"Livestream","en":"Production Team & Workflow","vi":"Đội sản xuất và quy trình","intro":"Các vai trò trong đội live và sản xuất nội dung, cùng từ vựng mô tả quy trình làm việc.","terms":[{"t":"producer","p":"n","vi":"nhà sản xuất","d":"Người chịu trách nhiệm tổng thể phiên live hoặc dự án nội dung: kế hoạch, ngân sách, nhân sự, tiến độ.","ex":[["The producer approves the final run of show.","Nhà sản xuất duyệt kịch bản chạy cuối cùng."]],"c":"Phân vai team.","col":["live producer","executive producer"],"rel":["director","run of show"]},{"t":"director","p":"n","vi":"đạo diễn","d":"Người chỉ đạo hình ảnh và diễn xuất: góc máy, chuyển cảnh, nhịp độ.","ex":[["The director calls the camera switches.","Đạo diễn ra lệnh chuyển máy."]],"c":"Live chuyên nghiệp, quay video.","col":["live director"],"rel":["producer","video switcher"]},{"t":"floor manager","p":"n","vi":"quản lý sàn quay","d":"Người điều phối trực tiếp trong phòng quay: ra hiệu cho host, sắp xếp đạo cụ, giữ trật tự.","ex":[["The floor manager gives the host time cues.","Quản lý sàn ra hiệu thời gian cho host."]],"c":"Phân vai team.","col":["stage manager"],"rel":["cue","props"]},{"t":"camera operator","p":"n","vi":"quay phim","d":"Người điều khiển máy quay.","ex":[["The camera operator follows the host during the try-on.","Quay phim theo host khi mặc thử."]],"c":"Phân vai team.","col":["cameraman","camera op"],"rel":["close-up"]},{"t":"technical director","p":"n","vi":"kỹ thuật viên chính","d":"Người phụ trách toàn bộ kỹ thuật: mạng, phần mềm phát, âm thanh, hình ảnh.","ex":[["Call the technical director if the stream drops.","Gọi kỹ thuật chính nếu live rớt."]],"c":"Phân vai team.","col":["tech lead","engineer"],"rel":["stream setup"]},{"t":"scriptwriter","p":"n","vi":"người viết kịch bản","d":"Người viết kịch bản live và video.","ex":[["The scriptwriter updates the script after each review.","Người viết kịch bản cập nhật sau mỗi buổi đánh giá."]],"c":"Phân vai team.","col":["copywriter"],"rel":["live script"]},{"t":"content creator team","p":"n","vi":"đội sản xuất nội dung","d":"Nhóm làm video ngắn, ảnh, thiết kế quảng bá cho live.","ex":[["The content team posts three teasers before every live.","Đội nội dung đăng ba video nhá hàng trước mỗi live."]],"c":"Phân vai.","col":["content team"],"rel":["short-form video"]},{"t":"editor","p":"n","vi":"người dựng phim","d":"Người dựng, cắt ghép video từ cảnh quay và replay.","ex":[["The editor needs the raw footage by noon.","Người dựng cần cảnh quay gốc trước trưa."]],"c":"Hậu kỳ.","col":["video editor"],"rel":["post-production"]},{"t":"post-production","p":"n","vi":"hậu kỳ","d":"Các bước sau khi quay: dựng, chỉnh màu, âm thanh, phụ đề.","ex":[["Post-production takes two days.","Hậu kỳ mất hai ngày."]],"c":"Quy trình video.","col":["post","editing"],"rel":["editor","pre-production"]},{"t":"pre-production","p":"n","vi":"tiền kỳ","d":"Các bước chuẩn bị trước khi quay: kịch bản, casting, đạo cụ, lịch quay.","ex":[["Most problems should be solved in pre-production.","Phần lớn vấn đề nên giải quyết ở khâu tiền kỳ."]],"c":"Quy trình video.","col":["planning"],"rel":["post-production","shot list"]},{"t":"raw footage","p":"n","vi":"cảnh quay gốc","d":"Video chưa qua chỉnh sửa.","ex":[["Upload the raw footage to the shared drive.","Tải cảnh quay gốc lên ổ chung."]],"c":"Hậu kỳ.","col":["footage","rushes"],"rel":["editor"]},{"t":"call time","p":"n","vi":"giờ có mặt","d":"Giờ mọi người phải có mặt ở phòng quay.","ex":[["Call time is 5 PM for a 7 PM live.","Giờ có mặt là 5 giờ cho phiên 7 giờ."]],"c":"Lịch làm việc.","col":["crew call"],"rel":["shift"]},{"t":"call sheet","p":"n","vi":"bảng lịch quay","d":"Tài liệu gửi cả đội: giờ có mặt, địa điểm, vai trò, liên hệ, lịch trình.","ex":[["The call sheet goes out the day before.","Bảng lịch quay được gửi trước một ngày."]],"c":"Chuẩn bị buổi quay.","col":["daily schedule"],"rel":["call time"]},{"t":"crew","p":"n","vi":"đội ngũ hậu trường","d":"Tất cả người làm việc phía sau máy quay.","ex":[["We need a crew of five for the outdoor live.","Live ngoài trời cần đội năm người."]],"c":"Nói chung về team.","col":["production crew","skeleton crew"],"rel":["producer"]},{"t":"SOP","p":"abbr","vi":"quy trình chuẩn","d":"Tài liệu mô tả các bước làm một việc theo cách thống nhất.","ex":[["Follow the SOP for setting up flash sales.","Làm theo quy trình chuẩn khi cài flash sale."]],"f":"Standard Operating Procedure","c":"Chuẩn hóa vận hành.","col":["write an SOP","follow the SOP"],"rel":["pre-live checklist","workflow"]},{"t":"workflow","p":"n","vi":"quy trình làm việc","d":"Chuỗi bước và người phụ trách để hoàn thành công việc.","ex":[["Our approval workflow has three steps.","Quy trình duyệt có ba bước."]],"c":"Thiết kế vận hành.","col":["streamline the workflow"],"rel":["SOP"]},{"t":"template","p":"n","vi":"mẫu có sẵn","d":"File mẫu dùng lại: mẫu kịch bản, mẫu báo cáo, mẫu banner.","ex":[["Use the report template so numbers are consistent.","Dùng mẫu báo cáo để số liệu thống nhất."]],"c":"Chuẩn hóa tài liệu.","col":["report template","script template"],"rel":["SOP"]},{"t":"shared drive","p":"n","vi":"ổ lưu trữ chung","d":"Thư mục đám mây cả team cùng truy cập.","ex":[["All live scripts are in the shared drive.","Mọi kịch bản live ở ổ chung."]],"c":"Lưu tài liệu.","col":["shared folder","Google Drive"],"rel":["template"]},{"t":"version control","p":"n","vi":"quản lý phiên bản","d":"Theo dõi các bản sửa của tài liệu để không nhầm bản cũ, bản mới. Hay đặt tên v1, v2, final.","ex":[["Name files with dates for version control.","Đặt tên file kèm ngày để quản lý phiên bản."]],"c":"Làm việc với nhiều bản sửa.","col":["latest version","final_v2"],"rel":["revision"]},{"t":"asset","p":"n","vi":"tài nguyên (hình, video, logo)","d":"Mọi file dùng cho nội dung: ảnh sản phẩm, logo, video, font.","ex":[["Can the brand send us the product assets?","Brand gửi giúp tài nguyên hình ảnh sản phẩm nhé?"]],"c":"Làm việc với brand, thiết kế.","col":["brand assets","creative assets"],"rel":["brand guidelines"]},{"t":"turnaround time","p":"n","vi":"thời gian hoàn thành","d":"Thời gian từ lúc nhận yêu cầu đến lúc giao kết quả.","ex":[["Turnaround time for a short video is 48 hours.","Thời gian hoàn thành một video ngắn là 48 giờ."]],"c":"Cam kết tiến độ.","col":["quick turnaround"],"rel":["SLA","deadline"]},{"t":"capacity","p":"n","vi":"năng lực, công suất","d":"Khối lượng tối đa team hoặc phòng quay xử lý được.","ex":[["We're at full capacity in November.","Tháng 11 bọn mình kín công suất."]],"c":"Lập kế hoạch.","col":["at capacity","production capacity"],"rel":["bandwidth"]},{"t":"utilization rate","p":"n","vi":"tỉ lệ sử dụng","d":"Phần trăm thời gian phòng quay hoặc nhân sự được sử dụng so với tổng thời gian có.","ex":[["Studio utilization rate is only 55%.","Tỉ lệ sử dụng phòng quay chỉ 55%."]],"c":"Quản lý chi phí phòng quay.","col":["occupancy rate"],"rel":["capacity"],"fm":"Tỉ lệ sử dụng = giờ sử dụng ÷ giờ khả dụng × 100%"},{"t":"outsource","p":"v","vi":"thuê ngoài","d":"Giao việc cho đơn vị bên ngoài thay vì tự làm.","ex":[["We outsource video editing to a freelancer.","Bọn mình thuê ngoài việc dựng video cho một freelancer."]],"c":"Quyết định vận hành.","col":["outsourcing","in-house"],"rel":["freelancer","3PL"]},{"t":"freelancer","p":"n","vi":"người làm tự do","d":"Người làm việc theo dự án, không phải nhân viên chính thức.","ex":[["We hired two freelancer hosts for 11.11.","Thuê hai host tự do cho 11.11."]],"c":"Thuê nhân sự linh hoạt.","col":["freelance","contractor"],"rel":["outsource"]},{"t":"part-time","p":"adj","vi":"bán thời gian","d":"Làm không đủ giờ hành chính. Toàn thời gian là full-time.","ex":[["Most of our moderators are part-time.","Phần lớn mod là bán thời gian."]],"c":"Tuyển dụng.","col":["full-time","part-timer"],"rel":["shift"]},{"t":"intern","p":"n","vi":"thực tập sinh","d":"Người học việc ngắn hạn.","ex":[["The intern helps with comment moderation.","Thực tập sinh hỗ trợ quản lý bình luận."]],"c":"Tuyển dụng.","col":["internship"],"rel":["part-time"]},{"t":"onboarding","p":"n","vi":"hội nhập nhân viên mới","d":"Quá trình hướng dẫn người mới làm quen công việc, công cụ, quy trình.","ex":[["Onboarding for new hosts takes one week.","Hội nhập cho host mới mất một tuần."]],"c":"Đào tạo.","col":["onboard","onboarding checklist"],"rel":["product training","SOP"]},{"t":"training material","p":"n","vi":"tài liệu đào tạo","d":"Tài liệu, video hướng dẫn dùng để đào tạo.","ex":[["Update the training material with the new policies.","Cập nhật tài liệu đào tạo theo quy định mới."]],"c":"Đào tạo.","col":["training deck","handbook"],"rel":["onboarding"]}]},{"id":"strategy","code":"STRATEGY","group":"Livestream","en":"Live Commerce Strategy","vi":"Chiến lược live commerce","intro":"Khái niệm cấp quản lý để lên kế hoạch và mở rộng kênh livestream bán hàng: mô hình, đầu tư, tăng trưởng.","terms":[{"t":"live commerce strategy","p":"n","vi":"chiến lược bán hàng qua live","d":"Kế hoạch tổng thể: mục tiêu, nền tảng, mô hình host, tần suất, sản phẩm, ngân sách.","ex":[["Our live commerce strategy focuses on daily brand lives.","Chiến lược live tập trung vào live thương hiệu hằng ngày."]],"c":"Lập kế hoạch năm.","col":["live strategy"],"rel":["self-broadcast","KOL"]},{"t":"live frequency","p":"n","vi":"tần suất live","d":"Số phiên live mỗi ngày hoặc mỗi tuần.","ex":[["Increasing live frequency to twice a day doubled GMV.","Tăng tần suất live lên hai lần mỗi ngày làm GMV tăng gấp đôi."]],"c":"Lập kế hoạch.","col":["daily live","sessions per week"],"rel":["consistency"]},{"t":"always-on live","p":"n","vi":"live đều đặn hằng ngày","d":"Live liên tục theo lịch cố định, khác với live chỉ vào dịp chiến dịch.","ex":[["Always-on live builds a loyal audience.","Live đều đặn hằng ngày xây tệp khán giả trung thành."]],"c":"Chiến lược.","col":["daily live"],"rel":["always-on","live frequency"]},{"t":"mega live","p":"n","vi":"live lớn dịp chiến dịch","d":"Phiên live quy mô lớn, đầu tư mạnh vào KOL, deal, quảng cáo, thường vào ngày đôi.","ex":[["The 11.11 mega live had three KOLs and a 500 million ad budget.","Live lớn 11.11 có ba KOL và 500 triệu ngân sách quảng cáo."]],"c":"Chiến dịch.","col":["tentpole event"],"rel":["mega sale","marathon live"]},{"t":"tentpole event","p":"n","vi":"sự kiện trọng điểm","d":"Sự kiện lớn làm điểm nhấn cho cả kỳ kinh doanh, kéo theo nhiều hoạt động xung quanh.","ex":[["11.11 is our biggest tentpole event.","11.11 là sự kiện trọng điểm lớn nhất của mình."]],"c":"Kế hoạch năm.","col":["key moment"],"rel":["mega live","campaign calendar"]},{"t":"channel strategy","p":"n","vi":"chiến lược kênh","d":"Quyết định bán ở đâu, vai trò của từng kênh (sàn, TikTok, website, cửa hàng).","ex":[["Our channel strategy: TikTok for discovery, Shopee for repeat buyers.","Chiến lược kênh: TikTok để khám phá, Shopee cho khách mua lại."]],"c":"Chiến lược.","col":["channel role"],"rel":["omnichannel"]},{"t":"content-to-commerce","p":"n","vi":"từ nội dung đến mua hàng","d":"Mô hình nội dung (video, live) dẫn thẳng tới mua hàng trong cùng nền tảng.","ex":[["TikTok's content-to-commerce loop is very short.","Vòng từ nội dung đến mua hàng trên TikTok rất ngắn."]],"c":"Chiến lược social commerce.","col":["shoppable content"],"rel":["social commerce"]},{"t":"flywheel","p":"n","vi":"bánh đà tăng trưởng","d":"Vòng tự củng cố: nhiều nội dung hơn → nhiều người xem hơn → nhiều đơn hơn → nhiều ngân sách cho nội dung hơn.","ex":[["Affiliate creators feed our sales flywheel.","Creator affiliate nuôi bánh đà doanh số."]],"c":"Chiến lược.","col":["growth loop"],"rel":["content-to-commerce"]},{"t":"scale up","p":"v","vi":"mở rộng quy mô","d":"Tăng quy mô hoạt động: thêm phòng quay, thêm host, thêm giờ live.","ex":[["We'll scale up to four studios next quarter.","Quý sau mở rộng lên bốn phòng quay."]],"c":"Kế hoạch tăng trưởng.","col":["scale","scalable"],"rel":["capacity"]},{"t":"scalable","p":"adj","vi":"có thể mở rộng","d":"Mô hình có thể tăng quy mô mà chi phí không tăng tương ứng.","ex":[["Is this host model scalable?","Mô hình host này có mở rộng được không?"]],"c":"Đánh giá mô hình.","col":["scalability"],"rel":["scale up"]},{"t":"unit economics per session","p":"n","vi":"kinh tế đơn vị mỗi phiên","d":"Doanh thu, chi phí và lợi nhuận tính trên một phiên live.","ex":[["Unit economics per session turned positive in month three.","Kinh tế mỗi phiên có lãi từ tháng thứ ba."]],"c":"Đánh giá hiệu quả.","col":["session P&L"],"rel":["unit economics","cost per session"]},{"t":"investment phase","p":"n","vi":"giai đoạn đầu tư","d":"Thời gian đầu chấp nhận lỗ để xây kênh, tệp khách.","ex":[["The first three months are an investment phase.","Ba tháng đầu là giai đoạn đầu tư."]],"c":"Chiến lược, tài chính.","col":["ramp-up"],"rel":["break-even"]},{"t":"ramp-up","p":"n","vi":"giai đoạn tăng tốc","d":"Giai đoạn tăng dần quy mô và hiệu suất sau khi khởi động.","ex":[["Expect a two-month ramp-up for a new live account.","Tài khoản live mới cần khoảng hai tháng tăng tốc."]],"c":"Kế hoạch.","col":["ramp up"],"rel":["investment phase"]},{"t":"cold start","p":"n","vi":"khởi đầu từ con số 0","d":"Giai đoạn tài khoản mới chưa có người theo dõi và dữ liệu, rất khó có traffic.","ex":[["Use paid traffic to break the cold start.","Dùng traffic trả phí để vượt qua giai đoạn khởi đầu."]],"c":"Tài khoản mới.","col":["new account"],"rel":["ramp-up","paid traffic"]},{"t":"account matrix","p":"n","vi":"ma trận tài khoản","d":"Vận hành nhiều tài khoản live cho cùng brand, mỗi tài khoản nhắm một nhóm khách hoặc dòng sản phẩm.","ex":[["We built an account matrix: one for skincare, one for makeup.","Xây ma trận tài khoản: một cho chăm da, một cho trang điểm."]],"c":"Chiến lược mở rộng.","col":["multiple accounts"],"rel":["multi-store"]},{"t":"competitive edge","p":"n","vi":"lợi thế cạnh tranh","d":"Điểm giúp vượt đối thủ.","ex":[["Our competitive edge is 24-hour delivery.","Lợi thế cạnh tranh là giao trong 24 giờ."]],"c":"Chiến lược.","col":["competitive advantage","moat"],"rel":["USP"]},{"t":"market leader","p":"n","vi":"dẫn đầu thị trường","d":"Thương hiệu hoặc shop chiếm thị phần lớn nhất.","ex":[["They're the market leader in live skincare.","Họ dẫn đầu thị trường live mỹ phẩm."]],"c":"Phân tích thị trường.","col":["category leader"],"rel":["market share"]},{"t":"playbook","p":"n","vi":"cẩm nang chiến thuật","d":"Tài liệu tổng hợp cách làm đã thành công để team áp dụng lặp lại.","ex":[["Write a live playbook for new brands.","Viết cẩm nang live cho các brand mới."]],"c":"Chuẩn hóa, mở rộng.","col":["live playbook"],"rel":["SOP","best practice"]},{"t":"north star","p":"n","vi":"định hướng chính","d":"Mục tiêu dài hạn định hướng mọi quyết định.","ex":[["Customer trust is our north star.","Niềm tin khách hàng là định hướng chính."]],"c":"Chiến lược.","col":["guiding principle"],"rel":["north star metric"]},{"t":"roadmap","p":"n","vi":"lộ trình","d":"Kế hoạch các bước lớn theo thời gian.","ex":[["Here's our 2027 live commerce roadmap.","Đây là lộ trình live commerce năm 2027."]],"c":"Chiến lược, sản phẩm.","col":["product roadmap"],"rel":["milestone"]}]},{"id":"store","code":"STORE","group":"Thương mại điện tử","en":"Marketplace & Store Ops","vi":"Sàn và vận hành gian hàng","intro":"Thuật ngữ khi làm việc trên Shopee, Lazada, TikTok Shop: gian hàng, sản phẩm, điểm vận hành, phí sàn.","terms":[{"t":"e-commerce","p":"n","vi":"thương mại điện tử","d":"Mua bán hàng hóa qua internet. Viết tắt là e-com. Người bán trên sàn thường gọi là seller.","c":"Mô tả ngành, giới thiệu bản thân.","ex":[["I work in e-commerce operations for a beauty brand.","Tôi làm vận hành thương mại điện tử cho một brand mỹ phẩm."]],"col":["e-commerce platform","e-com team"],"rel":["marketplace","social commerce"]},{"t":"marketplace","p":"n","vi":"sàn thương mại điện tử","d":"Nền tảng cho nhiều người bán cùng mở gian hàng, ví dụ Shopee, Lazada, TikTok Shop, Tiki.","c":"Nói về kênh bán.","ex":[["We sell on three marketplaces and our own website.","Mình bán trên ba sàn và website riêng."]],"col":["online marketplace","marketplace channel"],"rel":["D2C","seller center"]},{"t":"D2C","f":"Direct-to-Consumer","p":"abbr","vi":"bán trực tiếp cho người tiêu dùng","d":"Brand bán thẳng cho khách qua website, app hoặc kênh riêng, không qua nhà phân phối hay sàn. Còn viết DTC.","c":"Chiến lược kênh.","ex":[["The brand wants to grow its D2C website to reduce marketplace fees.","Brand muốn phát triển website riêng để giảm phí sàn."]],"col":["DTC brand","own channel"],"rel":["marketplace","omnichannel"]},{"t":"social commerce","p":"n","vi":"thương mại xã hội","d":"Mua bán ngay trong mạng xã hội, ví dụ mua trong video TikTok, live Facebook. Ranh giới giữa nội dung và mua hàng gần như không còn.","c":"Xu hướng ngành, chiến lược.","ex":[["Social commerce now accounts for a big share of our sales.","Thương mại xã hội giờ chiếm tỉ trọng lớn trong doanh số."]],"col":["shoppable content"],"rel":["live commerce","marketplace"]},{"t":"live commerce","p":"n","vi":"bán hàng qua livestream","d":"Hình thức bán hàng bằng livestream, người xem mua ngay trong lúc xem. Còn gọi là livestream shopping hoặc live selling.","c":"Mô tả ngành nghề Operation Livestream.","ex":[["Live commerce is growing fast in Southeast Asia.","Bán hàng qua livestream đang tăng trưởng nhanh ở Đông Nam Á."]],"col":["livestream shopping","live selling"],"rel":["social commerce","livestream session"]},{"t":"omnichannel","p":"adj, n","vi":"đa kênh hợp nhất","d":"Bán trên nhiều kênh (cửa hàng, sàn, website, mạng xã hội) với trải nghiệm và dữ liệu liên thông. Khác multichannel là chỉ có nhiều kênh nhưng rời rạc.","c":"Chiến lược kinh doanh.","ex":[["Our goal is an omnichannel experience across stores and marketplaces.","Mục tiêu là trải nghiệm đa kênh xuyên suốt cửa hàng và sàn."]],"col":["omnichannel strategy","multichannel"],"rel":["D2C","marketplace"]},{"t":"seller center","p":"n","vi":"kênh người bán","d":"Trang quản trị dành cho người bán trên sàn: quản lý đơn, sản phẩm, khuyến mãi, quảng cáo, số liệu, tài chính.","c":"Hướng dẫn thao tác, lấy báo cáo.","ex":[["You can download the order report from the seller center.","Tải báo cáo đơn hàng từ kênh người bán."]],"col":["Seller Centre","seller dashboard","backend"],"rel":["marketplace","listing"]},{"t":"official store","p":"n","vi":"gian hàng chính hãng","d":"Gian hàng được sàn xác nhận là của brand hoặc nhà phân phối chính thức, ví dụ Shopee Mall, LazMall. Có quyền lợi riêng nhưng yêu cầu khắt khe hơn.","c":"Đăng ký gian hàng, uy tín thương hiệu.","ex":[["Official store customers trust that the products are authentic.","Khách ở gian hàng chính hãng tin sản phẩm là hàng thật."]],"col":["Mall store","brand store","flagship store"],"rel":["authorized distributor","shop performance"]},{"t":"authorized distributor","p":"n","vi":"nhà phân phối được ủy quyền","d":"Đơn vị được brand cho phép phân phối sản phẩm, có giấy ủy quyền. Sàn yêu cầu giấy này khi mở gian hàng chính hãng.","c":"Hồ sơ mở gian hàng, hợp tác.","ex":[["We need the authorization letter to prove we are an authorized distributor.","Cần thư ủy quyền để chứng minh mình là nhà phân phối được ủy quyền."]],"col":["letter of authorization","LOA"],"rel":["official store"]},{"t":"shop performance","p":"n","vi":"hiệu suất vận hành gian hàng","d":"Bộ chỉ số sàn dùng chấm điểm shop: tỉ lệ giao trễ, tỉ lệ hủy, tỉ lệ phản hồi chat, đánh giá. Điểm thấp có thể bị hạn chế tham gia chiến dịch.","c":"Theo dõi sức khỏe gian hàng.","ex":[["Our shop performance dropped because of late shipments.","Hiệu suất gian hàng giảm vì giao hàng trễ."]],"col":["shop score","shop health","performance metrics"],"rel":["penalty points","late shipment rate","chat response rate"]},{"t":"penalty points","p":"n","vi":"điểm phạt","d":"Điểm sàn trừ khi shop vi phạm quy định (giao trễ, hủy đơn, hàng cấm, spam). Tích đủ điểm sẽ bị hạn chế tính năng hoặc khóa shop.","c":"Xử lý vi phạm, khiếu nại sàn.","ex":[["We received 3 penalty points for a prohibited listing.","Shop bị 3 điểm phạt vì đăng sản phẩm bị cấm."]],"col":["sanction points","get penalized","penalty tier"],"rel":["policy violation","shop performance"]},{"t":"policy violation","p":"n","vi":"vi phạm chính sách","d":"Hành vi trái quy định của sàn hoặc nền tảng: sai mô tả, hàng giả, giá ảo, nội dung cấm.","c":"Xử lý thông báo vi phạm.","ex":[["The listing was removed for policy violation.","Sản phẩm bị gỡ vì vi phạm chính sách."]],"col":["violate a policy","appeal a violation"],"rel":["penalty points","community guidelines","appeal"]},{"t":"appeal","p":"n, v","vi":"kháng nghị, khiếu nại lại","d":"Yêu cầu sàn xem xét lại một quyết định phạt, gỡ sản phẩm, khóa live.","c":"Xử lý vi phạm.","ex":[["We'll appeal the decision with the product certificate.","Mình sẽ kháng nghị kèm giấy chứng nhận sản phẩm."]],"col":["submit an appeal","appeal approved"],"rel":["policy violation","live restriction"]},{"t":"listing","p":"n","vi":"bài đăng sản phẩm","d":"Một sản phẩm được đăng bán trên sàn gồm tên, ảnh, giá, mô tả, phân loại. Động từ là list a product.","c":"Tạo, tối ưu sản phẩm.","ex":[["The new listing needs better photos and a size chart.","Bài đăng mới cần ảnh đẹp hơn và bảng size."],["We have 120 active listings.","Shop có 120 sản phẩm đang bán."]],"col":["create a listing","active listing","listing optimization"],"rel":["PDP","product title","SKU"]},{"t":"product title","p":"n","vi":"tên sản phẩm","d":"Tên hiển thị trên sàn, ảnh hưởng tới tìm kiếm. Thường gồm thương hiệu, loại sản phẩm, đặc điểm chính, dung tích hoặc size.","c":"Tối ưu tìm kiếm.","ex":[["Add the main keyword to the product title.","Thêm từ khóa chính vào tên sản phẩm."]],"col":["title optimization","keyword-rich title"],"rel":["search ranking","listing"]},{"t":"PDP","f":"Product Detail Page","p":"abbr","vi":"trang chi tiết sản phẩm","d":"Trang khách xem đầy đủ thông tin trước khi mua: ảnh, video, giá, phân loại, mô tả, đánh giá.","c":"Tối ưu chuyển đổi.","ex":[["Add the size chart and a demo video to the PDP.","Thêm bảng size và video demo vào trang chi tiết."]],"col":["product page","PDP optimization"],"rel":["listing","conversion rate"]},{"t":"main image","p":"n","vi":"ảnh bìa sản phẩm","d":"Ảnh đầu tiên hiển thị trong kết quả tìm kiếm. Quyết định khách có bấm vào hay không.","c":"Thiết kế hình ảnh sản phẩm.","ex":[["Test two main images to improve CTR.","Thử hai ảnh bìa để tăng tỉ lệ nhấp."]],"col":["cover image","thumbnail","white background"],"rel":["CTR","A/B test"]},{"t":"variant","p":"n","vi":"phân loại (màu, size)","d":"Các lựa chọn khác nhau của một sản phẩm, ví dụ màu đỏ, size M. Mỗi variant thường có SKU riêng.","c":"Cài đặt sản phẩm.","ex":[["This dress has 12 variants: 4 colors and 3 sizes.","Váy này có 12 phân loại: 4 màu và 3 size."]],"col":["product variation","variation"],"rel":["SKU","SPU"]},{"t":"SKU","f":"Stock Keeping Unit","p":"abbr","vi":"mã hàng, mã phân loại tồn kho","d":"Mã riêng cho từng phiên bản sản phẩm để quản lý kho. Đỏ size M và đỏ size L là hai SKU khác nhau.","c":"Quản lý kho, cài giá, đối soát.","ex":[["This lipstick has 6 SKUs, one for each shade.","Thỏi son có 6 SKU, mỗi màu một mã."],["Which SKU is out of stock?","Mã nào hết hàng?"]],"col":["SKU code","hero SKU","SKU count"],"rel":["SPU","variant","inventory"]},{"t":"SPU","f":"Standard Product Unit","p":"abbr","vi":"đơn vị sản phẩm chuẩn","d":"Một sản phẩm gốc gom tất cả phân loại. Một SPU áo thun có thể có nhiều SKU màu và size.","c":"Quản lý danh mục sản phẩm.","ex":[["We have 50 SPUs and around 400 SKUs.","Shop có 50 sản phẩm gốc và khoảng 400 SKU."]],"col":["parent product"],"rel":["SKU","variant"]},{"t":"category","p":"n","vi":"ngành hàng, danh mục","d":"Nhóm sản phẩm trên sàn, ví dụ Beauty, Fashion, Home & Living. Mỗi ngành hàng có phí, quy định và đội ngũ quản lý riêng.","c":"Đăng sản phẩm, làm việc với sàn.","ex":[["Beauty is the most competitive category on TikTok Shop.","Làm đẹp là ngành hàng cạnh tranh nhất trên TikTok Shop."]],"col":["category manager","product category"],"rel":["category manager","commission fee"]},{"t":"category manager","p":"n","vi":"quản lý ngành hàng (phía sàn)","d":"Nhân sự của sàn phụ trách một ngành hàng, làm việc với các brand về chiến dịch, suất deal, hỗ trợ. Hay gọi tắt là CM.","c":"Làm việc với sàn.","ex":[["Ask the category manager if we can get a banner slot for 11.11.","Hỏi quản lý ngành hàng xem có suất banner cho 11.11 không."]],"col":["account manager (platform)","CM"],"rel":["campaign nomination"]},{"t":"product attributes","p":"n","vi":"thuộc tính sản phẩm","d":"Thông tin chuẩn hóa như thương hiệu, xuất xứ, chất liệu, hạn sử dụng. Điền đủ giúp sản phẩm hiện ở bộ lọc tìm kiếm.","c":"Đăng sản phẩm.","ex":[["Fill in all product attributes, or the listing won't show in filters.","Điền đủ thuộc tính, nếu không sản phẩm không hiện ở bộ lọc."]],"col":["specifications","product specs"],"rel":["listing","search ranking"]},{"t":"search ranking","p":"n","vi":"thứ hạng tìm kiếm","d":"Vị trí sản phẩm khi khách tìm từ khóa. Phụ thuộc độ liên quan, doanh số, đánh giá, tỉ lệ nhấp và chuyển đổi.","c":"Tối ưu SEO trên sàn.","ex":[["Our search ranking for 'sunscreen' dropped to page 3.","Thứ hạng từ khóa “kem chống nắng” tụt xuống trang 3."]],"col":["marketplace SEO","rank for a keyword"],"rel":["product title","search ads"]},{"t":"storefront","p":"n","vi":"trang chủ gian hàng","d":"Trang shop được trang trí: banner, danh mục, sản phẩm nổi bật. Việc thiết kế gọi là shop decoration.","c":"Thiết kế shop theo chiến dịch.","ex":[["Update the storefront banner for the 12.12 campaign.","Cập nhật banner trang shop cho chiến dịch 12.12."]],"col":["shop decoration","shop homepage"],"rel":["campaign","brand guidelines"]},{"t":"campaign nomination","p":"n","vi":"đăng ký tham gia chiến dịch sàn","d":"Việc shop đăng ký sản phẩm và giá vào chương trình của sàn (siêu sale, flash sale sàn). Sàn duyệt dựa trên giá, tồn kho, hiệu suất shop.","c":"Chuẩn bị mega sale.","ex":[["Campaign nomination for 11.11 closes on October 25.","Đăng ký chiến dịch 11.11 đóng ngày 25 tháng 10."]],"col":["register for a campaign","nomination deadline"],"rel":["mega sale","category manager"]},{"t":"commission fee","p":"n","vi":"phí hoa hồng (sàn thu)","d":"Phần trăm sàn thu trên mỗi đơn thành công, khác nhau theo ngành hàng. Không nhầm với hoa hồng affiliate trả cho creator.","c":"Tính lợi nhuận, đặt giá.","ex":[["The commission fee for beauty is around 8% on this platform.","Phí hoa hồng ngành làm đẹp khoảng 8% trên sàn này."]],"col":["platform fee","fixed fee","service fee"],"rel":["transaction fee","take rate","affiliate commission"],"tip":"Phí sàn thay đổi thường xuyên, luôn kiểm tra thông báo mới nhất của sàn."},{"t":"transaction fee","p":"n","vi":"phí thanh toán","d":"Phí xử lý thanh toán tính trên mỗi đơn, thường vài phần trăm giá trị đơn.","c":"Tính chi phí.","ex":[["Don't forget the transaction fee when you calculate margin.","Đừng quên phí thanh toán khi tính biên lợi nhuận."]],"col":["payment fee","processing fee"],"rel":["commission fee","margin"]},{"t":"payout","p":"n","vi":"tiền sàn thanh toán về","d":"Số tiền sàn chuyển cho người bán sau khi đơn hoàn tất và trừ các loại phí. Quy trình đối chiếu gọi là settlement hoặc reconciliation.","c":"Tài chính, đối soát.","ex":[["The payout for last week's orders will arrive on Friday.","Tiền đơn tuần trước sẽ về vào thứ Sáu."]],"col":["settlement","reconciliation","payout cycle"],"rel":["net revenue","commission fee"]},{"t":"seller","p":"n","vi":"người bán, nhà bán hàng","d":"Cá nhân hoặc doanh nghiệp bán hàng trên sàn. Người mua là buyer.","ex":[["New sellers get traffic support for 30 days.","Người bán mới được hỗ trợ traffic 30 ngày."]],"c":"Nói chung.","col":["seller account","top seller"],"rel":["marketplace","seller center"]},{"t":"buyer","p":"n","vi":"người mua","d":"Người đặt đơn trên sàn.","ex":[["Buyers can leave a review within 30 days.","Người mua có thể đánh giá trong 30 ngày."]],"c":"Nói chung.","col":["buyer protection"],"rel":["seller","buyers"]},{"t":"shop","p":"n","vi":"gian hàng, cửa hàng","d":"Trang bán hàng của người bán trên sàn. Còn gọi là store.","ex":[["Our shop has 120,000 followers.","Gian hàng có 120.000 người theo dõi."]],"c":"Nói chung.","col":["online shop","shop page"],"rel":["storefront"]},{"t":"shop followers","p":"n","vi":"người theo dõi shop","d":"Người bấm theo dõi gian hàng, nhận thông báo deal và live.","ex":[["Give a follower voucher to grow shop followers.","Tặng voucher người theo dõi để tăng follower shop."]],"c":"Tăng tệp khách.","col":["follower voucher"],"rel":["new followers","shop voucher"]},{"t":"preferred seller","p":"n","vi":"người bán ưu tiên","d":"Nhãn sàn cấp cho shop đạt tiêu chuẩn vận hành và doanh số, ví dụ Shopee Yêu thích.","ex":[["We need a lower cancellation rate to keep preferred seller status.","Cần giảm tỉ lệ hủy để giữ nhãn người bán ưu tiên."]],"c":"Uy tín shop.","col":["Preferred+","badge"],"rel":["shop performance"]},{"t":"shop rating","p":"n","vi":"điểm đánh giá shop","d":"Điểm trung bình từ các đánh giá của người mua.","ex":[["Our shop rating is 4.9 out of 5.","Điểm shop là 4,9 trên 5."]],"c":"Uy tín shop.","col":["average rating"],"rel":["rating"]},{"t":"product listing quality","p":"n","vi":"chất lượng bài đăng","d":"Điểm hoặc mức đánh giá của sàn về độ đầy đủ của sản phẩm: ảnh, video, mô tả, thuộc tính.","ex":[["Improve listing quality by adding a video and 9 images.","Tăng chất lượng bài đăng bằng cách thêm video và 9 ảnh."]],"c":"Tối ưu sản phẩm.","col":["listing score","content score"],"rel":["listing","product attributes"]},{"t":"product description","p":"n","vi":"mô tả sản phẩm","d":"Phần chữ mô tả chi tiết công dụng, thành phần, cách dùng, chính sách.","ex":[["Rewrite the product description to focus on benefits.","Viết lại mô tả tập trung vào lợi ích."]],"c":"Đăng sản phẩm.","col":["write a description","bullet points"],"rel":["PDP","benefit"]},{"t":"product images","p":"n","vi":"ảnh sản phẩm","d":"Bộ ảnh hiển thị trên trang sản phẩm. Thường cần ảnh bìa nền trắng, ảnh chi tiết, ảnh lifestyle.","ex":[["Add lifestyle images to show the product in use.","Thêm ảnh lifestyle cho thấy sản phẩm khi dùng."]],"c":"Đăng sản phẩm.","col":["lifestyle shot","white background"],"rel":["main image"]},{"t":"product video","p":"n","vi":"video sản phẩm","d":"Video ngắn trên trang sản phẩm giới thiệu hoặc hướng dẫn dùng.","ex":[["Listings with a product video convert better.","Bài đăng có video sản phẩm chuyển đổi tốt hơn."]],"c":"Tăng chuyển đổi.","col":["PDP video"],"rel":["PDP"]},{"t":"keyword","p":"n","vi":"từ khóa","d":"Từ hoặc cụm từ khách gõ để tìm sản phẩm.","ex":[["'Kem chống nắng nâng tông' is a high-volume keyword.","“Kem chống nắng nâng tông” là từ khóa có lượng tìm kiếm cao."]],"c":"Tối ưu tìm kiếm.","col":["search keyword","long-tail keyword"],"rel":["search ranking","search volume"]},{"t":"search volume","p":"n","vi":"lượng tìm kiếm","d":"Số lần một từ khóa được tìm trong một khoảng thời gian.","ex":[["Search volume for 'sunscreen' peaks in April.","Lượng tìm “kem chống nắng” cao nhất vào tháng 4."]],"c":"Nghiên cứu từ khóa.","col":["keyword volume"],"rel":["keyword","seasonality"]},{"t":"keyword research","p":"n","vi":"nghiên cứu từ khóa","d":"Tìm những từ khách hay tìm để đưa vào tiêu đề, mô tả, quảng cáo.","ex":[["Do keyword research before writing new titles.","Nghiên cứu từ khóa trước khi viết tiêu đề mới."]],"c":"Tối ưu tìm kiếm.","col":["keyword tool"],"rel":["keyword","product title"]},{"t":"traffic","p":"n","vi":"lượng truy cập","d":"Lượt người vào shop, trang sản phẩm hoặc phòng live.","ex":[["Shop traffic doubled during the campaign.","Lượng truy cập shop tăng gấp đôi trong chiến dịch."]],"c":"Báo cáo.","col":["shop traffic","drive traffic"],"rel":["traffic source"]},{"t":"page views","p":"n","vi":"lượt xem trang","d":"Số lần trang sản phẩm hoặc trang shop được mở.","ex":[["Page views went up but orders didn't.","Lượt xem trang tăng nhưng đơn không tăng."]],"c":"Báo cáo shop.","col":["PV","product views"],"rel":["traffic","conversion rate"]},{"t":"visitors","p":"n","vi":"lượt khách truy cập","d":"Số người khác nhau vào shop hoặc trang. Còn gọi unique visitors.","ex":[["We had 50,000 visitors yesterday.","Hôm qua có 50.000 khách ory"],"rel":["policy violation"]},{"t":"prohibited items","p":"n","vi":"hàng cấm","d":"Sản phẩm không được phép bán trên sàn như thuốc kê đơn, vũ khí, hàng giả.","ex":[["Check the list of prohibited items before listing.","Kiểm tra danh sách hàng cấm trước khi đăng."]],"c":"Tuân thủ.","col":["restricted items"],"rel":["policy violation"]},{"t":"restricted category","p":"n","vi":"ngành hàng hạn chế","d":"Ngành hàng cần giấy phép hoặc duyệt trước mới được bán, như thực phẩm chức năng, mỹ phẩm, thiết bị y tế.","ex":[["Supplements are a restricted category, we need the license.","Thực phẩm chức năng là ngành hạn chế, cần giấy phép."]],"c":"Mở bán ngành hàng mới.","col":["category approval","qualification"],"rel":["prohibited items"]},{"t":"seller support","p":"n","vi":"hỗ trợ người bán","d":"Bộ phận của sàn hỗ trợ người bán qua chat, ticket hoặc quản lý tài khoản.","ex":[["Open a ticket with seller support about the payout delay.","Gửi yêu cầu hỗ trợ người bán về việc chậm thanh toán."]],"c":"Liên hệ sàn.","col":["support ticket","helpdesk"],"rel":["category manager"]},{"t":"ticket","p":"n","vi":"yêu cầu hỗ trợ (phiếu)","d":"Một yêu cầu hỗ trợ được ghi nhận có mã số để theo dõi.","ex":[["I raised a ticket, the ticket number is 4521.","Mình đã gửi yêu cầu, mã là 4521."]],"c":"Liên hệ hỗ trợ.","col":["raise a ticket","ticket number"],"rel":["seller support"]},{"t":"seller education","p":"n","vi":"học viện người bán","d":"Khóa học và tài liệu sàn cung cấp cho người bán, ví dụ Shopee Uni, TikTok Shop Academy.","ex":[["Check seller education for the new campaign rules.","Xem học viện người bán để biết luật chiến dịch mới."]],"c":"Học quy định, kỹ năng.","col":["seller university","academy"],"rel":["seller support"]},{"t":"store rating badge","p":"n","vi":"nhãn uy tín shop","d":"Biểu tượng hiển thị cạnh tên shop thể hiện mức uy tín.","ex":[["The badge helps new customers trust us.","Nhãn uy tín giúp khách mới tin hơn."]],"c":"Uy tín.","col":["trust badge"],"rel":["preferred seller"]},{"t":"multi-store","p":"adj","vi":"nhiều gian hàng","d":"Vận hành nhiều shop trên nhiều sàn hoặc nhiều shop trên cùng sàn.","ex":[["We use one tool to manage our multi-store setup.","Dùng một công cụ để quản lý nhiều gian hàng."]],"c":"Quản lý vận hành.","col":["multi-channel"],"rel":["omnichannel"]},{"t":"OMS","p":"abbr","vi":"hệ thống quản lý đơn hàng","d":"Phần mềm gom đơn từ nhiều sàn về một nơi để xử lý, đồng bộ tồn kho.","ex":[["Our OMS syncs stock across Shopee, Lazada and TikTok.","OMS đồng bộ tồn kho giữa Shopee, Lazada và TikTok."]],"f":"Order Management System","c":"Vận hành nhiều kênh.","col":["order management","ERP"],"rel":["overselling","multi-store"]},{"t":"ERP","p":"abbr","vi":"hệ thống quản trị doanh nghiệp","d":"Phần mềm tổng quản lý kế toán, kho, mua hàng, bán hàng.","ex":[["Orders flow from the OMS into the ERP.","Đơn đi từ OMS vào ERP."]],"f":"Enterprise Resource Planning","c":"Vận hành doanh nghiệp.","col":["ERP system"],"rel":["OMS"]},{"t":"API","p":"abbr","vi":"giao diện kết nối phần mềm","d":"Cách hai phần mềm trao đổi dữ liệu tự động, ví dụ kết nối sàn với phần mềm kho.","ex":[["We connect to the marketplace through its open API.","Bọn mình kết nối với sàn qua API mở."]],"f":"Application Programming Interface","c":"Kết nối hệ thống.","col":["API integration","open platform"],"rel":["OMS"]},{"t":"mass upload","p":"n","vi":"đăng hàng loạt","d":"Tải nhiều sản phẩm hoặc cập nhật giá cùng lúc bằng file Excel.","ex":[["Use mass upload to change prices for 200 SKUs.","Dùng đăng hàng loạt để đổi giá 200 SKU."]],"c":"Quản lý nhiều sản phẩm.","col":["bulk upload","bulk edit"],"rel":["listing"]},{"t":"pre-order listing","p":"n","vi":"sản phẩm đặt trước","d":"Sản phẩm cho phép thời gian chuẩn bị hàng dài hơn bình thường.","ex":[["Mark it as a pre-order listing with 10 days to ship.","Đánh dấu là hàng đặt trước, 10 ngày để giao."]],"c":"Hàng sản xuất theo đơn.","col":["pre-order"],"rel":["pre-sale","lead time"]},{"t":"Shopee Mall","p":"n","vi":"Shopee Mall","d":"Khu gian hàng chính hãng trên Shopee, có cam kết hàng thật và đổi trả. LazMall là tương đương trên Lazada.","ex":[["Shopee Mall shops get higher buyer trust.","Shop Mall trên Shopee được người mua tin tưởng hơn."]],"c":"Gian hàng chính hãng.","col":["LazMall","official store"],"rel":["official store"]},{"t":"free shipping program","p":"n","vi":"chương trình miễn phí vận chuyển của sàn","d":"Chương trình shop đóng phí dịch vụ để khách được hỗ trợ phí ship, ví dụ Freeship Xtra.","ex":[["Joining the free shipping program raised our conversion.","Tham gia chương trình freeship giúp tăng chuyển đổi."]],"c":"Tham gia chương trình sàn.","col":["Freeship Xtra","service fee"],"rel":["free shipping"]},{"t":"cashback program","p":"n","vi":"chương trình hoàn xu","d":"Chương trình sàn hoàn xu cho người mua, shop đóng phí tham gia, ví dụ Voucher Xtra, Coin Cashback.","ex":[["The cashback program costs 3% of each order.","Chương trình hoàn xu tốn 3% mỗi đơn."]],"c":"Tham gia chương trình sàn.","col":["Voucher Xtra","coins"],"rel":["cashback"]},{"t":"flash sale slot","p":"n","vi":"suất flash sale của sàn","d":"Khung giờ và số lượng hạn chế để sản phẩm xuất hiện trên trang flash sale chính của sàn.","ex":[["We got two flash sale slots for 12.12.","Bọn mình được hai suất flash sale sàn cho 12.12."]],"c":"Đăng ký chiến dịch.","col":["platform flash sale"],"rel":["campaign nomination"]},{"t":"campaign landing page","p":"n","vi":"trang chiến dịch của sàn","d":"Trang tập trung sản phẩm và deal của chiến dịch lớn trên sàn.","ex":[["Our serum is featured on the 11.11 campaign landing page.","Serum được đưa lên trang chiến dịch 11.11."]],"c":"Chiến dịch sàn.","col":["campaign page","feature"],"rel":["campaign nomination"]},{"t":"banner slot","p":"n","vi":"vị trí banner","d":"Vị trí hiển thị banner trên trang chủ hoặc trang chiến dịch của sàn, thường phải trả phí hoặc đăng ký.","ex":[["The homepage banner slot costs 50 million for one day.","Vị trí banner trang chủ tốn 50 triệu một ngày."]],"c":"Làm việc với sàn.","col":["homepage banner","placement"],"rel":["banner","trade marketing"]},{"t":"product SEO","p":"n","vi":"tối ưu tìm kiếm sản phẩm","d":"Tối ưu tên, mô tả, thuộc tính để sản phẩm lên cao khi khách tìm trên sàn.","ex":[["Product SEO helped us rank first for 'serum'.","Tối ưu tìm kiếm giúp lên hạng nhất cho từ “serum”."]],"c":"Vận hành gian hàng.","col":["marketplace SEO"],"rel":["keyword","search ranking"]},{"t":"shop voucher setup","p":"n","vi":"cài đặt voucher shop","d":"Thao tác tạo voucher: giá trị, điều kiện, thời gian, số lượng.","ex":[["Shop voucher setup must be done 24 hours in advance.","Phải cài voucher shop trước 24 giờ."]],"c":"Vận hành gian hàng.","col":["create a voucher"],"rel":["shop voucher"]}]},{"id":"promo","code":"PROMO","group":"Thương mại điện tử","en":"Pricing, Promotions & Campaigns","vi":"Giá, khuyến mãi và chiến dịch","intro":"Cách nói về giá, loại khuyến mãi và các mùa sale lớn khi làm deal với brand và sàn.","terms":[{"t":"RRP","f":"Recommended Retail Price","p":"abbr","vi":"giá bán lẻ đề xuất","d":"Giá brand khuyến nghị cho người bán lẻ. Ở Mỹ hay gọi MSRP (Manufacturer's Suggested Retail Price).","c":"Neo giá, tính phần trăm giảm.","ex":[["The RRP is 450k, our live price is 299k.","Giá đề xuất là 450k, giá live là 299k."]],"col":["MSRP","retail price"],"rel":["list price","price anchoring"]},{"t":"list price","p":"n","vi":"giá niêm yết, giá gốc","d":"Giá hiển thị trước khi giảm, thường bị gạch ngang khi có khuyến mãi. Còn gọi là original price.","c":"Cài giá trên sàn.","ex":[["Don't raise the list price before the sale, it's against policy.","Đừng nâng giá gốc trước đợt sale, như vậy vi phạm quy định."]],"col":["original price","strikethrough price"],"rel":["selling price","RRP"]},{"t":"selling price","p":"n","vi":"giá bán","d":"Giá khách thực trả cho sản phẩm (trước voucher). Nếu có deal riêng gọi là deal price hoặc promo price.","c":"Cài giá, báo cáo.","ex":[["The selling price after discount is 199k.","Giá bán sau giảm là 199k."]],"col":["deal price","promo price","net price"],"rel":["list price","discount"]},{"t":"discount","p":"n, v","vi":"giảm giá","d":"Phần giá được giảm, tính theo % hoặc số tiền. Discount rate là tỉ lệ giảm.","c":"Thiết kế ưu đãi.","fm":"Tỉ lệ giảm = (giá gốc − giá bán) ÷ giá gốc × 100%","ex":[["We can offer a 30% discount for the live.","Mình có thể giảm 30% cho phiên live."],["A deeper discount doesn't always mean higher profit.","Giảm sâu hơn không có nghĩa là lời nhiều hơn."]],"col":["deep discount","discount rate","% off"],"rel":["markdown","voucher"]},{"t":"markdown","p":"n","vi":"giảm giá hàng (để xả)","d":"Hạ giá vĩnh viễn hoặc dài hạn, thường để bán hàng tồn, hàng cũ mùa.","c":"Kế hoạch xả hàng.","ex":[["Last season's items need a 50% markdown.","Hàng mùa trước cần giảm 50%."]],"col":["mark down","clearance"],"rel":["clearance sale","discount"]},{"t":"price floor","p":"n","vi":"giá sàn, mức giá thấp nhất cho phép","d":"Mức giá brand không cho phép bán thấp hơn để giữ giá trị thương hiệu và tránh phá giá đại lý. Khái niệm gần: MAP (Minimum Advertised Price).","c":"Thương lượng deal với brand.","ex":[["We can't go below the price floor of 250k.","Không thể bán dưới giá sàn 250k."]],"col":["minimum price","MAP policy"],"rel":["price war","RRP"]},{"t":"price war","p":"n","vi":"cuộc chiến giá","d":"Các bên liên tục hạ giá để giành khách, làm giảm lợi nhuận toàn ngành.","c":"Phân tích thị trường.","ex":[["We don't want to join a price war with unauthorized sellers.","Mình không muốn tham gia cuộc chiến giá với người bán không chính hãng."]],"col":["undercut","price competition"],"rel":["price floor","margin"]},{"t":"voucher","p":"n","vi":"phiếu/mã giảm giá","d":"Mã hoặc phiếu khách lưu và áp dụng khi thanh toán. Trong TMĐT, voucher và coupon dùng gần như thay thế nhau.","c":"Cài khuyến mãi.","ex":[["Viewers must claim the voucher before checkout.","Người xem phải lưu voucher trước khi thanh toán."]],"col":["claim a voucher","voucher code","redeem"],"rel":["shop voucher","platform voucher","voucher stacking"]},{"t":"shop voucher","p":"n","vi":"voucher shop","d":"Voucher do shop tạo và tự chịu chi phí.","c":"Tính ngân sách khuyến mãi.","ex":[["The shop voucher is 50k off for orders over 500k.","Voucher shop giảm 50k cho đơn trên 500k."]],"col":["seller voucher","follower voucher"],"rel":["platform voucher","voucher"]},{"t":"platform voucher","p":"n","vi":"voucher sàn","d":"Voucher do sàn tài trợ, áp dụng cho nhiều shop. Shop không mất phí nhưng có thể phải tham gia chương trình.","c":"Chiến dịch sàn.","ex":[["Remind viewers they can stack the platform voucher with our shop voucher.","Nhắc người xem có thể dùng chung voucher sàn với voucher shop."]],"col":["marketplace voucher"],"rel":["voucher stacking","subsidy"]},{"t":"voucher stacking","p":"n","vi":"cộng dồn voucher","d":"Dùng nhiều voucher cho cùng một đơn, ví dụ voucher shop + voucher sàn + voucher freeship.","c":"Tính giá cuối của khách, hướng dẫn trong live.","ex":[["With voucher stacking, the final price is only 149k.","Cộng dồn voucher thì giá cuối chỉ 149k."]],"col":["stack vouchers","stackable"],"rel":["voucher","final price"]},{"t":"final price","p":"n","vi":"giá cuối khách trả","d":"Giá khách thực trả sau mọi giảm giá và voucher. Host thường tính sẵn để nói trên sóng.","c":"Kịch bản báo giá.","ex":[["Tell viewers the final price after all vouchers.","Nói với người xem giá cuối sau khi áp hết voucher."]],"col":["net price","price after vouchers"],"rel":["voucher stacking","price reveal"]},{"t":"minimum spend","p":"n","vi":"giá trị đơn tối thiểu","d":"Mức chi tiêu tối thiểu để dùng voucher hoặc nhận quà, ví dụ đơn từ 300k.","c":"Cài điều kiện ưu đãi, tăng AOV.","ex":[["Set the minimum spend just above our current AOV.","Đặt giá trị đơn tối thiểu cao hơn AOV hiện tại một chút."]],"col":["min. spend","spend threshold"],"rel":["AOV","free shipping"]},{"t":"free shipping","p":"n","vi":"miễn phí vận chuyển","d":"Khách không trả phí g er voucher brings in 30% of first orders.","Voucher khách mới mang về 30% đơn đầu tiên."]],"c":"Thu hút khách mới.","col":["first order discount"],"rel":["CAC"]},{"t":"follower voucher","p":"n","vi":"voucher người theo dõi","d":"Ưu đãi cho người theo dõi shop, khuyến khích bấm theo dõi.","ex":[["Follow the shop to unlock a 20k follower voucher.","Theo dõi shop để nhận voucher 20k."]],"c":"Tăng follower.","col":["follow prize"],"rel":["shop followers"]},{"t":"live voucher","p":"n","vi":"voucher chỉ dùng trong live","d":"Voucher chỉ lưu và dùng được trong phòng live.","ex":[["The live voucher can only be claimed during the live.","Voucher live chỉ lưu được trong lúc live."]],"c":"Giữ chân, chuyển đổi trong live.","col":["live-exclusive voucher"],"rel":["voucher drop","exclusive deal"]},{"t":"combo deal","p":"n","vi":"deal combo","d":"Ưu đãi khi mua nhiều sản phẩm cùng lúc, ví dụ mua 3 giảm 10%.","ex":[["The combo deal lifted AOV by 25%.","Deal combo làm AOV tăng 25%."]],"c":"Cài khuyến mãi.","col":["bundle deal"],"rel":["bundle","tiered discount"]},{"t":"price matching","p":"n","vi":"cam kết giá tốt nhất","d":"Cam kết bằng hoặc thấp hơn giá nơi khác.","ex":[["We offer price matching within the live.","Bên mình cam kết giá tốt nhất trong live."]],"c":"Chính sách giá.","col":["price match guarantee","lowest price"],"rel":["price war"]},{"t":"price parity","p":"n","vi":"đồng nhất giá","d":"Giữ giá giống nhau trên các kênh để tránh xung đột giữa đại lý, sàn và cửa hàng.","ex":[["The brand requires price parity across all marketplaces.","Brand yêu cầu giá đồng nhất trên mọi sàn."]],"c":"Chính sách giá với brand.","col":["channel conflict"],"rel":["price floor"]},{"t":"channel conflict","p":"n","vi":"xung đột kênh","d":"Mâu thuẫn khi các kênh bán (đại lý, sàn, cửa hàng) cạnh tranh bằng giá với nhau.","ex":[["Deep live discounts can cause channel conflict with retailers.","Giảm sâu trong live có thể gây xung đột với đại lý."]],"c":"Chiến lược giá.","col":["price parity"],"rel":["price war"]},{"t":"promo calendar","p":"n","vi":"lịch khuyến mãi","d":"Lịch chi tiết các chương trình khuyến mãi theo tuần, tháng.","ex":[["Share the promo calendar with the warehouse team.","Gửi lịch khuyến mãi cho team kho."]],"c":"Lập kế hoạch.","col":["promotion plan"],"rel":["campaign calendar"]},{"t":"double day","p":"n","vi":"ngày đôi","d":"Ngày có số tháng và ngày trùng nhau (9.9, 10.10, 11.11, 12.12), dịp siêu sale.","ex":[["Double days drive almost half our monthly GMV.","Ngày đôi đóng góp gần nửa GMV tháng."]],"c":"Lịch chiến dịch.","col":["double-digit day"],"rel":["mega sale"]},{"t":"Black Friday","p":"n","vi":"Black Friday","d":"Ngày mua sắm lớn sau Lễ Tạ ơn ở Mỹ (thứ Sáu cuối tháng 11), đi kèm Cyber Monday.","ex":[["We'll run a Black Friday live from 8 PM.","Live Black Friday từ 8 giờ tối."]],"c":"Lịch chiến dịch.","col":["Cyber Monday","BFCM"],"rel":["mega sale"]},{"t":"Lunar New Year sale","p":"n","vi":"sale Tết","d":"Mùa mua sắm lớn trước Tết Nguyên đán, nhu cầu quà biếu tăng.","ex":[["Gift sets sell out during the Lunar New Year sale.","Set quà bán hết trong mùa sale Tết."]],"c":"Lịch chiến dịch.","col":["Tet campaign","gift season"],"rel":["seasonality"]},{"t":"birthday sale","p":"n","vi":"sale sinh nhật","d":"Khuyến mãi mừng sinh nhật sàn hoặc brand.","ex":[["The brand birthday sale is our biggest event in Q2.","Sale sinh nhật brand là sự kiện lớn nhất quý 2."]],"c":"Lịch chiến dịch.","col":["anniversary sale"],"rel":["campaign"]},{"t":"hot deal","p":"n","vi":"deal hot","d":"Ưu đãi đang rất hấp dẫn, được nhiều người quan tâm.","ex":[["Here's tonight's hot deal: 50% off the cushion.","Deal hot tối nay: giảm 50% cushion."]],"c":"Ngôn ngữ quảng bá.","col":["deal of the day","hot price"],"rel":["flash sale"]},{"t":"deal of the day","p":"n","vi":"deal trong ngày","d":"Một ưu đãi đặc biệt chỉ trong ngày.","ex":[["Our deal of the day is the cleansing oil.","Deal trong ngày là dầu tẩy trang."]],"c":"Thiết kế deal.","col":["daily deal"],"rel":["hot deal"]},{"t":"price drop","p":"n","vi":"giảm giá đột ngột","d":"Giá được hạ xuống. Trong live thường là màn hạ giá kịch tính.","ex":[["Price drop in 3, 2, 1!","Giảm giá sau 3, 2, 1!"]],"c":"Câu của host.","col":["price cut"],"rel":["price reveal","countdown"]},{"t":"original price","p":"n","vi":"giá gốc","d":"Giá trước khi giảm, thường bị gạch ngang.","ex":[["The original price is 399k.","Giá gốc là 399k."]],"c":"Cài giá, báo giá.","col":["was price","crossed-out price"],"rel":["list price"]},{"t":"price tag","p":"n","vi":"nhãn giá, mức giá","d":"Nhãn ghi giá, hoặc nghĩa bóng là mức giá của một thứ.","ex":[["It has a premium price tag but lasts twice as long.","Giá cao cấp nhưng dùng lâu gấp đôi."]],"c":"Nói chung.","col":["hefty price tag"],"rel":["selling price"]},{"t":"price point","p":"n","vi":"mức giá","d":"Một mức giá cụ thể trong dải giá, thường dùng khi nói định vị sản phẩm.","ex":[["Products at the 99k price point sell best on live.","Sản phẩm ở mức giá 99k bán chạy nhất trên live."]],"c":"Chiến lược giá.","col":["entry price point","price range"],"rel":["price tier"]},{"t":"price tier","p":"n","vi":"phân khúc giá","d":"Nhóm mức giá: bình dân, tầm trung, cao cấp.","ex":[["We cover three price tiers: budget, mid-range and premium.","Bọn mình phủ ba phân khúc giá: bình dân, tầm trung, cao cấp."]],"c":"Chiến lược sản phẩm.","col":["budget","mid-range","premium"],"rel":["price point"]},{"t":"psychological pricing","p":"n","vi":"định giá tâm lý","d":"Đặt giá kết thúc bằng 9 (199k thay vì 200k) để trông rẻ hơn.","ex":[["Use psychological pricing: 299k instead of 300k.","Dùng định giá tâm lý: 299k thay vì 300k."]],"c":"Định giá.","col":["charm pricing"],"rel":["price point"]},{"t":"dynamic pricing","p":"n","vi":"định giá linh hoạt","d":"Thay đổi giá theo nhu cầu, thời điểm, đối thủ.","ex":[["The platform uses dynamic pricing for shipping fees.","Sàn dùng định giá linh hoạt cho phí vận chuyển."]],"c":"Chiến lược giá.","col":["surge pricing"],"rel":["price war"]},{"t":"promo ROI","p":"n","vi":"hiệu quả chi phí khuyến mãi","d":"Lợi nhuận tăng thêm so với chi phí khuyến mãi bỏ ra.","ex":[["Calculate promo ROI before repeating this voucher.","Tính hiệu quả khuyến mãi trước khi lặp lại voucher này."]],"c":"Đánh giá khuyến mãi.","col":["incremental sales"],"rel":["ROI","promo budget"]},{"t":"incremental sales","p":"n","vi":"doanh số tăng thêm","d":"Phần doanh số tăng lên nhờ một hoạt động so với khi không làm.","ex":[["The voucher brought 200 million in incremental sales.","Voucher mang về 200 triệu doanh số tăng thêm."]],"c":"Đánh giá hiệu quả.","col":["incrementality","baseline"],"rel":["promo ROI"]},{"t":"baseline","p":"n","vi":"mức nền","d":"Kết quả bình thường khi không có khuyến mãi hay chiến dịch, dùng để so sánh.","ex":[["Our baseline is 50 million GMV per day.","Mức nền của mình là 50 triệu GMV mỗi ngày."]],"c":"Đánh giá hiệu quả.","col":["baseline sales"],"rel":["incremental sales"]},{"t":"cannibalization","p":"n","vi":"ăn mòn doanh số (tự cạnh tranh)","d":"Khi sản phẩm hoặc kênh mới lấy doanh số của chính mình thay vì tạo doanh số mới.","ex":[["The new mini size caused cannibalization of the full size.","Bản mini mới ăn mòn doanh số của bản thường."]],"c":"Phân tích.","col":["cannibalize"],"rel":["incremental sales"]},{"t":"flash deal","p":"n","vi":"deal chớp nhoáng","d":"Ưu đãi thời gian ngắn, gần nghĩa với flash sale.","ex":[["A 5-minute flash deal every half hour.","Mỗi nửa tiếng một deal chớp nhoáng 5 phút."]],"c":"Thiết kế deal.","col":["lightning deal"],"rel":["flash sale"]},{"t":"lightning deal","p":"n","vi":"deal chớp nhoáng (giới hạn)","d":"Ưu đãi giới hạn cả thời gian lẫn số lượng.","ex":[["The lightning deal has only 100 units.","Deal chớp nhoáng chỉ có 100 suất."]],"c":"Thiết kế deal.","col":["flash deal"],"rel":["flash deal"]},{"t":"lucky draw","p":"n","vi":"bốc thăm may mắn","d":"Chọn ngẫu nhiên người thắng giải.","ex":[["Lucky draw at 10 PM for everyone who ordered.","Bốc thăm lúc 10 giờ cho mọi người đã đặt đơn."]],"c":"Minigame.","col":["raffle","prize draw"],"rel":["giveaway"]},{"t":"prize","p":"n","vi":"giải thưởng","d":"Phần thưởng cho người thắng.","ex":[["The grand prize is a full skincare set.","Giải đặc biệt là trọn bộ chăm da."]],"c":"Minigame.","col":["grand prize","winner"],"rel":["lucky draw"]},{"t":"winner announcement","p":"n","vi":"công bố người thắng","d":"Thông báo người trúng thưởng. Nên công khai, minh bạch.","ex":[["Winner announcement will be pinned after the live.","Công bố người thắng sẽ được ghim sau live."]],"c":"Minigame.","col":["announce the winner"],"rel":["lucky draw"]}]},{"id":"logistics","code":"OPS","group":"Thương mại điện tử","en":"Orders, Fulfillment & Logistics","vi":"Đơn hàng, kho và vận chuyển","intro":"Từ vựng làm việc với kho và đơn vị vận chuyển: xử lý đơn, tồn kho, giao hàng, hoàn hàng.","terms":[{"t":"order status","p":"n","vi":"trạng thái đơn hàng","d":"Tình trạng hiện tại của đơn: pending (chờ xử lý), to ship (chờ giao), shipped (đã giao cho vận chuyển), delivered (đã nhận), cancelled (đã hủy), returned (đã hoàn).","c":"Theo dõi đơn, trả lời khách.","ex":[["Check the order status in the seller center before replying.","Kiểm tra trạng thái đơn trên kênh người bán trước khi trả lời."]],"col":["pending","shipped","delivered","cancelled"],"rel":["ready to ship","order tracking"]},{"t":"ready to ship","f":"RTS","p":"n","vi":"sẵn sàng giao","d":"Trạng thái đơn đã đóng gói xong, chờ đơn vị vận chuyển lấy. Sàn thường yêu cầu đơn phải RTS trong 1 đến 2 ngày.","c":"Vận hành kho, chỉ số giao hàng.","ex":[["All live orders must be ready to ship within 24 hours.","Mọi đơn live phải sẵn sàng giao trong 24 giờ."]],"col":["arrange shipment","RTS rate"],"rel":["late shipment rate","handover"]},{"t":"order tracking","p":"n","vi":"theo dõi đơn hàng","d":"Theo dõi hành trình đơn qua mã vận đơn (tracking number).","c":"Chăm sóc khách hàng.","ex":[["Send the customer the tracking number.","Gửi khách mã vận đơn."]],"col":["tracking number","track an order"],"rel":["shipping label","order status"]},{"t":"fulfillment","p":"n","vi":"xử lý và hoàn tất đơn","d":"Toàn bộ quy trình từ khi có đơn đến khi giao cho vận chuyển: nhận đơn, nhặt hàng, đóng gói, dán nhãn, bàn giao. Anh Anh viết fulfilment.","c":"Bàn với kho về năng lực xử lý.","ex":[["Fulfillment takes longer during mega sale days.","Khâu xử lý đơn lâu hơn vào ngày siêu sale."],["Can the warehouse handle fulfillment for 5,000 orders a day?","Kho có xử lý được 5.000 đơn mỗi ngày không?"]],"col":["order fulfillment","fulfillment center","fulfillment capacity"],"rel":["pick and pack","3PL","warehouse"]},{"t":"warehouse","p":"n","vi":"kho hàng","d":"Nơi lưu trữ và xử lý hàng hóa. Quản lý kho gọi là warehouse management.","c":"Vận hành, tồn kho.","ex":[["The warehouse closes at 6 PM, so late orders ship tomorrow.","Kho đóng lúc 6 giờ chiều nên đơn muộn sẽ giao ngày mai."]],"col":["warehouse staff","WMS","fulfillment center"],"rel":["inventory","fulfillment"]},{"t":"pick and pack","p":"n","vi":"nhặt hàng và đóng gói","d":"Hai bước chính trong kho: picking (lấy đúng hàng trên kệ) và packing (đóng gói, dán nhãn).","c":"Vận hành kho, xử lý sai đơn.","ex":[["The wrong color was sent due to a picking error.","Gửi nhầm màu do lỗi nhặt hàng."]],"col":["picking error","packing list","packaging"],"rel":["fulfillment","shipping label"]},{"t":"shipping label","p":"n","vi":"nhãn vận chuyển, phiếu gửi","d":"Nhãn dán lên kiện hàng có mã vận đơn, địa chỉ, mã vạch. Còn gọi là AWB (air waybill) hoặc waybill.","c":"Đóng gói, in nhãn.","ex":[["Print the shipping labels for all live orders.","In phiếu gửi cho toàn bộ đơn live."]],"col":["waybill","AWB","print labels"],"rel":["order tracking","pick and pack"]},{"t":"handover","p":"n","vi":"bàn giao (hàng cho vận chuyển)","d":"Việc giao kiện hàng cho đơn vị vận chuyển. Cũng dùng cho bàn giao công việc giữa người với người.","c":"Vận hành kho, chuyển ca.","ex":[["Handover to the courier is at 4 PM every day.","Bàn giao cho đơn vị vận chuyển lúc 4 giờ chiều mỗi ngày."]],"col":["hand over","pickup","handover note"],"rel":["ready to ship","courier"]},{"t":"courier","p":"n","vi":"đơn vị vận chuyển, người giao hàng","d":"Công ty hoặc người giao hàng, ví dụ GHN, J&T, SPX. Còn gọi là carrier hoặc logistics partner.","c":"Làm việc với vận chuyển.","ex":[["The courier didn't pick up our orders today.","Đơn vị vận chuyển hôm nay không lấy hàng."]],"col":["carrier","shipping partner","shipper"],"rel":["last-mile delivery","3PL"]},{"t":"3PL","f":"Third-Party Logistics","p":"abbr","vi":"dịch vụ hậu cần bên thứ ba","d":"Đơn vị thuê ngoài lo kho bãi, đóng gói, vận chuyển thay cho shop.","c":"Lựa chọn mô hình vận hành.","ex":[["We moved fulfillment to a 3PL to handle mega sale volume.","Chuyển xử lý đơn sang 3PL để kịp lượng đơn siêu sale."]],"col":["outsource logistics","3PL warehouse"],"rel":["fulfillment","fulfilled by platform"]},{"t":"fulfilled by platform","p":"phrase","vi":"kho do sàn vận hành","d":"Shop gửi hàng vào kho của sàn, sàn lo đóng gói và giao, ví dụ Fulfilled by Lazada, Shopee Fulfillment. Giao nhanh hơn và có nhãn ưu tiên.","c":"Chiến lược vận hành.","ex":[["Products fulfilled by the platform get faster delivery badges.","Sản phẩm kho sàn được nhãn giao nhanh."]],"col":["FBL","fulfillment by marketplace"],"rel":["3PL","last-mile delivery"]},{"t":"last-mile delivery","p":"n","vi":"giao hàng chặng cuối","d":"Chặng giao cuối cùng từ bưu cục tới tay khách. Thường là chặng tốn kém và dễ phát sinh sự cố nhất.","c":"Phân tích vận chuyển.","ex":[["Most complaints come from last-mile delivery delays.","Phần lớn phàn nàn đến từ việc giao chặng cuối chậm."]],"col":["last mile","delivery time"],"rel":["courier","failed delivery"]},{"t":"lead time","p":"n","vi":"thời gian chờ, thời gian chuẩn bị","d":"Khoảng thời gian từ lúc bắt đầu đến lúc hoàn tất một quy trình, ví dụ từ đặt hàng nhà cung cấp đến khi hàng về kho, hoặc từ khi có đơn đến khi giao.","c":"Lên kế hoạch nhập hàng.","ex":[["The supplier's lead time is three weeks, so order now for 12.12.","Nhà cung cấp cần ba tuần, đặt ngay cho 12.12."]],"col":["delivery lead time","production lead time"],"rel":["restock","safety stock"]},{"t":"SLA","f":"Service Level Agreement","p":"abbr","vi":"cam kết mức dịch vụ","d":"Cam kết về thời gian hoặc chất lượng dịch vụ, ví dụ giao trong 48 giờ, trả lời chat trong 12 giờ. Vi phạm SLA có thể bị phạt.","c":"Hợp đồng với kho, vận chuyển, chỉ số sàn.","ex":[["The 3PL's SLA is to ship orders within 24 hours.","SLA của 3PL là giao đơn trong 24 giờ."]],"col":["meet the SLA","breach the SLA"],"rel":["late shipment rate","response time"]},{"t":"late shipment rate","p":"n","vi":"tỉ lệ giao hàng trễ","d":"Phần trăm đơn shop giao cho vận chuyển trễ hơn hạn sàn quy định. Ảnh hưởng điểm vận hành của shop.","c":"Theo dõi hiệu suất gian hàng.","fm":"Tỉ lệ giao trễ = số đơn giao trễ ÷ tổng đơn × 100%","ex":[["Our late shipment rate hit 8% after the mega sale.","Tỉ lệ giao trễ lên 8% sau siêu sale."]],"col":["LSR","on-time shipment"],"rel":["shop performance","SLA"]},{"t":"inventory","p":"n","vi":"hàng tồn kho","d":"Lượng hàng hiện có để bán. Còn gọi là stock. Quản lý tồn kho là inventory management.","c":"Kiểm tra trước live, kế hoạch nhập hàng.","ex":[["Please check the inventory before we set up the flash sale.","Kiểm tra tồn kho trước khi cài flash sale nhé."]],"col":["stock level","inventory count","stocktake"],"rel":["out of stock","safety stock"]},{"t":"out of stock","f":"OOS","p":"adj","vi":"hết hàng","d":"Sản phẩm không còn hàng để bán. Trong live cần báo host ngay để chuyển sản phẩm. Danh từ là stock-out.","c":"Báo khẩn trong live.","ex":[["The red one is out of stock, switch to the pink one.","Màu đỏ hết hàng rồi, chuyển sang màu hồng."],["Stock-outs during the live cost us a lot of orders.","Hết hàng giữa live làm mình mất nhiều đơn."]],"col":["sold out","OOS","back in stock"],"rel":["inventory","overselling","restock"]},{"t":"overselling","p":"n","vi":"bán vượt tồn kho","d":"Bán nhiều hơn số hàng thực có, thường do tồn kho không đồng bộ giữa các kênh. Dẫn tới phải hủy đơn và bị phạt.","c":"Xử lý sự cố, đồng bộ kho.","ex":[["We oversold 200 units because stock wasn't synced across platforms.","Bán vượt 200 sản phẩm vì tồn kho giữa các sàn không đồng bộ."]],"col":["oversell","stock sync"],"rel":["inventory","cancellation rate"]},{"t":"safety stock","p":"n","vi":"tồn kho an toàn","d":"Lượng hàng dự phòng giữ lại để tránh hết hàng khi nhu cầu tăng đột biến hoặc hàng về chậm.","c":"Lập kế hoạch kho.","ex":[["Keep a safety stock of 500 units for the hero product.","Giữ tồn kho an toàn 500 cái cho sản phẩm chủ lực."]],"col":["buffer stock","reorder point"],"rel":["restock","lead time"]},{"t":"restock","p":"v, n","vi":"nhập thêm hàng","d":"Bổ sung hàng vào kho khi sắp hết. Quy trình liên tục gọi là replenishment.","c":"Kế hoạch hàng hóa.","ex":[["When will the serum be restocked?","Khi nào serum có hàng lại?"]],"col":["replenish","back in stock"],"rel":["safety stock","out of stock"]},{"t":"inventory turnover","p":"n","vi":"vòng quay hàng tồn kho","d":"Số lần hàng tồn được bán hết và nhập lại trong một kỳ. Vòng quay cao là hàng bán nhanh, ít tồn đọng vốn.","c":"Báo cáo tài chính, kế hoạch nhập.","fm":"Vòng quay tồn kho = giá vốn hàng bán ÷ tồn kho bình quân","ex":[["Inventory turnover for this product is too low, we should bundle it.","Vòng quay hàng này quá thấp, nên làm combo."]],"col":["stock turnover","days of inventory"],"rel":["COGS","clearance sale"]},{"t":"COD","f":"Cash On Delivery","p":"abbr","vi":"thanh toán khi nhận hàng","d":"Khách trả tiền cho người giao hàng khi nhận. Phổ biến ở Việt Nam nhưng tỉ lệ bom hàng cao hơn.","c":"Phân tích hủy đơn, hoàn hàng.","ex":[["Most of our orders are COD.","Phần lớn đơn của mình là COD."],["COD orders have a much higher failed delivery rate.","Đơn COD có tỉ lệ giao thất bại cao hơn nhiều."]],"col":["COD order","prepaid"],"rel":["failed delivery","cancellation rate"]},{"t":"failed delivery","p":"n","vi":"giao hàng thất bại","d":"Đơn không giao được vì khách không nghe máy, từ chối nhận, sai địa chỉ. Còn gọi là delivery failure; khách cố tình không nhận thường gọi là bom hàng.","c":"Phân tích tỉ lệ hoàn.","ex":[["Failed deliveries increased after the impulse-buy flash sale.","Giao thất bại tăng sau flash sale mua bốc đồng."]],"col":["delivery failure","refused delivery"],"rel":["return to sender","COD"]},{"t":"return to sender","f":"RTS / RTO","p":"phrase","vi":"hoàn hàng về người gửi","d":"Kiện hàng bị trả về shop do giao thất bại. Một số sàn gọi RTO (return to origin). Lưu ý RTS ở đây khác với ready to ship.","c":"Đối soát, tính chi phí hoàn.","ex":[["We pay the shipping fee both ways for return-to-sender parcels.","Mình chịu phí hai chiều cho đơn bị hoàn về."]],"col":["returned parcel","RTO rate"],"rel":["failed delivery","reverse logistics"],"tip":"Viết tắt RTS có hai nghĩa (ready to ship và return to sender). Nên viết đầy đủ khi trao đổi."},{"t":"return","p":"n, v","vi":"trả hàng","d":"Khách gửi lại sản phẩm đã nhận vì lỗi, sai mô tả hoặc đổi ý. Yêu cầu trả hàng gọi là return request.","c":"Chăm sóc khách, đối soát.","ex":[["The return rate went up because the size chart was wrong.","Tỉ lệ trả hàng tăng vì bảng size sai."]],"col":["return request","return rate","return and refund"],"rel":["refund","reverse logistics"]},{"t":"refund","p":"n, v","vi":"hoàn tiền","d":"Trả lại tiền cho khách. Có thể hoàn toàn bộ (full refund) hoặc một phần (partial refund).","c":"Xử lý khiếu nại.","ex":[["The customer asked for a refund because the item was damaged.","Khách yêu cầu hoàn tiền vì hàng bị hỏng."]],"col":["full refund","partial refund","issue a refund"],"rel":["return","dispute"]},{"t":"reverse logistics","p":"n","vi":"logistics ngược","d":"Dòng hàng đi ngược từ khách về shop: hàng trả, hàng hoàn, hàng lỗi. Bao gồm kiểm tra, nhập lại kho hoặc tiêu hủy.","c":"Quản lý chi phí hoàn hàng.","ex":[["Reverse logistics costs are eating into our margin.","Chi phí logistics ngược đang ăn vào biên lợi nhuận."]],"col":["returns processing","restock returns"],"rel":["return","return to sender"]},{"t":"damaged goods","p":"n","vi":"hàng hư hỏng","d":"Hàng bị bể, móp, hỏng khi vận chuyển hoặc trong kho.","c":"Khiếu nại với vận chuyển, xử lý khách.","ex":[["File a claim with the courier for damaged goods.","Gửi yêu cầu bồi thường với vận chuyển cho hàng bị hỏng."]],"col":["damaged in transit","file a claim"],"rel":["refund","courier"]},{"t":"shipping fee","p":"n","vi":"phí vận chuyển","d":"Phí giao hàng, có thể khách trả, shop trả hoặc sàn hỗ trợ. Còn gọi là shipping cost, delivery fee.","c":"Tính giá, thiết kế ưu đãi.","ex":[["High shipping fees are a common reason for abandoned carts.","Phí ship cao là lý do phổ biến khiến khách bỏ giỏ."]],"col":["shipping cost","delivery fee"],"rel":["free shipping","cart abandonment"]},{"t":"cart abandonment","p":"n","vi":"bỏ giỏ hàng","d":"Khách thêm hàng vào giỏ nhưng không thanh toán. Tỉ lệ bỏ giỏ là cart abandonment rate.","c":"Phân tích phễu, retargeting.","ex":[["Cart abandonment is high when shipping fees appear at checkout.","Bỏ giỏ nhiều khi phí ship hiện ra lúc thanh toán."]],"col":["abandoned cart","abandonment rate"],"rel":["add-to-cart","retargeting"]},{"t":"add-to-cart","f":"ATC","p":"n","vi":"thêm vào giỏ hàng","d":"Hành động bỏ sản phẩm vào giỏ, chưa thanh toán. Tỉ lệ ATC cho biết sản phẩm hấp dẫn đến đâu.","c":"Phân tích phễu.","ex":[["We had 2,000 add-to-cart actions but only 600 orders.","Có 2.000 lượt thêm giỏ nhưng chỉ 600 đơn."]],"col":["ATC rate","add to cart"],"rel":["checkout","cart abandonment"]},{"t":"checkout","p":"n","vi":"bước thanh toán, đặt hàng","d":"Bước cuối khách xác nhận địa chỉ, phương thức thanh toán và đặt đơn. Động từ là check out.","c":"Phân tích phễu, nhắc khách.","ex":[["Remind viewers to complete checkout before the voucher expires.","Nhắc người xem thanh toán trước khi voucher hết hạn."]],"col":["check out","checkout page","checkout rate"],"rel":["add-to-cart","conversion rate"]},{"t":"cancellation rate","p":"n","vi":"tỉ lệ hủy đơn","d":"Phần trăm đơn bị hủy (do khách hoặc do shop) trên tổng đơn. Shop hủy nhiều sẽ bị phạt.","c":"Báo cáo chất lượng đơn.","fm":"Tỉ lệ hủy = số đơn hủy ÷ tổng đơn × 100%","ex":[["The cancellation rate is high for COD orders.","Tỉ lệ hủy cao với đơn COD."]],"col":["cancel an order","seller-initiated cancellation"],"rel":["COD","overselling","net revenue"]},{"t":"order volume","p":"n","vi":"lượng đơn","d":"Số đơn trong một khoảng thời gian.","ex":[["Order volume on 11.11 is five times a normal day.","Lượng đơn 11.11 gấp năm ngày thường."]],"c":"Lập kế hoạch kho.","col":["high volume","peak volume"],"rel":["fulfillment"]},{"t":"backlog","p":"n","vi":"đơn tồn đọng","d":"Đơn chưa xử lý kịp.","ex":[["We have a backlog of 3,000 orders after the mega sale.","Còn tồn 3.000 đơn sau siêu sale."]],"c":"Siêu sale, sự cố kho.","col":["clear the backlog","order backlog"],"rel":["order volume","late shipment rate"]},{"t":"cut-off time","p":"n","vi":"giờ chốt đơn","d":"Giờ cuối trong ngày để đơn được xử lý và giao đi trong ngày.","ex":[["Orders after the 3 PM cut-off time ship tomorrow.","Đơn sau giờ chốt 3 giờ chiều sẽ giao ngày mai."]],"c":"Vận hành kho.","col":["daily cut-off"],"rel":["handover"]},{"t":"same-day delivery","p":"n","vi":"giao trong ngày","d":"Giao hàng trong ngày đặt.","ex":[["Same-day delivery is available in Ho Chi Minh City.","Có giao trong ngày ở TP.HCM."]],"c":"Dịch vụ vận chuyển.","col":["next-day delivery","express"],"rel":["last-mile delivery"]},{"t":"express delivery","p":"n","vi":"giao nhanh","d":"Dịch vụ giao hàng nhanh hơn tiêu chuẩn, phí cao hơn.","ex":[["Express delivery costs 15k more.","Giao nhanh tốn thêm 15k."]],"c":"Lựa chọn vận chuyển.","col":["express shipping","standard delivery"],"rel":["same-day delivery"]},{"t":"delivery time","p":"n","vi":"thời gian giao hàng","d":"Thời gian từ lúc giao cho vận chuyển đến lúc khách nhận.","ex":[["Delivery time is 2 to 4 days.","Thời gian giao 2 đến 4 ngày."]],"c":"Trả lời khách.","col":["estimated delivery","ETA"],"rel":["lead time"]},{"t":"proof of delivery","p":"n","vi":"bằng chứng giao hàng","d":"Ảnh, chữ ký hoặc mã xác nhận khách đã nhận hàng.","ex":[["The courier has proof of delivery with a photo.","Vận chuyển có ảnh làm bằng chứng đã giao."]],"c":"Giải quyết tranh chấp.","col":["POD"],"rel":["dispute"]},{"t":"parcel","p":"n","vi":"bưu kiện, kiện hàng","d":"Gói hàng được gửi đi.","ex":[["The parcel is out for delivery.","Kiện hàng đang được giao."]],"c":"Vận chuyển.","col":["package","out for delivery"],"rel":["shipping label"]},{"t":"packaging","p":"n","vi":"bao bì, đóng gói","d":"Vật liệu đóng gói (hộp, túi, xốp). Packaging design là thiết kế bao bì.","ex":[["Use bubble wrap for glass bottles.","Dùng xốp hơi cho chai thủy tinh."]],"c":"Đóng gói, trải nghiệm khui hộp.","col":["bubble wrap","eco packaging"],"rel":["pick and pack","unboxing"]},{"t":"insert card","p":"n","vi":"thiệp kèm trong hộp","d":"Thiệp hoặc tờ giới thiệu đặt trong kiện hàng: cảm ơn, hướng dẫn, mã giảm giá mua lại.","ex":[["Add an insert card with a QR code for repeat orders.","Thêm thiệp có mã QR để mua lại."]],"c":"Tăng mua lại.","col":["thank-you card","package insert"],"rel":["repeat customer"]},{"t":"stock count","p":"n","vi":"kiểm kê","d":"Đếm thực tế số hàng trong kho để đối chiếu với hệ thống.","ex":[["We do a full stock count every month.","Kiểm kê toàn bộ mỗi tháng."]],"c":"Vận hành kho.","col":["stocktake","cycle count"],"rel":["inventory"]},{"t":"stock discrepancy","p":"n","vi":"chênh lệch tồn kho","d":"Số hàng thực tế khác với số trên hệ thống.","ex":[["There's a stock discrepancy of 40 units for SKU 12.","SKU 12 lệch tồn 40 cái."]],"c":"Đối soát kho.","col":["inventory mismatch"],"rel":["stock count"]},{"t":"batch number","p":"n","vi":"số lô","d":"Mã lô sản xuất, giúp truy xuất nguồn gốc và xử lý khi có lỗi.","ex":[["Check the batch number on the complaint.","Kiểm tra số lô của sản phẩm bị khiếu nại."]],"c":"Quản lý chất lượng.","col":["lot number"],"rel":["expiry date","recall"]},{"t":"expiry date","p":"n","vi":"hạn sử dụng","d":"Ngày sản phẩm hết hạn dùng. Viết tắt EXP. Ngày sản xuất là MFG.","ex":[["Only ship stock with at least 12 months to expiry.","Chỉ gửi hàng còn hạn ít nhất 12 tháng."]],"c":"Mỹ phẩm, thực phẩm.","col":["EXP","best before","shelf life"],"rel":["FEFO"]},{"t":"FEFO","p":"abbr","vi":"hết hạn trước, xuất trước","d":"Nguyên tắc xuất kho hàng có hạn sử dụng gần nhất trước.","ex":[["The warehouse follows FEFO for skincare.","Kho xuất theo nguyên tắc hết hạn trước với mỹ phẩm."]],"f":"First Expired, First Out","c":"Kho mỹ phẩm, thực phẩm.","col":["FIFO"],"rel":["expiry date"]},{"t":"FIFO","p":"abbr","vi":"nhập trước, xuất trước","d":"Nguyên tắc xuất hàng nhập kho sớm nhất trước.","ex":[["Use FIFO for non-perishable items.","Dùng nhập trước xuất trước với hàng không hạn."]],"f":"First In, First Out","c":"Quản lý kho.","col":["LIFO"],"rel":["FEFO"]},{"t":"dead stock","p":"n","vi":"hàng chết, tồn lâu","d":"Hàng tồn rất lâu không bán được.","ex":[["Bundle dead stock with best-sellers.","Gộp hàng tồn lâu với sản phẩm bán chạy."]],"c":"Quản lý tồn kho.","col":["slow-moving stock","obsolete"],"rel":["clearance sale","inventory turnover"]},{"t":"slow-moving","p":"adj","vi":"bán chậm","d":"Sản phẩm bán chậm hơn kế hoạch.","ex":[["Push slow-moving SKUs in the live as add-on deals.","Đẩy các mã bán chậm vào live làm deal mua kèm."]],"c":"Quản lý tồn kho.","col":["slow movers","fast-moving"],"rel":["dead stock"]},{"t":"fast-moving","p":"adj","vi":"bán nhanh","d":"Sản phẩm quay vòng nhanh. FMCG là hàng tiêu dùng nhanh.","ex":[["Keep higher safety stock for fast-moving items.","Giữ tồn an toàn cao hơn cho hàng bán nhanh."]],"c":"Quản lý tồn kho.","col":["fast movers","FMCG"],"rel":["slow-moving"]},{"t":"stock coverage","p":"n","vi":"số ngày đủ hàng","d":"Lượng tồn hiện tại đủ bán trong bao nhiêu ngày theo tốc độ bán hiện tại.","ex":[["Stock coverage is only 5 days, order now.","Tồn chỉ đủ 5 ngày, đặt hàng ngay."]],"c":"Kế hoạch nhập.","col":["days of cover","weeks of supply"],"rel":["safety stock"],"fm":"Số ngày đủ hàng = tồn kho ÷ lượng bán trung bình mỗi ngày"},{"t":"reorder point","p":"n","vi":"điểm đặt hàng lại","d":"Mức tồn kho mà khi chạm tới thì phải đặt hàng mới.","ex":[["The reorder point for the serum is 800 units.","Điểm đặt lại của serum là 800 cái."]],"c":"Kế hoạch nhập.","col":["ROP"],"rel":["safety stock","lead time"],"fm":"Điểm đặt lại = lượng bán mỗi ngày × thời gian chờ hàng + tồn an toàn"},{"t":"inbound","p":"adj, n","vi":"hàng nhập kho","d":"Hàng đi vào kho từ nhà cung cấp. Ngược lại outbound là hàng xuất kho.","ex":[["Inbound shipments arrive on Tuesdays.","Hàng nhập về kho vào thứ Ba."]],"c":"Vận hành kho.","col":["inbound shipment","outbound"],"rel":["warehouse"]},{"t":"goods receipt","p":"n","vi":"nhận hàng nhập kho","d":"Bước kiểm đếm và ghi nhận hàng nhập. Phiếu nhập kho là GRN (goods received note).","ex":[["Sign the goods receipt after counting.","Ký nhận hàng sau khi đếm."]],"c":"Vận hành kho.","col":["GRN"],"rel":["inbound"]},{"t":"cross-docking","p":"n","vi":"chuyển tiếp không lưu kho","d":"Hàng về kho được chia và chuyển đi ngay, không lưu trữ.","ex":[["Cross-docking cuts delivery time by a day.","Chuyển tiếp không lưu kho rút ngắn một ngày giao."]],"c":"Tối ưu vận hành.","col":["transshipment"],"rel":["warehouse"]},{"t":"shipping zone","p":"n","vi":"vùng giao hàng","d":"Khu vực tính phí và thời gian giao: nội thành, ngoại thành, liên tỉnh.","ex":[["Remote shipping zones take 5 to 7 days.","Vùng xa giao mất 5 đến 7 ngày."]],"c":"Tính phí ship.","col":["inner city","remote area"],"rel":["shipping fee"]},{"t":"volumetric weight","p":"n","vi":"trọng lượng quy đổi","d":"Trọng lượng tính theo kích thước kiện hàng. Đơn vị vận chuyển tính phí theo số lớn hơn giữa cân nặng thật và trọng lượng quy đổi.","ex":[["The box is light but the volumetric weight is high.","Hộp nhẹ nhưng trọng lượng quy đổi
