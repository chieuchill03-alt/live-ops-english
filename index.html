/* ---------- A–Z ---------- */
function az(){
  V.filter ||= "all";
  const list=ALL.filter(t=>V.filter==="all"||t.cat.group===V.filter).slice().sort((a,b)=>a.t.localeCompare(b.t,"en",{sensitivity:"base"}));
  const letters={};list.forEach(t=>{const L=/[a-z]/i.test(t.t[0])?t.t[0].toUpperCase():"#";(letters[L] ||= []).push(t);});
  const AZ="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  $("#app").innerHTML=`
  <header class="cathead" style="--gc:var(--live)"><span class="tag">Từ điển</span><h1>Tra cứu A–Z</h1><p>Toàn bộ ${ALL.length} thuật ngữ xếp theo bảng chữ cái. Bấm vào từ để xem đầy đủ.</p></header>
  <label class="search" for="q">${I.search}<input id="q" placeholder="Tìm bằng tiếng Anh hoặc tiếng Việt…" autocomplete="off"></label>
  <div class="chips" id="flt"><button class="chip" data-f="all" aria-pressed="${V.filter==="all"}">Tất cả</button>${GROUPS.map(([g])=>`<button class="chip" data-f="${esc(g)}" aria-pressed="${V.filter===g}"><span class="dot" style="--gc:${GCOL[g]}"></span>${esc(g)}</button>`).join("")}</div>
  <div class="azbar">${AZ.map(L=>`<button data-L="${L}" ${letters[L]?"":"disabled"}>${L}</button>`).join("")}</div>
  <div id="azlist">${Object.keys(letters).sort().map(L=>`<div class="letter" id="L-${L}">${L}</div><div class="rows">${letters[L].map(t=>rowHTML(t,true)).join("")}</div>`).join("")}</div>
  <div id="sres" class="hidden"></div>`;
  bindRows($("#azlist"));
  document.querySelectorAll("#flt .chip").forEach(b=>b.onclick=()=>{V.filter=b.dataset.f;az();});
  document.querySelectorAll(".azbar button").forEach(b=>b.onclick=()=>{const el=document.getElementById("L-"+b.dataset.L);if(el){const off=(window.innerWidth<720?70:130);window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-off,behavior:"smooth"});}});
  $("#q").oninput=e=>{const q=e.target.value,r=$("#sres"),l=$("#azlist");
    if(!q.trim()){r.classList.add("hidden");l.classList.remove("hidden");return;}
    const hits=searchTerms(q).filter(t=>V.filter==="all"||t.cat.group===V.filter);l.classList.add("hidden");r.classList.remove("hidden");
    r.innerHTML=hits.length?`<div class="rows">${hits.map(t=>rowHTML(t,true)).join("")}</div>`:`<p class="empty">Không tìm thấy “${esc(q)}”.</p>`;bindRows(r);};
}

/* ---------- REVIEW ---------- */
function review(){
  const due=shuffle(dueList());
  const learning=ALL.filter(t=>stateOf(t)!=="new");
  $("#app").innerHTML=`
  <header class="cathead" style="--gc:var(--live)"><span class="tag">Ôn tập ngắt quãng</span><h1>${due.length?`${due.length} thẻ cần ôn`:"Không có thẻ đến hạn"}</h1>
  <p>Mỗi khi bạn chấm “Nhớ rõ”, thẻ được giãn lịch ôn: 1 ngày, 3 ngày, 1 tuần, 2 tuần, 1 tháng, 2 tháng. “Chưa nhớ” thì quay lại sau 10 phút.</p></header>
  <div id="pane"></div>`;
  if(due.length)flashSession($("#pane"),due,{doneMsg:"Đã ôn xong lượt hôm nay. Quay lại ngày mai nhé."});
  else $("#pane").innerHTML=`<div class="empty"><p style="margin:0 0 12px">${learning.length?`Bạn đã học ${learning.length} từ. Chưa có từ nào đến hạn ôn.`:"Bạn chưa học từ nào. Học thẻ ở một chủ đề, rồi quay lại đây để ôn."}</p>
    <div class="cta-row" style="justify-content:center"><button class="btn primary" id="learnnew">Học từ mới</button>${learning.length?`<button class="btn" id="cram">Ôn trước 20 từ ngẫu nhiên</button>`:""}</div></div>`;
  if(!due.length){$("#learnnew").onclick=()=>{const c=CATS.find(c=>c.terms.some(t=>stateOf(t)==="new"))||CATS[0];go("cat",{c:c.id,tab:"learn"});};
    if(learning.length)$("#cram").onclick=()=>flashSession($("#pane"),shuffle(learning).slice(0,20));}
}

/* ---------- SAVED ---------- */
function saved(){
  const list=ALL.filter(t=>P.star[t.key]);
  $("#app").innerHTML=`
  <header class="cathead" style="--gc:#e0a400"><span class="tag">Sổ tay</span><h1>Từ đã lưu</h1><p>Lưu những thuật ngữ bạn hay gặp trong công việc bằng nút ngôi sao ở trang chi tiết.</p></header>
  ${list.length?`<div class="cta-row"><button class="btn primary" id="sv-learn">Học thẻ ${list.length} từ đã lưu</button><button class="btn" id="sv-quiz" ${list.length<4?"disabled":""}>Kiểm tra từ đã lưu</button></div><div id="pane"><div class="rows">${list.map(t=>rowHTML(t,true)).join("")}</div></div>`
  :`<p class="empty">Chưa lưu từ nào. Mở một thuật ngữ bất kỳ và bấm “Lưu vào sổ tay”.</p>`}`;
  if(list.length){bindRows($("#pane"));$("#sv-learn").onclick=()=>flashSession($("#pane"),list);
    if(list.length>=4)$("#sv-quiz").onclick=()=>startQuiz($("#pane"),list,{n:Math.min(15,list.length)});}
}

/* ---------- QUIZ ---------- */
function quizSetup(){
  V.qg ||= new Set(GROUPS.map(g=>g[0]));V.qsrc ||= "all";V.qn ||= 20;
  $("#app").innerHTML=`
  <header class="cathead" style="--gc:var(--live)"><span class="tag">Kiểm tra tổng hợp</span><h1>Tự kiểm tra</h1><p>Câu hỏi trộn năm dạng: chọn nghĩa, chọn thuật ngữ theo ngữ cảnh, điền vào câu, nghe và chọn, gõ thuật ngữ.</p></header>
  <div class="setup" id="setup">
    <div class="sec"><span class="label">Mảng</span><div class="chips">${GROUPS.map(([g])=>`<button class="chip" data-g="${esc(g)}" aria-pressed="${V.qg.has(g)}"><span class="dot" style="--gc:${GCOL[g]}"></span>${esc(g)}</button>`).join("")}</div></div>
    <div class="sec"><span class="label">Nguồn từ</span><div class="chips">${[["all","Tất cả"],["studied","Chỉ từ đã học"],["weak","Từ chưa thuộc"]].map(([k,l])=>`<button class="chip" data-s="${k}" aria-pressed="${V.qsrc===k}">${l}</button>`).join("")}</div></div>
    <div class="sec"><span class="label">Số câu</span><div class="chips">${[10,20,30].map(n=>`<button class="chip" data-n="${n}" aria-pressed="${V.qn===n}">${n} câu</button>`).join("")}</div></div>
    <p class="note" id="pool"></p>
    <div><button class="btn live" id="start">Bắt đầu</button></div>
  </div>
  <div id="pane"></div>`;
  const pool=()=>ALL.filter(t=>V.qg.has(t.cat.group)&&(V.qsrc==="all"||(V.qsrc==="studied"&&P.srs[t.key])||(V.qsrc==="weak"&&stateOf(t)!=="known")));
  const upd=()=>{const n=pool().length;$("#pool").textContent=`${n} thuật ngữ phù hợp.`;$("#start").disabled=n<4;};upd();
  document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{const g=b.dataset.g;V.qg.has(g)?V.qg.delete(g):V.qg.add(g);b.setAttribute("aria-pressed",V.qg.has(g));upd();});
  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{V.qsrc=b.dataset.s;document.querySelectorAll("[data-s]").forEach(x=>x.setAttribute("aria-pressed",x===b));upd();});
  document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{V.qn=+b.dataset.n;document.querySelectorAll("[data-n]").forEach(x=>x.setAttribute("aria-pressed",x===b));});
  $("#start").onclick=()=>{$("#setup").classList.add("hidden");startQuiz($("#pane"),pool(),{n:Math.min(V.qn,pool().length),onExit:()=>quizSetup()});};
}
function blankable(t,s){return new RegExp(reEsc(t.t.replace(/\s*\([^)]*\)/g,"").split(" / ")[0]),"i").test(s);}
function distractors(t,pool,k){
  const same=shuffle(pool.filter(x=>x!==t&&x.cat===t.cat&&x.t.toLowerCase()!==t.t.toLowerCase()));
  const other=shuffle(ALL.filter(x=>x!==t&&x.cat.group===t.cat.group&&x.cat!==t.cat));
  const out=[];for(const x of [...same,...other]){if(out.length>=k)break;if(!out.some(o=>o.vi===x.vi||o.t===x.t)&&x.vi!==t.vi)out.push(x);}return out;
}
function startQuiz(root,pool,opt){
  const types=["meaning","term","context",hasSpeech?"listen":"context","type"];
  const items=shuffle(pool).slice(0,opt.n).map((t,i)=>{let ty=types[i%types.length];
    const exi=t.ex.findIndex(e=>blankable(t,e[0]));
    if(ty==="context"&&exi<0)ty="term";
    if(ty==="type"&&(t.t.length>28||/[()]/.test(t.t)||/pattern|host line|greeting|closing/.test(t.p)))ty=/pattern|host line/.test(t.p)?"term":"meaning";
    return{t,ty,exi};});
  let i=0,score=0;const wrong=[];
  const draw=()=>{
    if(i>=items.length)return result();
    const {t,ty,exi}=items[i];let done=false;
    const ds=distractors(t,pool,3);
    const T={meaning:"Thuật ngữ này nghĩa là gì?",term:"Thuật ngữ nào phù hợp?",context:"Điền thuật ngữ vào chỗ trống",listen:"Nghe và chọn nghĩa đúng",type:"Gõ thuật ngữ tiếng Anh"};
    let prompt="",opts=null;
    if(ty==="meaning"){prompt=`<div class="big">${esc(t.t)}</div>${t.f?`<div class="dfull">${esc(t.f)}</div>`:""}`;opts=shuffle([t,...ds]).map(x=>[x,x.vi]);}
    if(ty==="term"){prompt=`<div class="big" style="font-size:1.35rem">${esc(t.vi)}</div><div class="sub">${esc(t.d)}</div>`;opts=shuffle([t,...ds]).map(x=>[x,x.t]);}
    if(ty==="context"){const e=t.ex[exi],re=new RegExp(reEsc(t.t.replace(/\s*\([^)]*\)/g,"").split(" / ")[0]),"i");const m=e[0].match(re);
      prompt=`<div class="sent">${esc(e[0].slice(0,m.index))}<span class="gap"></span>${esc(e[0].slice(m.index+m[0].length))}</div><div class="sub">${esc(e[1])}</div>`;opts=shuffle([t,...ds]).map(x=>[x,x.t]);}
    if(ty==="listen"){prompt=`<button class="bigplay" id="lp" aria-label="Nghe lại">${I.spk}</button><div class="sub">Chạm để nghe lại</div>`;opts=shuffle([t,...ds]).map(x=>[x,x.vi]);}
    if(ty==="type"){prompt=`<div class="big" style="font-size:1.35rem">${esc(t.vi)}</div>${t.c?`<div class="sub">${esc(t.c)}</div>`:""}<div class="sub">Gợi ý: bắt đầu bằng “${esc(t.t[0])}”, ${t.t.length} ký tự${t.f?" (có thể gõ dạng đầy đủ)":""}</div>`;}
    root.innerHTML=`<div class="quiz">
      <div class="qhead"><span class="label">${T[ty]}</span><span class="counter">${i+1}/${items.length} · ${score} đúng</span></div>
      <div class="pbar"><i style="width:${i/items.length*100}%"></i></div>
      <div class="qprompt">${prompt}</div>
      ${opts?`<div class="opts">${opts.map(([x,l],j)=>`<button class="opt" data-j="${j}">${esc(l)}</button>`).join("")}</div>`
      :`<form class="typebox" id="tf"><input id="ti" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ thuật ngữ…"><button class="btn primary" type="submit">Kiểm tra</button></form>`}
      <div class="fb" id="fb"></div><div id="exp"></div>
      <div class="cta-row" style="justify-content:center"><button class="btn primary hidden" id="nx">${i+1<items.length?"Câu tiếp →":"Xem kết quả"}</button></div></div>`;
    if(ty==="listen"){$("#lp").onclick=()=>sayTerm(t);sayTerm(t);}
    const finish=ok=>{done=true;if(ok)score++;else wrong.push(t);
      if(P.srs[t.key]||!ok)rate(t,ok?(P.srs[t.key]?2:1):0);
      const fb=$("#fb");fb.className="fb "+(ok?"ok":"no");fb.textContent=ok?"Chính xác!":`Đáp án: ${t.t}`;
      $("#exp").innerHTML=`<div class="explain"><b>${esc(t.t)}</b>${t.f?` (${esc(t.f)})`:""}: ${esc(t.vi)}. ${esc(t.d)}</div>`;
      sayTerm(t);$("#nx").classList.remove("hidden");$("#nx").focus();};
    if(opts)root.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(done)return;const ok=opts[+b.dataset.j][0]===t;
      root.querySelectorAll(".opt").forEach((o,j)=>{o.disabled=true;if(opts[j][0]===t)o.classList.add("right");});if(!ok)b.classList.add("wrong");finish(ok);});
    else{$("#ti").focus();$("#tf").onsubmit=e=>{e.preventDefault();if(done)return;const v=$("#ti").value;if(!v.trim())return;$("#ti").disabled=true;
      const n=norm(v);finish(n===norm(t.t)||(t.f&&n===norm(t.f))||t.t.split(" / ").some(p=>norm(p)===n));};}
    $("#nx").onclick=()=>{i++;draw();};
  };
  const result=()=>{
    const pct=Math.round(score/items.length*100);
    if(opt.catId){const prev=P.best[opt.catId];if(prev==null||pct>prev){P.best[opt.catId]=pct;save();}}
    const msg=pct>=90?"Rất tốt. Bạn đã dùng được những thuật ngữ này trong công việc.":pct>=60?"Khá ổn. Xem lại các từ sai bên dưới, chúng đã được đưa vào lịch ôn.":"Không sao, các từ sai đã được đưa vào lịch ôn. Học thẻ lại rồi thử lần nữa.";
    root.innerHTML=`<div class="quiz"><span class="label" style="text-align:center">Kết quả</span><div class="score">${pct}%</div>
      <p style="margin:0;text-align:center">${score}/${items.length} câu đúng</p><p class="note" style="margin:0;text-align:center">${msg}</p>
      ${wrong.length?`<div class="sec"><span class="label">Các từ cần xem lại</span><div class="rows">${wrong.map(t=>rowHTML(t,true)).join("")}</div></div>`:""}
      <div class="cta-row" style="justify-content:center"><button class="btn primary" id="again">Làm bài mới</button>${opt.onExit?`<button class="btn" id="exit">Đổi cài đặt</button>`:""}</div></div>`;
    bindRows(root);
    $("#again").onclick=()=>startQuiz(root,pool,opt);
    if(opt.onExit)$("#exit").onclick=opt.onExit;
  };
  draw();
}

render();
</script>

<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
