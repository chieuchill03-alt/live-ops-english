nh hơn.","ex":[["An overseas warehouse cuts delivery to 2 days.","Kho ở nước ngoài rút thời gian giao còn 2 ngày."]],"c":"Vận hành quốc tế.","col":["local fulfillment"],"rel":["fulfillment"]},{"t":"ASEAN","p":"n","vi":"ASEAN, Đông Nam Á","d":"Hiệp hội các quốc gia Đông Nam Á. SEA là viết tắt Southeast Asia.","ex":[["Live commerce is booming across SEA.","Live commerce đang bùng nổ khắp Đông Nam Á."]],"c":"Thị trường khu vực.","col":["SEA","Southeast Asia"],"rel":["cross-border e-commerce"]}]},{"id":"mkt","code":"MKT","group":"Marketing","en":"Marketing Fundamentals","vi":"Nền tảng marketing","intro":"Bộ khung tư duy marketing hay gặp trong brief, kế hoạch và họp với brand: khách hàng, định vị, phễu, hành trình mua.","terms":[{"t":"marketing mix","f":"4P","p":"n","vi":"marketing hỗn hợp (4P)","d":"Bốn yếu tố cơ bản: Product (sản phẩm), Price (giá), Place (kênh phân phối), Promotion (truyền thông, khuyến mãi).","c":"Lập kế hoạch marketing.","ex":[["Live commerce changes the Place and Promotion parts of the marketing mix.","Bán hàng qua live thay đổi phần Kênh và Truyền thông trong 4P."]],"col":["4Ps","7Ps"],"rel":["positioning","go-to-market"]},{"t":"STP","f":"Segmentation, Targeting, Positioning","p":"abbr","vi":"phân khúc, chọn mục tiêu, định vị","d":"Quy trình ba bước: chia thị trường thành nhóm (segmentation), chọn nhóm để phục vụ (targeting), xác định vị trí của thương hiệu trong tâm trí nhóm đó (positioning).","c":"Chiến lược thương hiệu.","ex":[["Let's go through the STP for the new product line.","Mình đi qua STP cho dòng sản phẩm mới."]],"col":["STP model"],"rel":["segmentation","target audience","positioning"]},{"t":"segmentation","p":"n","vi":"phân khúc thị trường","d":"Chia khách hàng thành nhóm có đặc điểm chung: tuổi, thu nhập, khu vực, hành vi, nhu cầu.","c":"Phân tích khách hàng.","ex":[["Our segmentation is based on skin type and budget.","Phân khúc của mình dựa trên loại da và ngân sách."]],"col":["customer segment","market segmentation"],"rel":["STP","target audience"]},{"t":"target audience","p":"n","vi":"khách hàng mục tiêu","d":"Nhóm người mà sản phẩm, nội dung hoặc quảng cáo hướng tới.","c":"Brief nội dung, quảng cáo, chọn host.","ex":[["Our target audience is women aged 22 to 35 in big cities.","Khách mục tiêu là nữ 22 đến 35 tuổi ở thành phố lớn."]],"col":["target customer","core audience"],"rel":["customer persona","targeting"]},{"t":"customer persona","p":"n","vi":"chân dung khách hàng","d":"Hình mẫu một khách hàng điển hình với tên, tuổi, nghề, thói quen, mong muốn, nỗi lo. Giúp cả team hiểu đang nói chuyện với ai.","c":"Brief, kịch bản live.","ex":[["Our main persona is a 27-year-old office worker with oily skin.","Chân dung chính là nhân viên văn phòng 27 tuổi da dầu."]],"col":["buyer persona","persona profile"],"rel":["target audience","pain point","insight"]},{"t":"consumer insight","p":"n","vi":"sự thật ngầm hiểu của khách hàng","d":"Hiểu biết sâu về động cơ, cảm xúc ẩn sau hành vi của khách, thứ họ không nói ra nhưng đúng. Insight tốt là nền cho ý tưởng truyền thông.","c":"Lên ý tưởng, chiến dịch.","ex":[["The insight is that busy moms want skincare that takes under 3 minutes.","Insight là các mẹ bận rộn muốn chăm da dưới 3 phút."]],"col":["customer insight","key insight"],"rel":["pain point","customer persona"]},{"t":"positioning","p":"n","vi":"định vị thương hiệu","d":"Vị trí thương hiệu muốn chiếm trong tâm trí khách so với đối thủ, ví dụ “mỹ phẩm thuần chay giá vừa túi tiền”.","c":"Chiến lược thương hiệu, nội dung.","ex":[["Our positioning is affordable premium.","Định vị là cao cấp giá phải chăng."]],"col":["brand positioning","positioning statement"],"rel":["STP","value proposition","USP"]},{"t":"value proposition","p":"n","vi":"tuyên bố giá trị","d":"Lời hứa về giá trị khách nhận được và lý do nên chọn mình thay vì đối thủ.","c":"Viết trang sản phẩm, pitch.","ex":[["Our value proposition: salon results at home in 10 minutes.","Giá trị cốt lõi: hiệu quả như salon tại nhà trong 10 phút."]],"col":["customer value proposition","CVP"],"rel":["USP","positioning","benefit"]},{"t":"USP","f":"Unique Selling Proposition","p":"abbr","vi":"điểm bán hàng độc nhất","d":"Điểm khác biệt duy nhất mà đối thủ không có hoặc không nói, là lý do chính để khách chọn mình. Còn đọc là Unique Selling Point.","c":"Brief cho host, quảng cáo.","ex":[["Our USP is that it lasts 24 hours without touch-ups.","Điểm khác biệt là giữ 24 giờ không cần dặm lại."]],"col":["key USP","differentiator"],"rel":["selling point","value proposition"]},{"t":"brand awareness","p":"n","vi":"độ nhận biết thương hiệu","d":"Mức độ người tiêu dùng biết và nhớ thương hiệu. Là mục tiêu tầng trên của phễu.","c":"Mục tiêu chiến dịch không đặt nặng doanh số.","ex":[["This campaign is for brand awareness, not sales.","Chiến dịch này để tăng nhận biết, không phải bán hàng."]],"col":["build awareness","awareness campaign"],"rel":["funnel","reach"]},{"t":"consideration","p":"n","vi":"giai đoạn cân nhắc","d":"Khách đã biết thương hiệu và đang so sánh, tìm hiểu trước khi mua. Nội dung review, so sánh, demo phục vụ giai đoạn này.","c":"Lập kế hoạch nội dung theo phễu.","ex":[["Review videos work well in the consideration stage.","Video review hiệu quả ở giai đoạn cân nhắc."]],"col":["consideration stage"],"rel":["funnel","customer journey"]},{"t":"funnel","p":"n","vi":"phễu marketing / phễu bán hàng","d":"Mô hình hành trình khách từ biết đến mua: Awareness → Consideration → Conversion → Loyalty. Mỗi tầng hẹp dần vì có người rơi rụng.","c":"Phân tích, lập kế hoạch nội dung và ngân sách.","ex":[["Most people drop off in the middle of the funnel.","Phần lớn người rớt ở giữa phễu."]],"col":["sales funnel","marketing funnel","full-funnel"],"rel":["TOFU / MOFU / BOFU","AIDA","live funnel"]},{"t":"TOFU / MOFU / BOFU","f":"Top / Middle / Bottom Of The Funnel","p":"abbr","vi":"đỉnh / giữa / đáy phễu","d":"Ba tầng của phễu. TOFU: tạo nhận biết, MOFU: nuôi dưỡng, cân nhắc; BOFU: chốt mua. Live bán hàng chủ yếu là BOFU.","c":"Phân loại nội dung, quảng cáo.","ex":[["Short videos are TOFU, the live session is BOFU.","Video ngắn là đỉnh phễu, phiên live là đáy phễu."]],"col":["top of funnel","bottom of funnel"],"rel":["funnel"]},{"t":"AIDA","f":"Attention, Interest, Desire, Action","p":"abbr","vi":"mô hình AIDA","d":"Công thức thuyết phục bốn bước: thu hút chú ý, tạo quan tâm, khơi mong muốn, thúc hành động. Rất hợp để viết kịch bản từng vòng sản phẩm trong live.","c":"Viết kịch bản, quảng cáo.","ex":[["Structure each product segment using AIDA.","Xây từng đoạn giới thiệu sản phẩm theo AIDA."]],"col":["AIDA model"],"rel":["hook","call to action","funnel"]},{"t":"customer journey","p":"n","vi":"hành trình khách hàng","d":"Toàn bộ các bước và trải nghiệm của khách từ khi biết đến thương hiệu, tìm hiểu, mua, dùng tới khi mua lại.","c":"Thiết kế trải nghiệm, tìm điểm nghẽn.","ex":[["Map the customer journey from TikTok video to repeat purchase.","Vẽ hành trình khách từ video TikTok đến lần mua lại."]],"col":["journey map","customer experience"],"rel":["touchpoint","funnel"]},{"t":"touchpoint","p":"n","vi":"điểm chạm","d":"Mọi nơi khách tiếp xúc với thương hiệu: quảng cáo, video, phòng live, trang sản phẩm, gói hàng, tin nhắn CSKH.","c":"Thiết kế trải nghiệm đồng bộ.","ex":[["The unboxing is an important touchpoint for us.","Khui hộp là điểm chạm quan trọng với mình."]],"col":["key touchpoints","brand touchpoint"],"rel":["customer journey","omnichannel"]},{"t":"IMC","f":"Integrated Marketing Communications","p":"abbr","vi":"truyền thông marketing tích hợp","d":"Phối hợp mọi kênh (quảng cáo, KOL, live, PR, nội dung) truyền tải một thông điệp nhất quán.","c":"Lập kế hoạch chiến dịch lớn.","ex":[["The 12.12 plan is an IMC campaign with KOLs, ads and daily lives.","Kế hoạch 12.12 là chiến dịch tích hợp gồm KOL, quảng cáo và live hằng ngày."]],"col":["integrated campaign","360 campaign"],"rel":["campaign","key message"]},{"t":"key message","p":"n","vi":"thông điệp chính","d":"Điều quan trọng nhất muốn khách nhớ sau chiến dịch. Mọi kênh nên lặp lại thông điệp này.","c":"Brief, kịch bản, quảng cáo.","ex":[["The key message is: gentle enough for sensitive skin.","Thông điệp chính là: đủ dịu nhẹ cho da nhạy cảm."]],"col":["core message","messaging"],"rel":["IMC","brand voice"]},{"t":"brand identity","p":"n","vi":"bộ nhận diện thương hiệu","d":"Các yếu tố nhìn thấy được của thương hiệu: logo, màu sắc, phông chữ, hình ảnh, phong cách.","c":"Thiết kế phòng live, banner, nội dung.","ex":[["The backdrop must follow the brand identity.","Phông nền phải theo đúng nhận diện thương hiệu."]],"col":["visual identity","brand assets"],"rel":["brand guidelines","brand voice"]},{"t":"brand voice","p":"n","vi":"giọng điệu thương hiệu","d":"Cách thương hiệu “nói chuyện”: thân thiện, chuyên gia, hài hước, sang trọng. Host và CS nên giữ đúng giọng điệu này.","c":"Đào tạo host, viết nội dung.","ex":[["The brand voice is friendly but expert, no slang.","Giọng thương hiệu thân thiện nhưng chuyên môn, không dùng tiếng lóng."]],"col":["tone of voice","brand tone"],"rel":["brand identity","brand guidelines"]},{"t":"competitor analysis","p":"n","vi":"phân tích đối thủ","d":"Nghiên cứu đối thủ: giá, sản phẩm, cách live, deal, nội dung, điểm mạnh yếu.","c":"Lập chiến lược, chuẩn bị chiến dịch.","ex":[["Do a competitor analysis of the top 5 sunscreen shops.","Phân tích 5 shop kem chống nắng hàng đầu."]],"col":["competitive analysis","benchmark against"],"rel":["SWOT","benchmark"]},{"t":"SWOT","f":"Strengths, Weaknesses, Opportunities, Threats","p":"abbr","vi":"phân tích SWOT","d":"Khung phân tích điểm mạnh, điểm yếu (bên trong) và cơ hội, thách thức (bên ngoài).","c":"Lập kế hoạch, báo cáo chiến lược.","ex":[["Include a SWOT of our live channel in the proposal.","Đưa phân tích SWOT kênh live vào đề xuất."]],"col":["SWOT analysis"],"rel":["competitor analysis"]},{"t":"market share","p":"n","vi":"thị phần","d":"Phần doanh số của một brand trên tổng doanh số thị trường hoặc ngành hàng.","c":"Báo cáo thị trường.","ex":[["We have 12% market share in the sunscreen category on Shopee.","Mình chiếm 12% thị phần ngành kem chống nắng trên Shopee."]],"col":["gain market share","share of market"],"rel":["share of voice","competitor analysis"]},{"t":"share of voice","f":"SOV","p":"n","vi":"thị phần thảo luận","d":"Mức độ thương hiệu được nhắc đến hoặc xuất hiện so với đối thủ trên truyền thông, mạng xã hội, quảng cáo.","c":"Đo hiệu quả truyền thông.","ex":[["Our share of voice on TikTok doubled during the campaign.","Thị phần thảo luận trên TikTok tăng gấp đôi trong chiến dịch."]],"col":["SOV","social listening"],"rel":["market share","brand awareness"]},{"t":"go-to-market","f":"GTM","p":"n","vi":"chiến lược đưa sản phẩm ra thị trường","d":"Kế hoạch ra mắt và bán một sản phẩm: khách mục tiêu, kênh, giá, truyền thông, thời điểm.","c":"Ra mắt sản phẩm mới.","ex":[["Live commerce is the core of our go-to-market plan.","Bán qua live là trung tâm kế hoạch ra mắt."]],"col":["GTM strategy","GTM plan"],"rel":["product launch","marketing mix"]},{"t":"product launch","p":"n","vi":"ra mắt sản phẩm","d":"Sự kiện và chiến dịch giới thiệu sản phẩm mới ra thị trường.","c":"Lên kế hoạch, live ra mắt.","ex":[["The product launch live will feature two KOLs.","Phiên live ra mắt sẽ có hai KOL."]],"col":["launch event","soft launch","launch date"],"rel":["go-to-market","pre-sale"]},{"t":"always-on","p":"adj","vi":"chạy đều đặn quanh năm","d":"Hoạt động marketing duy trì liên tục (nội dung, quảng cáo, live hằng ngày), khác với campaign có thời hạn.","c":"Phân bổ ngân sách.","ex":[["70% of the budget goes to always-on activities.","70% ngân sách dành cho hoạt động chạy đều."]],"col":["always-on content","BAU (business as usual)"],"rel":["campaign","content calendar"]},{"t":"campaign","p":"n","vi":"chiến dịch","d":"Chuỗi hoạt động marketing có mục tiêu, thông điệp và thời gian cụ thể.","c":"Lập kế hoạch, báo cáo.","ex":[["The Tet campaign runs from January 5 to February 10.","Chiến dịch Tết chạy từ 5/1 đến 10/2."]],"col":["launch a campaign","campaign period","campaign recap"],"rel":["always-on","IMC","mega sale"]},{"t":"seasonality","p":"n","vi":"tính mùa vụ","d":"Nhu cầu thay đổi theo mùa hoặc dịp: kem chống nắng bán mạnh mùa hè, quà tặng tăng dịp lễ.","c":"Dự báo, kế hoạch hàng hóa.","ex":[["Because of seasonality, Q4 GMV is usually double Q2.","Do tính mùa vụ, GMV quý 4 thường gấp đôi quý 2."]],"col":["seasonal demand","peak season","low season"],"rel":["forecast","campaign calendar"]},{"t":"marketing plan","p":"n","vi":"kế hoạch marketing","d":"Tài liệu nêu mục tiêu, đối tượng, kênh, ngân sách, lịch hoạt động trong một kỳ.","ex":[["The Q4 marketing plan focuses on live and KOC.","Kế hoạch marketing quý 4 tập trung vào live và KOC."]],"c":"Lập kế hoạch.","col":["annual plan","marketing strategy"],"rel":["campaign","budget allocation"]},{"t":"marketing objective","p":"n","vi":"mục tiêu marketing","d":"Kết quả cần đạt, nên cụ thể và đo được (theo SMART).","ex":[["Our marketing objective is 20% more new customers.","Mục tiêu marketing là tăng 20% khách mới."]],"c":"Lập kế hoạch.","col":["SMART goals"],"rel":["KPI","OKR"]},{"t":"SMART","p":"abbr","vi":"mục tiêu SMART","d":"Tiêu chí đặt mục tiêu: Specific (cụ thể), Measurable (đo được), Achievable (khả thi), Relevant (liên quan), Time-bound (có thời hạn).","ex":[["Make the goal SMART: 1 billion GMV from live by December 31.","Đặt mục tiêu theo SMART: 1 tỷ GMV từ live trước 31/12."]],"c":"Đặt mục tiêu.","col":["SMART goals"],"rel":["marketing objective"]},{"t":"brand equity","p":"n","vi":"giá trị thương hiệu","d":"Giá trị tăng thêm mà tên thương hiệu mang lại so với sản phẩm vô danh.","ex":[["Deep discounts can damage brand equity.","Giảm giá quá sâu có thể làm tổn hại giá trị thương hiệu."]],"c":"Chiến lược thương hiệu.","col":["build brand equity"],"rel":["brand awareness","positioning"]},{"t":"brand perception","p":"n","vi":"cảm nhận về thương hiệu","d":"Cách khách hàng nghĩ và cảm nhận về thương hiệu.","ex":[["The live tone should match the premium brand perception.","Giọng live nên hợp với cảm nhận cao cấp về thương hiệu."]],"c":"Nghiên cứu, truyền thông.","col":["brand image"],"rel":["brand equity"]},{"t":"brand recall","p":"n","vi":"khả năng nhớ thương hiệu","d":"Khách tự nhớ ra thương hiệu khi nghĩ tới một ngành hàng.","ex":[["Our jingle improved brand recall.","Đoạn nhạc hiệu giúp tăng khả năng nhớ thương hiệu."]],"c":"Đo hiệu quả truyền thông.","col":["unaided recall","top of mind"],"rel":["brand awareness"]},{"t":"top of mind","p":"adj","vi":"nghĩ đến đầu tiên","d":"Thương hiệu được nghĩ tới đầu tiên trong ngành hàng.","ex":[["We want to be top of mind for sunscreen.","Mình muốn là thương hiệu được nghĩ tới đầu tiên khi nói về kem chống nắng."]],"c":"Mục tiêu truyền thông.","col":["top-of-mind awareness"],"rel":["brand recall"]},{"t":"mass market","p":"n","vi":"thị trường đại chúng","d":"Phân khúc rộng, giá phổ thông. Ngược lại là niche market (thị trường ngách) hoặc premium.","ex":[["Live commerce works well for mass market brands.","Bán qua live rất hợp với thương hiệu đại chúng."]],"c":"Định vị.","col":["mass brand"],"rel":["niche market","price tier"]},{"t":"niche market","p":"n","vi":"thị trường ngách","d":"Phân khúc nhỏ, nhu cầu đặc thù.","ex":[["Vegan skincare is still a niche market here.","Mỹ phẩm thuần chay vẫn là thị trường ngách ở đây."]],"c":"Định vị.","col":["niche","specialist"],"rel":["mass market"]},{"t":"early adopter","p":"n","vi":"người dùng sớm","d":"Người thích dùng thử sản phẩm mới đầu tiên.","ex":[["Target early adopters for the launch live.","Nhắm người dùng sớm cho phiên live ra mắt."]],"c":"Ra mắt sản phẩm.","col":["innovator"],"rel":["product launch"]},{"t":"demand generation","p":"n","vi":"tạo nhu cầu","d":"Hoạt động khiến người chưa biết hoặc chưa có nhu cầu bắt đầu quan tâm.","ex":[["Short videos handle demand generation, lives handle conversion.","Video ngắn tạo nhu cầu, live lo chuyển đổi."]],"c":"Chiến lược phễu.","col":["demand gen"],"rel":["funnel","brand awareness"]},{"t":"performance marketing","p":"n","vi":"marketing hiệu suất","d":"Marketing đo lường bằng kết quả cụ thể (đơn, doanh thu) và tối ưu liên tục, chủ yếu quảng cáo số.","ex":[["Performance marketing owns ROAS targets.","Team marketing hiệu suất chịu trách nhiệm chỉ tiêu ROAS."]],"c":"Mô tả vai trò.","col":["performance marketer"],"rel":["paid ads","ROAS"]},{"t":"brand marketing","p":"n","vi":"marketing thương hiệu","d":"Marketing xây dựng nhận biết và cảm xúc dài hạn với thương hiệu.","ex":[["Brand marketing and performance marketing need to work together.","Marketing thương hiệu và hiệu suất cần phối hợp."]],"c":"Mô tả vai trò.","col":["brand building"],"rel":["brand awareness"]},{"t":"trade marketing","p":"n","vi":"marketing thương mại","d":"Marketing nhắm vào kênh bán (đại lý, sàn, cửa hàng): trưng bày, khuyến mãi tại điểm bán, chính sách kênh.","ex":[["Trade marketing negotiates banner slots with marketplaces.","Team trade marketing đàm phán vị trí banner với sàn."]],"c":"Brand làm việc với sàn và nhà phân phối.","col":["channel marketing"],"rel":["campaign nomination"]},{"t":"growth hacking","p":"n","vi":"tăng trưởng nhanh chi phí thấp","d":"Thử nghiệm nhanh nhiều cách sáng tạo, chi phí thấp để tăng trưởng.","ex":[["Referral codes were our best growth hack.","Mã giới thiệu là chiêu tăng trưởng hiệu quả nhất."]],"c":"Khởi nghiệp, thử nghiệm.","col":["growth hack"],"rel":["referral program","A/B test"]},{"t":"marketing channel","p":"n","vi":"kênh marketing","d":"Nơi tiếp cận khách: mạng xã hội, sàn, email, KOL, quảng cáo ngoài trời.","ex":[["TikTok is our main marketing channel.","TikTok là kênh marketing chính."]],"c":"Lập kế hoạch.","col":["channel mix","owned, paid, earned"],"rel":["IMC"]},{"t":"owned media","p":"n","vi":"kênh sở hữu","d":"Kênh do brand sở hữu: fanpage, website, tài khoản TikTok, Zalo OA.","ex":[["Grow owned media so we rely less on ads.","Phát triển kênh sở hữu để bớt phụ thuộc quảng cáo."]],"c":"Phân loại truyền thông.","col":["owned channels"],"rel":["paid media","earned media"]},{"t":"paid media","p":"n","vi":"kênh trả phí","d":"Truyền thông phải trả tiền: quảng cáo, booking KOL.","ex":[["Paid media brings fast but short-term results.","Kênh trả phí mang lại kết quả nhanh nhưng ngắn hạn."]],"c":"Phân loại truyền thông.","col":["paid channels"],"rel":["owned media","earned media"]},{"t":"earned media","p":"n","vi":"truyền thông lan tỏa tự nhiên","d":"Truyền thông có được miễn phí: báo chí đưa tin, khách review, chia sẻ.","ex":[["The viral review gave us huge earned media.","Bài review viral mang lại truyền thông lan tỏa rất lớn."]],"c":"Phân loại truyền thông.","col":["PR","word of mouth"],"rel":["owned media","paid media"]},{"t":"PR","p":"abbr","vi":"quan hệ công chúng","d":"Hoạt động xây dựng hình ảnh qua báo chí, sự kiện, quan hệ cộng đồng.","ex":[["PR will handle the media invitation.","Bên PR sẽ lo việc mời báo chí."]],"f":"Public Relations","c":"Truyền thông.","col":["press release","media coverage"],"rel":["earned media"]},{"t":"press release","p":"n","vi":"thông cáo báo chí","d":"Văn bản chính thức gửi báo chí thông báo tin của doanh nghiệp.","ex":[["Send the press release on launch day.","Gửi thông cáo báo chí vào ngày ra mắt."]],"c":"Ra mắt, sự kiện.","col":["news release"],"rel":["PR"]},{"t":"crisis communication","p":"n","vi":"truyền thông xử lý khủng hoảng","d":"Cách phản hồi công khai khi có sự cố ảnh hưởng uy tín.","ex":[["Prepare a crisis communication plan for product recalls.","Chuẩn bị kế hoạch truyền thông khủng hoảng cho trường hợp thu hồi sản phẩm."]],"c":"Xử lý khủng hoảng.","col":["PR crisis","holding statement"],"rel":["recall","PR"]},{"t":"social listening","p":"n","vi":"lắng nghe mạng xã hội","d":"Theo dõi những gì mọi người nói về thương hiệu, đối thủ, ngành trên mạng.","ex":[["Social listening picked up complaints about the new scent.","Lắng nghe mạng xã hội phát hiện phàn nàn về mùi hương mới."]],"c":"Nghiên cứu, quản lý khủng hoảng.","col":["sentiment analysis","mentions"],"rel":["share of voice"]},{"t":"sentiment","p":"n","vi":"cảm xúc (tích cực, tiêu cực)","d":"Thái độ chung trong bình luận, đánh giá về thương hiệu.","ex":[["Overall sentiment after the live was positive.","Cảm xúc chung sau live là tích cực."]],"c":"Phân tích mạng xã hội.","col":["positive sentiment","negative sentiment"],"rel":["social listening"]},{"t":"consumer behavior","p":"n","vi":"hành vi người tiêu dùng","d":"Cách người mua tìm hiểu, lựa chọn, mua và dùng sản phẩm.","ex":[["Live shopping has changed consumer behavior in Vietnam.","Mua qua live đã thay đổi hành vi người tiêu dùng Việt Nam."]],"c":"Nghiên cứu, chiến lược.","col":["buying behavior","purchase journey"],"rel":["customer journey"]},{"t":"purchase intent","p":"n","vi":"ý định mua","d":"Mức độ khách sẵn sàng mua.","ex":[["Questions about size show strong purchase intent.","Câu hỏi về size cho thấy ý định mua rõ."]],"c":"Phân tích, nhắm quảng cáo.","col":["buying intent","high intent"],"rel":["search intent"]},{"t":"pain-gain","p":"n","vi":"nỗi đau và lợi ích","d":"Khung phân tích khách: điều khách muốn tránh (pain) và điều khách muốn đạt (gain).","ex":[["List the pains and gains for this persona.","Liệt kê nỗi đau và lợi ích cho chân dung này."]],"c":"Thiết kế thông điệp.","col":["value proposition canvas"],"rel":["pain point","benefit"]},{"t":"anchoring effect","p":"n","vi":"hiệu ứng mỏ neo","d":"Con số đầu tiên thấy được ảnh hưởng tới cách đánh giá các con số sau.","ex":[["The anchoring effect makes 299k feel cheap after 599k.","Hiệu ứng mỏ neo làm 299k có vẻ rẻ sau 599k."]],"c":"Tâm lý định giá.","col":["anchor"],"rel":["price anchoring"]},{"t":"decoy effect","p":"n","vi":"hiệu ứng chim mồi","d":"Thêm một lựa chọn kém hấp dẫn để lựa chọn mục tiêu trông tốt hơn.","ex":[["The medium size works as a decoy for the large.","Size vừa đóng vai chim mồi cho size lớn."]],"c":"Thiết kế gói, combo.","col":["decoy pricing"],"rel":["price tier"]},{"t":"loss aversion","p":"n","vi":"tâm lý sợ mất","d":"Con người sợ mất hơn là thích được. “Đừng bỏ lỡ” mạnh hơn “hãy nhận”.","ex":[["'Don't lose your 50k voucher' uses loss aversion.","“Đừng để mất voucher 50k” dùng tâm lý sợ mất."]],"c":"Viết thông điệp.","col":["fear of loss"],"rel":["FOMO"]},{"t":"reciprocity","p":"n","vi":"nguyên tắc có qua có lại","d":"Khi được cho trước, người ta có xu hướng đáp lại. Tặng mẫu thử, mẹo miễn phí tạo thiện cảm mua.","ex":[["Free tips in the live build reciprocity.","Chia sẻ mẹo miễn phí trong live tạo tâm lý có qua có lại."]],"c":"Tâm lý bán hàng.","col":["reciprocate"],"rel":["gifting"]},{"t":"bandwagon effect","p":"n","vi":"hiệu ứng đám đông","d":"Người ta làm theo vì thấy nhiều người làm.","ex":[["'5,000 people bought this today' triggers the bandwagon effect.","“5.000 người mua hôm nay” kích hoạt hiệu ứng đám đông."]],"c":"Tâm lý mua.","col":["herd behavior"],"rel":["social proof"]},{"t":"authority bias","p":"n","vi":"thiên kiến uy tín","d":"Người ta tin hơn khi người nói là chuyên gia hoặc người có thẩm quyền.","ex":[["A pharmacist co-host uses authority bias.","Co-host là dược sĩ tận dụng thiên kiến uy tín."]],"c":"Chọn người nói, nội dung.","col":["expert endorsement"],"rel":["testimonial","KOL"]},{"t":"mere exposure effect","p":"n","vi":"hiệu ứng quen thuộc","d":"Càng thấy nhiều lần thì càng thích và tin. Lý do nên xuất hiện đều đặn.","ex":[["Daily lives benefit from the mere exposure effect.","Live hằng ngày hưởng lợi từ hiệu ứng quen thuộc."]],"c":"Chiến lược nội dung.","col":["familiarity"],"rel":["consistency","frequency"]},{"t":"paradox of choice","p":"n","vi":"nghịch lý lựa chọn","d":"Quá nhiều lựa chọn khiến người ta khó quyết và ít mua hơn.","ex":[["Show three options, not twelve, to avoid the paradox of choice.","Đưa ba lựa chọn thay vì mười hai để tránh nghịch lý lựa chọn."]],"c":"Thiết kế lineup.","col":["choice overload"],"rel":["decision fatigue"]},{"t":"instant gratification","p":"n","vi":"thỏa mãn tức thì","d":"Mong muốn có kết quả ngay. Giao nhanh và deal tức thì đáp ứng nhu cầu này.","ex":[["Same-day delivery appeals to instant gratification.","Giao trong ngày đáp ứng mong muốn thỏa mãn tức thì."]],"c":"Hành vi mua.","col":["immediate reward"],"rel":["impulse buying"]},{"t":"peer influence","p":"n","vi":"ảnh hưởng từ bạn bè","d":"Quyết định mua bị tác động bởi người xung quanh.","ex":[["Peer influence is strong among Gen Z buyers.","Ảnh hưởng bạn bè rất mạnh ở người mua Gen Z."]],"c":"Hành vi mua.","col":["peer pressure"],"rel":["word of mouth"]},{"t":"Gen Z","p":"n","vi":"thế hệ Z","d":"Người sinh khoảng 1997 đến 2012. Millennials (Gen Y) sinh khoảng 1981 đến 1996.","ex":[["Gen Z prefers authentic, unfiltered content.","Gen Z thích nội dung chân thật, không chỉnh sửa."]],"c":"Mô tả khách mục tiêu.","col":["millennials","Gen Alpha"],"rel":["target audience"]},{"t":"market research","p":"n","vi":"nghiên cứu thị trường","d":"Thu thập và phân tích thông tin về thị trường, khách hàng, đối thủ.","ex":[["Do market research before entering the pet category.","Nghiên cứu thị trường trước khi vào ngành thú cưng."]],"c":"Lập chiến lược.","col":["primary research","secondary research"],"rel":["survey","competitor analysis"]},{"t":"focus group","p":"n","vi":"nhóm thảo luận","d":"Buổi trò chuyện với nhóm nhỏ khách hàng để lấy ý kiến sâu.","ex":[["The focus group disliked the new scent.","Nhóm thảo luận không thích mùi hương mới."]],"c":"Nghiên cứu.","col":["qualitative research"],"rel":["market research"]},{"t":"qualitative","p":"adj","vi":"định tính","d":"Dữ liệu dạng ý kiến, cảm nhận, lý do. Định lượng là quantitative (số liệu, con số).","ex":[["Combine qualitative feedback with quantitative data.","Kết hợp phản hồi định tính với dữ liệu định lượng."]],"c":"Nghiên cứu.","col":["quantitative"],"rel":["focus group","survey"]},{"t":"sample size","p":"n","vi":"cỡ mẫu","d":"Số người hoặc số đơn vị dữ liệu trong khảo sát, thử nghiệm.","ex":[["The sample size is too small to conclude.","Cỡ mẫu quá nhỏ để kết luận."]],"c":"Đánh giá độ tin cậy kết quả.","col":["statistically significant"],"rel":["A/B test"]},{"t":"brand story","p":"n","vi":"câu chuyện thương hiệu","d":"Câu chuyện về nguồn gốc, sứ mệnh, giá trị của thương hiệu.","ex":[["Open the live with a 1-minute brand story.","Mở live bằng câu chuyện thương hiệu 1 phút."]],"c":"Nội dung, kịch bản.","col":["founder story"],"rel":["storytelling"]},{"t":"brand values","p":"n","vi":"giá trị thương hiệu","d":"Những nguyên tắc thương hiệu theo đuổi, ví dụ bền vững, minh bạch.","ex":[["Our brand values are honesty and sustainability.","Giá trị thương hiệu là trung thực và bền vững."]],"c":"Định vị.","col":["mission","vision"],"rel":["brand story"]},{"t":"mission statement","p":"n","vi":"tuyên bố sứ mệnh","d":"Câu ngắn nêu mục đích tồn tại của doanh nghiệp.","ex":[["Our mission statement is printed on every box.","Sứ mệnh được in trên mọi hộp."]],"c":"Thương hiệu.","col":["vision statement"],"rel":["brand values"]},{"t":"rebranding","p":"n","vi":"tái định vị thương hiệu","d":"Thay đổi tên, logo, hình ảnh hoặc định vị.","ex":[["The rebranding launches with a big live event.","Đợt tái định vị ra mắt bằng một sự kiện live lớn."]],"c":"Chiến lược.","col":["rebrand","brand refresh"],"rel":["brand identity"]},{"t":"co-branding","p":"n","vi":"hợp tác thương hiệu","d":"Hai thương hiệu cùng làm sản phẩm hoặc chiến dịch.","ex":[["The co-branding with a coffee chain drew new customers.","Hợp tác với chuỗi cà phê thu hút khách mới."]],"c":"Hợp tác.","col":["brand collab"],"rel":["collaboration product"]}]},{"id":"ads","code":"ADS","group":"Marketing","en":"Performance Advertising","vi":"Quảng cáo hiệu suất","intro":"Từ vựng chạy quảng cáo trên TikTok, Meta, sàn: cấu trúc chiến dịch, đối tượng, giá thầu, đo lường và tối ưu.","terms":[{"t":"paid ads","p":"n","vi":"quảng cáo trả phí","d":"Quảng cáo phải trả tiền để hiển thị. Đối lập với organic.","c":"Phân bổ ngân sách, báo cáo nguồn traffic.","ex":[["We'll use paid ads to push the first 30 minutes of the live.","Dùng quảng cáo trả phí để đẩy 30 phút đầu live."]],"col":["paid media","run ads","ad spend"],"rel":["organic traffic","ad budget"]},{"t":"ad account","p":"n","vi":"tài khoản quảng cáo","d":"Tài khoản dùng để tạo và thanh toán quảng cáo. Có thể bị khóa nếu vi phạm chính sách.","c":"Quản lý quyền truy cập, thanh toán.","ex":[["Please give me access to the brand's ad account.","Cấp quyền tài khoản quảng cáo của brand cho mình nhé."]],"col":["ads manager","business center","ad account banned"],"rel":["campaign structure"]},{"t":"campaign structure","p":"n","vi":"cấu trúc chiến dịch quảng cáo","d":"Ba cấp: Campaign (chọn mục tiêu, ngân sách) → Ad group / Ad set (đối tượng, vị trí, giá thầu) → Ad (mẫu quảng cáo cụ thể).","c":"Thiết lập và tối ưu quảng cáo.","ex":[["Keep the campaign structure simple: one campaign, three ad groups.","Giữ cấu trúc đơn giản: một chiến dịch, ba nhóm quảng cáo."]],"col":["campaign, ad group, ad","ad set"],"rel":["objective","targeting"]},{"t":"objective","p":"n","vi":"mục tiêu quảng cáo","d":"Kết quả muốn nền tảng tối ưu: reach, traffic, video views, conversions, product sales, live views. Chọn sai mục tiêu thì nền tảng tìm sai người.","c":"Tạo chiến dịch.","ex":[["Use the purchase objective, not traffic, for the live.","Dùng mục tiêu mua hàng chứ không phải lưu lượng cho phiên live."]],"col":["campaign objective","optimization goal"],"rel":["campaign structure","conversion event"]},{"t":"targeting","p":"n","vi":"nhắm mục tiêu","d":"Chọn ai sẽ thấy quảng cáo theo tuổi, giới tính, vị trí, sở thích, hành vi.","c":"Thiết lập nhóm quảng cáo.","ex":[["Narrow the targeting to women 20 to 35 in Hanoi and HCMC.","Thu hẹp nhắm mục tiêu còn nữ 20 đến 35 ở Hà Nội và TP.HCM."]],"col":["audience targeting","demographic targeting"],"rel":["broad targeting","interest targeting","custom audience"]},{"t":"broad targeting","p":"n","vi":"nhắm mục tiêu rộng","d":"Hầu như không giới hạn đối tượng, để thuật toán tự tìm người dễ mua. Thường hiệu quả khi tài khoản đã có nhiều dữ liệu chuyển đổi.","c":"Chiến lược quảng cáo.","ex":[["Broad targeting performed better than interest targeting this month.","Tháng này nhắm rộng hiệu quả hơn nhắm theo sở thích."]],"col":["go broad","open targeting"],"rel":["targeting","learning phase"]},{"t":"interest targeting","p":"n","vi":"nhắm theo sở thích","d":"Nhắm người dùng có sở thích liên quan, ví dụ làm đẹp, chăm sóc da, thời trang.","c":"Thiết lập đối tượng.","ex":[["Test interest targeting with skincare and K-beauty.","Thử nhắm theo sở thích chăm sóc da và mỹ phẩm Hàn."]],"col":["interest-based","behavior targeting"],"rel":["targeting","broad targeting"]},{"t":"custom audience","p":"n","vi":"đối tượng tùy chỉnh","d":"Tệp đối tượng tạo từ dữ liệu của mình: người đã xem video, đã vào phòng live, đã mua, danh sách số điện thoại.","c":"Retargeting, tạo lookalike.","ex":[["Create a custom audience of people who watched the live for 1 minute.","Tạo tệp những người đã xem live 1 phút."]],"col":["engagement audience","customer list"],"rel":["retargeting","lookalike audience"]},{"t":"lookalike audience","p":"n","vi":"đối tượng tương tự","d":"Nền tảng tìm người mới có đặc điểm giống tệp nguồn (ví dụ người đã mua), dùng để tìm khách mới chất lượng.","c":"Mở rộng tệp khách.","ex":[["Build a lookalike audience from our top 5,000 buyers.","Tạo tệp tương tự từ 5.000 khách mua nhiều nhất."]],"col":["lookalike 1%","seed audience","similar audience"],"rel":["custom audience","scaling"]},{"t":"retargeting","p":"n","vi":"quảng cáo bám đuổi, nhắm lại","d":"Chạy quảng cáo cho người đã tương tác (xem video, vào live, thêm giỏ) nhưng chưa mua. Còn gọi là remarketing.","c":"Tăng chuyển đổi.","ex":[["Set up retargeting for people who added to cart but didn't buy.","Cài quảng cáo nhắm lại người thêm giỏ chưa mua."]],"col":["remarketing","retarget"],"rel":["custom audience","cart abandonment"]},{"t":"pixel","p":"n","vi":"pixel theo dõi","d":"Đoạn mã gắn trên website giúp nền tảng quảng cáo ghi nhận hành vi (xem, thêm giỏ, mua) để đo lường và tối ưu.","c":"Cài đặt đo lường cho website.","ex":[["The pixel isn't firing on the checkout page.","Pixel không ghi nhận ở trang thanh toán."]],"col":["install the pixel","pixel event","Events API"],"rel":["conversion event","attribution"]},{"t":"conversion event","p":"n","vi":"sự kiện chuyển đổi","d":"Hành động được ghi nhận là chuyển đổi: thêm giỏ, bắt đầu thanh toán, mua hàng.","c":"Thiết lập tối ưu quảng cáo.","ex":[["Optimize for the purchase conversion event.","Tối ưu theo sự kiện mua hàng."]],"col":["optimization event","purchase event"],"rel":["pixel","objective"]},{"t":"attribution","p":"n","vi":"phân bổ chuyển đổi","d":"Cách xác định đơn hàng được ghi công cho quảng cáo hoặc kênh nào. Mô hình phổ biến: last-click (lần nhấp cuối).","c":"Đọc báo cáo, giải thích chênh lệch số liệu.","ex":[["Ads Manager and seller center show different numbers because of attribution.","Trình quản lý quảng cáo và kênh người bán ra số khác nhau do cách phân bổ."]],"col":["attribution model","last-click attribution"],"rel":["attribution window","pixel"]},{"t":"attribution window","p":"n","vi":"khung thời gian ghi nhận","d":"Khoảng thời gian sau khi xem hoặc nhấp quảng cáo mà đơn mua vẫn được tính cho quảng cáo, ví dụ 7 ngày sau nhấp, 1 ngày sau xem.","c":"Đọc báo cáo.","ex":[["We use a 7-day click, 1-day view attribution window.","Dùng khung ghi nhận 7 ngày sau nhấp, 1 ngày sau xem."]],"col":["click-through window","view-through window"],"rel":["attribution"]},{"t":"bid strategy","p":"n","vi":"chiến lược giá thầu","d":"Cách đặt giá trong đấu giá quảng cáo: lowest cost (chi phí thấp nhất), cost cap (giới hạn chi phí), ROAS target (mục tiêu ROAS).","c":"Thiết lập, tối ưu chi phí.","ex":[["Switch to cost cap to control CPA.","Chuyển sang giới hạn chi phí để kiểm soát CPA."]],"col":["bidding","cost cap","lowest cost","bid"],"rel":["CPA","ROAS"]},{"t":"daily budget","p":"n","vi":"ngân sách hằng ngày","d":"Số tiền tối đa chi mỗi ngày cho chiến dịch hoặc nhóm. Ngược lại là lifetime budget (ngân sách trọn đời).","c":"Thiết lập chiến dịch.","ex":[["Raise the daily budget by 20% if ROAS stays above 4.","Tăng ngân sách ngày 20% nếu ROAS giữ trên 4."]],"col":["lifetime budget","budget cap"],"rel":["ad budget","scaling"]},{"t":"ad budget","p":"n","vi":"ngân sách quảng cáo","d":"Tổng số tiền dự kiến chi cho quảng cáo trong một kỳ hoặc chiến dịch.","c":"Xin duyệt, phân bổ.","ex":[["The ad budget for this live is 10 million VND.","Ngân sách quảng cáo phiên này là 10 triệu."]],"col":["ad spend","media budget"],"rel":["daily budget","budget"]},{"t":"impression","p":"n","vi":"lượt hiển thị","d":"Số lần quảng cáo hoặc nội dung được hiển thị. Một người có thể tạo nhiều lượt.","c":"Báo cáo, tính CPM.","ex":[["We got 500,000 impressions but only 200,000 reach.","Có 500.000 lượt hiển thị nhưng chỉ 200.000 người tiếp cận."]],"col":["impressions","served"],"rel":["reach","CPM","frequency"]},{"t":"reach","p":"n, v","vi":"lượt tiếp cận, số người tiếp cận","d":"Số người khác nhau đã thấy nội dung hoặc quảng cáo.","c":"Báo cáo độ phủ.","ex":[["The video reached 200,000 people.","Video tiếp cận 200.000 người."]],"col":["organic reach","paid reach"],"rel":["impression","frequency"]},{"t":"frequency","p":"n","vi":"tần suất","d":"Trung bình mỗi người thấy quảng cáo bao nhiêu lần. Tần suất quá cao gây nhàm chán.","c":"Tối ưu quảng cáo.","fm":"Tần suất = lượt hiển thị ÷ lượt tiếp cận","ex":[["Frequency is 6, people are getting tired of this ad.","Tần suất là 6, người xem đã chán quảng cáo này."]],"col":["high frequency","frequency cap"],"rel":["ad fatigue","reach"]},{"t":"CPM","f":"Cost Per Mille","p":"abbr","vi":"chi phí cho 1.000 lượt hiển thị","d":"Số tiền trả cho mỗi 1.000 lần quảng cáo được hiển thị. Mille là nghìn (tiếng Latin).","c":"So sánh giá thầu giữa các ngày, nền tảng.","fm":"CPM = chi phí ÷ lượt hiển thị × 1.000","ex":[["CPM is higher during mega sale days.","CPM cao hơn trong ngày siêu sale."]],"col":["rising CPM","cost per thousand"],"rel":["impression","CPC"]},{"t":"CPC","f":"Cost Per Click","p":"abbr","vi":"chi phí mỗi lượt nhấp","d":"Số tiền trả cho mỗi lần người dùng nhấp vào quảng cáo.","c":"Tối ưu quảng cáo, quảng cáo tìm kiếm trên sàn.","fm":"CPC = chi phí ÷ số lượt nhấp","ex":[["We need to bring CPC down under 2,000 VND.","Cần giảm CPC xuống dưới 2.000 đồng."]],"col":["average CPC","pay per click"],"rel":["CTR","CPM"]},{"t":"CTR","f":"Click-Through Rate","p":"abbr","vi":"tỉ lệ nhấp","d":"Phần trăm người nhấp sau khi thấy. Đo độ hấp dẫn của quảng cáo, ảnh bìa, tiêu đề.","c":"Đánh giá mẫu quảng cáo, ảnh sản phẩm.","fm":"CTR = lượt nhấp ÷ lượt hiển thị × 100%","ex":[["The new creative has a CTR of 2.5%, twice the old one.","Mẫu mới có CTR 2,5%, gấp đôi mẫu cũ."]],"col":["improve CTR","low CTR"],"rel":["CPC","creative","main image"]},{"t":"CPA","f":"Cost Per Acquisition / Cost Per Action","p":"abbr","vi":"chi phí mỗi chuyển đổi","d":"Chi phí quảng cáo cho mỗi hành động mục tiêu (thường là một đơn mua).","c":"Đánh giá hiệu quả quảng cáo.","fm":"CPA = chi phí ÷ số chuyển đổi","ex":[["Our CPA is 45k, while AOV is 300k.","CPA là 45k, trong khi AOV là 300k."]],"col":["target CPA","cost per purchase"],"rel":["CAC","ROAS","bid strategy"]},{"t":"ROAS","f":"Return On Ad Spend","p":"abbr","vi":"doanh thu trên chi phí quảng cáo","d":"Doanh thu từ quảng cáo chia cho chi phí quảng cáo. ROAS 5 nghĩa là chi 1 đồng thu 5 đồng doanh thu (chưa phải lợi nhuận).","c":"Chỉ số chính đánh giá quảng cáo bán hàng.","fm":"ROAS = doanh thu từ quảng cáo ÷ chi phí quảng cáo","ex":[["Our ROAS is 5, so every 1 VND spent brings 5 VND in revenue.","ROAS là 5, cứ chi 1 đồng thu về 5 đồng."],["ROAS dropped below break-even after 10 PM.","ROAS tụt dưới mức hòa vốn sau 10 giờ."]],"col":["target ROAS","improve ROAS","blended ROAS"],"rel":["ROI","break-even","ACoS"]},{"t":"learning phase","p":"n","vi":"giai đoạn học","d":"Giai đoạn đầu sau khi tạo hoặc sửa lớn quảng cáo, thuật toán đang thử nghiệm để tìm người phù hợp. Hiệu quả thường dao động, không nên chỉnh liên tục.","c":"Tối ưu quảng cáo.","ex":[["Don't touch the campaign, it's still in the learning phase.","Đừng sửa chiến dịch, nó còn trong giai đoạn học."]],"col":["exit learning","learning limited"],"rel":["scaling","broad targeting"]},{"t":"creative","p":"n","vi":"mẫu quảng cáo, nội dung sáng tạo","d":"Phần hình ảnh, video, chữ của quảng cáo. Trong ngành quảng cáo, creative là danh từ đếm được.","c":"Sản xuất và thử nghiệm quảng cáo.","ex":[["We need five new creatives for next week.","Cần năm mẫu quảng cáo mới cho tuần sau."]],"col":["ad creative","creative testing","creative refresh"],"rel":["ad fatigue","A/B test","CTR"]},{"t":"ad fatigue","p":"n","vi":"quảng cáo bị nhàm","d":"Người xem thấy quảng cáo quá nhiều lần nên giảm phản ứng: CTR giảm, chi phí tăng. Còn gọi là creative fatigue.","c":"Quyết định thay mẫu quảng cáo.","ex":[["CTR dropped 40%, it's ad fatigue, refresh the creative.","CTR giảm 40%, quảng cáo bị nhàm rồi, thay mẫu mới."]],"col":["creative fatigue","refresh creatives"],"rel":["frequency","creative"]},{"t":"scaling","p":"n","vi":"mở rộng quy mô quảng cáo","d":"Tăng ngân sách hoặc mở rộng đối tượng cho quảng cáo đang hiệu quả. Vertical scaling là tăng ngân sách; horizontal scaling là nhân bản sang đối tượng mới.","c":"Tối ưu tăng trưởng.","ex":[["We're scaling the winning ad group by 20% a day.","Đang tăng ngân sách nhóm thắng 20% mỗi ngày."]],"col":["scale up","vertical scaling","horizontal scaling"],"rel":["daily budget","lookalike audience"]},{"t":"A/B test","p":"n","vi":"thử nghiệm A/B","d":"So sánh hai phiên bản (A và B) chỉ khác một yếu tố để biết cái nào hiệu quả hơn. Còn gọi là split test.","c":"Tối ưu quảng cáo, nội dung, kịch bản.","ex":[["Let's A/B test two hooks for the live ad.","Thử A/B hai câu mở đầu cho quảng cáo live."]],"col":["split test","variant A / B","test one variable"],"rel":["creative","CTR"]},{"t":"LIVE Shopping Ads","f":"LSA","p":"n","vi":"quảng cáo phòng live bán hàng","d":"Loại quảng cáo TikTok đưa người xem thẳng vào phòng live đang bán hàng.","c":"Kéo traffic trả phí vào live.","ex":[["Start LIVE Shopping Ads 15 minutes before prime time.","Bật quảng cáo phòng live 15 phút trước giờ vàng."]],"col":["live ads","promote live"],"rel":["paid traffic","GMV Max"]},{"t":"GMV Max","p":"n","vi":"quảng cáo tự động tối đa GMV","d":"Loại quảng cáo tự động của TikTok Shop, hệ thống tự phân phối để tối đa doanh thu theo ROI mục tiêu. Tên gọi và cách vận hành có thể thay đổi theo thời gian.","c":"Chạy quảng cáo cho shop và live.","ex":[["Set the target ROI in GMV Max to 4.","Đặt ROI mục tiêu trong GMV Max là 4."]],"col":["target ROI","automated ads"],"rel":["LIVE Shopping Ads","ROAS"],"tip":"Tên sản phẩm quảng cáo thay đổi khá nhanh, kiểm tra trung tâm trợ giúp của nền tảng."},{"t":"search ads","p":"n","vi":"quảng cáo tìm kiếm","d":"Quảng cáo hiện khi người dùng tìm từ khóa trên sàn hoặc công cụ tìm kiếm. Đặt giá thầu theo từ khóa.","c":"Quảng cáo trên sàn.","ex":[["Bid on 'sunscreen for oily skin' in search ads.","Đặt giá thầu từ khóa “kem chống nắng da dầu” trong quảng cáo tìm kiếm."]],"col":["keyword ads","keyword bidding"],"rel":["search ranking","CPC"]},{"t":"Spark Ads","p":"n","vi":"quảng cáo bài đăng tự nhiên (TikTok)","d":"Dùng video đã đăng (của shop hoặc của creator, khi được cấp quyền bằng mã ủy quyền) làm quảng cáo, giữ nguyên lượt tương tác.","c":"Khuếch đại video KOC hiệu quả.","ex":[["Ask the creator for the Spark Ads authorization code.","Xin creator mã ủy quyền Spark Ads."]],"col":["authorization code","boost a post","whitelisting"],"rel":["usage rights","UGC"]},{"t":"ad set","p":"n","vi":"nhóm quảng cáo (Meta)","d":"Cấp giữa trong cấu trúc chiến dịch Meta, nơi chọn đối tượng, vị trí, ngân sách. TikTok gọi ad group.","ex":[["Duplicate the winning ad set with a new audience.","Nhân bản nhóm thắng với đối tượng mới."]],"c":"Thiết lập quảng cáo.","col":["ad group"],"rel":["campaign structure"]},{"t":"placement","p":"n","vi":"vị trí hiển thị","d":"Nơi quảng cáo xuất hiện: bảng tin, story, reels, tìm kiếm.","ex":[["Automatic placement usually gives the lowest CPM.","Vị trí tự động thường cho CPM thấp nhất."]],"c":"Thiết lập quảng cáo.","col":["auto placement","manual placement"],"rel":["campaign structure"]},{"t":"ad format","p":"n","vi":"định dạng quảng cáo","d":"Kiểu quảng cáo: ảnh đơn, video, băng chuyền, collection.","ex":[["Video ads perform better than single images for us.","Quảng cáo video hiệu quả hơn ảnh đơn."]],"c":"Sản xuất quảng cáo.","col":["carousel","single image","video ad"],"rel":["creative"]},{"t":"ad copy","p":"n","vi":"chữ trong quảng cáo","d":"Phần nội dung chữ của quảng cáo: tiêu đề, mô tả, CTA.","ex":[["Test two versions of the ad copy.","Thử hai phiên bản chữ quảng cáo."]],"c":"Viết quảng cáo.","col":["headline","primary text"],"rel":["copywriting","creative"]},{"t":"landing page","p":"n","vi":"trang đích","d":"Trang người dùng tới sau khi bấm quảng cáo.","ex":[["The landing page loads too slowly.","Trang đích tải quá chậm."]],"c":"Tối ưu chuyển đổi.","col":["LP","landing page conversion"],"rel":["CTR","conversion rate"]},{"t":"audience size","p":"n","vi":"quy mô đối tượng","d":"Số người ước tính có thể thấy quảng cáo với cài đặt nhắm mục tiêu hiện tại.","ex":[["The audience size is too small, broaden the targeting.","Quy mô đối tượng quá nhỏ, mở rộng nhắm mục tiêu."]],"c":"Thiết lập.","col":["potential reach"],"rel":["targeting"]},{"t":"audience overlap","p":"n","vi":"trùng lặp đối tượng","d":"Các nhóm quảng cáo nhắm cùng một nhóm người, cạnh tranh nhau và đẩy chi phí lên.","ex":[["High audience overlap is raising our CPM.","Trùng lặp đối tượng cao làm tăng CPM."]],"c":"Tối ưu tài khoản.","col":["overlap"],"rel":["targeting","CPM"]},{"t":"exclusion","p":"n","vi":"loại trừ đối tượng","d":"Không hiển thị quảng cáo cho một nhóm, ví dụ người đã mua.","ex":[["Exclude recent buyers from the acquisition campaign.","Loại trừ người mới mua khỏi chiến dịch tìm khách mới."]],"c":"Thiết lập.","col":["exclude","exclusion list"],"rel":["custom audience"]},{"t":"prospecting","p":"n","vi":"tìm khách mới","d":"Chiến dịch nhắm người chưa từng tương tác với thương hiệu. Ngược với retargeting.","ex":[["Split budget 70% prospecting, 30% retargeting.","Chia 70% tìm khách mới, 30% nhắm lại."]],"c":"Chiến lược quảng cáo.","col":["acquisition"],"rel":["retargeting"]},{"t":"cost cap","p":"n","vi":"giới hạn chi phí","d":"Chiến lược giá thầu giữ chi phí trung bình mỗi kết quả quanh mức đặt.","ex":[["Set a cost cap of 50k per purchase.","Đặt giới hạn chi phí 50k mỗi đơn."]],"c":"Thiết lập giá thầu.","col":["bid cap"],"rel":["bid strategy","CPA"]},{"t":"target ROAS","p":"n","vi":"ROAS mục tiêu","d":"Cài đặt để hệ thống tối ưu đạt ROAS mong muốn.","ex":[["Start with a target ROAS of 3 and raise it slowly.","Bắt đầu ROAS mục tiêu là 3 rồi tăng dần."]],"c":"Thiết lập giá thầu.","col":["ROAS goal","value optimization"],"rel":["ROAS","bid strategy"]},{"t":"budget pacing","p":"n","vi":"tốc độ tiêu ngân sách","d":"Cách ngân sách được tiêu dần trong ngày. Accelerated là tiêu nhanh, standard là rải đều.","ex":[["Use accelerated pacing during the live.","Dùng tiêu ngân sách nhanh trong lúc live."]],"c":"Quản lý ngân sách.","col":["spend pacing"],"rel":["daily budget"]},{"t":"overspend","p":"v, n","vi":"tiêu vượt ngân sách","d":"Chi nhiều hơn dự kiến.","ex":[["We overspent by 3 million yesterday.","Hôm qua tiêu vượt 3 triệu."]],"c":"Quản lý ngân sách.","col":["underspend"],"rel":["budget"]},{"t":"ad review","p":"n","vi":"kiểm duyệt quảng cáo","d":"Nền tảng duyệt quảng cáo trước khi chạy. Bị từ chối là rejected, disapproved.","ex":[["The ad is stuck in review.","Quảng cáo đang bị kẹt ở bước duyệt."]],"c":"Chạy quảng cáo.","col":["ad rejected","disapproved"],"rel":["ad policy"]},{"t":"ad policy","p":"n","vi":"chính sách quảng cáo","d":"Quy định nội dung quảng cáo được phép của nền tảng.","ex":[["Before-and-after images violate the ad policy.","Ảnh trước và sau vi phạm chính sách quảng cáo."]],"c":"Tuân thủ.","col":["advertising policies"],"rel":["ad review","compliance"]},{"t":"hook rate","p":"n","vi":"tỉ lệ giữ 3 giây đầu","d":"Phần trăm người xem hết 2 đến 3 giây đầu video quảng cáo. Đo sức hút của câu mở.","ex":[["The new hook rate is 35%, up from 20%.","Tỉ lệ giữ 3 giây đầu mới là 35%, tăng từ 20%."]],"c":"Đánh giá creative.","col":["thumb-stop ratio"],"rel":["hook","scroll-stopper"],"fm":"Hook rate = lượt xem 3 giây ÷ lượt hiển thị × 100%"},{"t":"hold rate","p":"n","vi":"tỉ lệ xem tiếp","d":"Phần trăm người xem tiếp sau đoạn mở, ví dụ xem tới 15 giây hoặc hết video.","ex":[["Good hook rate but poor hold rate, the middle is boring.","Mở tốt nhưng giữ kém, đoạn giữa nhàm."]],"c":"Đánh giá creative.","col":["watch-through rate"],"rel":["hook rate"]},{"t":"VTR","p":"abbr","vi":"tỉ lệ xem hết","d":"Phần trăm người xem hết video quảng cáo.","ex":[["VTR is higher for 15-second ads.","Tỉ lệ xem hết cao hơn với quảng cáo 15 giây."]],"f":"View-Through Rate","c":"Đánh giá video.","col":["completion rate"],"rel":["hold rate"]},{"t":"CPV","p":"abbr","vi":"chi phí mỗi lượt xem","d":"Chi phí cho mỗi lượt xem video.","ex":[["CPV is 150 VND for this campaign.","Chi phí mỗi lượt xem là 150 đồng."]],"f":"Cost Per View","c":"Quảng cáo video.","col":["cost per view"],"rel":["CPM"]},{"t":"blended ROAS","p":"n","vi":"ROAS tổng","d":"Tổng doanh thu mọi kênh chia tổng chi phí quảng cáo. Còn gọi MER (marketing efficiency ratio).","ex":[["Platform ROAS looks great but blended ROAS is only 3.","ROAS nền tảng đẹp nhưng ROAS tổng chỉ 3."]],"c":"Đánh giá hiệu quả tổng thể.","col":["MER"],"rel":["ROAS"]},{"t":"incrementality test","p":"n","vi":"thử nghiệm đo phần tăng thêm","d":"So sánh nhóm thấy quảng cáo và nhóm không thấy để đo doanh số thực sự do quảng cáo tạo ra.","ex":[["Run an incrementality test before doubling the budget.","Chạy thử nghiệm đo phần tăng thêm trước khi gấp đôi ngân sách."]],"c":"Đo lường nâng cao.","col":["holdout test","lift study"],"rel":["incremental sales"]},{"t":"UTM","p":"abbr","vi":"tham số UTM","d":"Đoạn gắn vào link (utm_source, utm_medium, utm_campaign) để công cụ phân tích biết người dùng đến từ đâu.","ex":[["Add UTM tags to every link in the bio.","Gắn tham số UTM vào mọi link trong tiểu sử."]],"c":"Theo dõi nguồn traffic website.","col":["UTM parameters","UTM tags"],"rel":["tracking link","attribution"]},{"t":"CAPI","p":"abbr","vi":"API chuyển đổi","d":"Cách gửi dữ liệu chuyển đổi từ máy chủ trực tiếp cho nền tảng quảng cáo, bổ sung cho pixel.","ex":[["Set up CAPI to recover lost conversions.","Cài API chuyển đổi để ghi nhận lại chuyển đổi bị mất."]],"f":"Conversions API","c":"Đo lường chính xác hơn.","col":["server-side tracking","Events API"],"rel":["pixel"]},{"t":"dayparting","p":"n","vi":"chia giờ chạy quảng cáo","d":"Chỉ chạy quảng cáo vào các khung giờ hiệu quả.","ex":[["Use dayparting to run ads only during live hours.","Chia giờ để chỉ chạy quảng cáo trong giờ live."]],"c":"Tối ưu chi phí.","col":["ad scheduling"],"rel":["budget pacing"]},{"t":"geo-targeting","p":"n","vi":"nhắm theo vị trí","d":"Hiển thị quảng cáo theo khu vực địa lý.","ex":[["Use geo-targeting for same-day delivery cities.","Nhắm theo vị trí các thành phố có giao trong ngày."]],"c":"Thiết lập.","col":["location targeting"],"rel":["targeting"]},{"t":"ad library","p":"n","vi":"thư viện quảng cáo","d":"Công cụ công khai cho xem quảng cáo đang chạy của mọi trang, ví dụ Meta Ad Library, TikTok Creative Center.","ex":[["Check competitors' ads in the ad library.","Xem quảng cáo đối thủ trong thư viện quảng cáo."]],"c":"Nghiên cứu đối thủ.","col":["Creative Center"],"rel":["competitor analysis"]},{"t":"media plan","p":"n","vi":"kế hoạch truyền thông","d":"Kế hoạch phân bổ ngân sách quảng cáo theo kênh, thời gian, mục tiêu.","ex":[["The media plan puts 60% of budget on TikTok.","Kế hoạch truyền thông dồn 60% ngân sách cho TikTok."]],"c":"Lập kế hoạch chiến dịch.","col":["media buying","media mix"],"rel":["budget allocation"]},{"t":"media buyer","p":"n","vi":"người mua quảng cáo","d":"Người lập kế hoạch và vận hành tài khoản quảng cáo.","ex":[["Our media buyer optimizes ads during the live.","Người chạy quảng cáo tối ưu trong lúc live."]],"c":"Mô tả vai trò.","col":["ads specialist"],"rel":["performance marketing"]},{"t":"ad spend","p":"n","vi":"chi tiêu quảng cáo","d":"Số tiền đã chi cho quảng cáo.","ex":[["Ad spend was 30 million yesterday.","Hôm qua chi 30 triệu cho quảng cáo."]],"c":"Báo cáo.","col":["spend","media spend"],"rel":["ad budget"]},{"t":"cost per live view","p":"n","vi":"chi phí mỗi lượt xem live","d":"Chi phí quảng cáo cho mỗi người vào phòng live.","ex":[["Cost per live view dropped to 500 VND.","Chi phí mỗi lượt vào phòng live giảm còn 500 đồng."]],"c":"Quảng cáo live.","col":["cost per viewer"],"rel":["LIVE Shopping Ads"]},{"t":"conversion rate optimization","p":"n","vi":"tối ưu tỉ lệ chuyển đổi","d":"Hoạt động cải thiện trang, nội dung để tăng tỉ lệ mua.","ex":[["CRO on the product page raised sales 18%.","Tối ưu chuyển đổi trang sản phẩm làm doanh số tăng 18%."]],"f":"CRO","c":"Website, trang sản phẩm.","col":["CRO"],"rel":["conversion rate","A/B test"]}]},{"id":"content","code":"CONTENT","group":"Marketing","en":"Content & Social Media","vi":"Nội dung và mạng xã hội","intro":"Sản xuất video ngắn, lên kế hoạch nội dung, hiểu thuật toán và các định dạng nội dung bán hàng.","terms":[{"t":"content pillar","p":"n","vi":"trụ cột nội dung","d":"Các nhóm chủ đề chính kênh đăng đều đặn, giúp nội dung nhất quán và đa dạng. Ví dụ: mẹo, review, hậu trường, khuyến mãi.","c":"Lập kế hoạch nội dung tháng.","ex":[["Our three content pillars are tips, reviews and behind the scenes.","Ba trụ cột nội dung là mẹo, review và hậu trường."]],"col":["content theme","content mix"],"rel":["content calendar"]},{"t":"content calendar","p":"n","vi":"lịch nội dung","d":"Bảng kế hoạch đăng nội dung theo ngày: chủ đề, định dạng, kênh, người phụ trách. Còn gọi là editorial calendar.","c":"Lập kế hoạch, phối hợp team.","ex":[["Add the teaser videos to the content calendar before the live.","Thêm video nhá hàng vào lịch nội dung trước live."]],"col":["editorial calendar","posting schedule"],"rel":["content pillar","always-on"]},{"t":"short-form video","p":"n","vi":"video ngắn","d":"Video dưới khoảng 60 đến 90 giây trên TikTok, Reels, Shorts. Là nguồn kéo traffic chính cho live và shop.","c":"Chiến lược nội dung.","ex":[["Post three short-form videos before every live to warm up traffic.","Đăng ba video ngắn trước mỗi live để làm nóng traffic."]],"col":["short video","Reels","Shorts"],"rel":["vertical video","scroll-stopper"]},{"t":"scroll-stopper","p":"n","vi":"khoảnh khắc làm người lướt dừng lại","d":"Hình ảnh hoặc câu mở đầu khiến người đang lướt dừng tay. Còn gọi là thumb-stopper. Chỉ số liên quan: hook rate (tỉ lệ xem qua 2 đến 3 giây đầu).","c":"Sản xuất video ngắn, quảng cáo.","ex":[["The first frame needs to be a scroll-stopper.","Khung hình đầu phải khiến người lướt dừng lại."]],"col":["thumb-stopper","hook rate","first 3 seconds"],"rel":["hook","short-form video"]},{"t":"caption","p":"n","vi":"chú thích bài đăng / phụ đề","d":"Đoạn chữ đi kèm bài đăng. Cũng dùng để chỉ phụ đề trên video (captions).","c":"Viết nội dung.","ex":[["Keep the caption short and add a clear CTA.","Viết chú thích ngắn và có lời kêu gọi rõ."]],"col":["write a caption","auto captions"],"rel":["hashtag","subtitles"]},{"t":"hashtag","p":"n","vi":"thẻ hashtag","d":"Từ khóa có dấu #, giúp phân loại nội dung và hỗ trợ tìm kiếm. Brand hay tạo hashtag riêng cho chiến dịch.","c":"Đăng nội dung, chiến dịch.","ex":[["Use the campaign hashtag in every post.","Dùng hashtag chiến dịch trong mọi bài đăng."]],"col":["branded hashtag","hashtag challenge"],"rel":["caption","trend"]},{"t":"algorithm","p":"n","vi":"thuật toán","d":"Hệ thống quyết định nội dung nào được đề xuất cho ai, dựa trên tương tác, thời gian xem, độ liên quan.","c":"Giải thích vì sao video hay live lên hoặc không lên.","ex":[["The algorithm pushes lives with high watch time.","Thuật toán đẩy những phòng live có thời gian xem cao."]],"col":["the algorithm favors","algorithm change"],"rel":["For You Page","organic reach"]},{"t":"For You Page","f":"FYP","p":"n","vi":"trang Dành cho bạn","d":"Bảng tin đề xuất của TikTok, nơi phần lớn lượt xem tự nhiên đến từ đây.","c":"Nói về phân phối nội dung.","ex":[["The video went viral on the For You Page overnight.","Video viral trên trang Dành cho bạn chỉ sau một đêm."]],"col":["FYP","For You feed","recommendation feed"],"rel":["algorithm","viral"]},{"t":"organic reach","p":"n","vi":"tiếp cận tự nhiên","d":"Số người thấy nội dung mà không qua quảng cáo.","c":"Đánh giá nội dung.","ex":[["Organic reach on Facebook keeps dropping.","Tiếp cận tự nhiên trên Facebook ngày càng giảm."]],"col":["organic views"],"rel":["reach","organic traffic"]},{"t":"viral","p":"adj","vi":"lan truyền mạnh","d":"Nội dung được chia sẻ và xem rất nhiều trong thời gian ngắn. Động từ là go viral.","c":"Báo cáo nội dung.","ex":[["The unboxing video went viral with 3 million views.","Video khui hộp viral với 3 triệu lượt xem."]],"col":["go viral","viral video"],"rel":["trend","For You Page"]},{"t":"trend","p":"n","vi":"xu hướng","d":"Chủ đề, âm thanh, định dạng đang được nhiều người làm theo. Bắt trend nhanh giúp tăng tiếp cận.","c":"Lên ý tưởng nội dung.","ex":[["Let's jump on this trend with our product.","Bắt trend này với sản phẩm của mình đi."]],"col":["jump on a trend","trending sound","trend-jacking"],"rel":["viral","hashtag"]},{"t":"UGC","f":"User-Generated Content","p":"abbr","vi":"nội dung do người dùng tạo","d":"Ảnh, video, review do khách hàng thật tự làm. Đáng tin hơn nội dung brand tự làm. Hiện còn có UGC creator: người được thuê làm video theo phong cách người dùng.","c":"Tận dụng làm nội dung, quảng cáo.","ex":[["UGC ads often outperform studio ads.","Quảng cáo dạng UGC thường hiệu quả hơn quảng cáo quay studio."]],"col":["UGC creator","UGC video"],"rel":["review","KOC","Spark Ads"]},{"t":"storyboard","p":"n","vi":"bảng phân cảnh","d":"Bản vẽ hoặc mô tả từng cảnh của video theo thứ tự trước khi quay.","c":"Sản xuất video.","ex":[["Send me the storyboard before the shoot.","Gửi bảng phân cảnh trước buổi quay nhé."]],"col":["scene by scene"],"rel":["shot list","live script"]},{"t":"shot list","p":"n","vi":"danh sách cảnh quay","d":"Liệt kê các cảnh cần quay: góc máy, nội dung, đạo cụ. Giúp buổi quay nhanh và không sót.","c":"Chuẩn bị buổi quay.","ex":[["Add a close-up of the texture to the shot list.","Thêm cảnh cận kết cấu vào danh sách cảnh quay."]],"col":["shooting list","shoot day"],"rel":["storyboard","B-roll"]},{"t":"B-roll","p":"n","vi":"cảnh phụ, cảnh minh họa","d":"Cảnh quay bổ trợ chèn xen vào cảnh chính (A-roll): cận sản phẩm, quy trình, không khí.","c":"Dựng video.","ex":[["We need more B-roll of the packaging.","Cần thêm cảnh phụ quay bao bì."]],"col":["A-roll","cutaway"],"rel":["shot list","close-up"]},{"t":"voice-over","f":"VO","p":"n","vi":"lồng tiếng, lời bình","d":"Giọng nói thu riêng và ghép vào video.","c":"Sản xuất video.","ex":[["Add a voice-over explaining the three steps.","Thêm lời bình giải thích ba bước."]],"col":["VO","record a voice-over","AI voice"],"rel":["subtitles"]},{"t":"subtitles","p":"n","vi":"phụ đề","d":"Chữ hiển thị lời nói trên video. Quan trọng vì nhiều người xem không bật tiếng.","c":"Dựng video.","ex":[["Always add subtitles, most people watch on mute.","Luôn thêm phụ đề, đa số người xem tắt tiếng."]],"col":["captions","burned-in subtitles"],"rel":["caption","voice-over"]},{"t":"thumbnail","p":"n","vi":"ảnh bìa video","d":"Ảnh đại diện nhỏ của video hoặc phòng live, ảnh hưởng lớn đến tỉ lệ nhấp.","c":"Thiết kế, tối ưu CTR.","ex":[["The thumbnail should show the product and the price.","Ảnh bìa nên có sản phẩm và giá."]],"col":["cover image","custom thumbnail"],"rel":["CTR","main image"]},{"t":"engagement","p":"n","vi":"tương tác","d":"Các hành động thích, bình luận, chia sẻ, lưu, theo dõi.","c":"Báo cáo hiệu quả nội dung.","ex":[["Engagement was low because there was no mini game.","Tương tác thấp vì không có minigame."]],"col":["drive engagement","engagement rate"],"rel":["engagement rate","comment prompt"]},{"t":"community management","p":"n","vi":"quản lý cộng đồng","d":"Trả lời bình luận, tin nhắn, xây dựng nhóm người theo dõi trung thành, xử lý khủng hoảng nhỏ trên mạng xã hội.","c":"Phân công công việc mạng xã hội.","ex":[["Community management covers replying within two hours.","Quản lý cộng đồng gồm việc trả lời trong vòng hai giờ."]],"col":["community manager","social listening"],"rel":["moderator","brand voice"]},{"t":"edutainment","p":"n","vi":"nội dung vừa học vừa giải trí","d":"Ghép education và entertainment: nội dung cung cấp kiến thức một cách thú vị, ví dụ mẹo skincare vui nhộn.","c":"Ý tưởng nội dung.","ex":[["Edutainment videos get more saves than pure ads.","Video vừa học vừa giải trí được lưu nhiều hơn quảng cáo thuần."]],"col":["educational content"],"rel":["content pillar"]},{"t":"unboxing","p":"n","vi":"khui hộp","d":"Video mở hộp sản phẩm lần đầu, cho thấy bao bì, quà tặng, cảm nhận ban đầu.","c":"Định dạng nội dung.","ex":[["Send PR boxes to creators for unboxing videos.","Gửi hộp quà cho creator làm video khui hộp."]],"col":["unboxing video","PR box"],"rel":["touchpoint","seeding"]},{"t":"tutorial","p":"n","vi":"video hướng dẫn","d":"Nội dung hướng dẫn cách dùng, các bước thực hiện. Còn gọi là how-to.","c":"Định dạng nội dung.","ex":[["A 30-second tutorial shows how to layer the products.","Video hướng dẫn 30 giây chỉ cách dùng chồng các sản phẩm."]],"col":["how-to video","step-by-step"],"rel":["edutainment","product demo"]},{"t":"repurpose","p":"v","vi":"tái sử dụng nội dung","d":"Biến một nội dung thành nhiều định dạng khác, ví dụ cắt phiên live thành clip ngắn, ảnh, bài viết.","c":"Tối ưu chi phí sản xuất.","ex":[["Repurpose the live replay into ten short clips.","Tái sử dụng bản phát lại thành mười clip ngắn."]],"col":["repurpose content","content recycling"],"rel":["highlight clip","replay"]},{"t":"call-out text","p":"n","vi":"chữ nhấn trên video","d":"Chữ to xuất hiện trên video để nhấn mạnh thông tin: giá, ưu đãi, lợi ích chính. Còn gọi là text overlay.","c":"Dựng video ngắn.","ex":[["Add call-out text: 50% OFF ONLY TONIGHT.","Thêm chữ nhấn: GIẢM 50% CHỈ TỐI NAY."]],"col":["text overlay","on-screen text"],"rel":["overlay","subtitles"]},{"t":"content strategy","p":"n","vi":"chiến lược nội dung","d":"Kế hoạch tổng thể: nói gì, với ai, trên kênh nào, theo định dạng nào và để đạt mục tiêu gì.","ex":[["Our content strategy supports every live with three videos.","Chiến lược nội dung hỗ trợ mỗi live bằng ba video."]],"c":"Lập kế hoạch.","col":["content plan"],"rel":["content pillar","content calendar"]},{"t":"content format","p":"n","vi":"định dạng nội dung","d":"Kiểu nội dung: video ngắn, ảnh, băng chuyền, live, bài viết.","ex":[["Carousels are a good content format for tips.","Băng chuyền là định dạng hợp cho mẹo."]],"c":"Lên kế hoạch.","col":["carousel","reel","story"],"rel":["short-form video"]},{"t":"carousel","p":"n","vi":"bài nhiều ảnh trượt","d":"Bài đăng gồm nhiều ảnh hoặc slide người xem vuốt ngang.","ex":[["Post a carousel comparing three sunscreens.","Đăng bài trượt so sánh ba kem chống nắng."]],"c":"Định dạng nội dung.","col":["swipe post"],"rel":["content format"]},{"t":"story","p":"n","vi":"tin (story)","d":"Nội dung tự biến mất sau 24 giờ trên Instagram, Facebook.","ex":[["Post a story countdown before the live.","Đăng story đếm ngược trước live."]],"c":"Định dạng nội dung.","col":["IG story","story highlight"],"rel":["content format"]},{"t":"reel","p":"n","vi":"video ngắn (Reels)","d":"Định dạng video ngắn của Instagram và Facebook.","ex":[["Repost the TikTok video as a reel.","Đăng lại video TikTok dưới dạng reel."]],"c":"Định dạng nội dung.","col":["Reels"],"rel":["short-form video"]},{"t":"teaser","p":"n","vi":"video nhá hàng","d":"Nội dung ngắn hé lộ trước sự kiện, sản phẩm hoặc phiên live.","ex":[["Post a teaser 24 hours before the launch live.","Đăng video nhá hàng 24 giờ trước live ra mắt."]],"c":"Quảng bá live.","col":["teaser video"],"rel":["tease","sneak peek"]},{"t":"behind the scenes","p":"n","vi":"hậu trường","d":"Nội dung cho thấy quá trình phía sau: phòng quay, kho, nhà máy. Tạo sự gần gũi, tin tưởng.","ex":[["BTS videos of our studio get high engagement.","Video hậu trường phòng quay có tương tác cao."]],"f":"BTS","c":"Ý tưởng nội dung.","col":["BTS"],"rel":["content pillar"]},{"t":"POV","p":"abbr","vi":"góc nhìn thứ nhất (định dạng video)","d":"Point of view: video đặt người xem vào một tình huống, kiểu “POV: bạn là host lần đầu live”.","ex":[["Try a POV video about packing 1,000 orders.","Thử video POV về việc đóng 1.000 đơn."]],"c":"Định dạng trend.","col":["POV video"],"rel":["trend"]},{"t":"GRWM","p":"abbr","vi":"chuẩn bị cùng tôi","d":"Định dạng video vừa trang điểm, chuẩn bị vừa trò chuyện. Rất hợp lồng ghép sản phẩm.","ex":[["Our host's GRWM video sold 300 lipsticks.","Video GRWM của host bán được 300 thỏi son."]],"f":"Get Ready With Me","c":"Nội dung làm đẹp.","col":["get ready with me"],"rel":["tutorial"]},{"t":"haul","p":"n","vi":"video khoe đồ đã mua","d":"Video giới thiệu loạt sản phẩm vừa mua.","ex":[["Creators post 11.11 haul videos after the sale.","Creator đăng video khoe đồ 11.11 sau đợt sale."]],"c":"Nội dung mua sắm.","col":["shopping haul","try-on haul"],"rel":["unboxing"]},{"t":"review video","p":"n","vi":"video đánh giá","d":"Video chia sẻ trải nghiệm thật về sản phẩm.","ex":[["Honest review videos convert better than ads.","Video đánh giá trung thực chuyển đổi tốt hơn quảng cáo."]],"c":"Nội dung, KOC.","col":["honest review"],"rel":["review","KOC"]},{"t":"duet","p":"n","vi":"video ghép đôi","d":"Tính năng TikTok quay song song với video của người khác.","ex":[["Invite customers to duet our tutorial.","Mời khách quay ghép đôi với video hướng dẫn."]],"c":"Tương tác, trend.","col":["stitch"],"rel":["trend"]},{"t":"stitch","p":"n","vi":"ghép nối video","d":"Tính năng TikTok cắt một đoạn video người khác rồi nối phần của mình vào sau.","ex":[["Stitch the customer's question and answer it.","Ghép nối câu hỏi của khách rồi trả lời."]],"c":"Trả lời bình luận, phản hồi.","col":["stitch a video"],"rel":["duet"]},{"t":"sound","p":"n","vi":"âm thanh, nhạc nền video","d":"Âm thanh hoặc nhạc dùng trên TikTok. Trending sound là âm thanh đang thịnh hành.","ex":[["Use a trending sound to boost reach.","Dùng âm thanh thịnh hành để tăng tiếp cận."]],"c":"Làm video.","col":["trending sound","original sound"],"rel":["trend"]},{"t":"posting time","p":"n","vi":"giờ đăng","d":"Thời điểm đăng nội dung. Đăng khi khán giả online nhiều giúp tăng tiếp cận ban đầu.","ex":[["Our best posting time is 7 to 9 PM.","Giờ đăng tốt nhất là 7 đến 9 giờ tối."]],"c":"Lên lịch đăng.","col":["best time to post"],"rel":["content calendar"]},{"t":"consistency","p":"n","vi":"sự đều đặn","d":"Đăng nội dung và live đều đặn theo lịch, giúp thuật toán và khán giả quen.","ex":[["Consistency matters more than perfection.","Đều đặn quan trọng hơn hoàn hảo."]],"c":"Lời khuyên phát triển kênh.","col":["post consistently"],"rel":["content calendar"]},{"t":"watch time","p":"n","vi":"thời gian xem","d":"Tổng thời gian người xem dành cho video.","ex":[["Longer watch time pushes the video to more people.","Thời gian xem dài hơn giúp video được đẩy tới nhiều người."]],"c":"Đánh giá video.","col":["total watch time"],"rel":["average watch time"]},{"t":"completion rate","p":"n","vi":"tỉ lệ xem hết","d":"Phần trăm người xem tới cuối video.","ex":[["Short videos have a higher completion rate.","Video ngắn có tỉ lệ xem hết cao hơn."]],"c":"Đánh giá video.","col":["finish rate"],"rel":["VTR"]},{"t":"saves","p":"n","vi":"lượt lưu","d":"Số lần người dùng lưu video hoặc bài. Tín hiệu nội dung có giá trị.","ex":[["Tutorials get the most saves.","Video hướng dẫn được lưu nhiều nhất."]],"c":"Đánh giá nội dung.","col":["bookmark"],"rel":["engagement"]},{"t":"profile visits","p":"n","vi":"lượt vào trang cá nhân","d":"Số người vào xem trang kênh sau khi xem nội dung.","ex":[["Profile visits doubled after the viral video.","Lượt vào trang tăng gấp đôi sau video viral."]],"c":"Đánh giá hiệu quả nội dung.","col":["profile views"],"rel":["new followers"]},{"t":"link in bio","p":"phrase","vi":"link ở tiểu sử","d":"Link đặt ở phần giới thiệu trang cá nhân, nơi duy nhất gắn link trên nhiều nền tảng.","ex":[["Shop now via the link in bio.","Mua ngay qua link ở tiểu sử."]],"c":"Kêu gọi hành động.","col":["bio link"],"rel":["call to action"]},{"t":"bio","p":"n","vi":"tiểu sử, phần giới thiệu","d":"Đoạn giới thiệu ngắn trên trang cá nhân.","ex":[["Add the live schedule to the bio.","Thêm lịch live vào phần giới thiệu."]],"c":"Tối ưu trang.","col":["profile bio"],"rel":["link in bio"]},{"t":"niche content","p":"n","vi":"nội dung ngách","d":"Nội dung tập trung một chủ đề hẹp, giúp thuật toán hiểu và đưa tới đúng người.","ex":[["Stick to niche content about oily skin.","Bám nội dung ngách về da dầu."]],"c":"Định hướng kênh.","col":["niche down"],"rel":["content pillar"]},{"t":"evergreen content","p":"n","vi":"nội dung bền vững","d":"Nội dung luôn hữu ích, không lỗi thời theo thời gian, ví dụ hướng dẫn cơ bản.","ex":[["Evergreen content keeps bringing views for months.","Nội dung bền vững mang lượt xem trong nhiều tháng."]],"c":"Lên kế hoạch.","col":["timeless content"],"rel":["trend"]},{"t":"script hook","p":"n","vi":"câu mở video","d":"Câu đầu tiên của video ngắn, quyết định người xem có ở lại.","ex":[["Write three script hooks for each video.","Viết ba câu mở cho mỗi video."]],"c":"Viết kịch bản video.","col":["opening line"],"rel":["hook","scroll-stopper"]},{"t":"followers","p":"n","vi":"người theo dõi","d":"Người bấm theo dõi tài khoản. Following là số tài khoản mình theo dõi.","ex":[["We hit 100,000 followers this week.","Tuần này cán mốc 100.000 người theo dõi."]],"c":"Mạng xã hội.","col":["follower count","gain followers"],"rel":["new followers"]},{"t":"DM","p":"abbr","vi":"tin nhắn riêng","d":"Tin nhắn trực tiếp trên mạng xã hội. Slide into DMs là nhắn riêng.","ex":[["DM us your order number.","Nhắn riêng cho bên mình mã đơn nhé."]],"f":"Direct Message","c":"Mạng xã hội, CS.","col":["inbox","direct message"],"rel":["inquiry"]},{"t":"comment section","p":"n","vi":"khu vực bình luận","d":"Phần bình luận dưới bài đăng hoặc trong live.","ex":[["The comment section is full of size questions.","Khu bình luận toàn câu hỏi về size."]],"c":"Mạng xã hội.","col":["comments"],"rel":["comments","moderator"]},{"t":"verified badge","p":"n","vi":"tích xanh xác minh","d":"Dấu xác nhận tài khoản chính thức.","ex":[["The verified badge helps buyers trust the account.","Tích xanh giúp người mua tin tài khoản."]],"c":"Uy tín tài khoản.","col":["blue tick","verified account"],"rel":["trust signal"]},{"t":"pin a post","p":"phrase","vi":"ghim bài đăng","d":"Đặt bài lên đầu trang cá nhân.","ex":[["Pin the post with the live schedule.","Ghim bài có lịch live."]],"c":"Quản lý trang.","col":["pinned video"],"rel":["pinned comment"]},{"t":"tag","p":"v, n","vi":"gắn thẻ","d":"Gắn tên tài khoản hoặc sản phẩm vào bài đăng.","ex":[["Tag the brand in every video.","Gắn thẻ brand trong mọi video."]],"c":"Mạng xã hội.","col":["tag a product","tagged"],"rel":["mention"]},{"t":"repost","p":"v, n","vi":"đăng lại","d":"Chia sẻ lại nội dung của người khác hoặc của mình.","ex":[["Repost customer reviews to our story.","Đăng lại đánh giá của khách lên story."]],"c":"Mạng xã hội.","col":["share","regram"],"rel":["UGC"]},{"t":"go viral","p":"phrase","vi":"lan truyền mạnh","d":"Được xem và chia sẻ rất nhiều trong thời gian ngắn.","ex":[["The packing video went viral overnight.","Video đóng hàng viral chỉ sau một đêm."]],"c":"Nội dung.","col":["blow up"],"rel":["viral"]},{"t":"content creator","p":"n","vi":"nhà sáng tạo nội dung","d":"Người làm nội dung trên mạng.","ex":[["We hired a content creator to film daily videos.","Thuê nhà sáng tạo nội dung quay video hằng ngày."]],"c":"Nói chung.","col":["creator"],"rel":["creator"]},{"t":"video length","p":"n","vi":"độ dài video","d":"Thời lượng video.","ex":[["Keep the video length under 30 seconds.","Giữ video dưới 30 giây."]],"c":"Sản xuất nội dung.","col":["duration"],"rel":["completion rate"]},{"t":"text-to-speech","p":"n","vi":"giọng đọc tự động","d":"Tính năng chuyển chữ thành giọng nói trong ứng dụng video.","ex":[["Use text-to-speech for the product steps.","Dùng giọng đọc tự động cho các bước dùng sản phẩm."]],"c":"Dựng video.","col":["TTS","AI voice"],"rel":["voice-over"]},{"t":"green screen effect","p":"n","vi":"hiệu ứng phông xanh (video ngắn)","d":"Hiệu ứng TikTok đặt người nói trước ảnh nền, hay dùng để phản hồi tin tức, đánh giá.","ex":[["Use the green screen effect to react to reviews.","Dùng hiệu ứng phông xanh để phản hồi các đánh giá."]],"c":"Định dạng video.","col":["background effect"],"rel":["green screen"]}]},{"id":"kol","code":"KOL","group":"Marketing","en":"Influencers & Affiliates","vi":"KOL, KOC và tiếp thị liên kết","intro":"Làm việc với người có ảnh hưởng và creator affiliate: phân loại, booking, hợp đồng, quyền sử dụng nội dung, hoa hồng.","terms":[{"t":"influencer","p":"n","vi":"người có sức ảnh hưởng","d":"Người có lượng người theo dõi và khả năng tác động tới quyết định mua của họ. Influencer marketing là làm marketing qua những người này.","c":"Chiến lược marketing.","ex":[["We work with 30 influencers each month.","Mỗi tháng mình làm việc với 30 người có ảnh hưởng."]],"col":["influencer marketing","influencer campaign"],"rel":["KOL","KOC","creator"]},{"t":"KOL","f":"Key Opinion Leader","p":"abbr","vi":"người dẫn dắt dư luận","d":"Người nổi tiếng hoặc chuyên gia có nhiều người theo dõi, ví dụ ca sĩ, diễn viên, bác sĩ, beauty blogger lớn. Chi phí cao, phù hợp tạo độ phủ.","c":"Booking quảng bá, live cùng KOL.","ex":[["We booked a KOL for the 11.11 live.","Mình đã book một KOL cho live 11.11."],["KOL lives bring traffic but conversion can be unpredictable.","Live KOL kéo traffic nhưng chuyển đổi khó đoán."]],"col":["book a KOL","KOL live","celebrity"],"rel":["KOC","booking","rate card"]},{"t":"KOC","f":"Key Opinion Consumer","p":"abbr","vi":"người tiêu dùng có ảnh hưởng","d":"Người dùng thật chia sẻ trải nghiệm sản phẩm. Ít người theo dõi hơn KOL nhưng đáng tin, chi phí thấp, chuyển đổi tốt.","c":"Seeding, affiliate, review.","ex":[["KOC videos often convert better than KOL videos.","Video KOC thường chuyển đổi tốt hơn video KOL."]],"col":["KOC seeding","KOC army"],"rel":["KOL","affiliate marketing","UGC"]},{"t":"micro-influencer","p":"n","vi":"người ảnh hưởng tầm nhỏ","d":"Người có khoảng 10.000 đến 100.000 người theo dõi (mốc mỗi nơi định nghĩa khác nhau). Dưới mức này là nano-influencer. Tỉ lệ tương tác thường cao hơn người nổi tiếng lớn.","c":"Chọn creator theo ngân sách.","ex":[["Twenty micro-influencers cost less than one celebrity.","Hai mươi người ảnh hưởng tầm nhỏ rẻ hơn một người nổi tiếng."]],"col":["nano-influencer","macro-influencer","mega-influencer"],"rel":["influencer","KOC"]},{"t":"creator","p":"n","vi":"nhà sáng tạo nội dung","d":"Người làm nội dung trên mạng xã hội. Trên TikTok Shop, creator thường là người bán hàng affiliate.","c":"Làm việc với người làm nội dung.","ex":[["We invited 200 creators to promote the new serum.","Mời 200 creator quảng bá serum mới."]],"col":["content creator","creator marketplace"],"rel":["influencer","affiliate marketing"]},{"t":"affiliate marketing","p":"n","vi":"tiếp thị liên kết","d":"Người khác (affiliate, creator) giới thiệu và bán sản phẩm của shop qua link riêng, nhận hoa hồng trên đơn thành công.","c":"Mở rộng kênh bán qua creator.","ex":[["Affiliate marketing brings 30% of our TikTok Shop GMV.","Tiếp thị liên kết mang lại 30% GMV TikTok Shop."]],"col":["affiliate program","affiliate link","affiliate creator"],"rel":["affiliate commission","tracking link"]},{"t":"affiliate commission","p":"n","vi":"hoa hồng tiếp thị liên kết","d":"Phần trăm shop trả cho creator trên mỗi đơn thành công qua link của họ.","c":"Thiết lập chương trình affiliate.","ex":[["Affiliate creators get 15% commission on this product.","Creator nhận 15% hoa hồng với sản phẩm này."]],"col":["commission rate","pay commission"],"rel":["affiliate marketing","commission fee"],"tip":"Khác với commission fee (phí sàn thu của shop)."},{"t":"open collaboration","p":"n","vi":"hợp tác mở","d":"Hình thức affiliate trên TikTok Shop: shop đặt mức hoa hồng chung, mọi creator đủ điều kiện đều có thể bán. Đối lập là targeted collaboration (mời riêng creator với hoa hồng riêng).","c":"Thiết lập affiliate.","ex":[["Open collaboration at 10%, targeted collaboration at 20% for top creators.","Hợp tác mở 10%, hợp tác riêng 20% cho creator hàng đầu."]],"col":["targeted collaboration","target plan"],"rel":["affiliate commission"]},{"t":"free sample","p":"n","vi":"hàng mẫu miễn phí","d":"Sản phẩm gửi cho creator dùng thử và làm nội dung. Creator thường gửi sample request qua nền tảng.","c":"Quản lý gửi mẫu.","ex":[["Approve sample requests only from creators with over 5,000 followers.","Chỉ duyệt yêu cầu mẫu từ creator trên 5.000 người theo dõi."]],"col":["sample request","send samples","PR package"],"rel":["seeding","creator"]},{"t":"seeding","p":"n","vi":"gieo nội dung, rải review","d":"Gửi sản phẩm cho nhiều KOC hoặc người dùng để họ đăng review, tạo cảm giác sản phẩm được nhiều người nhắc tới. Cũng dùng chỉ việc bình luận tạo thảo luận.","c":"Chiến dịch ra mắt, tăng social proof.","ex":[["Start seeding two weeks before the launch.","Bắt đầu rải review hai tuần trước ngày ra mắt."]],"col":["seeding campaign","KOC seeding"],"rel":["KOC","free sample"],"tip":"Seeding phải minh bạch; nội dung có trả phí nên được gắn nhãn quảng cáo theo quy định."},{"t":"booking","p":"n","vi":"đặt lịch, thuê (KOL)","d":"Việc thuê KOL hoặc creator làm nội dung hoặc live. Động từ là book.","c":"Làm việc với KOL, agency.","ex":[["The booking includes one live and two videos.","Gói thuê gồm một live và hai video."],["Book the KOL at least a month in advance for 12.12.","Đặt KOL trước ít nhất một tháng cho 12.12."]],"col":["book a KOL","booking fee","KOL booking"],"rel":["rate card","deliverables"]},{"t":"rate card","p":"n","vi":"bảng giá","d":"Bảng báo giá của KOL, creator hoặc kênh truyền thông cho từng loại nội dung.","c":"Thương lượng chi phí.","ex":[["Can you send me your rate card for TikTok videos and lives?","Gửi mình bảng giá video và live TikTok nhé?"]],"col":["price list","rates"],"rel":["booking","quotation"]},{"t":"deliverables","p":"n","vi":"sản phẩm bàn giao","d":"Danh sách những gì phải giao theo thỏa thuận, ví dụ 1 video 60 giây, 3 story, 1 live 2 giờ.","c":"Hợp đồng KOL, agency.","ex":[["The deliverables are one video, three stories and one live.","Sản phẩm bàn giao gồm một video, ba story và một live."]],"col":["list of deliverables","deliver on time"],"rel":["booking","SOW"]},{"t":"usage rights","p":"n","vi":"quyền sử dụng nội dung","d":"Quyền brand được dùng lại nội dung của creator (chạy quảng cáo, đăng lại) trong thời gian và kênh cụ thể. Thường tính thêm phí.","c":"Hợp đồng creator.","ex":[["We need 3-month usage rights to run the video as an ad.","Cần quyền sử dụng 3 tháng để chạy video làm quảng cáo."]],"col":["content rights","license period"],"rel":["Spark Ads","whitelisting"]},{"t":"whitelisting","p":"n","vi":"chạy quảng cáo qua tài khoản creator","d":"Creator cấp quyền để brand chạy quảng cáo dưới tên tài khoản của creator, tận dụng độ tin cậy của họ. Trên TikTok tương đương Spark Ads.","c":"Khuếch đại nội dung creator.","ex":[["Whitelisting the creator's post doubled the CTR.","Chạy quảng cáo qua tài khoản creator làm CTR tăng gấp đôi."]],"col":["creator licensing","partnership ads"],"rel":["usage rights","Spark Ads"]},{"t":"exclusivity","p":"n","vi":"điều khoản độc quyền","d":"Creator cam kết không làm cho đối thủ trong một thời gian nhất định.","c":"Hợp đồng.","ex":[["The contract has a 30-day exclusivity clause for skincare brands.","Hợp đồng có điều khoản độc quyền 30 ngày với các brand chăm sóc da."]],"col":["exclusivity clause","non-compete"],"rel":["contract","usage rights"]},{"t":"content approval","p":"n","vi":"duyệt nội dung","d":"Brand xem và duyệt nội dung trước khi đăng. Thường giới hạn số lần sửa.","c":"Quy trình làm việc với creator.","ex":[["All videos need content approval 48 hours before posting.","Mọi video phải được duyệt trước khi đăng 48 giờ."]],"col":["approval process","draft review"],"rel":["revision","sign-off"]},{"t":"MCN","f":"Multi-Channel Network","p":"abbr","vi":"mạng lưới đa kênh","d":"Tổ chức quản lý nhiều creator, hỗ trợ nội dung, kết nối brand, chia doanh thu. Đối tác phổ biến với TikTok Shop.","c":"Tìm nguồn creator, hợp tác.","ex":[["We work with an MCN that manages 300 affiliate creators.","Mình làm việc với một MCN quản lý 300 creator affiliate."]],"col":["talent agency","creator agency"],"rel":["creator","agency"]},{"t":"tracking link","p":"n","vi":"link theo dõi","d":"Link riêng để biết đơn hàng đến từ creator hoặc kênh nào. Thường có tham số UTM.","c":"Đo hiệu quả từng creator.","ex":[["Each creator gets a unique tracking link.","Mỗi creator có một link theo dõi riêng."]],"col":["UTM link","affiliate link"],"rel":["promo code","attribution"]},{"t":"promo code","p":"n","vi":"mã khuyến mãi riêng","d":"Mã giảm giá gắn với một creator hoặc chiến dịch, vừa tạo ưu đãi cho người xem vừa giúp đo lường.","c":"Đo hiệu quả KOL, tạo ưu đãi.","ex":[["Use code LINH20 for 20% off.","Dùng mã LINH20 để giảm 20%."]],"col":["discount code","creator code"],"rel":["tracking link","voucher"]},{"t":"fake followers","p":"n","vi":"người theo dõi ảo","d":"Người theo dõi mua hoặc tài khoản bot. Dấu hiệu: nhiều follow nhưng tương tác rất thấp, bình luận chung chung.","c":"Kiểm tra trước khi booking.","ex":[["Check engagement rate to spot fake followers.","Ki
