lớn."]],"c":"Tính phí vận chuyển.","col":["dimensional weight","chargeable weight"],"rel":["shipping fee"],"fm":"Trọng lượng quy đổi (kg) = dài × rộng × cao (cm) ÷ 5.000 (hệ số tùy hãng vận chuyển)"},{"t":"COD reconciliation","p":"n","vi":"đối soát COD","d":"So khớp tiền thu hộ của đơn vị vận chuyển với số đơn đã giao.","ex":[["COD reconciliation is done every Friday.","Đối soát COD vào thứ Sáu hằng tuần."]],"c":"Tài chính.","col":["cash collection"],"rel":["COD","payout"]},{"t":"return window","p":"n","vi":"thời hạn đổi trả","d":"Số ngày khách được yêu cầu trả hàng kể từ khi nhận.","ex":[["The return window is 15 days.","Thời hạn đổi trả là 15 ngày."]],"c":"Chính sách đổi trả.","col":["return period"],"rel":["return"]},{"t":"return reason","p":"n","vi":"lý do trả hàng","d":"Nguyên nhân khách trả hàng: sai size, lỗi, không giống mô tả, đổi ý.","ex":[["'Not as described' is our top return reason.","“Không đúng mô tả” là lý do trả hàng hàng đầu."]],"c":"Phân tích hoàn hàng.","col":["not as described","change of mind"],"rel":[]},{"t":"restocking fee","p":"n","vi":"phí nhập lại kho","d":"Phí khách phải trả khi trả hàng không do lỗi của shop.","ex":[["There's no restocking fee for defective items.","Không thu phí nhập lại với hàng lỗi."]],"c":"Chính sách đổi trả.","col":["return fee"],"rel":["return"]},{"t":"defective","p":"adj","vi":"bị lỗi","d":"Sản phẩm hỏng do sản xuất. Danh từ: defect.","ex":[["Replace the defective unit immediately.","Đổi ngay sản phẩm lỗi."]],"c":"Xử lý khiếu nại.","col":["defect rate","faulty"],"rel":["damaged goods","warranty"]},{"t":"quality check","p":"n","vi":"kiểm tra chất lượng","d":"Kiểm tra hàng trước khi giao hoặc khi nhập kho. Viết tắt QC.","ex":[["Add a quality check before packing glass items.","Thêm bước kiểm tra chất lượng trước khi đóng hàng thủy tinh."]],"c":"Vận hành kho.","col":["QC","inspection"],"rel":["defective"]},{"t":"warehouse capacity","p":"n","vi":"công suất kho","d":"Số đơn hoặc lượng hàng kho xử lý, chứa được.","ex":[["Warehouse capacity is 8,000 orders a day.","Công suất kho là 8.000 đơn mỗi ngày."]],"c":"Lập kế hoạch siêu sale.","col":["daily capacity"],"rel":["capacity","fulfillment"]},{"t":"peak season","p":"n","vi":"mùa cao điểm","d":"Thời kỳ đơn hàng tăng mạnh, như quý 4 và Tết.","ex":[["Hire temporary packers for peak season.","Thuê nhân viên đóng gói thời vụ cho mùa cao điểm."]],"c":"Kế hoạch vận hành.","col":["high season","off-season"],"rel":["seasonality"]},{"t":"temporary staff","p":"n","vi":"nhân viên thời vụ","d":"Người làm ngắn hạn trong mùa cao điểm.","ex":[["We need 10 temporary staff for 11.11.","Cần 10 nhân viên thời vụ cho 11.11."]],"c":"Nhân sự kho.","col":["seasonal workers","temps"],"rel":["peak season"]},{"t":"pickup","p":"n","vi":"lấy hàng","d":"Đơn vị vận chuyển đến lấy hàng tại kho hoặc shop.","ex":[["Schedule a second pickup at 6 PM.","Đặt lượt lấy hàng thứ hai lúc 6 giờ."]],"c":"Vận hành kho.","col":["pickup time","drop-off"],"rel":["handover"]},{"t":"drop-off point","p":"n","vi":"điểm gửi hàng","d":"Bưu cục nơi shop tự mang hàng đến gửi.","ex":[["Bring urgent parcels to the nearest drop-off point.","Mang kiện gấp tới điểm gửi hàng gần nhất."]],"c":"Vận chuyển.","col":["post office","drop off"],"rel":["pickup"]}]},{"id":"cs","code":"CS","group":"Thương mại điện tử","en":"Customer Service & Retention","vi":"Chăm sóc và giữ chân khách hàng","intro":"Ngôn ngữ chăm sóc khách: phản hồi, khiếu nại, đánh giá, đo mức hài lòng và giữ khách quay lại.","terms":[{"t":"customer service","f":"CS","p":"n","vi":"chăm sóc khách hàng","d":"Bộ phận và hoạt động hỗ trợ khách trước, trong và sau khi mua. Còn gọi là customer support, customer care.","c":"Phân công, quy trình.","ex":[["Forward this complaint to customer service.","Chuyển khiếu nại này cho chăm sóc khách hàng."]],"col":["CS team","customer support","customer care"],"rel":["after-sales service","response time"]},{"t":"inquiry","p":"n","vi":"câu hỏi, yêu cầu thông tin","d":"Câu hỏi khách gửi tới shop, ví dụ hỏi size, hỏi hàng. Anh Anh viết enquiry.","c":"Xử lý chat.","ex":[["We received 300 inquiries during the live.","Nhận 300 câu hỏi trong lúc live."]],"col":["customer inquiry","handle inquiries"],"rel":["FAQ","chat response rate"]},{"t":"chat response rate","p":"n","vi":"tỉ lệ phản hồi chat","d":"Phần trăm tin nhắn khách được shop trả lời trong thời gian quy định. Là một chỉ số đánh giá shop.","c":"Hiệu suất gian hàng.","ex":[["Our chat response rate must stay above 90%.","Tỉ lệ phản hồi chat phải giữ trên 90%."]],"col":["response rate","reply rate"],"rel":["response time","shop performance"]},{"t":"response time","p":"n","vi":"thời gian phản hồi","d":"Thời gian từ lúc khách nhắn đến lúc shop trả lời. Câu trả lời đầu tiên gọi là first response time.","c":"Đo hiệu suất CS.","ex":[["Average response time during the live was 15 minutes, too slow.","Thời gian phản hồi trung bình trong live là 15 phút, quá chậm."]],"col":["first response time","reply within"],"rel":["chat response rate","SLA"]},{"t":"auto-reply","p":"n","vi":"tin trả lời tự động","d":"Tin nhắn soạn sẵn tự gửi khi khách nhắn, ví dụ chào hỏi, ngoài giờ làm việc.","c":"Cài đặt chat.","ex":[["Set an auto-reply with the voucher code for new chats.","Cài tin trả lời tự động kèm mã voucher cho chat mới."]],"col":["away message","automated reply"],"rel":["chatbot","canned response"]},{"t":"canned response","p":"n","vi":"câu trả lời mẫu","d":"Câu trả lời chuẩn soạn sẵn cho các câu hỏi lặp lại, nhân viên chỉ việc chọn và gửi. Còn gọi là saved reply, template.","c":"Đào tạo CS, tăng tốc độ trả lời.","ex":[["Create canned responses for shipping and size questions.","Tạo câu trả lời mẫu cho câu hỏi về ship và size."]],"col":["saved reply","reply template"],"rel":["FAQ","auto-reply"]},{"t":"chatbot","p":"n","vi":"chatbot, trợ lý chat tự động","d":"Chương trình tự động trả lời tin nhắn theo kịch bản hoặc AI.","c":"Tự động hóa CS.","ex":[["The chatbot handles 60% of questions without staff.","Chatbot xử lý 60% câu hỏi không cần nhân viên."]],"col":["AI chatbot","bot flow"],"rel":["auto-reply","FAQ"]},{"t":"FAQ","f":"Frequently Asked Questions","p":"abbr","vi":"câu hỏi thường gặp","d":"Danh sách câu hỏi khách hay hỏi kèm câu trả lời chuẩn. Dùng cho CS, chatbot và kịch bản live.","c":"Chuẩn bị tài liệu.","ex":[["Add the new return policy to the FAQ.","Thêm chính sách trả hàng mới vào câu hỏi thường gặp."]],"col":["FAQ page","FAQ document"],"rel":["Q&A","canned response"]},{"t":"complaint","p":"n","vi":"khiếu nại, phàn nàn","d":"Khách bày tỏ không hài lòng về sản phẩm hoặc dịch vụ. Động từ là complain about.","c":"Xử lý sự cố, báo cáo.","ex":[["We got 20 complaints about late delivery this week.","Tuần này nhận 20 khiếu nại về giao trễ."]],"col":["file a complaint","handle a complaint","complaint rate"],"rel":["dispute","escalation"]},{"t":"dispute","p":"n","vi":"tranh chấp","d":"Khi shop và khách không thống nhất (ví dụ về trả hàng, hoàn tiền), sàn sẽ đứng ra phân xử.","c":"Xử lý trả hàng có tranh chấp.","ex":[["The customer opened a dispute because we rejected the return.","Khách mở tranh chấp vì shop từ chối trả hàng."]],"col":["open a dispute","win a dispute","provide evidence"],"rel":["refund","return"]},{"t":"escalation","p":"n","vi":"chuyển cấp xử lý","d":"Đẩy vấn đề lên người hoặc bộ phận có thẩm quyền cao hơn khi nhân viên không giải quyết được. Động từ là escalate.","c":"Quy trình CS, quản lý sự cố.","ex":[["This case needs escalation to the brand's QA team.","Trường hợp này cần chuyển lên team kiểm định của brand."]],"col":["escalate to","escalation path"],"rel":["escalate","complaint"]},{"t":"resolution","p":"n","vi":"giải pháp, cách giải quyết","d":"Kết quả xử lý vấn đề của khách. Thời gian xử lý xong gọi là resolution time.","c":"Báo cáo CS.","ex":[["We offered a replacement as the resolution.","Shop đề xuất đổi hàng mới làm phương án giải quyết."]],"col":["resolution time","resolve an issue"],"rel":["complaint","compensation"]},{"t":"compensation","p":"n","vi":"bồi thường, đền bù","d":"Khoản bù đắp cho khách khi có lỗi: voucher, quà, hoàn một phần tiền.","c":"Xử lý khiếu nại.","ex":[["Offer a 50k voucher as compensation for the delay.","Tặng voucher 50k để bù cho việc giao trễ."]],"col":["offer compensation","goodwill voucher"],"rel":["refund","resolution"]},{"t":"replacement","p":"n","vi":"đổi hàng mới","d":"Gửi sản phẩm mới thay cho sản phẩm lỗi.","c":"Xử lý khiếu nại.","ex":[["We'll send a replacement at no extra cost.","Shop sẽ gửi sản phẩm mới không mất thêm phí."]],"col":["exchange","send a replacement"],"rel":["return","warranty"]},{"t":"warranty","p":"n","vi":"bảo hành","d":"Cam kết sửa hoặc đổi sản phẩm lỗi trong thời gian nhất định.","c":"Đồ điện tử, gia dụng.","ex":[["The blender comes with a 12-month warranty.","Máy xay có bảo hành 12 tháng."]],"col":["under warranty","warranty claim"],"rel":["after-sales service","replacement"]},{"t":"after-sales service","p":"n","vi":"dịch vụ hậu mãi","d":"Hỗ trợ sau khi bán: hướng dẫn sử dụng, bảo hành, đổi trả, chăm sóc định kỳ.","c":"Chiến lược giữ khách.","ex":[["Good after-sales service leads to repeat purchases.","Hậu mãi tốt dẫn tới mua lại."]],"col":["post-purchase support"],"rel":["warranty","customer retention"]},{"t":"rating","p":"n","vi":"điểm đánh giá (sao)","d":"Điểm khách chấm cho sản phẩm hoặc shop, thường từ 1 đến 5 sao. Shop rating là điểm trung bình của shop.","c":"Theo dõi uy tín.","ex":[["Our shop rating dropped to 4.6 after the delivery issues.","Điểm shop tụt xuống 4,6 sau sự cố giao hàng."]],"col":["star rating","5-star","average rating"],"rel":["review","social proof"]},{"t":"review","p":"n, v","vi":"đánh giá, nhận xét","d":"Nhận xét bằng chữ, ảnh, video khách để lại sau khi mua. Đánh giá xấu gọi là negative review.","c":"Theo dõi phản hồi, trả lời đánh giá.","ex":[["Reply to every negative review within 24 hours.","Trả lời mọi đánh giá xấu trong 24 giờ."],["Ask satisfied customers to leave a review.","Nhờ khách hài lòng để lại đánh giá."]],"col":["leave a review","negative review","review with photos"],"rel":["rating","UGC"]},{"t":"CSAT","f":"Customer Satisfaction Score","p":"abbr","vi":"điểm hài lòng khách hàng","d":"Đo mức hài lòng sau một lần tương tác, thường bằng câu hỏi chấm điểm 1 đến 5.","c":"Đo chất lượng CS.","fm":"CSAT = số phản hồi 4–5 điểm ÷ tổng phản hồi × 100%","ex":[["CSAT for the CS team was 92% this month.","Điểm hài lòng của team CS tháng này là 92%."]],"col":["CSAT survey","satisfaction rate"],"rel":["NPS"]},{"t":"NPS","f":"Net Promoter Score","p":"abbr","vi":"chỉ số sẵn sàng giới thiệu","d":"Hỏi khách “Bạn có giới thiệu chúng tôi cho bạn bè không?” trên thang 0 đến 10. Người 9–10 là promoter, 0–6 là detractor.","c":"Đo lòng trung thành.","fm":"NPS = % promoter − % detractor (từ −100 đến +100)","ex":[["Our NPS went up from 30 to 45.","NPS tăng từ 30 lên 45."]],"col":["promoter","detractor","passive"],"rel":["CSAT","customer retention"]},{"t":"customer retention","p":"n","vi":"giữ chân khách hàng","d":"Khả năng giữ khách tiếp tục mua. Giữ khách cũ thường rẻ hơn nhiều so với tìm khách mới.","c":"Chiến lược tăng trưởng.","ex":[["Live sessions help customer retention because people come back weekly.","Live giúp giữ chân khách vì người xem quay lại hằng tuần."]],"col":["retention rate","retain customers"],"rel":["churn","repeat customer","LTV"]},{"t":"repeat customer","p":"n","vi":"khách mua lại","d":"Khách đã mua từ hai lần trở lên. Tỉ lệ khách mua lại là repeat purchase rate.","c":"Đo lòng trung thành.","ex":[["40% of live buyers are repeat customers.","40% người mua trong live là khách mua lại."]],"col":["returning customer","repeat purchase"],"rel":["repeat purchase rate","loyalty program"]},{"t":"churn","p":"n, v","vi":"rời bỏ (khách)","d":"Khách ngừng mua hoặc ngừng dùng dịch vụ. Churn rate là tỉ lệ khách rời bỏ trong một kỳ.","c":"Phân tích giữ khách.","ex":[["Customers churn if delivery keeps being late.","Khách rời bỏ nếu giao hàng cứ trễ."]],"col":["churn rate","churned customers"],"rel":["customer retention"]},{"t":"loyalty program","p":"n","vi":"chương trình khách hàng thân thiết","d":"Chương trình thưởng cho khách mua thường xuyên: tích điểm, hạng thành viên, ưu đãi riêng.","c":"Giữ chân khách.","ex":[["Members of the loyalty program get early access to live deals.","Thành viên thân thiết được vào deal live sớm."]],"col":["membership tier","reward points","VIP"],"rel":["repeat customer","membership tier"]},{"t":"membership tier","p":"n","vi":"hạng thành viên","d":"Cấp bậc khách hàng theo mức chi tiêu, ví dụ Silver, Gold, Diamond, mỗi hạng có quyền lợi khác nhau.","c":"Thiết kế chương trình thân thiết.","ex":[["Gold tier members get free shipping on every order.","Hạng Vàng được miễn phí vận chuyển mọi đơn."]],"col":["tier upgrade","VIP tier"],"rel":["loyalty program"]},{"t":"customer","p":"n","vi":"khách hàng","d":"Người mua sản phẩm hoặc dịch vụ. Client thường chỉ khách hàng doanh nghiệp.","ex":[["Our customers are mostly office workers.","Khách hàng chủ yếu là nhân viên văn phòng."]],"c":"Nói chung.","col":["end customer","existing customer"],"rel":["client","buyer"]},{"t":"customer experience","p":"n","vi":"trải nghiệm khách hàng","d":"Toàn bộ cảm nhận của khách qua mọi điểm chạm, từ xem live tới nhận hàng và hậu mãi.","ex":[["Fast delivery is a big part of customer experience.","Giao nhanh là phần lớn của trải nghiệm khách hàng."]],"f":"CX","c":"Chiến lược.","col":["CX","improve CX"],"rel":["touchpoint","customer journey"]},{"t":"customer feedback","p":"n","vi":"phản hồi của khách","d":"Ý kiến, nhận xét của khách về sản phẩm, dịch vụ.","ex":[["We changed the pump because of customer feedback.","Đổi vòi bơm theo phản hồi của khách."]],"c":"Cải tiến sản phẩm.","col":["collect feedback","voice of the customer"],"rel":["review","feedback"]},{"t":"voice of the customer","p":"n","vi":"tiếng nói khách hàng","d":"Tổng hợp những gì khách nói qua đánh giá, chat, khảo sát để hiểu nhu cầu.","ex":[["Share a monthly VoC report with the product team.","Gửi báo cáo tiếng nói khách hàng hằng tháng cho team sản phẩm."]],"f":"VoC","c":"Nghiên cứu khách hàng.","col":["VoC report"],"rel":["customer feedback"]},{"t":"survey","p":"n, v","vi":"khảo sát","d":"Bảng câu hỏi lấy ý kiến khách.","ex":[["Send a short survey after delivery.","Gửi khảo sát ngắn sau khi giao hàng."]],"c":"Đo hài lòng, nghiên cứu.","col":["customer survey","questionnaire"],"rel":["CSAT","NPS"]},{"t":"ticket volume","p":"n","vi":"lượng yêu cầu hỗ trợ","d":"Số câu hỏi, khiếu nại CS nhận trong một khoảng thời gian.","ex":[["Ticket volume triples after mega sales.","Lượng yêu cầu hỗ trợ tăng gấp ba sau siêu sale."]],"c":"Lập kế hoạch nhân sự CS.","col":["chat volume"],"rel":["response time"]},{"t":"first contact resolution","p":"n","vi":"giải quyết ngay lần đầu","d":"Tỉ lệ vấn đề được xử lý xong ngay trong lần liên hệ đầu tiên.","ex":[["Our first contact resolution rate is 78%.","Tỉ lệ giải quyết ngay lần đầu là 78%."]],"f":"FCR","c":"Đo hiệu quả CS.","col":["FCR rate"],"rel":["resolution"]},{"t":"handling time","p":"n","vi":"thời gian xử lý","d":"Thời gian trung bình xử lý xong một yêu cầu. AHT là average handling time.","ex":[["Canned responses cut handling time in half.","Câu trả lời mẫu giảm một nửa thời gian xử lý."]],"c":"Đo hiệu suất CS.","col":["AHT"],"rel":["response time"]},{"t":"negative feedback","p":"n","vi":"phản hồi tiêu cực","d":"Nhận xét không hài lòng. Cần trả lời nhanh và xử lý công khai, lịch sự.","ex":[["Respond to negative feedback within 24 hours.","Trả lời phản hồi tiêu cực trong 24 giờ."]],"c":"Xử lý đánh giá.","col":["bad review","handle criticism"],"rel":["review","complaint"]},{"t":"apology","p":"n","vi":"lời xin lỗi","d":"Lời xin lỗi khách khi có lỗi. Động từ apologize for.","ex":[["We sincerely apologize for the delay.","Chân thành xin lỗi vì sự chậm trễ."]],"c":"Xử lý khiếu nại.","col":["sincere apology","apologize for"],"rel":["complaint","compensation"]},{"t":"inconvenience","p":"n","vi":"sự bất tiện","d":"Từ hay dùng trong lời xin lỗi khách.","ex":[["Sorry for any inconvenience caused.","Xin lỗi vì sự bất tiện."]],"c":"Viết tin nhắn xin lỗi.","col":["any inconvenience"],"rel":["apology"]},{"t":"goodwill gesture","p":"n","vi":"cử chỉ thiện chí","d":"Quà hoặc ưu đãi tặng khách để giữ thiện cảm dù không bắt buộc.","ex":[["Send a sample as a goodwill gesture.","Tặng mẫu thử như cử chỉ thiện chí."]],"c":"Xử lý khiếu nại.","col":["as a gesture of goodwill"],"rel":["compensation"]},{"t":"customer lifetime","p":"n","vi":"thời gian gắn bó của khách","d":"Khoảng thời gian khách tiếp tục mua hàng.","ex":[["Average customer lifetime is 18 months.","Thời gian gắn bó trung bình là 18 tháng."]],"c":"Tính LTV.","col":["customer tenure"],"rel":["LTV","churn"]},{"t":"win-back","p":"n","vi":"kéo khách quay lại","d":"Chiến dịch dành cho khách lâu rồi không mua.","ex":[["Send a win-back voucher to customers inactive for 90 days.","Gửi voucher kéo lại cho khách 90 ngày không mua."]],"c":"CRM.","col":["win-back campaign","reactivation"],"rel":["churn"]},{"t":"VIP customer","p":"n","vi":"khách VIP","d":"Khách chi tiêu cao hoặc mua thường xuyên, được ưu đãi riêng.","ex":[["Call VIP customers personally before the launch.","Gọi riêng cho khách VIP trước buổi ra mắt."]],"c":"Chăm sóc khách lớn.","col":["top customers","high-value customer"],"rel":["membership tier"]},{"t":"brand loyalty","p":"n","vi":"lòng trung thành thương hiệu","d":"Khách tiếp tục chọn một thương hiệu dù có lựa chọn khác.","ex":[["Live sessions build brand loyalty over time.","Live xây dựng lòng trung thành thương hiệu theo thời gian."]],"c":"Chiến lược.","col":["loyal customers"],"rel":["customer retention"]},{"t":"word of mouth","p":"n","vi":"truyền miệng","d":"Khách giới thiệu cho nhau. Rất mạnh với người mua Việt Nam.","ex":[["Most new customers come from word of mouth.","Phần lớn khách mới đến từ truyền miệng."]],"c":"Marketing.","col":["WOM","referral"],"rel":["referral program"]},{"t":"referral program","p":"n","vi":"chương trình giới thiệu","d":"Thưởng cho khách khi giới thiệu người mới mua hàng.","ex":[["Both sides get 30k in our referral program.","Cả hai bên đều nhận 30k trong chương trình giới thiệu."]],"c":"Tăng trưởng khách hàng.","col":["refer a friend","referral code"],"rel":["word of mouth"]},{"t":"Thank you for your order","p":"pattern","vi":"Cảm ơn bạn đã đặt hàng","d":"Câu mở tin nhắn sau khi khách mua.","ex":[["Thank you for your order! It will ship within 24 hours.","Cảm ơn bạn đã đặt hàng! Đơn sẽ được gửi trong 24 giờ."]],"c":"Tin nhắn CS.","col":["thanks for shopping with us"],"rel":["order confirmation"]},{"t":"Your order has been shipped","p":"pattern","vi":"Đơn của bạn đã được gửi đi","d":"Thông báo đơn đã giao cho vận chuyển.","ex":[["Your order has been shipped. Here's your tracking number.","Đơn đã được gửi đi. Đây là mã vận đơn."]],"c":"Tin nhắn CS.","col":["out for delivery"],"rel":["order tracking"]},{"t":"We're sorry to hear that","p":"pattern","vi":"Rất tiếc khi nghe điều này","d":"Mở đầu phản hồi khiếu nại.","ex":[["We're sorry to hear that the item arrived damaged.","Rất tiếc khi biết sản phẩm đến nơi bị hỏng."]],"c":"CS.","col":["sorry to hear"],"rel":["apology"]},{"t":"Please send us a photo","p":"pattern","vi":"Vui lòng gửi ảnh cho bên mình","d":"Xin bằng chứng để xử lý.","ex":[["Please send us a photo of the product and the shipping label.","Vui lòng gửi ảnh sản phẩm và phiếu gửi hàng."]],"c":"CS.","col":["unboxing video"],"rel":["dispute"]},{"t":"We'll send a replacement","p":"pattern","vi":"Bên mình sẽ gửi sản phẩm thay thế","d":"Phương án xử lý hàng lỗi.","ex":[["We'll send a replacement at no extra cost.","Bên mình sẽ gửi sản phẩm thay thế miễn phí."]],"c":"CS.","col":["resend"],"rel":["replacement"]},{"t":"Is there anything else I can help with","p":"pattern","vi":"Bạn cần hỗ trợ thêm gì không","d":"Câu kết cuộc trò chuyện CS.","ex":[["Is there anything else I can help you with today?","Hôm nay bạn cần hỗ trợ thêm gì không?"]],"c":"CS.","col":["anything else"],"rel":["customer service"]},{"t":"unboxing video (proof)","p":"n","vi":"video mở hàng làm bằng chứng","d":"Video khách quay khi mở hộp, dùng để chứng minh khi khiếu nại thiếu hàng, hàng lỗi.","ex":[["Please record an unboxing video for any claims.","Vui lòng quay video mở hàng để khiếu nại."]],"c":"Chính sách khiếu nại.","col":["unboxing proof"],"rel":["dispute","Please send us a photo"]},{"t":"missing item","p":"n","vi":"thiếu hàng","d":"Khách nhận thiếu sản phẩm so với đơn.","ex":[["The customer reported a missing item in a 3-piece set.","Khách báo thiếu một món trong set 3 món."]],"c":"CS.","col":["incomplete order"],"rel":["pick and pack"]},{"t":"wrong item","p":"n","vi":"giao nhầm hàng","d":"Khách nhận sai sản phẩm hoặc sai phân loại.","ex":[["We sent the wrong item, the replacement is on the way.","Bên mình gửi nhầm hàng, hàng thay thế đang được gửi."]],"c":"CS.","col":["wrong variant"],"rel":["pick and pack"]},{"t":"rating request","p":"n","vi":"lời nhờ đánh giá","d":"Tin nhắn mời khách để lại đánh giá sau khi nhận hàng. Không được ép buộc hoặc đổi quà lấy đánh giá 5 sao nếu sàn cấm.","ex":[["Send a rating request three days after delivery.","Gửi lời nhờ đánh giá ba ngày sau khi giao."]],"c":"CRM, CS.","col":["review request"],"rel":["review"]},{"t":"fake review","p":"n","vi":"đánh giá giả","d":"Đánh giá không phải từ người mua thật. Vi phạm quy định sàn.","ex":[["Buying fake reviews can get the shop banned.","Mua đánh giá giả có thể khiến shop bị khóa."]],"c":"Tuân thủ.","col":["paid review"],"rel":["order brushing","review"]}]},{"id":"finance","code":"FIN","group":"Thương mại điện tử","en":"Business Metrics & Finance","vi":"Chỉ số kinh doanh và tài chính","intro":"Các khái niệm để hiểu một phiên live có thực sự lời hay không: doanh thu, giá vốn, biên lợi nhuận, chi phí khách hàng.","terms":[{"t":"revenue","p":"n","vi":"doanh thu","d":"Tiền thu được từ bán hàng. Trong TMĐT cần phân biệt gross revenue (doanh thu gộp) và net revenue (doanh thu thuần sau hủy, hoàn, giảm giá).","c":"Báo cáo tài chính.","ex":[["Revenue grew 25% compared to last quarter.","Doanh thu tăng 25% so với quý trước."]],"col":["gross revenue","net revenue","revenue stream"],"rel":["GMV","net revenue","profit"]},{"t":"net revenue","p":"n","vi":"doanh thu thuần","d":"Doanh thu sau khi trừ đơn hủy, đơn hoàn, chiết khấu. Gần với số tiền thực thu hơn GMV.","c":"Báo cáo cho brand, tính lợi nhuận.","fm":"Doanh thu thuần ≈ GMV − đơn hủy − đơn hoàn − giảm giá do shop chịu","ex":[["GMV was 1 billion, but net revenue was only 820 million.","GMV là 1 tỷ nhưng doanh thu thuần chỉ 820 triệu."]],"col":["net sales","NMV (net merchandise value)"],"rel":["GMV","revenue","cancellation rate"]},{"t":"profit","p":"n","vi":"lợi nhuận","d":"Phần còn lại sau khi trừ chi phí. Gross profit (lợi nhuận gộp) trừ giá vốn; net profit (lợi nhuận ròng) trừ hết mọi chi phí.","c":"Đánh giá hiệu quả.","ex":[["The live had high GMV but almost no profit after discounts.","Phiên live GMV cao nhưng gần như không lời sau giảm giá."]],"col":["gross profit","net profit","make a profit"],"rel":["margin","COGS"]},{"t":"COGS","f":"Cost Of Goods Sold","p":"abbr","vi":"giá vốn hàng bán","d":"Chi phí trực tiếp để có sản phẩm bán ra: giá nhập hoặc chi phí sản xuất, đóng gói.","c":"Tính lợi nhuận, đặt giá.","ex":[["COGS for this serum is 80k per bottle.","Giá vốn serum này là 80k một chai."]],"col":["unit cost","landed cost"],"rel":["margin","profit"]},{"t":"margin","p":"n","vi":"biên lợi nhuận","d":"Tỉ lệ lợi nhuận trên doanh thu. Gross margin tính sau giá vốn; net margin tính sau mọi chi phí.","c":"Đánh giá deal, thương lượng giá.","fm":"Biên lợi nhuận gộp = (doanh thu − giá vốn) ÷ doanh thu × 100%","ex":[["A 50% discount leaves us with a 5% margin.","Giảm 50% thì biên lợi nhuận chỉ còn 5%."],["We can't accept this deal, the margin is too thin.","Không nhận deal này được, biên lợi nhuận quá mỏng."]],"col":["gross margin","thin margin","healthy margin"],"rel":["COGS","contribution margin","markup"]},{"t":"markup","p":"n","vi":"tỉ lệ cộng thêm trên giá vốn","d":"Phần trăm cộng vào giá vốn để ra giá bán. Hay bị nhầm với margin.","c":"Định giá.","fm":"Markup = (giá bán − giá vốn) ÷ giá vốn × 100%","ex":[["A 100% markup equals a 50% margin.","Cộng 100% trên giá vốn tương đương biên lợi nhuận 50%."]],"col":["mark up","markup rate"],"rel":["margin"],"tip":"Margin chia cho giá bán, markup chia cho giá vốn."},{"t":"contribution margin","p":"n","vi":"lãi góp","d":"Phần còn lại sau khi trừ các chi phí biến đổi theo đơn (giá vốn, phí sàn, ship, quảng cáo, hoa hồng). Cho biết mỗi đơn đóng góp bao nhiêu để bù chi phí cố định.","c":"Đánh giá hiệu quả phiên live thật sự.","fm":"Lãi góp = doanh thu − chi phí biến đổi","ex":[["After ads and platform fees, the contribution margin is 12%.","Sau quảng cáo và phí sàn, lãi góp là 12%."]],"col":["CM1, CM2","variable costs"],"rel":["margin","unit economics"]},{"t":"unit economics","p":"n","vi":"kinh tế đơn vị","d":"Phân tích doanh thu và chi phí trên một đơn vị (một đơn hàng, một khách hàng) để biết mô hình có lời khi mở rộng không.","c":"Đánh giá mô hình kinh doanh.","ex":[["Let's check the unit economics before scaling ads.","Kiểm tra kinh tế đơn vị trước khi tăng quảng cáo."]],"col":["per-order economics"],"rel":["contribution margin","CAC","LTV"]},{"t":"OPEX","f":"Operating Expenses","p":"abbr","vi":"chi phí vận hành","d":"Chi phí hoạt động thường xuyên: lương, thuê phòng quay, thiết bị, phần mềm. Khác CAPEX là chi đầu tư tài sản lớn.","c":"Ngân sách, báo cáo P&L.","ex":[["Studio rent is a big part of our OPEX.","Tiền thuê phòng quay chiếm phần lớn chi phí vận hành."]],"col":["fixed costs","overhead","CAPEX"],"rel":["P&L","profit"]},{"t":"P&L","f":"Profit and Loss statement","p":"abbr","vi":"báo cáo lãi lỗ","d":"Báo cáo tổng hợp doanh thu, chi phí và lợi nhuận trong một kỳ. Còn gọi là income statement.","c":"Báo cáo quản lý, đánh giá kênh.","ex":[["Please prepare the P&L for the live channel this quarter.","Chuẩn bị báo cáo lãi lỗ kênh live quý này."]],"col":["P&L statement","channel P&L"],"rel":["revenue","OPEX"]},{"t":"AOV","f":"Average Order Value","p":"abbr","vi":"giá trị đơn hàng trung bình","d":"Trung bình mỗi đơn khách chi bao nhiêu. Tăng AOV bằng combo, upsell, giá trị đơn tối thiểu cho voucher.","c":"Phân tích giỏ hàng, thiết kế deal.","fm":"AOV = GMV ÷ số đơn","ex":[["Bundles helped us raise AOV from 250k to 320k.","Combo giúp AOV tăng từ 250k lên 320k."]],"col":["increase AOV","basket size"],"rel":["bundle","minimum spend","upsell"]},{"t":"CAC","f":"Customer Acquisition Cost","p":"abbr","vi":"chi phí có được một khách hàng mới","d":"Tổng chi phí marketing và bán hàng chia cho số khách mới. Cần so với LTV để biết có đáng không.","c":"Đánh giá hiệu quả marketing.","fm":"CAC = chi phí marketing & bán hàng ÷ số khách mới","ex":[["Our CAC through live is lower than through display ads.","CAC qua live thấp hơn qua quảng cáo hiển thị."]],"col":["acquisition cost","lower CAC"],"rel":["LTV","CPA"]},{"t":"LTV","f":"Customer Lifetime Value","p":"abbr","vi":"giá trị vòng đời khách hàng","d":"Tổng giá trị (thường là lợi nhuận) một khách mang lại trong suốt thời gian mua hàng. Còn viết CLV. Tỉ lệ LTV:CAC khoảng 3:1 thường được xem là khỏe.","c":"Chiến lược giữ khách, ngân sách.","fm":"LTV ≈ AOV × số lần mua mỗi năm × số năm gắn bó × biên lợi nhuận","ex":[["Repeat buyers have three times the LTV of one-time buyers.","Khách mua lại có LTV gấp ba khách mua một lần."]],"col":["CLV","LTV:CAC ratio"],"rel":["CAC","customer retention"]},{"t":"repeat purchase rate","p":"n","vi":"tỉ lệ mua lại","d":"Phần trăm khách đã mua từ hai lần trở lên trong một kỳ.","c":"Đo lòng trung thành.","fm":"Tỉ lệ mua lại = số khách mua ≥ 2 lần ÷ tổng số khách × 100%","ex":[["Our repeat purchase rate is 28% within 90 days.","Tỉ lệ mua lại là 28% trong 90 ngày."]],"col":["repurchase rate","RPR"],"rel":["repeat customer","LTV"]},{"t":"ROI","f":"Return On Investment","p":"abbr","vi":"tỉ suất hoàn vốn","d":"Lợi nhuận thu được so với tổng chi phí đầu tư. Rộng hơn ROAS vì tính cả lợi nhuận và mọi chi phí.","c":"Đánh giá chiến dịch, booking KOL, đầu tư phòng quay.","fm":"ROI = (lợi nhuận − chi phí đầu tư) ÷ chi phí đầu tư × 100%","ex":[["The ROI of the KOL live was 40%.","ROI phiên live KOL là 40%."]],"col":["positive ROI","measure ROI"],"rel":["ROAS","profit"],"tip":"ROAS dựa trên doanh thu, ROI dựa trên lợi nhuận."},{"t":"break-even","p":"n, adj","vi":"hòa vốn","d":"Điểm doanh thu vừa đủ bù chi phí. Động từ là break even. Break-even ROAS là ROAS tối thiểu để không lỗ.","c":"Đặt mục tiêu quảng cáo, đánh giá deal.","fm":"ROAS hòa vốn = 1 ÷ biên lợi nhuận (trước quảng cáo)","ex":[["With a 25% margin, our break-even ROAS is 4.","Với biên 25%, ROAS hòa vốn là 4."],["The campaign just broke even.","Chiến dịch vừa đủ hòa vốn."]],"col":["break even","break-even point","break-even ROAS"],"rel":["ROAS","margin"]},{"t":"take rate","p":"n","vi":"tỉ lệ sàn thu","d":"Tổng phần trăm sàn hoặc nền tảng thu trên GMV, gồm hoa hồng, phí thanh toán, phí dịch vụ.","c":"So sánh chi phí giữa các sàn.","ex":[["The total take rate on this platform is around 15%.","Tổng tỉ lệ sàn thu khoảng 15%."]],"col":["platform take rate"],"rel":["commission fee","transaction fee"]},{"t":"ACoS","f":"Advertising Cost of Sale","p":"abbr","vi":"tỉ lệ chi phí quảng cáo trên doanh thu","d":"Chi phí quảng cáo chia doanh thu từ quảng cáo, là nghịch đảo của ROAS. Ở Việt Nam hay gọi là % chi phí quảng cáo trên doanh thu.","c":"Kiểm soát chi phí.","fm":"ACoS = chi phí quảng cáo ÷ doanh thu quảng cáo × 100% = 1 ÷ ROAS","ex":[["ACoS of 20% equals a ROAS of 5.","ACoS 20% tương đương ROAS 5."]],"col":["TACoS (total ACoS)","ad cost ratio"],"rel":["ROAS"]},{"t":"cost per order","f":"CPO","p":"n","vi":"chi phí trên mỗi đơn","d":"Chi phí (quảng cáo hoặc toàn bộ chi phí vận hành phiên) chia cho số đơn.","c":"Đánh giá hiệu quả phiên live.","fm":"CPO = tổng chi phí ÷ số đơn","ex":[["Our cost per order for this live was 35k.","Chi phí mỗi đơn phiên này là 35k."]],"col":["CPO","cost per purchase"],"rel":["CPA","AOV"]},{"t":"budget","p":"n","vi":"ngân sách","d":"Số tiền dự kiến được chi cho một hạng mục hoặc kỳ. Over budget là vượt ngân sách, under budget là dưới ngân sách.","c":"Lập kế hoạch, xin duyệt.","ex":[["We're 10% over budget on ads this month.","Tháng này vượt ngân sách quảng cáo 10%."]],"col":["over budget","under budget","allocate budget"],"rel":["forecast","ad budget"]},{"t":"forecast","p":"n, v","vi":"dự báo","d":"Ước tính kết quả tương lai (GMV, đơn, tồn kho) dựa trên dữ liệu cũ và kế hoạch.","c":"Lập kế hoạch chiến dịch, nhập hàng.","ex":[["We forecast 2 billion in GMV for 11.11.","Dự báo GMV 11.11 là 2 tỷ."],["The forecast was too optimistic.","Dự báo quá lạc quan."]],"col":["sales forecast","forecast accuracy"],"rel":["target","actual"]},{"t":"target","p":"n","vi":"chỉ tiêu, mục tiêu","d":"Con số cần đạt trong một kỳ. Đạt mục tiêu là hit / meet the target; không đạt là miss the target.","c":"Đặt KPI, báo cáo.","ex":[["We hit 110% of the monthly target.","Đạt 110% chỉ tiêu tháng."],["We missed the target by 15%.","Hụt chỉ tiêu 15%."]],"col":["hit the target","miss the target","stretch target"],"rel":["KPI","actual","achievement rate"]},{"t":"actual","p":"n, adj","vi":"số thực tế","d":"Kết quả thực đạt được, đối chiếu với target hoặc forecast. Báo cáo thường có cột Target, Actual, Variance.","c":"Báo cáo so sánh.","ex":[["Actual GMV was 850 million against a target of 1 billion.","GMV thực tế 850 triệu so với chỉ tiêu 1 tỷ."]],"col":["target vs actual","actuals"],"rel":["target","variance"]},{"t":"variance","p":"n","vi":"chênh lệch","d":"Khoảng chênh giữa số thực tế và kế hoạch. Cần giải thích nguyên nhân chênh lệch trong báo cáo.","c":"Báo cáo tài chính, KPI.","ex":[["Please explain the variance in ad spend.","Giải thích giúp mình phần chênh lệch chi phí quảng cáo."]],"col":["positive variance","negative variance"],"rel":["actual","forecast"]},{"t":"run rate","p":"n","vi":"tốc độ hiện tại quy ra cả kỳ","d":"Ước tính kết quả cả tháng hay cả năm dựa trên tốc độ hiện tại. Ví dụ 10 ngày đầu đạt 300 triệu thì run rate tháng là khoảng 900 triệu.","c":"Dự báo nhanh có đạt chỉ tiêu không.","ex":[["At the current run rate, we'll reach 90% of the target.","Theo tốc độ hiện tại, mình sẽ đạt 90% chỉ tiêu."]],"col":["monthly run rate","annual run rate"],"rel":["forecast","target"]},{"t":"cash flow","p":"n","vi":"dòng tiền","d":"Dòng tiền ra vào doanh nghiệp. Bán nhiều nhưng tiền sàn về chậm vẫn có thể thiếu tiền nhập hàng.","c":"Quản lý tài chính.","ex":[["The payout delay is hurting our cash flow.","Tiền sàn về chậm đang ảnh hưởng dòng tiền."]],"col":["positive cash flow","cash flow problem"],"rel":["payout","budget"]},{"t":"gross profit","p":"n","vi":"lợi nhuận gộp","d":"Doanh thu trừ giá vốn hàng bán.","ex":[["Gross profit for the live channel was 300 million.","Lợi nhuận gộp kênh live là 300 triệu."]],"c":"Báo cáo tài chính.","col":["GP"],"rel":["margin","COGS"],"fm":"Lợi nhuận gộp = doanh thu thuần − giá vốn"},{"t":"net profit","p":"n","vi":"lợi nhuận ròng","d":"Lợi nhuận sau khi trừ mọi chi phí, kể cả thuế.","ex":[["Net profit is low because of heavy ad spend.","Lợi nhuận ròng thấp vì chi quảng cáo nhiều."]],"c":"Báo cáo tài chính.","col":["bottom line","net income"],"rel":["profit"]},{"t":"bottom line","p":"n","vi":"lợi nhuận cuối cùng","d":"Dòng cuối của báo cáo lãi lỗ, tức lợi nhuận ròng. Nghĩa bóng: điểm mấu chốt.","ex":[["Discounts hurt the bottom line.","Giảm giá làm tổn hại lợi nhuận cuối cùng."]],"c":"Họp, nói về tài chính.","col":["impact the bottom line"],"rel":["net profit"]},{"t":"top line","p":"n","vi":"doanh thu (dòng đầu)","d":"Dòng đầu tiên của báo cáo lãi lỗ, tức doanh thu. Top-line growth là tăng trưởng doanh thu.","ex":[["Top-line growth was strong but margins fell.","Doanh thu tăng mạnh nhưng biên lợi nhuận giảm."]],"c":"Báo cáo.","col":["top-line growth"],"rel":["revenue","bottom line"]},{"t":"EBITDA","p":"abbr","vi":"lợi nhuận trước lãi vay, thuế và khấu hao","d":"Thước đo lợi nhuận từ hoạt động kinh doanh cốt lõi.","ex":[["The company became EBITDA-positive this year.","Năm nay công ty có EBITDA dương."]],"f":"Earnings Before Interest, Taxes, Depreciation and Amortization","c":"Báo cáo tài chính doanh nghiệp.","col":["EBITDA margin"],"rel":["net profit"]},{"t":"fixed cost","p":"n","vi":"chi phí cố định","d":"Chi phí không đổi theo doanh số: thuê phòng quay, lương cứng.","ex":[["Studio rent is a fixed cost.","Tiền thuê phòng quay là chi phí cố định."]],"c":"Tính hòa vốn.","col":["overhead"],"rel":["variable cost","OPEX"]},{"t":"variable cost","p":"n","vi":"chi phí biến đổi","d":"Chi phí thay đổi theo số đơn: giá vốn, phí sàn, ship, hoa hồng.","ex":[["Packaging is a variable cost.","Bao bì là chi phí biến đổi."]],"c":"Tính lãi góp.","col":["per-unit cost"],"rel":["fixed cost","contribution margin"]},{"t":"overhead","p":"n","vi":"chi phí chung","d":"Chi phí vận hành không gắn trực tiếp với sản phẩm: văn phòng, điện, hành chính.","ex":[["Keep overhead low while scaling the live team.","Giữ chi phí chung thấp khi mở rộng team live."]],"c":"Tài chính.","col":["overhead costs"],"rel":["fixed cost"]},{"t":"CAPEX","p":"abbr","vi":"chi phí đầu tư tài sản","d":"Khoản chi mua tài sản dùng lâu dài: máy quay, đèn, xây phòng quay.","ex":[["The new studio is a CAPEX of 500 million.","Phòng quay mới là khoản đầu tư 500 triệu."]],"f":"Capital Expenditure","c":"Ngân sách.","col":["capital investment"],"rel":["OPEX"]},{"t":"depreciation","p":"n","vi":"khấu hao","d":"Phân bổ giá trị tài sản vào chi phí qua nhiều năm.","ex":[["Cameras are depreciated over three years.","Máy quay được khấu hao trong ba năm."]],"c":"Tài chính.","col":["depreciate"],"rel":["CAPEX"]},{"t":"payback period","p":"n","vi":"thời gian hoàn vốn","d":"Thời gian để khoản đầu tư thu hồi đủ vốn.","ex":[["The payback period for the new studio is 8 months.","Thời gian hoàn vốn phòng quay mới là 8 tháng."]],"c":"Đánh giá đầu tư.","col":["pay back"],"rel":["ROI","break-even"]},{"t":"cost structure","p":"n","vi":"cơ cấu chi phí","d":"Tỉ trọng các loại chi phí trong tổng chi phí.","ex":[["Ads are 40% of our cost structure.","Quảng cáo chiếm 40% cơ cấu chi phí."]],"c":"Phân tích tài chính.","col":["cost breakdown"],"rel":["OPEX"]},{"t":"cost saving","p":"n","vi":"tiết kiệm chi phí","d":"Khoản giảm chi phí đạt được.","ex":[["Switching couriers brings a 10% cost saving.","Đổi đơn vị vận chuyển tiết kiệm 10% chi phí."]],"c":"Đề xuất cải tiến.","col":["cut costs","cost reduction"],"rel":["cost structure"]},{"t":"accounts receivable","p":"n","vi":"khoản phải thu","d":"Tiền khách hàng hoặc sàn còn nợ mình.","ex":[["Accounts receivable from marketplaces are 2 billion.","Khoản phải thu từ các sàn là 2 tỷ."]],"f":"AR","c":"Tài chính.","col":["receivables"],"rel":["accounts payable","payout"]},{"t":"accounts payable","p":"n","vi":"khoản phải trả","d":"Tiền mình còn nợ nhà cung cấp, đối tác.","ex":[["Pay accounts payable before the 25th.","Thanh toán khoản phải trả trước ngày 25."]],"f":"AP","c":"Tài chính.","col":["payables"],"rel":["accounts receivable"]},{"t":"working capital","p":"n","vi":"vốn lưu động","d":"Tiền dùng cho hoạt động hằng ngày: nhập hàng, trả lương, quảng cáo.","ex":[["Mega sale stock ties up a lot of working capital.","Hàng cho siêu sale chiếm nhiều vốn lưu động."]],"c":"Quản lý dòng tiền.","col":["working capital needs"],"rel":["cash flow"]},{"t":"VAT","p":"abbr","vi":"thuế giá trị gia tăng","d":"Thuế tính trên giá bán hàng hóa, dịch vụ.","ex":[["Prices include 8% VAT.","Giá đã gồm 8% VAT."]],"f":"Value Added Tax","c":"Giá, hóa đơn.","col":["VAT invoice","VAT-inclusive"],"rel":["invoice"]},{"t":"withholding tax","p":"n","vi":"thuế khấu trừ tại nguồn","d":"Thuế được sàn hoặc bên trả tiền khấu trừ trước khi chuyển tiền.","ex":[["The platform deducts withholding tax from individual sellers.","Sàn khấu trừ thuế tại nguồn với người bán cá nhân."]],"c":"Thuế TMĐT, thanh toán cho cá nhân.","col":["tax deduction"],"rel":["payout"]},{"t":"gross vs net","p":"phrase","vi":"tổng và thuần","d":"Gross là trước khi trừ (phí, hủy, thuế); net là sau khi trừ. Luôn hỏi rõ số đang nói là gross hay net.","ex":[["Is that 10% of gross or net sales?","10% đó tính trên doanh số tổng hay thuần?"]],"c":"Báo cáo, đàm phán.","col":["gross sales","net sales"],"rel":["GMV","net revenue"]},{"t":"year-to-date","p":"n","vi":"lũy kế từ đầu năm","d":"Tổng từ đầu năm đến nay. Tương tự MTD (từ đầu tháng), QTD (từ đầu quý).","ex":[["YTD GMV is 15 billion.","GMV lũy kế từ đầu năm là 15 tỷ."]],"f":"YTD","c":"Báo cáo.","col":["MTD","QTD"],"rel":["YoY"]},{"t":"fiscal year","p":"n","vi":"năm tài chính","d":"Khoảng 12 tháng doanh nghiệp dùng để lập báo cáo. Có thể khác năm dương lịch.","ex":[["Our fiscal year starts in April.","Năm tài chính của bọn mình bắt đầu tháng 4."]],"c":"Lập kế hoạch.","col":["FY","FY2026"],"rel":["budget"]},{"t":"cost center","p":"n","vi":"trung tâm chi phí","d":"Bộ phận chỉ phát sinh chi phí, không trực tiếp tạo doanh thu. Ngược lại là profit center.","ex":[["Customer service is a cost center.","Chăm sóc khách hàng là trung tâm chi phí."]],"c":"Cơ cấu tổ chức.","col":["profit center"],"rel":["OPEX"]},{"t":"budget allocation","p":"n","vi":"phân bổ ngân sách","d":"Chia ngân sách cho các kênh, hạng mục.","ex":[["Budget allocation: 60% ads, 25% KOL, 15% promo.","Phân bổ: 60% quảng cáo, 25% KOL, 15% khuyến mãi."]],"c":"Lập kế hoạch.","col":["allocate"],"rel":["budget"]},{"t":"cost per session","p":"n","vi":"chi phí mỗi phiên live","d":"Tổng chi phí của một phiên: host, phòng quay, nhân sự, quảng cáo.","ex":[["Cost per session is around 8 million.","Chi phí mỗi phiên khoảng 8 triệu."]],"c":"Đánh giá hiệu quả phiên.","col":["session cost"],"rel":["cost per order"]},{"t":"profitability","p":"n","vi":"khả năng sinh lời","d":"Mức độ có lãi của sản phẩm, kênh, doanh nghiệp.","ex":[["We need to improve profitability, not just GMV.","Cần cải thiện khả năng sinh lời chứ không chỉ GMV."]],"c":"Đánh giá kinh doanh.","col":["profitable","unprofitable"],"rel":["margin"]},{"t":"revenue share","p":"n","vi":"chia sẻ doanh thu","d":"Hai bên chia phần trăm doanh thu theo thỏa thuận.","ex":[["The KOL deal is a 10% revenue share.","Hợp tác KOL là chia 10% doanh thu."]],"c":"Hợp đồng hợp tác.","col":["rev share"],"rel":["commission-based"]},{"t":"financial report","p":"n","vi":"báo cáo tài chính","d":"Báo cáo doanh thu, chi phí, lợi nhuận, dòng tiền.","ex":[["The monthly financial report includes live channel P&L.","Báo cáo tài chính tháng có lãi lỗ kênh live."]],"c":"Tài chính.","col":["financial statement"],"rel":["P&L"]},{"t":"expense","p":"n","vi":"khoản chi","d":"Chi phí đã tiêu. Expense report là báo cáo chi tiêu.","ex":[["Submit your expense report with receipts.","Nộp báo cáo chi tiêu kèm hóa đơn."]],"c":"Tài chính.","col":["expense report","reimbursement"],"rel":["OPEX"]},{"t":"reimbursement","p":"n","vi":"hoàn ứng, thanh toán lại","d":"Công ty trả lại tiền nhân viên đã ứng chi cho công việc.","ex":[["Reimbursement for props takes a week.","Hoàn tiền mua đạo cụ mất một tuần."]],"c":"Tài chính nội bộ.","col":["reimburse","claim"],"rel":["expense"]}]},{"id":"payment","code":"PAY","group":"Thương mại điện tử","en":"Payments & Checkout","vi":"Thanh toán","intro":"Các phương thức thanh toán, quy trình xử lý tiền và rủi ro gian lận trong thương mại điện tử.","terms":[{"t":"payment method","p":"n","vi":"phương thức thanh toán","d":"Cách khách trả tiền: COD, thẻ, ví điện tử, chuyển khoản, trả sau.","ex":[["COD is still the most popular payment method in Vietnam.","COD vẫn là phương thức thanh toán phổ biến nhất ở Việt Nam."]],"c":"Thiết lập, phân tích.","col":["payment option"],"rel":["COD","e-wallet"]},{"t":"e-wallet","p":"n","vi":"ví điện tử","d":"Ví tiền trên điện thoại như MoMo, ZaloPay, ShopeePay.","ex":[["E-wallet payments get an extra 10k off.","Thanh toán bằng ví điện tử được giảm thêm 10k."]],"c":"Thanh toán.","col":["digital wallet","mobile wallet"],"rel":["payment method"]},{"t":"bank transfer","p":"n","vi":"chuyển khoản ngân hàng","d":"Khách chuyển tiền trực tiếp qua ngân hàng, thường bằng mã QR.","ex":[["Pay by bank transfer using the QR code.","Thanh toán chuyển khoản bằng mã QR."]],"c":"Thanh toán.","col":["wire transfer","QR payment"],"rel":["payment method"]},{"t":"credit card","p":"n","vi":"thẻ tín dụng","d":"Thẻ chi tiêu trước trả sau. Thẻ ghi nợ trừ tiền ngay gọi là debit card.","ex":[["Credit card payments can be split into instalments.","Thanh toán thẻ tín dụng có thể trả góp."]],"c":"Thanh toán.","col":["debit card","card payment"],"rel":["instalment"]},{"t":"instalment","p":"n","vi":"trả góp","d":"Chia khoản thanh toán thành nhiều kỳ. Mỹ viết installment.","ex":[["0% instalment for orders over 3 million.","Trả góp 0% cho đơn trên 3 triệu."]],"c":"Bán hàng giá cao.","col":["0% instalment","pay in instalments"],"rel":["BNPL"]},{"t":"BNPL","p":"abbr","vi":"mua trước trả sau","d":"Dịch vụ cho khách nhận hàng trước, trả tiền sau hoặc trả góp, ví dụ SPayLater.","ex":[["BNPL increased our AOV for electronics.","Mua trước trả sau làm tăng AOV ngành điện tử."]],"f":"Buy Now, Pay Later","c":"Thanh toán.","col":["pay later"],"rel":["instalment"]},{"t":"prepaid","p":"adj","vi":"trả trước","d":"Đơn đã thanh toán trước khi giao, ngược với COD.","ex":[["Prepaid orders have far fewer cancellations.","Đơn trả trước ít bị hủy hơn nhiều."]],"c":"Giảm hủy đơn.","col":["prepaid order"],"rel":["COD"]},{"t":"payment gateway","p":"n","vi":"cổng thanh toán","d":"Dịch vụ trung gian xử lý giao dịch online giữa khách, ngân hàng và người bán.","ex":[["Our website uses a local payment gateway.","Website dùng cổng thanh toán trong nước."]],"c":"Thiết lập website.","col":["PSP"],"rel":["payment method"]},{"t":"transaction","p":"n","vi":"giao dịch","d":"Một lần thanh toán hoặc chuyển tiền.","ex":[["The transaction failed, please try again.","Giao dịch thất bại, vui lòng thử lại."]],"c":"Đối soát.","col":["failed transaction","transaction ID"],"rel":["payment gateway"]},{"t":"payment failure","p":"n","vi":"thanh toán thất bại","d":"Giao dịch không thành công do thẻ, số dư, mạng hoặc hệ thống.","ex":[["Payment failures spiked at midnight on 11.11.","Thanh toán thất bại tăng vọt lúc nửa đêm 11.11."]],"c":"Phân tích bỏ giỏ.","col":["declined payment"],"rel":["cart abandonment"]},{"t":"pending payment","p":"n","vi":"chờ thanh toán","d":"Đơn đã đặt nhưng chưa trả tiền. Sau một thời gian sẽ tự hủy.","ex":[["Remind buyers with pending payments before the voucher expires.","Nhắc khách đang chờ thanh toán trước khi voucher hết hạn."]],"c":"Theo dõi đơn.","col":["unpaid order"],"rel":["order status"]},{"t":"escrow","p":"n","vi":"giữ tiền trung gian","d":"Sàn giữ tiền khách trả cho đến khi đơn hoàn tất mới chuyển cho người bán.","ex":[["Funds stay in escrow until the buyer confirms receipt.","Tiền được sàn giữ cho đến khi khách xác nhận đã nhận."]],"c":"Hiểu dòng tiền sàn.","col":["escrow release"],"rel":["payout"]},{"t":"chargeback","p":"n","vi":"hoàn tiền bắt buộc từ ngân hàng","d":"Khách khiếu nại với ngân hàng phát hành thẻ và giao dịch bị đảo ngược.","ex":[["We lost the chargeback because we had no proof of delivery.","Thua yêu cầu hoàn tiền vì không có bằng chứng giao hàng."]],"c":"Rủi ro thanh toán thẻ.","col":["chargeback rate"],"rel":["proof of delivery","fraud"]},{"t":"fraud","p":"n","vi":"gian lận","d":"Hành vi lừa đảo như dùng thẻ đánh cắp, đặt đơn ảo, lạm dụng voucher.","ex":[["The system flagged 30 orders for possible fraud.","Hệ thống đánh dấu 30 đơn nghi gian lận."]],"c":"Quản lý rủi ro.","col":["fraud detection","fraudulent"],"rel":["promo code abuse"]},{"t":"fake order","p":"n","vi":"đơn ảo","d":"Đơn không có thật, đặt để tăng doanh số hoặc phá hoại. Sàn phạt nặng.","ex":[["Fake orders can get the shop suspended.","Đơn ảo có thể khiến shop bị đình chỉ."]],"c":"Tuân thủ.","col":["order brushing"],"rel":["fraud","policy violation"]},{"t":"order brushing","p":"n","vi":"tạo đơn ảo tăng hạng","d":"Tự đặt đơn giả để tăng lượt bán và thứ hạng. Bị cấm trên mọi sàn.","ex":[["Order brushing is strictly prohibited.","Tạo đơn ảo bị nghiêm cấm."]],"c":"Tuân thủ.","col":["brushing"],"rel":["fake order"]},{"t":"refund processing","p":"n","vi":"xử lý hoàn tiền","d":"Quy trình trả tiền lại cho khách sau khi duyệt trả hàng.","ex":[["Refund processing takes 3 to 7 working days.","Xử lý hoàn tiền mất 3 đến 7 ngày làm việc."]],"c":"CS, tài chính.","col":["refund time"],"rel":["refund"]},{"t":"working days","p":"n","vi":"ngày làm việc","d":"Ngày từ thứ Hai đến thứ Sáu, không tính lễ. Còn gọi là business days.","ex":[["You'll receive the refund within 5 working days.","Bạn sẽ nhận tiền hoàn trong 5 ngày làm việc."]],"c":"Hẹn thời gian.","col":["business days"],"rel":["refund processing"]},{"t":"receipt","p":"n","vi":"biên nhận","d":"Chứng từ xác nhận đã thanh toán.","ex":[["You can download the receipt from the order page.","Có thể tải biên nhận ở trang đơn hàng."]],"c":"Khách hỏi chứng từ.","col":["e-receipt","proof of payment"],"rel":["invoice"]},{"t":"e-invoice","p":"n","vi":"hóa đơn điện tử","d":"Hóa đơn tạo và gửi dạng điện tử, bắt buộc với doanh nghiệp ở Việt Nam.","ex":[["Send the company's tax code to get an e-invoice.","Gửi mã số thuế công ty để nhận hóa đơn điện tử."]],"c":"Khách doanh nghiệp yêu cầu hóa đơn.","col":["issue an e-invoice","tax code"],"rel":["invoice","VAT"]},{"t":"tax code","p":"n","vi":"mã số thuế","d":"Mã định danh thuế của doanh nghiệp hoặc cá nhân.","ex":[["Please provide your company tax code.","Vui lòng cung cấp mã số thuế công ty."]],"c":"Xuất hóa đơn.","col":["tax ID"],"rel":["e-invoice"]},{"t":"checkout flow","p":"n","vi":"luồng thanh toán","d":"Các bước từ giỏ hàng đến đặt đơn thành công. Càng ít bước càng ít bỏ giỏ.","ex":[["We simplified the checkout flow from five steps to three.","Rút gọn luồng thanh toán từ năm bước còn ba."]],"c":"Tối ưu website.","col":["one-click checkout","guest checkout"],"rel":["checkout","cart abandonment"]},{"t":"one-click checkout","p":"n","vi":"thanh toán một chạm","d":"Lưu sẵn thông tin để khách đặt đơn chỉ với một lần bấm.","ex":[["One-click checkout reduces drop-off on mobile.","Thanh toán một chạm giảm rớt khách trên điện thoại."]],"c":"Tối ưu chuyển đổi.","col":["express checkout"],"rel":["checkout flow"]},{"t":"shipping address","p":"n","vi":"địa chỉ giao hàng","d":"Nơi nhận hàng. Billing address là địa chỉ thanh toán.","ex":[["Please double-check your shipping address.","Vui lòng kiểm tra lại địa chỉ giao hàng."]],"c":"Đặt hàng, xử lý sai địa chỉ.","col":["delivery address","billing address"],"rel":["failed delivery"]},{"t":"order confirmation","p":"n","vi":"xác nhận đơn hàng","d":"Thông báo hoặc email xác nhận khách đã đặt đơn thành công.","ex":[["Customers receive an order confirmation by SMS.","Khách nhận xác nhận đơn qua tin nhắn."]],"c":"Trải nghiệm khách.","col":["confirmation email","order number"],"rel":["order status"]},{"t":"order number","p":"n","vi":"mã đơn hàng","d":"Mã định danh duy nhất của đơn.","ex":[["Could you send me your order number?","Bạn gửi giúp mình mã đơn hàng nhé?"]],"c":"CS, đối soát.","col":["order ID"],"rel":["order confirmation"]},{"t":"currency","p":"n","vi":"tiền tệ","d":"Đơn vị tiền: VND, USD. Exchange rate là tỷ giá.","ex":[["Report all figures in VND.","Báo cáo mọi số liệu bằng VND."]],"c":"Bán xuyên biên giới, báo cáo.","col":["exchange rate","local currency"],"rel":[]},{"t":"exchange rate","p":"n","vi":"tỷ giá","d":"Tỷ lệ quy đổi giữa hai loại tiền.","ex":[["We used an exchange rate of 25,000 VND per USD.","Dùng tỷ giá 25.000 đồng một USD."]],"c":"Nhập hàng, bán quốc tế.","col":["FX rate"],"rel":["currency"]},{"t":"deposit","p":"n","vi":"tiền đặt cọc","d":"Khoản trả trước một phần để giữ hàng hoặc giữ lịch.","ex":[["Pay a 30% deposit to confirm the booking.","Đặt cọc 30% để xác nhận lịch."]],"c":"Pre-sale, booking KOL.","col":["down payment","balance payment"],"rel":["pre-sale","payment terms"]},{"t":"balance payment","p":"n","vi":"phần tiền còn lại","d":"Khoản thanh toán nốt sau tiền cọc.","ex":[["The balance payment is due after delivery.","Phần còn lại thanh toán sau khi giao."]],"c":"Pre-sale, hợp đồng.","col":["remaining balance"],"rel":["deposit"]},{"t":"outstanding","p":"adj","vi":"còn tồn, chưa thanh toán","d":"Khoản tiền hoặc việc chưa hoàn thành.","ex":[["There's an outstanding invoice from September.","Còn một hóa đơn tháng 9 chưa thanh toán."]],"c":"Nhắc thanh toán, nhắc việc.","col":["outstanding balance","outstanding issues"],"rel":["overdue"]},{"t":"overdue","p":"adj","vi":"quá hạn","d":"Đã qua hạn thanh toán hoặc hạn hoàn thành.","ex":[["This invoice is 15 days overdue.","Hóa đơn này đã quá hạn 15 ngày."]],"c":"Nhắc thanh toán.","col":["overdue payment"],"rel":["outstanding","invoice"]}]},{"id":"supply","code":"SUPPLY","group":"Thương mại điện tử","en":"Sourcing & Supply Chain","vi":"Nguồn hàng và chuỗi cung ứng","intro":"Từ vựng làm việc với nhà cung cấp, nhà máy, nhập khẩu và kiểm soát chất lượng.","terms":[{"t":"supply chain","p":"n","vi":"chuỗi cung ứng","d":"Toàn bộ dòng chảy từ nguyên liệu, sản xuất, kho, vận chuyển đến tay khách.","ex":[["Supply chain delays affected our 11.11 stock.","Chậm trễ chuỗi cung ứng ảnh hưởng hàng 11.11."]],"c":"Nói chung về vận hành.","col":["supply chain management","disruption"],"rel":[]},{"t":"supplier","p":"n","vi":"nhà cung cấp","d":"Đơn vị cung cấp hàng hóa hoặc nguyên liệu. Còn gọi vendor.","ex":[["We're looking for a new packaging supplier.","Đang tìm nhà cung cấp bao bì mới."]],"c":"Nhập hàng.","col":["vendor","supplier list"],"rel":["manufacturer"]},{"t":"manufacturer","p":"n","vi":"nhà sản xuất","d":"Đơn vị trực tiếp sản xuất sản phẩm.","ex":[["The manufacturer is based in Binh Duong.","Nhà sản xuất ở Bình Dương."]],"c":"Nguồn hàng.","col":["factory","maker"],"rel":["OEM"]},{"t":"sourcing","p":"n","vi":"tìm nguồn hàng","d":"Tìm và chọn nhà cung cấp phù hợp về giá, chất lượng, năng lực.","ex":[["Sourcing from overseas takes longer.","Tìm hàng từ nước ngoài mất nhiều thời gian hơn."]],"c":"Phát triển sản phẩm.","col":["source products","sourcing agent"],"rel":["supplier"]},{"t":"OEM","p":"abbr","vi":"gia công theo thiết kế của khách","d":"Nhà máy sản xuất theo công thức, thiết kế của brand, gắn nhãn brand.","ex":[["Our serum is made by an OEM in Korea.","Serum được gia công bởi một nhà máy OEM ở Hàn Quốc."]],"f":"Original Equipment Manufacturer","c":"Phát triển sản phẩm riêng.","col":["OEM factory"],"rel":["ODM","private label"]},{"t":"ODM","p":"abbr","vi":"nhà máy tự thiết kế và sản xuất","d":"Nhà máy có sẵn công thức, mẫu thiết kế; brand chọn và gắn nhãn.","ex":[["An ODM product can launch in two months.","Sản phẩm ODM có thể ra mắt trong hai tháng."]],"f":"Original Design Manufacturer","c":"Ra sản phẩm nhanh.","col":["ODM catalog"],"rel":["OEM"]},{"t":"private label","p":"n","vi":"nhãn hàng riêng","d":"Sản phẩm do bên thứ ba sản xuất nhưng bán dưới thương hiệu riêng của người bán.","ex":[["We're launching a private label skincare line.","Bọn mình ra dòng chăm da nhãn hàng riêng."]],"c":"Chiến lược sản phẩm.","col":["white label","own brand"],"rel":["OEM"]},{"t":"MOQ","p":"abbr","vi":"số lượng đặt hàng tối thiểu","d":"Số lượng nhỏ nhất nhà cung cấp chấp nhận cho một đơn.","ex":[["The MOQ is 3,000 units per SKU.","Đặt tối thiểu 3.000 cái mỗi SKU."]],"f":"Minimum Order Quantity","c":"Đàm phán nhập hàng.","col":["meet the MOQ"],"rel":["supplier","unit cost"]},{"t":"unit cost","p":"n","vi":"giá mỗi đơn vị","d":"Chi phí cho một sản phẩm.","ex":[["Unit cost drops to 40k if we order 10,000 units.","Giá mỗi cái giảm còn 40k nếu đặt 10.000 cái."]],"c":"Tính giá vốn.","col":["cost per unit"],"rel":["COGS","MOQ"]},{"t":"landed cost","p":"n","vi":"giá vốn về kho","d":"Tổng chi phí để hàng về tới kho: giá mua, vận chuyển, thuế, phí hải quan.","ex":[["The landed cost is 30% higher than the factory price.","Giá về kho cao hơn giá xuất xưởng 30%."]],"c":"Nhập khẩu, tính giá.","col":["total landed cost"],"rel":["COGS"]},{"t":"quotation request","p":"n","vi":"yêu cầu báo giá","d":"Văn bản gửi nhà cung cấp đề nghị báo giá. RFQ là request for quotation.","ex":[["Send an RFQ to three suppliers.","Gửi yêu cầu báo giá cho ba nhà cung cấp."]],"f":"RFQ","c":"Nhập hàng.","col":["request for quotation"],"rel":["quotation"]},{"t":"sample","p":"n","vi":"hàng mẫu","d":"Sản phẩm mẫu để kiểm tra chất lượng trước khi đặt số lượng lớn.","ex":[["Approve the sample before mass production.","Duyệt mẫu trước khi sản xuất hàng loạt."]],"c":"Phát triển sản phẩm.","col":["pre-production sample","golden sample"],"rel":["free sample","mass production"]},{"t":"mass production","p":"n","vi":"sản xuất hàng loạt","d":"Sản xuất số lượng lớn sau khi duyệt mẫu.","ex":[["Mass production starts next week.","Tuần sau bắt đầu sản xuất hàng loạt."]],"c":"Phát triển sản phẩm.","col":["bulk production"],"rel":["sample"]},{"t":"production lead time","p":"n","vi":"thời gian sản xuất","d":"Thời gian nhà máy cần để làm xong đơn.","ex":[["Production lead time is 45 days.","Thời gian sản xuất là 45 ngày."]],"c":"Kế hoạch nhập hàng.","col":["lead time"],"rel":["lead time"]},{"t":"purchase order","p":"n","vi":"đơn đặt hàng nhà cung cấp","d":"Chứng từ đặt mua chính thức gửi nhà cung cấp (viết tắt PO).","ex":[["Issue the purchase order once the price is agreed.","Phát hành đơn đặt hàng khi đã chốt giá."]],"c":"Nhập hàng.","col":["issue a PO"],"rel":["PO"]},{"t":"procurement","p":"n","vi":"mua hàng, thu mua","d":"Quy trình mua hàng hóa, dịch vụ cho doanh nghiệp.","ex":[["Procurement must approve all new suppliers.","Bộ phận mua hàng phải duyệt mọi nhà cung cấp mới."]],"c":"Vận hành doanh nghiệp.","col":["procurement team","purchasing"],"rel":["supplier"]},{"t":"import","p":"v, n","vi":"nhập khẩu","d":"Đưa hàng từ nước ngoài vào. Xuất khẩu là export.","ex":[["We import skincare products from Korea.","Bọn mình nhập mỹ phẩm từ Hàn Quốc."]],"c":"Nguồn hàng nước ngoài.","col":["importer","import duty"],"rel":["customs","export"]},{"t":"export","p":"v, n","vi":"xuất khẩu","d":"Bán hàng ra nước ngoài.","ex":[["We started exporting to Malaysia this year.","Năm nay bắt đầu xuất khẩu sang Malaysia."]],"c":"Bán xuyên biên giới.","col":["exporter"],"rel":["import"]},{"t":"customs","p":"n","vi":"hải quan","d":"Cơ quan kiểm soát hàng hóa ra vào quốc gia. Customs clearance là thông quan.","ex":[["The shipment is stuck at customs.","Lô hàng đang kẹt ở hải quan."]],"c":"Nhập khẩu.","col":["customs clearance","customs declaration"],"rel":["import duty"]},{"t":"import duty","p":"n","vi":"thuế nhập khẩu","d":"Thuế đánh lên hàng nhập.","ex":[["Import duty for this category is 10%.","Thuế nhập khẩu ngành này là 10%."]],"c":"Tính giá vốn.","col":["tariff","duties"],"rel":["landed cost"]},{"t":"HS code","p":"n","vi":"mã HS","d":"Mã phân loại hàng hóa quốc tế dùng khai hải quan và tính thuế.","ex":[["Check the HS code before declaring the goods.","Kiểm tra mã HS trước khi khai báo."]],"f":"Harmonized System code","c":"Nhập khẩu.","col":["tariff code"],"rel":["customs"]},{"t":"incoterms","p":"n","vi":"điều kiện thương mại quốc tế","d":"Bộ điều kiện quy định trách nhiệm, chi phí giữa người mua và bán, ví dụ FOB, CIF, EXW, DDP.","ex":[["The quote is FOB Shanghai.","Báo giá theo điều kiện FOB Thượng Hải."]],"c":"Đàm phán nhập khẩu.","col":["FOB","CIF","EXW","DDP"],"rel":["landed cost"]},{"t":"freight","p":"n","vi":"cước vận chuyển hàng hóa","d":"Phí vận chuyển hàng số lượng lớn. Sea freight là đường biển, air freight là đường hàng không.","ex":[["Sea freight is cheaper but takes 3 weeks.","Đường biển rẻ hơn nhưng mất 3 tuần."]],"c":"Nhập khẩu.","col":["sea freight","air freight","freight forwarder"],"rel":[]},{"t":"freight forwarder","p":"n","vi":"công ty giao nhận","d":"Đơn vị thay mặt chủ hàng lo vận chuyển quốc tế, thủ tục hải quan.","ex":[["Our freight forwarder handles customs clearance.","Công ty giao nhận lo thủ tục thông quan."]],"c":"Nhập khẩu.","col":["forwarder","logistics agent"],"rel":["customs","freight"]},{"t":"certificate of origin","p":"n","vi":"giấy chứng nhận xuất xứ","d":"Chứng từ xác nhận hàng sản xuất ở nước nào, có thể giúp giảm thuế.","ex":[["The C/O is needed to get the lower tariff.","Cần C/O để được thuế thấp hơn."]],"f":"C/O","c":"Nhập khẩu, chứng minh nguồn gốc.","col":["C/O"],"rel":["customs"]},{"t":"quality control","p":"n","vi":"kiểm soát chất lượng","d":"Kiểm tra sản phẩm đạt tiêu chuẩn. QA (quality assurance) là đảm bảo chất lượng cả quy trình.","ex":[["Quality control found scratches on 5% of units.","Kiểm soát chất lượng phát hiện 5% sản phẩm bị xước."]],"c":"Sản xuất, nhập hàng.","col":["QC","QA","inspection"],"rel":["quality check","defective"]},{"t":"defect rate","p":"n","vi":"tỉ lệ lỗi","d":"Phần trăm sản phẩm lỗi trên tổng số.","ex":[["The supplier's defect rate must stay under 1%.","Tỉ lệ lỗi của nhà cung cấp phải dưới 1%."]],"c":"Đánh giá nhà cung cấp.","col":["AQL"],"rel":["defective","quality control"]},{"t":"recall","p":"n, v","vi":"thu hồi sản phẩm","d":"Rút sản phẩm khỏi thị trường vì lỗi hoặc nguy hiểm.","ex":[["The brand issued a recall for batch 2306.","Brand thu hồi lô 2306."]],"c":"Xử lý khủng hoảng.","col":["product recall"],"rel":["batch number"]},{"t":"compliance certificate","p":"n","vi":"giấy chứng nhận hợp quy","d":"Giấy tờ chứng minh sản phẩm đạt quy chuẩn, ví dụ công bố mỹ phẩm, chứng nhận an toàn.","ex":[["Upload the compliance certificate to list the product.","Tải giấy chứng nhận hợp quy để đăng sản phẩm."]],"c":"Đăng bán ngành hạn chế.","col":["product certification","registration"],"rel":["restricted category"]},{"t":"supplier evaluation","p":"n","vi":"đánh giá nhà cung cấp","d":"Chấm điểm nhà cung cấp theo chất lượng, giá, tiến độ, hỗ trợ.","ex":[["Do a supplier evaluation every quarter.","Đánh giá nhà cung cấp hằng quý."]],"c":"Quản lý nhà cung cấp.","col":["vendor scorecard"],"rel":["supplier"]},{"t":"single source","p":"n","vi":"một nguồn duy nhất","d":"Chỉ phụ thuộc một nhà cung cấp, rủi ro cao. Multi-sourcing là dùng nhiều nguồn.","ex":[["Avoid single source for the hero product.","Tránh phụ thuộc một nguồn cho sản phẩm chủ lực."]],"c":"Quản lý rủi ro.","col":["multi-sourcing","backup supplier"],"rel":["supplier"]},{"t":"demand planning","p":"n","vi":"hoạch định nhu cầu","d":"Dự báo lượng hàng cần dựa trên doanh số cũ, chiến dịch, mùa vụ.","ex":[["Demand planning for Q4 starts in August.","Hoạch định nhu cầu quý 4 bắt đầu từ tháng 8."]],"c":"Lập kế hoạch nhập hàng.","col":["demand forecast"],"rel":["forecast","seasonality"]},{"t":"stockout risk","p":"n","vi":"nguy cơ hết hàng","d":"Khả năng hết hàng trước khi hàng mới về.","ex":[["There's a high stockout risk for the 11.11 hero product.","Sản phẩm chủ lực 11.11 có nguy cơ hết hàng cao."]],"c":"Kế hoạch kho.","col":["risk of running out"],"rel":["out of stock","stock coverage"]},{"t":"overstock","p":"n, v","vi":"tồn kho dư thừa","d":"Nhập quá nhiều so với nhu cầu, gây đọng vốn.","ex":[["We overstocked on summer items.","Mình nhập dư hàng mùa hè."]],"c":"Kế hoạch kho.","col":["excess inventory"],"rel":["dead stock","working capital"]}]},{"id":"merch","code":"MERCH","group":"Thương mại điện tử","en":"Merchandising & Product Strategy","vi":"Ngành hàng và chiến lược sản phẩm","intro":"Chọn sản phẩm, xây danh mục, định giá theo dòng sản phẩm và phân tích hiệu quả từng mã.","terms":[{"t":"merchandising","p":"n","vi":"trưng bày và quản lý hàng hóa","d":"Chọn sản phẩm, sắp xếp, định giá, trưng bày để tối đa doanh số. Người làm gọi là merchandiser.","ex":[["Online merchandising includes banners, ranking and bundles.","Trưng bày online gồm banner, thứ tự sản phẩm và combo."]],"c":"Vận hành ngành hàng.","col":["visual merchandising","merchandiser"],"rel":["product lineup","storefront"]},{"t":"assortment","p":"n","vi":"cơ cấu hàng hóa","d":"Tập hợp các sản phẩm shop bán, theo chiều rộng (số dòng) và chiều sâu (số phân loại).","ex":[["Our assortment is too wide for a small team.","Cơ cấu hàng quá rộng so với team nhỏ."]],"c":"Lập kế hoạch sản phẩm.","col":["assortment planning","product range"],"rel":["product mix"]},{"t":"product range","p":"n","vi":"dòng sản phẩm, dải sản phẩm","d":"Các sản phẩm cùng một nhóm hoặc của cùng thương hiệu.","ex":[["The brand's product range covers cleansing to sun care.","Dải sản phẩm của brand từ làm sạch đến chống nắng."]],"c":"Giới thiệu brand.","col":["product line","full range"],"rel":["assortment"]},{"t":"product line","p":"n","vi":"dòng sản phẩm","d":"Nhóm sản phẩm liên quan cùng thương hiệu, ví dụ dòng trị mụn.","ex":[["The acne product line has five items.","Dòng trị mụn có năm sản phẩm."]],"c":"Giới thiệu sản phẩm.","col":["line extension"],"rel":["product range"]},{"t":"product mix","p":"n","vi":"tổ hợp sản phẩm","d":"Tỉ lệ các loại sản phẩm trong danh mục hoặc trong doanh số.","ex":[["Shift the product mix toward higher-margin items.","Chuyển tổ hợp sản phẩm sang các mã biên lợi nhuận cao hơn."]],"c":"Phân tích doanh số.","col":["sales mix"],"rel":["assortment","margin"]},{"t":"SKU rationalization","p":"n","vi":"tinh gọn mã hàng","d":"Loại bớt mã bán kém để tập trung vào mã hiệu quả.","ex":[["SKU rationalization cut 30% of our slow sellers.","Tinh gọn mã hàng loại bỏ 30% mã bán chậm."]],"c":"Tối ưu danh mục.","col":["cut SKUs"],"rel":["slow-moving","SKU"]},{"t":"ABC analysis","p":"n","vi":"phân tích ABC","d":"Chia sản phẩm thành nhóm A (đóng góp nhiều doanh số nhất), B, C để ưu tiên quản lý.","ex":[["ABC analysis shows 20 SKUs make 80% of GMV.","Phân tích ABC cho thấy 20 SKU tạo 80% GMV."]],"c":"Phân tích danh mục.","col":["Pareto","80/20 rule"],"rel":["SKU rationalization"]},{"t":"80/20 rule","p":"n","vi":"quy tắc 80/20","d":"Khoảng 80% kết quả đến từ 20% nguyên nhân, ví dụ 20% sản phẩm tạo 80% doanh số. Còn gọi nguyên lý Pareto.","ex":[["By the 80/20 rule, focus on the top 20% of SKUs.","Theo quy tắc 80/20, tập trung vào 20% mã hàng đầu."]],"c":"Phân tích, ưu tiên.","col":["Pareto principle"],"rel":["ABC analysis"]},{"t":"traffic product","p":"n","vi":"sản phẩm kéo traffic","d":"Sản phẩm giá hấp dẫn dùng để thu hút người xem, thường biên lợi nhuận thấp.","ex":[["Use the 9k cotton pads as a traffic product.","Dùng bông tẩy trang 9k làm sản phẩm kéo traffic."]],"c":"Thiết kế lineup.","col":["traffic driver"],"rel":["loss leader"]},{"t":"profit product","p":"n","vi":"sản phẩm tạo lợi nhuận","d":"Sản phẩm có biên lợi nhuận cao, đóng góp chính vào lợi nhuận.","ex":[["Push profit products after the traffic products warm up the room.","Đẩy sản phẩm lợi nhuận sau khi sản phẩm kéo traffic làm nóng phòng."]],"c":"Thiết kế lineup.","col":["margin product"],"rel":["traffic product","hero product"]},{"t":"image product","p":"n","vi":"sản phẩm định vị hình ảnh","d":"Sản phẩm cao cấp giúp nâng hình ảnh thương hiệu, không nhất thiết bán nhiều.","ex":[["The luxury set is an image product, not a volume driver.","Set cao cấp là sản phẩm định vị hình ảnh, không phải để bán số lượng."]],"c":"Chiến lược danh mục.","col":["flagship product"],"rel":["hero product"]},{"t":"flagship product","p":"n","vi":"sản phẩm chủ lực, tiêu biểu","d":"Sản phẩm đại diện tiêu biểu nhất của thương hiệu.","ex":[["The vitamin C serum is the brand's flagship product.","Serum vitamin C là sản phẩm tiêu biểu của brand."]],"c":"Giới thiệu brand.","col":["flagship"],"rel":["hero product"]},{"t":"gift set","p":"n","vi":"bộ quà tặng","d":"Bộ nhiều sản phẩm đóng hộp đẹp để làm quà, bán mạnh dịp lễ.","ex":[["Gift sets drive 40% of December GMV.","Bộ quà tặng mang về 40% GMV tháng 12."]],"c":"Thiết kế sản phẩm theo mùa.","col":["holiday set","gift box"],"rel":["bundle","seasonality"]},{"t":"mini size","p":"n","vi":"bản mini","d":"Sản phẩm dung tích nhỏ để dùng thử hoặc mang du lịch. Còn gọi travel size, trial size.","ex":[["Mini sizes are great gifts with purchase.","Bản mini rất hợp làm quà tặng kèm."]],"c":"Thiết kế sản phẩm, quà tặng.","col":["travel size","trial size"],"rel":["gift with purchase"]},{"t":"full size","p":"n","vi":"bản đầy đủ","d":"Sản phẩm dung tích tiêu chuẩn.","ex":[["Buy the full size and get a mini for free.","Mua bản đầy đủ tặng bản mini."]],"c":"Phân biệt với bản mini.","col":["full-size product"],"rel":["mini size"]},{"t":"refill","p":"n","vi":"lõi thay, bản refill","d":"Gói nạp lại thay cho sản phẩm đã dùng hết, rẻ hơn và thân thiện môi trường.","ex":[["The refill is 30% cheaper than the full bottle.","Bản refill rẻ hơn chai đầy đủ 30%."]],"c":"Bán hàng mua lại.","col":["refill pack","refillable"],"rel":["repeat customer"]},{"t":"limited edition","p":"n","vi":"phiên bản giới hạn","d":"Sản phẩm sản xuất số lượng hạn chế hoặc chỉ trong thời gian ngắn.","ex":[["The Tet limited edition sold out in one live.","Phiên bản giới hạn Tết bán hết trong một phiên live."]],"c":"Tạo khan hiếm.","col":["limited run","exclusive edition"],"rel":["scarcity"]},{"t":"collaboration product","p":"n","vi":"sản phẩm hợp tác","d":"Sản phẩm brand hợp tác với nghệ sĩ, thương hiệu khác hoặc KOL.","ex":[["The collab product with the artist drew new customers.","Sản phẩm hợp tác với nghệ sĩ thu hút khách mới."]],"c":"Ra mắt đặc biệt.","col":["collab","co-branding"],"rel":["limited edition"]},{"t":"product development","p":"n","vi":"phát triển sản phẩm","d":"Quá trình tạo sản phẩm mới từ ý tưởng tới ra mắt. Viết tắt NPD (new product development).","ex":[["Live comments give great input for product development.","Bình luận live là đầu vào tốt cho phát triển sản phẩm."]],"c":"Brand, nhà sản xuất.","col":["NPD","R&D"],"rel":["product launch"]},{"t":"product-market fit","p":"n","vi":"sản phẩm phù hợp thị trường","d":"Khi sản phẩm đáp ứng đúng nhu cầu một thị trường đủ lớn, bán được ổn định.","ex":[["Strong repeat purchases show product-market fit.","Mua lại nhiều cho thấy sản phẩm phù hợp thị trường."]],"c":"Khởi nghiệp, sản phẩm mới.","col":["PMF"],"rel":["repeat purchase rate"]},{"t":"category growth","p":"n","vi":"tăng trưởng ngành hàng","d":"Tốc độ tăng doanh số của cả ngành hàng trên sàn.","ex":[["Category growth for sunscreen is 35% YoY.","Ngành kem chống nắng tăng 35% so với năm trước."]],"c":"Phân tích thị trường.","col":["category trend"],"rel":["market share"]},{"t":"whitespace","p":"n","vi":"khoảng trống thị trường","d":"Nhu cầu chưa được sản phẩm nào đáp ứng tốt.","ex":[["There's whitespace for sunscreen for men.","Có khoảng trống cho kem chống nắng dành cho nam."]],"c":"Phát triển sản phẩm.","col":["market gap","untapped"],"rel":["product development"]},{"t":"sell-through rate","p":"n","vi":"tỉ lệ bán hết","d":"Phần trăm hàng đã bán so với lượng nhập trong một kỳ.","ex":[["Sell-through rate for the new collection is 70% in two weeks.","Bộ sưu tập mới bán được 70% trong hai tuần."]],"c":"Đánh giá sản phẩm, đợt hàng.","col":["STR"],"rel":["inventory turnover"],"fm":"Tỉ lệ bán hết = số đã bán ÷ số đã nhập × 100%"},{"t":"sell-in","p":"n","vi":"hàng bán vào kênh","d":"Lượng hàng brand bán cho nhà phân phối hoặc đại lý. Sell-out là lượng bán ra cho người tiêu dùng cuối.","ex":[["Sell-in was strong but sell-out is slow.","Hàng vào kênh mạnh nhưng bán ra chậm."]],"c":"Làm việc với brand, nhà phân phối.","col":["sell-out","sell-through"],"rel":["sell-through rate"]}]},{"id":"legal","code":"LEGAL","group":"Thương mại điện tử","en":"Legal, Policy & IP","vi":"Pháp lý, chính sách và sở hữu trí tuệ","intro":"Khái niệm pháp lý hay gặp: nhãn hiệu, hàng giả, bảo vệ người tiêu dùng, quảng cáo, dữ liệu cá nhân. Đây là từ vựng tham khảo, không thay cho tư vấn pháp lý.","terms":[{"t":"terms and conditions","p":"n","vi":"điều khoản và điều kiện","d":"Quy định áp dụng cho chương trình, dịch vụ. Hay ghi “áp dụng điều kiện”.","ex":[["Giveaway T&Cs are pinned in the comments.","Điều khoản minigame được ghim trong bình luận."]],"f":"T&Cs","c":"Khuyến mãi, minigame.","col":["T&Cs apply"],"rel":["giveaway","policy"]},{"t":"policy","p":"n","vi":"chính sách","d":"Bộ quy định chính thức, ví dụ return policy, privacy policy.","ex":[["Our return policy allows exchanges within 7 days.","Chính sách cho phép đổi hàng trong 7 ngày."]],"c":"Nói chung.","col":["return policy","privacy policy"],"rel":["terms and conditions"]},{"t":"trademark","p":"n","vi":"nhãn hiệu","d":"Tên, logo được đăng ký bảo hộ. Dùng nhãn hiệu người khác trái phép là vi phạm.","ex":[["Register the trademark before launching.","Đăng ký nhãn hiệu trước khi ra mắt."]],"c":"Đăng ký thương hiệu, xử lý vi phạm.","col":["registered trademark","TM","®"],"rel":["intellectual property","counterfeit"]},{"t":"intellectual property","p":"n","vi":"sở hữu trí tuệ","d":"Tài sản vô hình: nhãn hiệu, bản quyền, kiểu dáng, sáng chế.","ex":[["Using their photos without permission is an IP violation.","Dùng ảnh của họ không xin phép là vi phạm sở hữu trí tuệ."]],"f":"IP","c":"Pháp lý.","col":["IP rights","IP infringement"],"rel":["trademark","copyright"]},{"t":"counterfeit","p":"n, adj","vi":"hàng giả","d":"Hàng nhái thương hiệu thật để đánh lừa người mua.","ex":[["Report counterfeit listings to the platform.","Báo cáo các sản phẩm hàng giả với sàn."]],"c":"Bảo vệ thương hiệu.","col":["fake goods","knock-off"],"rel":["authenticity","trademark"]},{"t":"infringement","p":"n","vi":"hành vi vi phạm (quyền)","d":"Xâm phạm quyền của người khác, ví dụ trademark infringement.","ex":[["We received an infringement notice for using a song.","Bị thông báo vi phạm vì dùng một bài hát."]],"c":"Pháp lý.","col":["copyright infringement","infringe"],"rel":["intellectual property"]},{"t":"takedown request","p":"n","vi":"yêu cầu gỡ bỏ","d":"Yêu cầu nền tảng gỡ nội dung hoặc sản phẩm vi phạm.","ex":[["File a takedown request for the fake shop.","Gửi yêu cầu gỡ shop bán hàng giả."]],"c":"Bảo vệ thương hiệu.","col":["takedown notice"],"rel":["counterfeit"]},{"t":"brand protection","p":"n","vi":"bảo vệ thương hiệu","d":"Hoạt động phát hiện và xử lý hàng giả, bán phá giá, dùng trái phép thương hiệu.","ex":[["The brand protection team monitors unauthorized sellers.","Đội bảo vệ thương hiệu theo dõi người bán không được ủy quyền."]],"c":"Làm việc với brand.","col":["brand registry"],"rel":["counterfeit"]},{"t":"consumer protection","p":"n","vi":"bảo vệ quyền lợi người tiêu dùng","d":"Luật và quy định bảo vệ người mua: thông tin trung thực, đổi trả, bảo hành.","ex":[["Misleading discounts may break consumer protection laws.","Giảm giá gây hiểu nhầm có thể vi phạm luật bảo vệ người tiêu dùng."]],"c":"Tuân thủ.","col":["consumer rights"],"rel":["compliance"]},{"t":"misleading advertising","p":"n","vi":"quảng cáo gây hiểu nhầm","d":"Quảng cáo sai sự thật hoặc phóng đại khiến người mua hiểu sai.","ex":[["'Cures acne in 3 days' is misleading advertising.","“Hết mụn sau 3 ngày” là quảng cáo gây hiểu nhầm."]],"c":"Kiểm duyệt nội dung.","col":["false advertising"],"rel":["product claims","consumer protection"]},{"t":"disclaimer","p":"n","vi":"tuyên bố miễn trừ","d":"Câu lưu ý giới hạn trách nhiệm, ví dụ “kết quả tùy cơ địa”.","ex":[["Add a disclaimer: results may vary.","Thêm lưu ý: kết quả có thể khác nhau tùy người."]],"c":"Nội dung quảng cáo.","col":["results may vary"],"rel":["product claims"]},{"t":"personal data","p":"n","vi":"dữ liệu cá nhân","d":"Thông tin xác định một người: tên, số điện thoại, địa chỉ. Phải bảo mật và dùng đúng mục đích.","ex":[["Never share customers' personal data in group chats.","Không bao giờ gửi dữ liệu cá nhân khách vào nhóm chat."]],"c":"Xử lý đơn, CRM.","col":["data privacy","PII"],"rel":["privacy policy"]},{"t":"privacy policy","p":"n","vi":"chính sách bảo mật","d":"Văn bản giải thích cách thu thập và sử dụng dữ liệu người dùng.","ex":[["Update the privacy policy before collecting emails.","Cập nhật chính sách bảo mật trước khi thu thập email."]],"c":"Website, CRM.","col":["data protection"],"rel":["personal data"]},{"t":"consent","p":"n","vi":"sự đồng ý","d":"Người dùng cho phép thu thập dữ liệu hoặc nhận tin nhắn quảng cáo.","ex":[["Only send promos to customers who gave consent.","Chỉ gửi khuyến mãi cho khách đã đồng ý."]],"c":"CRM, marketing.","col":["opt-in","opt-out"],"rel":["personal data"]},{"t":"liability","p":"n","vi":"trách nhiệm pháp lý","d":"Trách nhiệm phải chịu khi có thiệt hại.","ex":[["The contract limits our liability to the service fee.","Hợp đồng giới hạn trách nhiệm của bên mình trong phạm vi phí dịch vụ."]],"c":"Hợp đồng.","col":["limited liability","liable for"],"rel":["contract"]},{"t":"clause","p":"n","vi":"điều khoản (trong hợp đồng)","d":"Một mục trong hợp đồng.","ex":[["Let's revise the payment clause.","Sửa điều khoản thanh toán nhé."]],"c":"Đọc, đàm phán hợp đồng.","col":["termination clause","penalty clause"],"rel":["contract"]},{"t":"termination","p":"n","vi":"chấm dứt hợp đồng","d":"Kết thúc hợp đồng trước hạn hoặc theo điều kiện.","ex":[["Either party can request termination with 30 days' notice.","Mỗi bên có thể chấm dứt hợp đồng với thông báo trước 30 ngày."]],"c":"Hợp đồng.","col":["terminate","notice period"],"rel":["contract","clause"]},{"t":"penalty","p":"n","vi":"tiền phạt, hình phạt","d":"Khoản phạt khi vi phạm hợp đồng hoặc quy định.","ex":[["There's a penalty for late delivery.","Có phạt nếu giao trễ."]],"c":"Hợp đồng, sàn.","col":["late penalty","penalty clause"],"rel":["penalty points"]},{"t":"business license","p":"n","vi":"giấy phép kinh doanh","d":"Giấy đăng ký doanh nghiệp hoặc hộ kinh doanh.","ex":[["Upload the business license to open an official store.","Tải giấy phép kinh doanh để mở gian hàng chính hãng."]],"c":"Mở gian hàng.","col":["business registration"],"rel":["official store"]},{"t":"product registration","p":"n","vi":"công bố sản phẩm","d":"Thủ tục đăng ký với cơ quan quản lý trước khi lưu hành, ví dụ phiếu công bố mỹ phẩm.","ex":[["The serum's product registration number is on the box.","Số công bố của serum in trên hộp."]],"c":"Ngành hạn chế.","col":["cosmetic notification"],"rel":["compliance certificate"]},{"t":"labeling","p":"n","vi":"ghi nhãn","d":"Thông tin bắt buộc trên bao bì: tên, thành phần, xuất xứ, hạn dùng, đơn vị chịu trách nhiệm.","ex":[["Imported goods need Vietnamese labeling.","Hàng nhập khẩu cần nhãn phụ tiếng Việt."]],"c":"Tuân thủ.","col":["sub-label","label requirements"],"rel":["product registration"]},{"t":"age-restricted","p":"adj","vi":"giới hạn độ tuổi","d":"Sản phẩm hoặc nội dung chỉ dành cho người đủ tuổi, ví dụ đồ uống có cồn.","ex":[["Alcohol is age-restricted and can't be sold on live.","Đồ uống có cồn bị giới hạn độ tuổi và không được bán qua live."]],"c":"Tuân thủ nền tảng.","col":["18+"],"rel":["prohibited items"]}]},{"id":"crossborder","code":"GLOBAL","group":"Thương mại điện tử","en":"Cross-border & Global E-commerce","vi":"TMĐT xuyên biên giới","intro":"Bán hàng ra nước ngoài hoặc nhập hàng bán trong nước qua kênh TMĐT quốc tế.","terms":[{"t":"cross-border e-commerce","p":"n","vi":"TMĐT xuyên biên giới","d":"Mua bán online giữa các quốc gia.","ex":[["Cross-border e-commerce lets us sell to Malaysia from Vietnam.","TMĐT xuyên biên giới giúp bán sang Malaysia từ Việt Nam."]],"c":"Mở rộng thị trường.","col":["CBEC"],"rel":["export","marketplace"]},{"t":"local seller","p":"n","vi":"người bán nội địa","d":"Shop đăng ký và giao hàng trong nước. Ngược lại là cross-border seller.","ex":[["Local sellers get faster delivery badges.","Người bán nội địa được nhãn giao nhanh."]],"c":"Phân loại người bán.","col":["cross-border seller"],"rel":["cross-border e-commerce"]},{"t":"global selling program","p":"n","vi":"chương trình bán hàng quốc tế","d":"Chương trình sàn hỗ trợ người bán đưa hàng ra nước ngoài, ví dụ Shopee Global, TikTok Shop Cross-Border.","ex":[["Join the global selling program to reach the Philippines.","Tham gia chương trình bán quốc tế để tiếp cận Philippines."]],"c":"Mở rộng thị trường.","col":["SIP","cross-border program"],"rel":["cross-border e-commerce"]},{"t":"market entry","p":"n","vi":"thâm nhập thị trường","d":"Việc bắt đầu kinh doanh tại một thị trường mới.","ex":[["Our market entry plan for Thailand starts with live.","Kế hoạch vào Thái Lan bắt đầu bằng live."]],"c":"Chiến lược.","col":["enter a market"],"rel":["go-to-market"]},{"t":"duty-free","p":"adj","vi":"miễn thuế","d":"Không phải chịu thuế nhập khẩu, trong giới hạn quy định.","ex":[["Orders under the threshold are duty-free.","Đơn dưới ngưỡng quy định được miễn thuế."]],"c":"Nhập khẩu, xách tay.","col":["tax-free","de minimis"],"rel":["import duty"]},{"t":"parallel import","p":"n","vi":"hàng nhập song song (xách tay)","d":"Hàng chính hãng nhưng nhập không qua nhà phân phối chính thức.","ex":[["Parallel imports may not have an official warranty.","Hàng nhập song song có thể không có bảo hành chính hãng."]],"c":"Phân biệt nguồn hàng.","col":["grey market","hand-carried"],"rel":["authorized distributor"]},{"t":"grey market","p":"n","vi":"thị trường xám","d":"Mua bán hàng thật qua kênh không chính thức, ngoài hệ thống phân phối của brand.","ex":[["The brand is fighting grey market sellers.","Brand đang xử lý người bán hàng thị trường xám."]],"c":"Bảo vệ thương hiệu.","col":["grey goods"],"rel":["parallel import"]},{"t":"international shipping","p":"n","vi":"vận chuyển quốc tế","d":"Gửi hàng qua biên giới.","ex":[["International shipping takes 7 to 14 days.","Vận chuyển quốc tế mất 7 đến 14 ngày."]],"c":"Vận chuyển.","col":["overseas shipping","cross-border logistics"],"rel":["freight"]},{"t":"localized pricing","p":"n","vi":"giá theo thị trường","d":"Đặt giá phù hợp sức mua và đối thủ ở từng nước.","ex":[["Use localized pricing instead of converting from VND.","Đặt giá theo thị trường thay vì quy đổi từ VND."]],"c":"Chiến lược giá.","col":["local pricing"],"rel":["localization","currency"]},{"t":"local language host","p":"n","vi":"host nói tiếng bản địa","d":"Host dùng ngôn ngữ của thị trường mục tiêu.","ex":[["We hired a Thai-speaking host for the Thailand shop.","Thuê host nói tiếng Thái cho shop Thái Lan."]],"c":"Live thị trường nước ngoài.","col":["native speaker"],"rel":["localization","host"]},{"t":"overseas warehouse","p":"n","vi":"kho ở nước ngoài","d":"Kho đặt tại thị trường bán để giao nha
