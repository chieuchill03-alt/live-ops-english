ểm tra tỉ lệ tương tác để phát hiện follow ảo."]],"col":["bot accounts","audit an influencer"],"rel":["engagement rate"]},{"t":"brand ambassador","p":"n","vi":"đại sứ thương hiệu","d":"Người đại diện thương hiệu trong thời gian dài, xuất hiện xuyên suốt trong các chiến dịch.","c":"Hợp tác dài hạn.","ex":[["She has been our brand ambassador for two years.","Cô ấy là đại sứ thương hiệu của mình hai năm nay."]],"col":["long-term partnership","face of the brand"],"rel":["KOL","exclusivity"]},{"t":"sponsored content","p":"n","vi":"nội dung được tài trợ","d":"Nội dung creator làm có nhận tiền hoặc quà từ brand. Thường phải gắn nhãn như #ad, “Hợp tác trả phí”.","c":"Tuân thủ quy định quảng cáo.","ex":[["Sponsored content must be labeled as paid partnership.","Nội dung tài trợ phải được gắn nhãn hợp tác trả phí."]],"col":["paid partnership","disclosure"],"rel":["seeding","community guidelines"]},{"t":"nano-influencer","p":"n","vi":"người ảnh hưởng siêu nhỏ","d":"Người có khoảng 1.000 đến 10.000 người theo dõi, tương tác cao, chi phí thấp.","ex":[["Nano-influencers are great for seeding.","Người ảnh hưởng siêu nhỏ rất hợp để rải review."]],"c":"Chọn creator.","col":["nano creator"],"rel":["micro-influencer","KOC"]},{"t":"macro-influencer","p":"n","vi":"người ảnh hưởng tầm lớn","d":"Người có khoảng 100.000 đến 1 triệu người theo dõi.","ex":[["One macro-influencer gives reach, ten micros give trust.","Một người tầm lớn cho độ phủ, mười người tầm nhỏ cho niềm tin."]],"c":"Chọn creator.","col":["mega-influencer"],"rel":["micro-influencer"]},{"t":"celebrity","p":"n","vi":"người nổi tiếng","d":"Ca sĩ, diễn viên, người của công chúng. Celebrity endorsement là người nổi tiếng quảng bá.","ex":[["The celebrity live drove 2 billion in GMV.","Phiên live người nổi tiếng mang về 2 tỷ GMV."]],"c":"Booking.","col":["celebrity endorsement","celeb"],"rel":["KOL"]},{"t":"influencer brief","p":"n","vi":"brief cho KOL","d":"Tài liệu gửi creator: mục tiêu, thông điệp chính, điều cần nói và không ":"Cost Per Engagement","c":"Đánh giá KOL.","col":["cost per engagement"],"rel":["engagement","rate card"]},{"t":"EMV","p":"abbr","vi":"giá trị truyền thông quy đổi","d":"Ước tính giá trị tiền của độ phủ có được (nếu phải mua bằng quảng cáo thì tốn bao nhiêu).","ex":[["The campaign generated 1.2 billion in EMV.","Chiến dịch tạo giá trị truyền thông quy đổi 1,2 tỷ."]],"f":"Earned Media Value","c":"Báo cáo chiến dịch KOL.","col":["media value"],"rel":["earned media"]},{"t":"gifting","p":"n","vi":"tặng sản phẩm","d":"Gửi sản phẩm miễn phí cho creator mà không ràng buộc phải đăng bài.","ex":[["Gifting works best with a personal note.","Tặng sản phẩm hiệu quả nhất khi kèm lời nhắn riêng."]],"c":"Seeding.","col":["product gifting","PR box"],"rel":["seeding","free sample"]},{"t":"paid collaboration","p":"n","vi":"hợp tác có trả phí","d":"Hợp tác có thù lao, creator phải giao nội dung theo thỏa thuận.","ex":[["This is a paid collaboration with two videos.","Đây là hợp tác có trả phí gồm hai video."]],"c":"Booking.","col":["paid partnership"],"rel":["sponsored content"]},{"t":"creator outreach","p":"n","vi":"tiếp cận creator","d":"Liên hệ, mời creator hợp tác.","ex":[["We send 200 creator outreach messages a week.","Gửi 200 tin nhắn mời creator mỗi tuần."]],"c":"Tìm KOC.","col":["outreach","invitation"],"rel":["affiliate marketing"]},{"t":"affiliate tier","p":"n","vi":"bậc creator affiliate","d":"Phân hạng creator theo doanh số để áp mức hoa hồng, quyền lợi khác nhau.","ex":[["Top-tier affiliates get 20% commission.","Creator bậc cao nhận 20% hoa hồng."]],"c":"Quản lý affiliate.","col":["creator tier"],"rel":["affiliate commission"]},{"t":"top creators","p":"n","vi":"creator hàng đầu","d":"Nhóm creator mang lại nhiều GMV nhất.","ex":[["Top creators bring 70% of affiliate GMV.","Creator hàng đầu mang lại 70% GMV affiliate."]],"c":"Quản lý affiliate.","col":["key creators"],"rel":["80/20 rule"]},{"t":"creator marketplace","p":"n","vi":"chợ creator","d":"Nền tảng kết nối brand với creator, ví dụ TikTok One (Creator Marketplace).","ex":[["Find beauty creators on the creator marketplace.","Tìm creator làm đẹp trên chợ creator."]],"c":"Tìm creator.","col":["TikTok One"],"rel":["creator outreach"]}]},{"id":"crm","code":"CRM","group":"Marketing","en":"CRM, Email & Messaging","vi":"CRM, email và tin nhắn","intro":"Quản lý dữ liệu khách hàng và giao tiếp trực tiếp qua email, Zalo, SMS để giữ khách và tăng mua lại.","terms":[{"t":"CRM","p":"abbr","vi":"quản lý quan hệ khách hàng","d":"Hệ thống và chiến lược lưu trữ dữ liệu khách, lịch sử mua để chăm sóc và bán lại.","ex":[["Add live buyers to the CRM after each session.","Đưa người mua trong live vào CRM sau mỗi phiên."]],"f":"Customer Relationship Management","c":"Giữ chân khách.","col":["CRM system","CRM campaign"],"rel":["customer retention","LTV"]},{"t":"customer database","p":"n","vi":"cơ sở dữ liệu khách hàng","d":"Danh sách khách với thông tin liên hệ, lịch sử mua.","ex":[["Our customer database has 80,000 contacts.","Cơ sở dữ liệu có 80.000 liên hệ."]],"c":"CRM.","col":["contact list"],"rel":["CRM"]},{"t":"first-party data","p":"n","vi":"dữ liệu bên thứ nhất","d":"Dữ liệu doanh nghiệp tự thu thập trực tiếp từ khách. Ngày càng quan trọng khi cookie bị hạn chế.","ex":[["Build first-party data through Zalo and membership.","Xây dữ liệu bên thứ nhất qua Zalo và thẻ thành viên."]],"c":"Chiến lược dữ liệu.","col":["zero-party data","third-party data"],"rel":["customer database","consent"]},{"t":"customer segment","p":"n","vi":"phân khúc khách hàng","d":"Nhóm khách chia theo hành vi, giá trị, nhân khẩu học để gửi thông điệp phù hợp.","ex":[["Send different offers to each customer segment.","Gửi ưu đãi khác nhau cho từng phân khúc khách."]],"c":"CRM.","col":["segment","segmentation"],"rel":["segmentation"]},{"t":"RFM","p":"abbr","vi":"phân tích RFM","d":"Phân nhóm khách theo Recency (lần mua gần nhất), Frequency (tần suất), Monetary (giá trị chi tiêu).","ex":[["Use RFM to find customers about to churn.","Dùng RFM để tìm khách sắp rời bỏ."]],"c":"Phân khúc khách hàng.","col":["RFM analysis","RFM score"],"rel":["customer segment","churn"]},{"t":"cohort","p":"n","vi":"nhóm khách cùng thời điểm","d":"Nhóm khách có chung một mốc, ví dụ mua lần đầu trong tháng 10. Cohort analysis theo dõi hành vi từng nhóm theo thời gian.","ex":[["The October cohort has the best retention.","Nhóm khách tháng 10 có tỉ lệ giữ chân tốt nhất."]],"c":"Phân tích giữ chân.","col":["cohort analysis"],"rel":["customer retention"]},{"t":"lifecycle marketing","p":"n","vi":"marketing theo vòng đời khách","d":"Gửi thông điệp phù hợp từng giai đoạn: khách mới, khách mua lần 2, khách trung thành, khách sắp rời.","ex":[["Lifecycle marketing doubled our second-purchase rate.","Marketing theo vòng đời làm tỉ lệ mua lần hai tăng gấp đôi."]],"c":"CRM.","col":["customer lifecycle"],"rel":["win-back"]},{"t":"email marketing","p":"n","vi":"tiếp thị qua email","d":"Gửi email quảng bá, chăm sóc cho danh sách khách đã đăng ký.","ex":[["Email marketing works well for our website buyers.","Email marketing hiệu quả với khách mua trên website."]],"c":"CRM.","col":["newsletter","EDM"],"rel":["CRM"]},{"t":"newsletter","p":"n","vi":"bản tin","d":"Email định kỳ gửi người đăng ký: tin mới, mẹo, ưu đãi.","ex":[["Our weekly newsletter announces the live schedule.","Bản tin hằng tuần thông báo lịch live."]],"c":"CRM.","col":["weekly newsletter","subscribe"],"rel":["email marketing"]},{"t":"subject line","p":"n","vi":"tiêu đề email","d":"Dòng tiêu đề người nhận thấy đầu tiên, quyết định họ có mở email không.","ex":[["Test two subject lines for the 11.11 email.","Thử hai tiêu đề cho email 11.11."]],"c":"Viết email.","col":["email subject"],"rel":["open rate"]},{"t":"open rate","p":"n","vi":"tỉ lệ mở","d":"Phần trăm người nhận mở email hoặc tin nhắn.","ex":[["The open rate was 28% for the VIP email.","Tỉ lệ mở email VIP là 28%."]],"c":"Đánh giá email.","col":["email open rate"],"rel":["subject line"],"fm":"Tỉ lệ mở = số lượt mở ÷ số email đã gửi thành công × 100%"},{"t":"click rate","p":"n","vi":"tỉ lệ nhấp (email)","d":"Phần trăm người nhận bấm vào link trong email.","ex":[["Click rate improved with a single clear button.","Tỉ lệ nhấp tăng khi chỉ có một nút rõ ràng."]],"c":"Đánh giá email.","col":["CTR","click-to-open rate"],"rel":["open rate","CTR"]},{"t":"unsubscribe","p":"v, n","vi":"hủy đăng ký nhận tin","d":"Người nhận chọn không nhận email nữa. Phải luôn có link hủy đăng ký.","ex":[["Too many emails increase unsubscribes.","Gửi quá nhiều email làm tăng lượt hủy đăng ký."]],"c":"Email marketing.","col":["unsubscribe rate","opt out"],"rel":["consent"]},{"t":"opt-in","p":"n, v","vi":"đồng ý nhận tin","d":"Người dùng chủ động đăng ký nhận thông tin. Double opt-in là xác nhận hai bước.","ex":[["Only message customers who opted in.","Chỉ nhắn cho khách đã đồng ý nhận tin."]],"c":"Thu thập dữ liệu.","col":["double opt-in","opt out"],"rel":["consent"]},{"t":"spam folder","p":"n","vi":"thư mục thư rác","d":"Nơi email bị lọc vào nếu bị coi là rác. Deliverability là khả năng email vào hộp thư chính.","ex":[["Our emails are landing in the spam folder.","Email của mình đang vào thư mục rác."]],"c":"Email marketing.","col":["deliverability","inbox"],"rel":["email marketing"]},{"t":"automation","p":"n","vi":"tự động hóa","d":"Thiết lập gửi tin, email tự động theo hành vi hoặc thời gian.","ex":[["Set up automation to message buyers 3 days after delivery.","Cài tự động nhắn cho người mua 3 ngày sau khi giao."]],"c":"CRM, CS.","col":["marketing automation","workflow"],"rel":["automated flow"]},{"t":"automated flow","p":"n","vi":"chuỗi tin tự động","d":"Chuỗi tin nhắn gửi tự động theo kịch bản, ví dụ chào mừng, nhắc giỏ hàng, chúc sinh nhật.","ex":[["The welcome flow has three messages over a week.","Chuỗi chào mừng có ba tin trong một tuần."]],"c":"CRM.","col":["welcome flow","abandoned cart flow"],"rel":["automation"]},{"t":"abandoned cart reminder","p":"n","vi":"nhắc giỏ hàng bị bỏ","d":"Tin nhắn hoặc email nhắc khách hoàn tất đơn còn trong giỏ.","ex":[["The abandoned cart reminder recovers 8% of carts.","Tin nhắc giỏ hàng lấy lại 8% giỏ bị bỏ."]],"c":"Tăng chuyển đổi.","col":["cart recovery"],"rel":["cart abandonment","automated flow"]},{"t":"Zalo OA","p":"n","vi":"tài khoản Zalo chính thức","d":"Tài khoản doanh nghiệp trên Zalo để nhắn tin, chăm sóc khách, gửi thông báo.","ex":[["Invite buyers to follow our Zalo OA for live alerts.","Mời người mua quan tâm Zalo OA để nhận thông báo live."]],"f":"Zalo Official Account","c":"CRM ở Việt Nam.","col":["ZNS","Zalo notification"],"rel":["CRM","owned media"]},{"t":"broadcast message","p":"n","vi":"tin nhắn gửi hàng loạt","d":"Tin gửi cùng lúc cho nhiều người theo dõi kênh nhắn tin.","ex":[["Send a broadcast message 30 minutes before the live.","Gửi tin hàng loạt 30 phút trước live."]],"c":"CRM.","col":["mass message","blast"],"rel":["Zalo OA"]},{"t":"SMS","p":"abbr","vi":"tin nhắn SMS","d":"Tin nhắn văn bản điện thoại. SMS brandname là tin gửi bằng tên thương hiệu.","ex":[["Send an SMS with the voucher code to VIP customers.","Gửi SMS kèm mã voucher cho khách VIP."]],"c":"Thông báo, khuyến mãi.","col":["SMS brandname","text message"],"rel":["broadcast message"]},{"t":"personalization","p":"n","vi":"cá nhân hóa","d":"Điều chỉnh nội dung theo từng khách: tên, sản phẩm đã mua, sở thích.","ex":[["Personalization raised click rates by 40%.","Cá nhân hóa làm tỉ lệ nhấp tăng 40%."]],"c":"CRM, quảng cáo.","col":["personalized message"],"rel":["customer segment"]},{"t":"lead nurturing","p":"n","vi":"nuôi dưỡng khách tiềm năng","d":"Gửi nội dung hữu ích theo thời gian để khách tiềm năng sẵn sàng mua.","ex":[["Use lead nurturing emails before the launch.","Gửi email nuôi dưỡng khách tiềm năng trước buổi ra mắt."]],"c":"CRM, B2B.","col":["nurture sequence"],"rel":["lead"]},{"t":"lead","p":"n","vi":"khách tiềm năng","d":"Người đã để lại thông tin hoặc bày tỏ quan tâm nhưng chưa mua.","ex":[["We collected 500 leads from the giveaway.","Thu được 500 khách tiềm năng từ minigame."]],"c":"Bán hàng, B2B.","col":["qualified lead","lead generation"],"rel":["lead nurturing"]},{"t":"community","p":"n","vi":"cộng đồng","d":"Nhóm khách, người hâm mộ kết nối với nhau và với brand, ví dụ group Facebook, nhóm Zalo.","ex":[["Our private community gets live deals first.","Cộng đồng riêng được nhận deal live đầu tiên."]],"c":"Giữ chân khách.","col":["community group","brand community"],"rel":["fan club","community management"]}]},{"id":"seo","code":"SEO","group":"Marketing","en":"Search & SEO","vi":"Tìm kiếm và SEO","intro":"Từ vựng tối ưu tìm kiếm trên Google, sàn TMĐT và mạng xã hội.","terms":[{"t":"SEO","p":"abbr","vi":"tối ưu công cụ tìm kiếm","d":"Tối ưu nội dung, website để lên thứ hạng cao trên kết quả tìm kiếm tự nhiên.","ex":[["SEO brings steady traffic to our blog.","SEO mang lượng truy cập ổn định cho blog."]],"f":"Search Engine Optimization","c":"Marketing website, nội dung.","col":["SEO strategy","on-page SEO"],"rel":["keyword","search ranking"]},{"t":"SEM","p":"abbr","vi":"marketing trên công cụ tìm kiếm","d":"Marketing trên kết quả tìm kiếm, gồm SEO và quảng cáo tìm kiếm trả phí.","ex":[["Our SEM budget is mostly Google Ads.","Ngân sách SEM chủ yếu là Google Ads."]],"f":"Search Engine Marketing","c":"Kế hoạch kênh.","col":["search marketing"],"rel":["SEO","search ads"]},{"t":"SERP","p":"abbr","vi":"trang kết quả tìm kiếm","d":"Trang hiện ra sau khi gõ từ khóa.","ex":[["We rank on the first SERP for 'serum vitamin C'.","Mình nằm trên trang kết quả đầu tiên cho “serum vitamin C”."]],"f":"Search Engine Results Page","c":"SEO.","col":["first page"],"rel":["search ranking"]},{"t":"long-tail keyword","p":"n","vi":"từ khóa dài","d":"Từ khóa cụ thể, nhiều chữ, ít người tìm nhưng ý định mua rõ, ví dụ “kem chống nắng cho da dầu mụn nhạy cảm”.","ex":[["Long-tail keywords convert better.","Từ khóa dài chuyển đổi tốt hơn."]],"c":"Tối ưu tìm kiếm.","col":["long tail","short-tail"],"rel":["keyword"]},{"t":"search intent","p":"n","vi":"ý định tìm kiếm","d":"Mục đích phía sau một lượt tìm: tìm thông tin, so sánh, hay muốn mua.","ex":[["'Best sunscreen' has commercial search intent.","“Kem chống nắng tốt nhất” có ý định so sánh để mua."]],"c":"SEO, nội dung.","col":["user intent","buying intent"],"rel":["keyword"]},{"t":"meta description","p":"n","vi":"mô tả meta","d":"Đoạn mô tả ngắn hiển thị dưới tiêu đề trong kết quả Google.","ex":[["Write a meta description under 160 characters.","Viết mô tả meta dưới 160 ký tự."]],"c":"SEO website.","col":["meta title","title tag"],"rel":["SEO"]},{"t":"backlink","p":"n","vi":"liên kết ngược","d":"Link từ website khác trỏ về website mình. Giúp tăng uy tín với Google.","ex":[["A backlink from a beauty magazine boosted our ranking.","Link từ tạp chí làm đẹp giúp tăng thứ hạng."]],"c":"SEO.","col":["link building"],"rel":["SEO"]},{"t":"organic search","p":"n","vi":"tìm kiếm tự nhiên","d":"Lượt truy cập từ kết quả tìm kiếm không trả phí.","ex":[["Organic search brings 30% of website traffic.","Tìm kiếm tự nhiên mang 30% traffic website."]],"c":"Báo cáo nguồn traffic.","col":["organic results"],"rel":["SEO","paid ads"]},{"t":"search bar","p":"n","vi":"thanh tìm kiếm","d":"Ô nhập từ khóa trên website hoặc ứng dụng.","ex":[["Most buyers start from the search bar.","Phần lớn người mua bắt đầu từ thanh tìm kiếm."]],"c":"Trải nghiệm.","col":["search box"],"rel":["keyword"]},{"t":"search suggestion","p":"n","vi":"gợi ý tìm kiếm","d":"Các cụm từ sàn hoặc Google tự gợi ý khi gõ. Nguồn tốt để tìm từ khóa.","ex":[["Check search suggestions on Shopee for keyword ideas.","Xem gợi ý tìm kiếm trên Shopee để tìm ý tưởng từ khóa."]],"c":"Nghiên cứu từ khóa.","col":["autocomplete"],"rel":["keyword research"]},{"t":"social search","p":"n","vi":"tìm kiếm trên mạng xã hội","d":"Người dùng tìm thông tin và sản phẩm ngay trên TikTok, Instagram thay vì Google.","ex":[["Young buyers use TikTok for social search.","Người mua trẻ dùng TikTok để tìm kiếm."]],"c":"Xu hướng nội dung.","col":["TikTok SEO"],"rel":["SEO","caption"]},{"t":"keyword stuffing","p":"n","vi":"nhồi từ khóa","d":"Lặp từ khóa quá nhiều, gây khó đọc và có thể bị phạt.","ex":[["Avoid keyword stuffing in product titles.","Tránh nhồi từ khóa vào tên sản phẩm."]],"c":"Tối ưu tìm kiếm.","col":["keyword spam"],"rel":["listing violation","product title"]},{"t":"alt text","p":"n","vi":"văn bản thay thế ảnh","d":"Mô tả chữ cho hình ảnh, giúp SEO và người khiếm thị.","ex":[["Add alt text to every product image.","Thêm văn bản thay thế cho mọi ảnh sản phẩm."]],"c":"Website.","col":["image alt"],"rel":["SEO"]},{"t":"page speed","p":"n","vi":"tốc độ tải trang","d":"Thời gian trang tải xong. Chậm làm tăng tỉ lệ thoát và giảm thứ hạng.","ex":[["Compress images to improve page speed.","Nén ảnh để tăng tốc độ tải trang."]],"c":"Website.","col":["load time"],"rel":["landing page","bounce"]},{"t":"domain","p":"n","vi":"tên miền","d":"Địa chỉ website, ví dụ brand.vn.","ex":[["We bought the domain for the new brand.","Đã mua tên miền cho thương hiệu mới."]],"c":"Website.","col":["domain name","subdomain"],"rel":["SEO"]},{"t":"Google Business Profile","p":"n","vi":"hồ sơ doanh nghiệp trên Google","d":"Trang thông tin cửa hàng hiển thị trên Google Search và Maps.","ex":[["Update store hours on the Google Business Profile.","Cập nhật giờ mở cửa trên hồ sơ Google."]],"c":"Cửa hàng có địa chỉ.","col":["Google Maps listing"],"rel":[]}]},{"id":"creative","code":"CREATIVE","group":"Marketing","en":"Branding, Design & Copywriting","vi":"Thương hiệu, thiết kế và viết nội dung","intro":"Ngôn ngữ làm việc với designer và copywriter: bố cục, màu, chữ, giọng văn và các công thức viết.","terms":[{"t":"key visual","p":"n","vi":"hình ảnh chủ đạo","d":"Hình ảnh trung tâm của chiến dịch, dùng làm gốc cho mọi ấn phẩm.","ex":[["Adapt the key visual for the live backdrop.","Chuyển thể hình ảnh chủ đạo thành phông nền live."]],"f":"KV","c":"Thiết kế chiến dịch.","col":["KV adaptation"],"rel":["campaign","brand identity"]},{"t":"mood board","p":"n","vi":"bảng cảm hứng","d":"Tập hợp hình ảnh, màu, chữ thể hiện định hướng thẩm mỹ trước khi thiết kế.","ex":[["Share a mood board before the photoshoot.","Gửi bảng cảm hứng trước buổi chụp."]],"c":"Định hướng sáng tạo.","col":["moodboard","visual direction"],"rel":["key visual"]},{"t":"color palette","p":"n","vi":"bảng màu","d":"Bộ màu thương hiệu dùng thống nhất.","ex":[["Stick to the brand color palette.","Bám theo bảng màu thương hiệu."]],"c":"Thiết kế.","col":["primary color","brand colors"],"rel":["brand identity"]},{"t":"typography","p":"n","vi":"kiểu chữ, cách dùng chữ","d":"Lựa chọn phông chữ, cỡ chữ, khoảng cách trong thiết kế.","ex":[["The typography is hard to read on mobile.","Chữ khó đọc trên điện thoại."]],"c":"Thiết kế.","col":["font","typeface"],"rel":["brand guidelines"]},{"t":"font","p":"n","vi":"phông chữ","d":"Kiểu chữ cụ thể.","ex":[["Use the brand font for all overlays.","Dùng phông chữ thương hiệu cho mọi lớp phủ."]],"c":"Thiết kế.","col":["font size","bold"],"rel":["typography"]},{"t":"layout","p":"n","vi":"bố cục","d":"Cách sắp xếp các thành phần trên một thiết kế hoặc trang.","ex":[["The layout feels crowded, add more white space.","Bố cục chật quá, thêm khoảng trắng."]],"c":"Thiết kế.","col":["grid","white space"],"rel":["visual hierarchy"]},{"t":"white space","p":"n","vi":"khoảng trắng","d":"Khoảng trống không có nội dung giúp thiết kế thoáng, dễ đọc.","ex":[["More white space makes it look premium.","Nhiều khoảng trắng hơn trông cao cấp hơn."]],"c":"Góp ý thiết kế.","col":["negative space"],"rel":["layout"]},{"t":"visual hierarchy","p":"n","vi":"thứ bậc thị giác","d":"Sắp xếp kích thước, màu, vị trí để người xem thấy điều quan trọng nhất trước.","ex":[["The price should be first in the visual hierarchy.","Giá nên nổi bật nhất trong thứ bậc thị giác."]],"c":"Góp ý thiết kế.","col":["focal point"],"rel":["layout"]},{"t":"logo","p":"n","vi":"biểu trưng","d":"Hình nhận diện thương hiệu.","ex":[["The logo is too small on the banner.","Logo trên banner quá nhỏ."]],"c":"Thiết kế.","col":["logo placement","logo lockup"],"rel":["brand identity"]},{"t":"banner","p":"n","vi":"biểu ngữ, ảnh banner","d":"Hình chữ nhật quảng bá trên website, shop, phòng live.","ex":[["Update the shop banner for 12.12.","Cập nhật banner shop cho 12.12."]],"c":"Thiết kế.","col":["web banner","hero banner"],"rel":["storefront","key visual"]},{"t":"mockup","p":"n","vi":"bản mô phỏng","d":"Hình minh họa thiết kế trông như thật, ví dụ bao bì trên chai.","ex":[["Send a mockup of the gift box.","Gửi bản mô phỏng hộp quà."]],"c":"Duyệt thiết kế.","col":["mock-up"],"rel":["key visual"]},{"t":"draft","p":"n, v","vi":"bản nháp","d":"Phiên bản chưa hoàn thiện để xem và góp ý.","ex":[["Here's the first draft of the script.","Đây là bản nháp đầu của kịch bản."]],"c":"Duyệt nội dung.","col":["first draft","rough draft"],"rel":["revision"]},{"t":"final artwork","p":"n","vi":"file thiết kế hoàn chỉnh","d":"Bản thiết kế cuối đã duyệt, sẵn sàng in hoặc đăng.","ex":[["Send the final artwork in PDF and PNG.","Gửi file thiết kế hoàn chỉnh dạng PDF và PNG."]],"c":"Bàn giao thiết kế.","col":["final file","print-ready"],"rel":["draft"]},{"t":"resolution (image)","p":"n","vi":"độ phân giải ảnh","d":"Số điểm ảnh của hình. Ảnh độ phân giải thấp bị vỡ khi phóng to.","ex":[["The logo file is low resolution, send a vector.","File logo độ phân giải thấp, gửi bản vector."]],"c":"Thiết kế, in ấn.","col":["high-res","low-res","vector"],"rel":["resolution"]},{"t":"photoshoot","p":"n","vi":"buổi chụp ảnh","d":"Buổi chụp ảnh sản phẩm hoặc người mẫu.","ex":[["The product photoshoot is on Tuesday.","Buổi chụp sản phẩm vào thứ Ba."]],"c":"Sản xuất hình ảnh.","col":["product shoot","lookbook"],"rel":["asset"]},{"t":"lookbook","p":"n","vi":"bộ ảnh phối đồ","d":"Bộ ảnh giới thiệu bộ sưu tập thời trang và cách phối.","ex":[["Use the lookbook to plan the try-on live.","Dùng bộ ảnh phối đồ để lên kế hoạch live mặc thử."]],"c":"Thời trang.","col":["collection lookbook"],"rel":["photoshoot"]},{"t":"copywriting","p":"n","vi":"viết nội dung quảng cáo","d":"Viết chữ để thuyết phục: tiêu đề, mô tả, kịch bản, quảng cáo. Người viết là copywriter.","ex":[["Good copywriting turns features into benefits.","Viết tốt biến tính năng thành lợi ích."]],"c":"Sản xuất nội dung.","col":["copywriter","copy"],"rel":["ad copy","headline"]},{"t":"copy","p":"n","vi":"nội dung chữ","d":"Phần chữ trong quảng cáo, bài đăng, bao bì.","ex":[["The copy is too long for a story.","Chữ quá dài cho story."]],"c":"Duyệt nội dung.","col":["ad copy","body copy"],"rel":["copywriting"]},{"t":"headline","p":"n","vi":"tiêu đề chính","d":"Dòng chữ nổi bật nhất, thu hút sự chú ý.","ex":[["The headline should mention the discount.","Tiêu đề nên nói về mức giảm."]],"c":"Viết quảng cáo, banner.","col":["tagline","subheadline"],"rel":["copy"]},{"t":"tagline","p":"n","vi":"khẩu hiệu","d":"Câu ngắn đặc trưng gắn với thương hiệu hoặc chiến dịch.","ex":[["The campaign tagline is 'Glow every day'.","Khẩu hiệu chiến dịch là “Rạng rỡ mỗi ngày”."]],"c":"Thương hiệu.","col":["slogan"],"rel":["headline","brand voice"]},{"t":"microcopy","p":"n","vi":"chữ nhỏ trong giao diện","d":"Các đoạn chữ ngắn trên nút bấm, thông báo, hướng dẫn.","ex":[["Change the button microcopy to 'Get my voucher'.","Đổi chữ trên nút thành “Nhận voucher”."]],"c":"Thiết kế trang, app.","col":["button text"],"rel":["call to action"]},{"t":"tone","p":"n","vi":"giọng văn","d":"Sắc thái cảm xúc của câu chữ: vui, nghiêm túc, gần gũi.","ex":[["Keep the tone friendly, not salesy.","Giữ giọng thân thiện, đừng quá bán hàng."]],"c":"Viết nội dung.","col":["tone of voice","salesy"],"rel":["brand voice"]},{"t":"salesy","p":"adj","vi":"quá bán hàng","d":"Nội dung nghe như quảng cáo ép mua, dễ gây phản cảm.","ex":[["The caption sounds too salesy.","Chú thích nghe quá bán hàng."]],"c":"Góp ý nội dung.","col":["pushy"],"rel":["hard sell","tone"]},{"t":"power words","p":"n","vi":"từ ngữ mạnh","d":"Từ gợi cảm xúc mạnh như free, new, exclusive, instantly, proven.","ex":[["Use power words in the first line.","Dùng từ ngữ mạnh ở dòng đầu."]],"c":"Viết quảng cáo.","col":["emotional words"],"rel":["headline"]},{"t":"proofread","p":"v","vi":"đọc soát lỗi","d":"Đọc lại để sửa lỗi chính tả, ngữ pháp trước khi đăng.","ex":[["Please proofread the banner, there's a typo.","Đọc soát giúp banner, có lỗi chính tả."]],"c":"Duyệt nội dung.","col":["proofreading","typo"],"rel":["draft"]},{"t":"typo","p":"n","vi":"lỗi đánh máy","d":"Lỗi gõ sai chữ.","ex":[["There's a typo in the price: 1990k instead of 199k.","Có lỗi gõ trong giá: 1990k thay vì 199k."]],"c":"Duyệt nội dung.","col":["spelling mistake"],"rel":["proofread"]},{"t":"localization","p":"n","vi":"bản địa hóa","d":"Điều chỉnh nội dung cho phù hợp ngôn ngữ, văn hóa từng thị trường, không chỉ dịch.","ex":[["The Korean slogan needs localization, not translation.","Khẩu hiệu tiếng Hàn cần bản địa hóa chứ không chỉ dịch."]],"c":"Nội dung đa thị trường.","col":["localize","transcreation"],"rel":[]},{"t":"AIDA copy","p":"n","vi":"viết theo công thức AIDA","d":"Viết nội dung theo bốn bước: Attention, Interest, Desire, Action.","ex":[["Rewrite the caption as AIDA copy.","Viết lại chú thích theo công thức AIDA."]],"c":"Viết quảng cáo, kịch bản.","col":["copy formula"],"rel":["AIDA","copywriting"]},{"t":"PAS formula","p":"n","vi":"công thức PAS","d":"Problem (vấn đề), Agitate (khoét sâu nỗi đau), Solution (giải pháp).","ex":[["The PAS formula works great for acne products.","Công thức PAS rất hiệu quả cho sản phẩm trị mụn."]],"c":"Viết quảng cáo.","col":["problem-agitate-solution"],"rel":["problem-solution","copywriting"]},{"t":"FAB","p":"abbr","vi":"công thức FAB","d":"Features (đặc điểm), Advantages (ưu điểm), Benefits (lợi ích). Cách chuyển tính năng thành lợi ích.","ex":[["Use FAB for each selling point.","Dùng FAB cho mỗi điểm bán."]],"c":"Viết mô tả, kịch bản.","col":["features, advantages, benefits"],"rel":["feature","benefit"]},{"t":"social proof copy","p":"n","vi":"nội dung dùng bằng chứng xã hội","d":"Câu chữ nhấn số liệu thật: số đã bán, số đánh giá, nhận xét.","ex":[["Add social proof copy: '4.9 stars from 12,000 reviews'.","Thêm câu bằng chứng xã hội: “4,9 sao từ 12.000 đánh giá”."]],"c":"Viết nội dung.","col":["reviews count"],"rel":["social proof"]},{"t":"readability","p":"n","vi":"độ dễ đọc","d":"Mức dễ đọc của văn bản: câu ngắn, từ đơn giản, chia đoạn.","ex":[["Break long sentences to improve readability.","Tách câu dài để dễ đọc hơn."]],"c":"Viết nội dung.","col":["easy to read","scannable"],"rel":["copy"]},{"t":"emoji","p":"n","vi":"biểu tượng cảm xúc","d":"Ký hiệu cảm xúc dùng trong chú thích, tin nhắn. Dùng vừa phải.","ex":[["Don't overuse emojis in the product title.","Đừng dùng quá nhiều emoji trong tên sản phẩm."]],"c":"Viết chú thích.","col":["emoticon"],"rel":["caption"]}]},{"id":"events","code":"EVENT","group":"Marketing","en":"Events & Offline Activation","vi":"Sự kiện và hoạt động offline","intro":"Từ vựng tổ chức sự kiện, pop-up store và kết hợp online với offline.","terms":[{"t":"event","p":"n","vi":"sự kiện","d":"Hoạt động có thời gian, địa điểm cụ thể.","ex":[["The launch event is at a mall in District 1.","Sự kiện ra mắt ở một trung tâm thương mại quận 1."]],"c":"Tổ chức.","col":["launch event","offline event"],"rel":["activation"]},{"t":"activation","p":"n","vi":"hoạt động kích hoạt thương hiệu","d":"Hoạt động tương tác trực tiếp với khách: dùng thử, trò chơi, check-in.","ex":[["The mall activation collected 2,000 leads.","Hoạt động tại trung tâm thương mại thu 2.000 khách tiềm năng."]],"c":"Marketing offline.","col":["brand activation","roadshow"],"rel":["event"]},{"t":"pop-up store","p":"n","vi":"cửa hàng tạm thời","d":"Cửa hàng mở trong thời gian ngắn để quảng bá, bán hàng.","ex":[["We'll livestream from our pop-up store.","Mình sẽ live từ cửa hàng tạm thời."]],"c":"Marketing offline.","col":["pop-up","booth"],"rel":["activation"]},{"t":"booth","p":"n","vi":"gian hàng (sự kiện)","d":"Khu trưng bày tại hội chợ, sự kiện.","ex":[["Our booth is number 12 at the beauty fair.","Gian hàng mình số 12 ở hội chợ làm đẹp."]],"c":"Tổ chức sự kiện.","col":["stand","exhibition"],"rel":["pop-up store"]},{"t":"O2O","p":"abbr","vi":"kết hợp online và offline","d":"Kéo khách từ online đến cửa hàng thực hoặc ngược lại.","ex":[["Live viewers get a voucher to use in our stores, an O2O tactic.","Người xem live nhận voucher dùng tại cửa hàng, một chiến thuật O2O."]],"f":"Online to Offline","c":"Chiến lược đa kênh.","col":["online-to-offline"],"rel":["omnichannel"]},{"t":"sampling","p":"n","vi":"phát mẫu thử","d":"Phát sản phẩm dùng thử cho khách.","ex":[["Sampling at gyms works well for protein drinks.","Phát mẫu thử ở phòng gym hiệu quả với đồ uống protein."]],"c":"Hoạt động offline.","col":["free trial","sample"],"rel":["free sample","activation"]},{"t":"RSVP","p":"abbr","vi":"xác nhận tham dự","d":"Yêu cầu khách mời xác nhận có tham gia không.","ex":[["Please RSVP by Friday.","Vui lòng xác nhận tham dự trước thứ Sáu."]],"c":"Mời sự kiện.","col":["confirm attendance"],"rel":["event"]},{"t":"guest list","p":"n","vi":"danh sách khách mời","d":"Danh sách người được mời tham dự.","ex":[["Add five KOCs to the guest list.","Thêm năm KOC vào danh sách khách mời."]],"c":"Tổ chức sự kiện.","col":["invitation"],"rel":["RSVP"]},{"t":"MC","p":"abbr","vi":"người dẫn chương trình","d":"Người dẫn sự kiện trực tiếp.","ex":[["The MC will introduce the brand founder.","MC sẽ giới thiệu nhà sáng lập brand."]],"f":"Master of Ceremonies","c":"Sự kiện.","col":["emcee","host"],"rel":["host"]},{"t":"run sheet","p":"n","vi":"kịch bản chi tiết sự kiện","d":"Lịch trình từng phút của sự kiện, tương tự run of show.","ex":[["Print the run sheet for every staff member.","In kịch bản chi tiết cho mọi nhân sự."]],"c":"Tổ chức.","col":["event rundown"],"rel":["run of show"]},{"t":"venue","p":"n","vi":"địa điểm","d":"Nơi tổ chức sự kiện.","ex":[["The venue fits 200 guests.","Địa điểm chứa được 200 khách."]],"c":"Tổ chức.","col":["location","book a venue"],"rel":["event"]},{"t":"logistics (event)","p":"n","vi":"hậu cần sự kiện","d":"Mọi khâu sắp xếp: vận chuyển đồ, setup, nhân sự, âm thanh ánh sáng.","ex":[["Event logistics are handled by the agency.","Hậu cần sự kiện do agency lo."]],"c":"Tổ chức.","col":["setup","teardown"],"rel":["venue"]},{"t":"foot traffic","p":"n","vi":"lượng khách ghé qua","d":"Số người đi qua hoặc ghé gian hàng, cửa hàng.","ex":[["Foot traffic peaks on weekend evenings.","Lượng khách ghé cao nhất tối cuối tuần."]],"c":"Đánh giá sự kiện, cửa hàng.","col":["walk-ins"],"rel":["activation"]}]},{"id":"work","code":"WORK","group":"Công việc","en":"Workplace Communication","vi":"Giao tiếp công việc hằng ngày","intro":"Từ viết tắt và cách nói hay gặp trong tin nhắn, email và họp nhóm ở môi trường làm việc có tiếng Anh.","terms":[{"t":"deadline","p":"n","vi":"hạn chót","d":"Thời hạn phải xong việc. Kịp hạn là meet the deadline; trễ hạn là miss the deadline.","c":"Giao việc, nhắc việc.","ex":[["The deadline for the live script is Friday.","Hạn chót kịch bản live là thứ Sáu."],["Can we push the deadline to Monday?","Mình lùi hạn sang thứ Hai được không?"]],"col":["meet / miss the deadline","tight deadline","push the deadline"],"rel":["ETA","EOD"]},{"t":"ASAP","f":"As Soon As Possible","p":"abbr","vi":"càng sớm càng tốt","d":"Báo việc gấp. Dùng nhiều nghe có thể hơi gắt; lịch sự hơn: at your earliest convenience.","c":"Tin nhắn khẩn.","ex":[["Please send me the stock numbers ASAP.","Gửi mình số tồn kho càng sớm càng tốt nhé."]],"col":["at your earliest convenience","urgent"],"rel":["EOD","priority"]},{"t":"EOD","f":"End Of Day","p":"abbr","vi":"cuối ngày làm việc","d":"Hạn chót trong ngày. Tương tự: EOW (end of week), EOM (end of month).","c":"Đặt hạn ngắn.","ex":[["Can you finish the report by EOD?","Bạn xong báo cáo trước cuối ngày được không?"]],"col":["by EOD","EOW","EOM"],"rel":["deadline","ASAP"]},{"t":"ETA","f":"Estimated Time of Arrival","p":"abbr","vi":"thời gian dự kiến","d":"Ban đầu là giờ đến dự kiến, trong công việc dùng để hỏi khi nào xong.","c":"Hỏi tiến độ.","ex":[["What's the ETA on the new overlay?","Khi nào có lớp phủ mới?"],["The samples' ETA is Thursday.","Hàng mẫu dự kiến về thứ Năm."]],"col":["ETA on","give an ETA"],"rel":["deadline","on track"]},{"t":"FYI","f":"For Your Information","p":"abbr","vi":"để bạn nắm thông tin","d":"Chia sẻ thông tin, không yêu cầu hành động.","c":"Chuyển tiếp email, tin nhắn.","ex":[["FYI, the brand changed the deal price.","Để bạn nắm, brand đã đổi giá deal."]],"col":["just FYI","for your reference"],"rel":["heads-up","loop in"]},{"t":"heads-up","p":"n","vi":"báo trước","d":"Thông báo sớm để người khác chuẩn bị.","c":"Báo trước thay đổi.","ex":[["Just a heads-up, the live might start 15 minutes late.","Báo trước là live có thể trễ 15 phút."]],"col":["give sb a heads-up","quick heads-up"],"rel":["FYI"]},{"t":"loop in","p":"v","vi":"thêm ai đó vào cuộc trao đổi","d":"Cho ai đó cùng nắm thông tin, ví dụ thêm vào email, nhóm chat. Keep sb in the loop là cập nhật cho ai đó thường xuyên.","c":"Email, nhóm chat.","ex":[["I'm looping in Minh from the warehouse team.","Mình thêm Minh bên kho vào trao đổi."],["Please keep me in the loop.","Nhớ cập nhật cho mình nhé."]],"col":["keep sb in the loop","cc"],"rel":["FYI","keep me posted"]},{"t":"keep me posted","p":"phrase","vi":"cập nhật cho mình nhé","d":"Nhờ người khác báo tin khi có cập nhật.","c":"Kết thúc tin nhắn.","ex":[["Keep me posted on the courier issue.","Có gì về vụ vận chuyển thì cập nhật mình nhé."]],"col":["keep sb updated"],"rel":["loop in","follow up"]},{"t":"follow up","p":"v","vi":"theo dõi tiếp, nhắc lại","d":"Liên hệ lại để cập nhật hoặc nhắc việc chưa có phản hồi. Danh từ viết follow-up.","c":"Sau họp, sau email chưa trả lời.","ex":[["I'll follow up with the brand about the samples.","Mình sẽ nhắc lại brand về hàng mẫu."],["Just following up on my email from Monday.","Mình nhắc lại email hôm thứ Hai nhé."]],"col":["follow-up email","follow up on"],"rel":["circle back","touch base"]},{"t":"circle back","p":"v","vi":"quay lại bàn sau","d":"Hẹn quay lại chủ đề sau, khi có thêm thông tin.","c":"Trong họp, khi chưa đủ thông tin.","ex":[["Let's circle back on the budget next week.","Tuần sau mình quay lại chuyện ngân sách nhé."]],"col":["circle back on","revisit"],"rel":["follow up","parking lot"]},{"t":"touch base","p":"v","vi":"trao đổi nhanh, liên lạc","d":"Liên lạc ngắn để cập nhật tình hình.","c":"Hẹn trao đổi.","ex":[["Let's touch base after the live.","Sau live mình trao đổi nhanh nhé."]],"col":["touch base with"],"rel":["sync","follow up"]},{"t":"sync","p":"n, v","vi":"họp nhanh để thống nhất","d":"Buổi trao đổi ngắn để mọi người cùng nắm tình hình. Còn nói sync-up.","c":"Hẹn họp.","ex":[["Let's have a quick sync before the live.","Họp nhanh trước live nhé."]],"col":["quick sync","weekly sync","sync up"],"rel":["touch base","stand-up"]},{"t":"on track","p":"adj","vi":"đúng tiến độ","d":"Công việc đi đúng kế hoạch. Ngược lại là behind schedule hoặc off track; vượt tiến độ là ahead of schedule.","c":"Báo cáo tiến độ.","ex":[["We're on track to hit the monthly KPI.","Đang đúng tiến độ để đạt KPI tháng."]],"col":["behind schedule","ahead of schedule","off track"],"rel":["blocker","status update"]},{"t":"status update","p":"n","vi":"cập nhật tình hình","d":"Báo cáo ngắn về tiến độ hiện tại.","c":"Báo cáo hằng ngày.","ex":[["Can you give me a status update on the 11.11 prep?","Cập nhật giúp mình tình hình chuẩn bị 11.11?"]],"col":["quick update","progress update"],"rel":["on track","recap"]},{"t":"blocker","p":"n","vi":"vướng mắc làm tắc việc","d":"Vấn đề khiến công việc không thể tiếp tục cho tới khi được giải quyết.","c":"Họp tiến độ, stand-up.","ex":[["The main blocker is that samples haven't arrived.","Vướng mắc chính là hàng mẫu chưa về."]],"col":["unblock","remove blockers"],"rel":["escalate","on track"]},{"t":"bandwidth","p":"n","vi":"khả năng nhận thêm việc","d":"Nghĩa bóng: còn thời gian, sức để làm thêm không.","c":"Hỏi khéo khi giao việc.","ex":[["Do you have bandwidth to handle one more live this week?","Tuần này bạn còn sức nhận thêm một phiên live không?"]],"col":["no bandwidth","capacity"],"rel":["workload","priority"]},{"t":"workload","p":"n","vi":"khối lượng công việc","d":"Lượng việc một người hoặc nhóm phải làm.","c":"Phân công, nói về áp lực.","ex":[["My workload is heavy during mega sale weeks.","Khối lượng việc của mình rất nặng những tuần siêu sale."]],"col":["heavy workload","balance the workload"],"rel":["bandwidth"]},{"t":"priority","p":"n","vi":"ưu tiên","d":"Việc quan trọng cần làm trước. Động từ là prioritize. Top priority là ưu tiên số một.","c":"Sắp xếp công việc.","ex":[["Fixing the stream lag is our top priority.","Sửa lỗi giật live là ưu tiên số một."],["Let's prioritize the hero product listings.","Ưu tiên làm bài đăng sản phẩm chủ lực trước."]],"col":["top priority","prioritize","P0 / P1"],"rel":["ASAP","bandwidth"]},{"t":"escalate","p":"v","vi":"báo lên cấp trên","d":"Đẩy vấn đề lên người có thẩm quyền cao hơn khi mình không giải quyết được.","c":"Xử lý sự cố.","ex":[["If the platform doesn't reply, please escalate it to the manager.","Nếu sàn không phản hồi thì báo lên quản lý nhé."]],"col":["escalate to","escalation"],"rel":["escalation","blocker"]},{"t":"approve","p":"v","vi":"phê duyệt","d":"Đồng ý cho thực hiện. Danh từ là approval. Pending approval là đang chờ duyệt.","c":"Xin duyệt ngân sách, kịch bản, giá deal.","ex":[["Can you approve the deal prices today?","Bạn duyệt giá deal hôm nay được không?"],["The script is pending approval from the brand.","Kịch bản đang chờ brand duyệt."]],"col":["get approval","pending approval","approved"],"rel":["sign-off","content approval"]},{"t":"alignment","p":"n","vi":"sự thống nhất","d":"Mọi bên cùng hiểu và đồng ý về mục tiêu, cách làm. Động từ là align (on).","c":"Họp với brand, giữa các team.","ex":[["We need alignment on the KPI before the campaign starts.","Cần thống nhất KPI trước khi chiến dịch bắt đầu."],["Let's align on the deal list tomorrow.","Mai thống nhất danh sách deal nhé."]],"col":["align on","get alignment","be aligned"],"rel":["stakeholder","sync"]},{"t":"stakeholder","p":"n","vi":"bên liên quan","d":"Những người hoặc bộ phận bị ảnh hưởng hoặc có quyền quyết định trong dự án, ví dụ brand, team kho, team ads, sếp.","c":"Quản lý dự án.","ex":[["Share the post-mortem with all stakeholders.","Gửi báo cáo rút kinh nghiệm cho mọi bên liên quan."]],"col":["key stakeholders","stakeholder management"],"rel":["alignment","owner"]},{"t":"owner","p":"n","vi":"người phụ trách chính","d":"Người chịu trách nhiệm cho một việc. Take ownership là nhận trách nhiệm.","c":"Phân việc.","ex":[["Who's the owner of the voucher setup?","Ai phụ trách cài voucher?"]],"col":["task owner","take ownership","DRI"],"rel":["action items"]},{"t":"action items","p":"n","vi":"đầu việc cần làm","d":"Danh sách việc cụ thể sau cuộc họp, mỗi việc có người phụ trách và hạn.","c":"Kết thúc họp.","ex":[["Here are the action items from today's meeting.","Đây là các đầu việc từ cuộc họp hôm nay."]],"col":["AI (viết tắt)","next steps","to-do"],"rel":["owner","next steps"]},{"t":"TBD / TBC","f":"To Be Determined / To Be Confirmed","p":"abbr","vi":"chưa xác định / chờ xác nhận","d":"TBD: chưa quyết định. TBC: đã có dự kiến nhưng chờ xác nhận.","c":"Kế hoạch, lịch.","ex":[["Host: TBC. Product lineup: TBD.","Host: chờ xác nhận. Danh sách sản phẩm: chưa quyết."]],"col":["TBA (to be announced)"],"rel":["ETA"]},{"t":"OOO","f":"Out Of Office","p":"abbr","vi":"vắng mặt","d":"Không có mặt làm việc (nghỉ phép, đi công tác). Tin trả lời tự động khi nghỉ gọi là OOO message.","c":"Thông báo nghỉ.","ex":[["I'm OOO tomorrow, please contact Linh.","Mai mình nghỉ, liên hệ Linh nhé."]],"col":["OOO message","on leave","day off"],"rel":["WFH","handover"]},{"t":"WFH","f":"Work From Home","p":"abbr","vi":"làm việc tại nhà","d":"Làm việc ở nhà thay vì văn phòng. Làm từ xa là remote.","c":"Thông báo lịch làm việc.","ex":[["I'm WFH today but available on chat.","Hôm nay mình làm ở nhà nhưng vẫn trên chat."]],"col":["remote","hybrid"],"rel":["OOO"]},{"t":"handover","p":"n","vi":"bàn giao công việc","d":"Chuyển giao công việc và thông tin cho người khác (đổi ca, nghỉ phép, chuyển việc). Handover note là ghi chú bàn giao.","c":"Đổi ca live, nghỉ phép.","ex":[["Leave a handover note for the night shift.","Để lại ghi chú bàn giao cho ca tối."]],"col":["handover note","hand over to"],"rel":["OOO","owner"]},{"t":"colleague","p":"n","vi":"đồng nghiệp","d":"Người làm cùng công ty. Teammate là người cùng nhóm.","ex":[["My colleague from the ads team will join the call.","Đồng nghiệp bên team quảng cáo sẽ tham gia cuộc gọi."]],"c":"Nói chung.","col":["coworker","teammate"],"rel":["stakeholder"]},{"t":"line manager","p":"n","vi":"quản lý trực tiếp","d":"Người quản lý trực tiếp của bạn. Còn gọi direct manager, report to.","ex":[["I report to the live operations manager.","Mình báo cáo cho quản lý vận hành live."]],"c":"Cơ cấu tổ chức.","col":["report to","direct report"],"rel":["one-on-one"]},{"t":"direct report","p":"n","vi":"nhân viên cấp dưới trực tiếp","d":"Người báo cáo trực tiếp cho bạn.","ex":[["I have four direct reports.","Mình có bốn nhân viên trực tiếp."]],"c":"Quản lý.","col":["team member"],"rel":["line manager"]},{"t":"cross-functional","p":"adj","vi":"liên phòng ban","d":"Liên quan tới nhiều bộ phận phối hợp với nhau.","ex":[["11.11 is a cross-functional project with ops, ads and warehouse.","11.11 là dự án liên phòng ban gồm vận hành, quảng cáo và kho."]],"c":"Dự án.","col":["cross-functional team"],"rel":["stakeholder"]},{"t":"department","p":"n","vi":"phòng ban","d":"Bộ phận trong công ty.","ex":[["Which department handles refunds?","Phòng nào xử lý hoàn tiền?"]],"c":"Cơ cấu tổ chức.","col":["team","division"],"rel":["cross-functional"]},{"t":"headcount","p":"n","vi":"số lượng nhân sự","d":"Số người trong một nhóm hoặc định biên được duyệt.","ex":[["We need two more headcount for Q4.","Cần thêm hai định biên cho quý 4."]],"c":"Lập ngân sách nhân sự.","col":["headcount plan"],"rel":["workload"]},{"t":"responsibility","p":"n","vi":"trách nhiệm","d":"Việc thuộc phạm vi của ai đó. Be responsible for là chịu trách nhiệm cho.","ex":[["I'm responsible for voucher setup.","Mình chịu trách nhiệm cài voucher."]],"c":"Phân công.","col":["be responsible for","take responsibility"],"rel":["owner","RACI"]},{"t":"accountable","p":"adj","vi":"chịu trách nhiệm giải trình","d":"Là người cuối cùng chịu trách nhiệm về kết quả.","ex":[["The ops lead is accountable for the live GMV.","Trưởng vận hành chịu trách nhiệm cuối cùng về GMV live."]],"c":"Phân vai.","col":["accountability"],"rel":["responsibility","owner"]},{"t":"delegate","p":"v","vi":"ủy quyền, giao việc","d":"Giao một phần việc cho người khác làm.","ex":[["Delegate the comment moderation to the intern.","Giao việc quản lý bình luận cho thực tập sinh."]],"c":"Quản lý.","col":["delegation"],"rel":["owner","workload"]},{"t":"follow-up email","p":"n","vi":"email theo dõi","d":"Email gửi sau cuộc họp hoặc khi chưa nhận phản hồi.","ex":[["Send a follow-up email with the action items.","Gửi email theo dõi kèm các đầu việc."]],"c":"Email.","col":["follow-up message"],"rel":["follow up","action items"]},{"t":"reminder","p":"n","vi":"lời nhắc","d":"Tin nhắn hoặc thông báo nhắc nhở.","ex":[["I set a reminder for the brand call.","Mình đặt nhắc lịch cuộc gọi với brand."]],"c":"Nhắc việc.","col":["gentle reminder","set a reminder"],"rel":["Just a quick reminder that"]},{"t":"quick question","p":"phrase","vi":"câu hỏi nhanh","d":"Cách mở đầu tin nhắn hỏi ngắn, lịch sự.","ex":[["Quick question: is the voucher stackable?","Hỏi nhanh: voucher này cộng dồn được không?"]],"c":"Tin nhắn công việc.","col":["got a sec?"],"rel":["Just to clarify"]},{"t":"noted","p":"adj","vi":"đã ghi nhận","d":"Trả lời ngắn khi đã đọc và hiểu. Lịch sự hơn: Noted, thanks.","ex":[["Noted, I'll update the price list.","Đã ghi nhận, mình sẽ cập nhật bảng giá."]],"c":"Trả lời tin nhắn.","col":["well noted","got it"],"rel":["acknowledge"]},{"t":"acknowledge","p":"v","vi":"xác nhận đã nhận","d":"Báo cho người gửi là mình đã nhận thông tin.","ex":[["Please acknowledge receipt of this email.","Vui lòng xác nhận đã nhận email này."]],"c":"Email, tin nhắn.","col":["acknowledge receipt","ack"],"rel":["noted"]},{"t":"on it","p":"phrase","vi":"đang làm ngay","d":"Cách nói thân mật: tôi đang xử lý việc đó.","ex":[["On it, will send it in 10 minutes.","Đang làm, 10 phút nữa gửi."]],"c":"Tin nhắn nhanh.","col":["working on it"],"rel":["noted"]},{"t":"ping","p":"v","vi":"nhắn nhanh","d":"Gửi tin nhắn ngắn để liên lạc hoặc nhắc.","ex":[["Ping me when the stock arrives.","Hàng về thì nhắn mình nhé."]],"c":"Tin nhắn công việc.","col":["ping sb"],"rel":["keep me posted"]},{"t":"reach out","p":"v","vi":"liên hệ","d":"Chủ động liên lạc với ai đó.","ex":[["Feel free to reach out if you have questions.","Có câu hỏi gì cứ liên hệ nhé."]],"c":"Email, công việc.","col":["reach out to"],"rel":["touch base"]},{"t":"get back to","p":"v","vi":"phản hồi lại","d":"Trả lời sau khi có thông tin.","ex":[["I'll get back to you by Friday.","Thứ Sáu mình phản hồi lại nhé."]],"c":"Email, họp.","col":["get back to sb"],"rel":["I'll get back to you on"]},{"t":"hand off","p":"v","vi":"chuyển giao việc","d":"Chuyển phần việc cho người hoặc team khác làm tiếp.","ex":[["Hand off the approved script to the host team.","Chuyển kịch bản đã duyệt cho team host."]],"c":"Quy trình.","col":["handoff"],"rel":["handover"]},{"t":"bottleneck","p":"n","vi":"nút thắt cổ chai","d":"Điểm làm chậm cả quy trình.","ex":[["Brand approval is the bottleneck in our workflow.","Bước brand duyệt là nút thắt trong quy trình."]],"c":"Phân tích quy trình.","col":["remove the bottleneck"],"rel":["blocker","workflow"]},{"t":"workaround","p":"n","vi":"cách xử lý tạm thời","d":"Giải pháp tạm để vượt qua vấn đề trong khi chưa sửa được gốc.","ex":[["The workaround is to pin the product manually.","Cách xử lý tạm là ghim sản phẩm thủ công."]],"c":"Xử lý sự cố.","col":["temporary fix"],"rel":["root cause"]},{"t":"quick win","p":"n","vi":"thắng lợi nhanh","d":"Cải tiến nhỏ, dễ làm, có kết quả ngay.","ex":[["Changing the live cover is a quick win.","Đổi ảnh bìa live là việc nhỏ mà hiệu quả ngay."]],"c":"Đề xuất cải tiến.","col":["low-hanging fruit"],"rel":["priority"]},{"t":"low-hanging fruit","p":"n","vi":"việc dễ ăn","d":"Cơ hội dễ đạt, ít công sức.","ex":[["Let's start with the low-hanging fruit.","Bắt đầu từ những việc dễ làm trước."]],"c":"Họp, ưu tiên.","col":["quick win"],"rel":["priority"]},{"t":"game changer","p":"n","vi":"thứ thay đổi cuộc chơi","d":"Thứ tạo ra khác biệt lớn.","ex":[["The new dashboard is a game changer for ops.","Bảng số liệu mới thay đổi hẳn cách vận hành."]],"c":"Họp, thuyết trình.","col":["breakthrough"],"rel":["insight"]},{"t":"best practice","p":"n","vi":"cách làm tốt nhất","d":"Cách làm đã được chứng minh hiệu quả, nên áp dụng.","ex":[["It's best practice to test orders before going live.","Đặt đơn thử trước live là cách làm chuẩn."]],"c":"Đào tạo, quy trình.","col":["industry best practice"],"rel":["SOP"]},{"t":"rule of thumb","p":"n","vi":"nguyên tắc kinh nghiệm","d":"Quy tắc ước lượng đơn giản từ kinh nghiệm, không chính xác tuyệt đối.","ex":[["Rule of thumb: recap the deal every 10 minutes.","Nguyên tắc kinh nghiệm: nhắc lại deal mỗi 10 phút."]],"c":"Hướng dẫn nhanh.","col":["as a rule"],"rel":["best practice"]},{"t":"heads down","p":"adj","vi":"đang tập trung làm","d":"Đang tập trung cao độ, ít trả lời tin nhắn.","ex":[["I'm heads down on the 11.11 plan today.","Hôm nay mình đang tập trung vào kế hoạch 11.11."]],"c":"Báo trạng thái.","col":["focus time"],"rel":["bandwidth"]},{"t":"swamped","p":"adj","vi":"ngập việc","d":"Quá nhiều việc.","ex":[["I'm swamped this week, can we meet Monday?","Tuần này ngập việc quá, thứ Hai gặp được không?"]],"c":"Nói về khối lượng việc.","col":["snowed under","overloaded"],"rel":["workload","bandwidth"]},{"t":"push back","p":"v","vi":"phản đối, đẩy lùi","d":"Có hai nghĩa: phản đối một yêu cầu, hoặc dời lịch muộn hơn.","ex":[["We pushed back on the brand's extra request.","Bọn mình đã phản đối yêu cầu thêm của brand."]],"c":"Đàm phán, lịch.","col":["push back on","pushback"],"rel":["scope creep","reschedule"]},{"t":"reschedule","p":"v","vi":"dời lịch","d":"Đổi thời gian của cuộc họp, sự kiện.","ex":[["Can we reschedule to 3 PM?","Mình dời sang 3 giờ được không?"]],"c":"Lịch họp.","col":["postpone","move the meeting"],"rel":["push back"]},{"t":"postpone","p":"v","vi":"hoãn","d":"Lùi một việc sang thời điểm sau.","ex":[["The launch live is postponed to next week.","Live ra mắt hoãn sang tuần sau."]],"c":"Lịch.","col":["put off"],"rel":["reschedule"]},{"t":"cancel","p":"v","vi":"hủy","d":"Không diễn ra nữa.","ex":[["Today's sync is cancelled.","Buổi họp nhanh hôm nay bị hủy."]],"c":"Lịch.","col":["call off"],"rel":["postpone"]},{"t":"calendar invite","p":"n","vi":"lời mời họp trên lịch","d":"Thư mời qua lịch Google hoặc Outlook.","ex":[["I'll send a calendar invite for Thursday.","Mình sẽ gửi lời mời họp thứ Năm."]],"c":"Hẹn họp.","col":["meeting invite","send an invite"],"rel":["agenda"]},{"t":"time zone","p":"n","vi":"múi giờ","d":"Khu vực giờ. Quan trọng khi họp với đối tác nước ngoài.","ex":[["What time is that in your time zone?","Giờ đó là mấy giờ ở múi giờ bạn?"]],"c":"Họp quốc tế.","col":["GMT+7","ICT"],"rel":["calendar invite"]},{"t":"Out of curiosity","p":"pattern","vi":"Cho mình hỏi tò mò","d":"Mở đầu câu hỏi nhẹ nhàng, không gây áp lực.","ex":[["Out of curiosity, why did we stop the morning live?","Hỏi tò mò chút, sao mình ngừng live buổi sáng vậy?"]],"c":"Hỏi đồng nghiệp.","col":["just wondering"],"rel":["quick question"]},{"t":"Would it be possible to","p":"pattern","vi":"Có thể nào … không","d":"Nhờ vả rất lịch sự.","ex":[["Would it be possible to get the samples by Monday?","Có thể nhận mẫu trước thứ Hai không?"]],"c":"Email, tin nhắn.","col":["is it possible"],"rel":["Could you please"]},{"t":"I was wondering if","p":"pattern","vi":"Không biết bạn có thể","d":"Hỏi xin lịch sự, mềm mỏng.","ex":[["I was wondering if you could join the live review.","Không biết bạn có thể tham gia buổi đánh giá live không."]],"c":"Email, tin nhắn.","col":["would you mind"],"rel":["Could you please"]},{"t":"Just checking in","p":"pattern","vi":"Hỏi thăm tiến độ chút","d":"Nhắc nhẹ hoặc hỏi tình hình.","ex":[["Just checking in on the banner, any updates?","Hỏi thăm chút về banner, có cập nhật gì chưa?"]],"c":"Tin nhắn, email.","col":["checking in","follow up"],"rel":["follow up"]},{"t":"Happy to discuss","p":"pattern","vi":"Sẵn sàng trao đổi thêm","d":"Mở cửa cho thảo luận tiếp.","ex":[["Happy to discuss if you have other ideas.","Sẵn sàng trao đổi nếu bạn có ý khác."]],"c":"Kết email.","col":["open to discuss"],"rel":["Please let me know if"]},{"t":"Let me loop in","p":"pattern","vi":"Để mình thêm … vào trao đổi","d":"Thêm người liên quan vào email, nhóm chat.","ex":[["Let me loop in our ads lead.","Để mình thêm trưởng nhóm quảng cáo vào."]],"c":"Email, chat.","col":["adding","cc'ing"],"rel":["loop in"]},{"t":"working hours","p":"n","vi":"giờ làm việc","d":"Khung giờ làm việc chính thức. After hours là ngoài giờ.","ex":[["Our working hours are 1 PM to 10 PM because of lives.","Giờ làm việc 1 giờ chiều đến 10 giờ tối vì có live."]],"c":"Lịch làm việc.","col":["office hours","after hours"],"rel":["shift"]},{"t":"urgent","p":"adj","vi":"khẩn cấp","d":"Cần xử lý ngay.","ex":[["Urgent: wrong price on product 3!","Khẩn: sai giá sản phẩm số 3!"]],"c":"Tin nhắn.","col":["URGENT","high priority"],"rel":["ASAP","priority"]}]},{"id":"report","code":"REPORT","group":"Công việc","en":"Meetings, Reporting & Data","vi":"Họp, báo cáo và phân tích số liệu","intro":"Ngôn ngữ để trình bày số liệu, so sánh theo kỳ, giải thích nguyên nhân và đề xuất hành động.","terms":[{"t":"agenda","p":"n","vi":"chương trình họp","d":"Danh sách nội dung sẽ bàn trong cuộc họp, gửi trước để mọi người chuẩn bị.","c":"Mời họp.","ex":[["Please send the agenda before the meeting.","Gửi chương trình họp trước nhé."]],"col":["on the agenda","meeting agenda"],"rel":["meeting minutes","kick-off meeting"]},{"t":"kick-off meeting","p":"n","vi":"họp khởi động dự án","d":"Cuộc họp đầu tiên của dự án hoặc chiến dịch để thống nhất mục tiêu, phân vai, lịch.","c":"Bắt đầu chiến dịch với brand.","ex":[["The kick-off meeting for the 12.12 campaign is on Monday.","Họp khởi động chiến dịch 12.12 vào thứ Hai."]],"col":["project kick-off","kick off"],"rel":["agenda","brief"]},{"t":"stand-up","p":"n","vi":"họp nhanh đầu ngày","d":"Họp rất ngắn (khoảng 15 phút) hằng ngày, mỗi người nói hôm qua làm gì, hôm nay làm gì, có vướng mắc gì.","c":"Nhịp làm việc của team.","ex":[["Raise the courier issue in tomorrow's stand-up.","Nêu vụ vận chuyển ở buổi họp nhanh sáng mai."]],"col":["daily stand-up","morning huddle"],"rel":["sync","blocker"]},{"t":"one-on-one","f":"1:1","p":"n","vi":"họp riêng hai người","d":"Cuộc trao đổi định kỳ giữa quản lý và nhân viên về công việc, phát triển, khó khăn.","c":"Quản lý nhân sự.","ex":[["Let's discuss your career goals in our next 1:1.","Mình bàn mục tiêu nghề nghiệp của bạn ở buổi 1:1 tới."]],"col":["1:1","weekly one-on-one"],"rel":["feedback"]},{"t":"meeting minutes","p":"n","vi":"biên bản họp","d":"Ghi chép những gì đã bàn, quyết định và đầu việc trong cuộc họp. Hay viết tắt MoM (minutes of meeting), dễ nhầm với MoM tăng trưởng theo tháng.","c":"Gửi sau họp.","ex":[["I'll send the meeting minutes by noon.","Mình gửi biên bản họp trước trưa."]],"col":["take minutes","MoM"],"rel":["recap","action items"],"tip":"MoM có hai nghĩa: biên bản họp và month-over-month. Dựa vào ngữ cảnh để hiểu."},{"t":"recap","p":"n, v","vi":"tóm tắt lại","d":"Tóm tắt nội dung chính sau cuộc họp, phiên live hoặc chiến dịch.","c":"Gửi sau sự kiện.","ex":[["Here's a quick recap of last night's live.","Đây là tóm tắt nhanh phiên live tối qua."]],"col":["quick recap","campaign recap","to recap"],"rel":["meeting minutes","key takeaway"]},{"t":"key takeaway","p":"n","vi":"điểm rút ra chính","d":"Điều quan trọng nhất cần nhớ hoặc rút ra từ báo cáo, cuộc họp.","c":"Kết luận báo cáo.","ex":[["The key takeaway: evening lives convert twice as well.","Điểm chính rút ra: live buổi tối chuyển đổi gấp đôi."]],"col":["main takeaway","takeaways"],"rel":["insight","recap"]},{"t":"next steps","p":"n","vi":"các bước tiếp theo","d":"Việc cần làm tiếp sau khi kết thúc cuộc họp hoặc báo cáo.","c":"Kết thúc họp, email.","ex":[["Next steps: finalize the lineup and send it to the brand by Wednesday.","Bước tiếp: chốt danh sách sản phẩm và gửi brand trước thứ Tư."]],"col":["agree on next steps"],"rel":["action items"]},{"t":"parking lot","p":"n","vi":"danh sách vấn đề để bàn sau","d":"Nơi ghi lại những chủ đề phát sinh không thuộc chương trình họp, để bàn sau và không làm lệch cuộc họp.","c":"Điều phối cuộc họp.","ex":[["Good point, let's put it in the parking lot.","Ý hay, ghi lại để bàn sau nhé."]],"col":["park the topic"],"rel":["circle back","agenda"]},{"t":"WoW","f":"Week-over-Week","p":"abbr","vi":"so với tuần trước","d":"So sánh chỉ số tuần này với tuần trước.","c":"Báo cáo tuần.","fm":"Tăng trưởng WoW = (tuần này − tuần trước) ÷ tuần trước × 100%","ex":[["GMV is up 15% WoW.","GMV tăng 15% so với tuần trước."]],"col":["WoW growth","week on week"],"rel":["MoM","YoY"]},{"t":"MoM","f":"Month-over-Month","p":"abbr","vi":"so với tháng trước","d":"So sánh chỉ số tháng này với tháng trước.","c":"Báo cáo tháng.","fm":"Tăng trưởng MoM = (tháng này − tháng trước) ÷ tháng trước × 100%","ex":[["Orders grew 8% MoM.","Số đơn tăng 8% so với tháng trước."]],"col":["MoM growth","month on month"],"rel":["WoW","YoY","meeting minutes"]},{"t":"YoY","f":"Year-over-Year","p":"abbr","vi":"so với cùng kỳ năm trước","d":"So sánh với cùng thời điểm năm trước, loại bỏ ảnh hưởng mùa vụ. Rất hay dùng cho siêu sale (11.11 năm nay so với 11.11 năm ngoái).","c":"Báo cáo chiến dịch, báo cáo năm.","ex":[["11.11 GMV grew 40% YoY.","GMV 11.11 tăng 40% so với cùng kỳ năm trước."]],"col":["YoY growth","same period last year"],"rel":["MoM","seasonality"]},{"t":"QoQ","f":"Quarter-over-Quarter","p":"abbr","vi":"so với quý trước","d":"So sánh chỉ số quý này với quý trước. Các quý: Q1 đến Q4.","c":"Báo cáo quý.","ex":[["Live revenue increased 22% QoQ in Q3.","Doanh thu live quý 3 tăng 22% so với quý 2."]],"col":["Q1, Q2, Q3, Q4","QoQ growth"],"rel":["YoY","MoM"]},{"t":"growth rate","p":"n","vi":"tốc độ tăng trưởng","d":"Phần trăm thay đổi giữa hai kỳ. Tăng là increase, grow, rise; giảm là decrease, decline, drop.","c":"Báo cáo.","fm":"Tăng trưởng = (kỳ này − kỳ trước) ÷ kỳ trước × 100%","ex":[["The growth rate slowed down in October.","Tốc độ tăng trưởng chậm lại trong tháng 10."]],"col":["increase by / to","decline","surge","plunge"],"rel":["WoW","percentage point"]},{"t":"percentage point","f":"pp","p":"n","vi":"điểm phần trăm","d":"Đơn vị chênh lệch giữa hai tỉ lệ phần trăm. Chuyển đổi từ 2% lên 3% là tăng 1 điểm phần trăm (hay tăng 50%), không phải tăng 1%.","c":"Báo cáo chính xác.","ex":[["Conversion rate rose by 1 percentage point, from 2% to 3%.","Tỉ lệ chuyển đổi tăng 1 điểm phần trăm, từ 2% lên 3%."]],"col":["pp","basis point"],"rel":["growth rate","conversion rate"],"tip":"Lỗi rất hay gặp trong báo cáo. Khi so sánh hai tỉ lệ, dùng pp."},{"t":"achievement rate","p":"n","vi":"tỉ lệ đạt chỉ tiêu","d":"Phần trăm thực tế so với chỉ tiêu.","c":"Báo cáo KPI.","fm":"Tỉ lệ đạt = thực tế ÷ chỉ tiêu × 100%","ex":[["Our achievement rate this month is 92%.","Tháng này đạt 92% chỉ tiêu."]],"col":["% to target","KPI achievement"],"rel":["target","actual"]},{"t":"insight","p":"n","vi":"nhận định rút ra từ dữ liệu","d":"Hiểu biết có giá trị rút ra từ số liệu, giải thích tại sao và gợi ý nên làm gì. Insight khác với data: data là con số, insight là ý nghĩa của con số.","c":"Báo cáo, phân tích.","ex":[["Don't just list numbers, give me the insights.","Đừng chỉ liệt kê số, cho mình nhận định."],["One insight: viewers from short videos buy more than those from ads.","Một nhận định: người xem từ video ngắn mua nhiều hơn người từ quảng cáo."]],"col":["actionable insight","key insight","data insight"],"rel":["key takeaway","consumer insight"]},{"t":"root cause","p":"n","vi":"nguyên nhân gốc","d":"Nguyên nhân sâu xa thật sự của vấn đề, không phải triệu chứng bề mặt. Root cause analysis (RCA) là phân tích nguyên nhân gốc.","c":"Báo cáo sự cố, rút kinh nghiệm.","ex":[["The root cause of the cancellations was wrong stock data.","Nguyên nhân gốc của các đơn hủy là dữ liệu tồn kho sai."]],"col":["root cause analysis","RCA","5 whys"],"rel":["post-mortem"]},{"t":"post-mortem","p":"n","vi":"họp rút kinh nghiệm","d":"Phân tích sau một sự cố hay chiến dịch: điều gì tốt, điều gì sai, vì sao, cải thiện thế nào. Còn gọi là retrospective, retro.","c":"Sau live lỗi hoặc sau siêu sale.","ex":[["Let's do a post-mortem on the 10.10 live.","Họp rút kinh nghiệm phiên 10.10 nhé."]],"col":["retrospective","retro","lessons learned"],"rel":["root cause","lessons learned"]},{"t":"lessons learned","p":"n","vi":"bài học kinh nghiệm","d":"Những điều rút ra để làm tốt hơn lần sau.","c":"Báo cáo sau chiến dịch.","ex":[["Add a lessons learned section to the campaign report.","Thêm phần bài học kinh nghiệm vào báo cáo chiến dịch."]],"col":["key lessons"],"rel":["post-mortem"]},{"t":"dashboard","p":"n","vi":"bảng điều khiển số liệu","d":"Trang tổng hợp chỉ số bằng biểu đồ, bảng, cập nhật định kỳ hoặc thời gian thực.","c":"Theo dõi hiệu suất.","ex":[["All live KPIs are on the shared dashboard.","Mọi KPI live nằm trên bảng số liệu chung."]],"col":["KPI dashboard","build a dashboard"],"rel":["real-time dashboard","KPI"]},{"t":"KPI","f":"Key Performance Indicator","p":"abbr","vi":"chỉ số đo lường hiệu suất chính","d":"Con số then chốt dùng đánh giá công việc, ví dụ GMV, số đơn, ROAS, tỉ lệ chuyển đổi.","c":"Đặt mục tiêu, đánh giá.","ex":[["Our KPI for this month is 3 billion VND in GMV.","KPI tháng này là 3 tỷ GMV."]],"col":["set KPIs","hit the KPI","KPI review"],"rel":["OKR","target"]},{"t":"benchmark","p":"n, v","vi":"mốc so sánh, chuẩn đối chiếu","d":"Con số hoặc kết quả dùng làm chuẩn để so sánh, ví dụ trung bình ngành, kết quả kỳ trước, đối thủ tốt nhất. Động từ benchmark against là so sánh với.","c":"Đánh giá kết quả có tốt hay không.","ex":[["A 2% conversion rate is a good benchmark for this category.","Tỉ lệ chuyển đổi 2% là mốc tốt cho ngành hàng này."],["Let's benchmark our GPM against the top three shops.","So sánh GPM của mình với ba shop dẫn đầu."]],"col":["industry benchmark","benchmark against"],"rel":["competitor analysis","KPI"]},{"t":"OKR","f":"Objectives and Key Results","p":"abbr","vi":"mục tiêu và kết quả then chốt","d":"Phương pháp đặt mục tiêu: một mục tiêu định tính (Objective) đi kèm vài kết quả đo được (Key Results).","c":"Lập kế hoạch quý.","ex":[["Q4 objective: become the top live shop in skincare. KR1: 10 billion GMV.","Mục tiêu quý 4: thành shop live số 1 ngành chăm sóc da. KR1: 10 tỷ GMV."]],"col":["set OKRs","key results"],"rel":["KPI"]},{"t":"breakdown","p":"n","vi":"phân tách chi tiết","d":"Chia một con số tổng ra theo thành phần: theo sản phẩm, theo kênh, theo giờ.","c":"Báo cáo.","ex":[["Can you give me a breakdown of GMV by product?","Gửi mình GMV tách theo từng sản phẩm nhé?"]],"col":["break down by","cost breakdown"],"rel":["deep dive"]},{"t":"deep dive","p":"n, v","vi":"phân tích sâu","d":"Phân tích chi tiết một vấn đề cụ thể.","c":"Họp, báo cáo.","ex":[["Let's do a deep dive into why ROAS dropped.","Phân tích sâu vì sao ROAS giảm."]],"col":["deep dive into"],"rel":["breakdown","root cause"]},{"t":"outlier","p":"n","vi":"giá trị bất thường","d":"Số liệu khác hẳn phần còn lại, có thể do lỗi hoặc sự kiện đặc biệt. Nên loại hoặc giải thích khi phân tích.","c":"Phân tích dữ liệu.","ex":[["The 11.11 session is an outlier, exclude it from the average.","Phiên 11.11 là giá trị bất thường, loại khỏi số trung bình."]],"col":["exclude outliers"],"rel":["trend line"]},{"t":"trend line","p":"n","vi":"đường xu hướng","d":"Đường thể hiện hướng thay đổi chung của số liệu theo thời gian (đi lên, đi xuống, đi ngang).","c":"Trình bày biểu đồ.","ex":[["The trend line shows GMV is slowly declining.","Đường xu hướng cho thấy GMV đang giảm dần."]],"col":["upward trend","downward trend","flat"],"rel":["outlier","growth rate"]},{"t":"highlight / lowlight","p":"n","vi":"điểm sáng / điểm chưa tốt","d":"Trong báo cáo, highlights là kết quả tốt nổi bật, lowlights là phần chưa đạt cần cải thiện.","c":"Cấu trúc báo cáo tuần, tháng.","ex":[["Highlight: new host hit 120% target. Lowlight: return rate rose to 6%.","Điểm sáng: host mới đạt 120% chỉ tiêu. Điểm chưa tốt: tỉ lệ hoàn tăng lên 6%."]],"col":["highlights and lowlights"],"rel":["recap","key takeaway"]},{"t":"data-driven","p":"adj","vi":"dựa trên dữ liệu","d":"Ra quyết định dựa trên số liệu thay vì cảm tính.","c":"Văn hóa làm việc, phỏng vấn.","ex":[["We make data-driven decisions about which host goes on prime time.","Mình quyết định host nào lên giờ vàng dựa trên dữ liệu."]],"col":["data-driven decision","data-informed"],"rel":["insight","dashboard"]},{"t":"weekly report","p":"n","vi":"báo cáo tuần","d":"Báo cáo kết quả và tiến độ mỗi tuần. Monthly report là báo cáo tháng.","ex":[["The weekly report is due every Monday at 10 AM.","Báo cáo tuần nộp 10 giờ sáng thứ Hai."]],"c":"Báo cáo định kỳ.","col":["monthly report","daily report"],"rel":["recap"]},{"t":"executive summary","p":"n","vi":"tóm tắt điều hành","d":"Phần tóm tắt ngắn ở đầu báo cáo cho lãnh đạo đọc nhanh.","ex":[["Keep the executive summary to five bullet points.","Giữ phần tóm tắt trong năm gạch đầu dòng."]],"c":"Viết báo cáo.","col":["summary","TL","DR"],"rel":["key takeaway"]},{"t":"TL;DR","p":"abbr","vi":"tóm tắt ngắn","d":"Too long; didn't read: tóm tắt cực ngắn, thường ở đầu tin nhắn dài.","ex":[["TL;DR: GMV up 20%, ROAS stable, stock is the risk.","Tóm tắt: GMV tăng 20%, ROAS ổn định, tồn kho là rủi ro."]],"c":"Tin nhắn, email.","col":["TLDR"],"rel":["executive summary"]},{"t":"data source","p":"n","vi":"nguồn dữ liệu","d":"Nơi lấy số liệu.","ex":[["Data source: Seller Center, exported Oct 10.","Nguồn: kênh người bán, xuất ngày 10/10."]],"c":"Báo cáo minh bạch.","col":["source"],"rel":["dashboard"]},{"t":"assumption","p":"n","vi":"giả định","d":"Điều được giả sử là đúng khi tính toán hoặc lập kế hoạch.","ex":[["The forecast assumes a 3% conversion rate.","Dự báo giả định tỉ lệ chuyển đổi 3%."]],"c":"Dự báo, kế hoạch.","col":["key assumptions","assume"],"rel":["forecast"]},{"t":"scenario","p":"n","vi":"kịch bản (dự báo)","d":"Các tình huống giả định: best case (tốt nhất), base case (cơ sở), worst case (xấu nhất).","ex":[["In the worst-case scenario, we hit 70% of target.","Trường hợp xấu nhất, đạt 70% chỉ tiêu."]],"c":"Lập kế hoạch.","col":["best case","worst case","base case"],"rel":["forecast","assumption"]},{"t":"correlation","p":"n","vi":"tương quan","d":"Hai chỉ số biến động cùng nhau. Tương quan không có nghĩa là quan hệ nhân quả (causation).","ex":[["There's a correlation between watch time and GMV.","Có tương quan giữa thời gian xem và GMV."]],"c":"Phân tích dữ liệu.","col":["correlation vs causation"],"rel":["insight"]},{"t":"spike","p":"n, v","vi":"tăng vọt","d":"Tăng đột ngột trong thời gian ngắn.","ex":[["Orders spiked at 9 PM.","Đơn tăng vọt lúc 9 giờ."]],"c":"Mô tả biểu đồ.","col":["sharp spike","surge"],"rel":["plunge"]},{"t":"plunge","p":"v, n","vi":"tụt mạnh","d":"Giảm rất mạnh, đột ngột.","ex":[["CCU plunged when the stream lagged.","CCU tụt mạnh khi live bị giật."]],"c":"Mô tả biểu đồ.","col":["plummet","drop sharply"],"rel":["spike"]},{"t":"plateau","p":"n, v","vi":"chững lại","d":"Đi ngang, không tăng nữa sau một thời gian tăng.","ex":[["Organic traffic has plateaued.","Lượng truy cập tự nhiên đã chững lại."]],"c":"Mô tả xu hướng.","col":["level off","flat"],"rel":["trend line"]},{"t":"fluctuate","p":"v","vi":"dao động","d":"Lên xuống thất thường.","ex":[["ROAS fluctuated between 3 and 6 this week.","ROAS dao động từ 3 đến 6 tuần này."]],"c":"Mô tả số liệu.","col":["fluctuation"],"rel":["trend line"]},{"t":"steady","p":"adj","vi":"ổn định, đều","d":"Thay đổi đều, không đột biến.","ex":[["GMV grew at a steady pace.","GMV tăng đều đặn."]],"c":"Mô tả xu hướng.","col":["steady growth","stable"],"rel":["plateau"]},{"t":"significant","p":"adj","vi":"đáng kể","d":"Lớn, quan trọng. Trong thống kê là có ý nghĩa thống kê.","ex":[["There was a significant drop in conversion.","Chuyển đổi giảm đáng kể."]],"c":"Báo cáo.","col":["significantly","marginal"],"rel":[]},{"t":"marginal","p":"adj","vi":"không đáng kể","d":"Rất nhỏ.","ex":[["The change in CTR was marginal.","Thay đổi CTR không đáng kể."]],"c":"Báo cáo.","col":["marginally","slight"],"rel":["significant"]},{"t":"roughly","p":"adv","vi":"khoảng, xấp xỉ","d":"Con số ước lượng. Tương tự approximately, around, about.","ex":[["We had roughly 2,000 orders.","Có khoảng 2.000 đơn."]],"c":"Nói số liệu.","col":["approximately","around"],"rel":["estimate"]},{"t":"estimate","p":"n, v","vi":"ước tính","d":"Con số tính gần đúng. Viết tắt est.","ex":[["Our estimate is 1.5 billion for the campaign.","Ước tính chiến dịch đạt 1,5 tỷ."]],"c":"Báo cáo, kế hoạch.","col":["rough estimate","ballpark"],"rel":["forecast","roughly"]},{"t":"ballpark figure","p":"n","vi":"con số ước chừng","d":"Con số ước lượng sơ bộ.","ex":[["Can you give me a ballpark figure for the KOL budget?","Cho mình con số ước chừng ngân sách KOL nhé?"]],"c":"Thảo luận nhanh.","col":["ballpark"],"rel":["estimate"]},{"t":"summary table","p":"n","vi":"bảng tóm tắt","d":"Bảng tổng hợp số liệu chính.","ex":[["Put a summary table at the top of the report.","Đặt bảng tóm tắt ở đầu báo cáo."]],"c":"Báo cáo.","col":["overview table"],"rel":["executive summary"]}]},{"id":"client","code":"CLIENT","group":"Công việc","en":"Brand & Agency Collaboration","vi":"Làm việc với brand và agency","intro":"Từ vựng hợp tác thương mại: đề xuất, báo giá, hợp đồng, mô hình phí, duyệt nội dung và quy định quảng cáo.","terms":[{"t":"client","p":"n","vi":"khách hàng (doanh nghiệp)","d":"Bên thuê dịch vụ, với agency live thường là brand. Phía client gọi là client side.","c":"Làm việc agency.","ex":[["The client wants a weekly performance report.","Khách hàng muốn báo cáo hiệu suất hằng tuần."]],"col":["client side","client meeting","key client"],"rel":["agency","account manager"]},{"t":"agency","p":"n","vi":"công ty dịch vụ, đại lý","d":"Đơn vị cung cấp dịch vụ cho brand: live agency, ad agency, creative agency. Agency side là phía agency.","c":"Mô tả mô hình làm việc.","ex":[["We're a live commerce agency managing 15 brands.","Bọn mình là agency livestream quản lý 15 brand."]],"col":["agency side","in-house"],"rel":["client","MCN"],"tip":"In-house là team nội bộ của brand, đối lập với thuê agency."},{"t":"account manager","f":"AM","p":"n","vi":"người quản lý khách hàng","d":"Người phụ trách mối quan hệ với một hoặc nhiều client: nhận yêu cầu, báo cáo, chăm sóc, bán thêm dịch vụ.","c":"Làm việc agency.","ex":[["Please contact your account manager for the contract.","Liên hệ người quản lý khách hàng của bạn về hợp đồng."]],"col":["AM","key account manager"],"rel":["client","key account"]},{"t":"key account","f":"KA","p":"n","vi":"khách hàng lớn, khách hàng trọng điểm","d":"Client quan trọng nhất, đóng góp doanh thu lớn, được phục vụ đặc biệt.","c":"Phân loại khách hàng.","ex":[["This brand is one of our key accounts.","Brand này là một trong những khách hàng trọng điểm."]],"col":["KA","key account manager (KAM)"],"rel":["account manager"]},{"t":"brief","p":"n, v","vi":"bản yêu cầu công việc","d":"Tài liệu ngắn mô tả mục tiêu, đối tượng, thông điệp, yêu cầu, ngân sách, thời gian của một nhiệm vụ. Động từ brief là giao việc kèm thông tin.","c":"Brand gửi cho agency, leader gửi cho team.","ex":[["The brand sent us the brief for the 12.12 campaign.","Brand đã gửi brief chiến dịch 12.12."],["Can you brief the host on the new product?","Bạn brief host về sản phẩm mới nhé?"]],"col":["creative brief","debrief","client brief"],"rel":["proposal","key message"]},{"t":"proposal","p":"n","vi":"bản đề xuất","d":"Tài liệu agency gửi brand trình bày giải pháp, kế hoạch, chi phí. Còn gọi là deck khi là dạng slide.","c":"Chào dịch vụ, đáp lại brief.","ex":[["We'll send the proposal by Thursday.","Thứ Năm bọn mình gửi bản đề xuất."]],"col":["submit a proposal","proposal deck"],"rel":["pitch","quotation"]},{"t":"pitch","p":"n, v","vi":"thuyết trình chào dịch vụ","d":"Buổi trình bày để thuyết phục brand chọn mình. Nhiều agency cùng pitch thì gọi là competitive pitch.","c":"Tìm khách mới.","ex":[["We won the pitch for the skincare brand.","Bọn mình thắng pitch của brand chăm sóc da."]],"col":["win / lose a pitch","pitch deck"],"rel":["proposal"]},{"t":"quotation","p":"n","vi":"báo giá","d":"Văn bản ghi giá dịch vụ hoặc sản phẩm. Nói ngắn là quote.","c":"Thương lượng chi phí.","ex":[["Please send us a quotation for 20 live sessions.","Gửi báo giá cho 20 phiên live nhé."]],"col":["quote","request a quote","price quote"],"rel":["rate card","proposal"]},{"t":"SOW","f":"Scope Of Work","p":"abbr","vi":"phạm vi công việc","d":"Tài liệu mô tả chính xác việc sẽ làm và không làm, sản phẩm bàn giao, thời gian. Bảo vệ cả hai bên khỏi hiểu lầm.","c":"Ký hợp đồng.","ex":[["Product photography is not in the SOW.","Chụp ảnh sản phẩm không nằm trong phạm vi công việc."]],"col":["out of scope","in scope"],"rel":["scope creep","deliverables","contract"]},{"t":"scope creep","p":"n","vi":"phạm vi công việc bị phình ra","d":"Khi client liên tục thêm yêu cầu ngoài thỏa thuận mà không tăng phí hoặc thời gian.","c":"Quản lý dự án, thương lượng.","ex":[["Extra videos every week is scope creep, we need to charge for it.","Thêm video mỗi tuần là phình phạm vi, cần tính phí."]],"col":["avoid scope creep"],"rel":["SOW","change request"]},{"t":"change request","p":"n","vi":"yêu cầu thay đổi","d":"Yêu cầu chính thức thay đổi phạm vi, thời gian hoặc chi phí so với thỏa thuận ban đầu.","c":"Quản lý dự án.","ex":[["Please submit a change request for the additional sessions.","Gửi yêu cầu thay đổi cho các phiên bổ sung nhé."]],"col":["submit a change request"],"rel":["scope creep","SOW"]},{"t":"contract","p":"n","vi":"hợp đồng","d":"Thỏa thuận pháp lý giữa các bên. Ký hợp đồng là sign a contract; gia hạn là renew.","c":"Hợp tác chính thức.","ex":[["The contract will be renewed every six months.","Hợp đồng gia hạn mỗi sáu tháng."]],"col":["sign a contract","renew","terminate","contract term"],"rel":["SOW","NDA","payment terms"]},{"t":"NDA","f":"Non-Disclosure Agreement","p":"abbr","vi":"thỏa thuận bảo mật","d":"Cam kết không tiết lộ thông tin mật như sản phẩm chưa ra mắt, giá, số liệu.","c":"Trước khi brand chia sẻ thông tin nhạy cảm.","ex":[["We need to sign an NDA before seeing the new product.","Cần ký thỏa thuận bảo mật trước khi xem sản phẩm mới."]],"col":["sign an NDA","under NDA","confidential"],"rel":["contract"]},{"t":"retainer","p":"n","vi":"phí duy trì hằng tháng","d":"Client trả một khoản cố định mỗi tháng để agency làm một khối lượng việc liên tục.","c":"Mô hình phí.","ex":[["The client pays a monthly retainer plus commission.","Khách trả phí cố định hằng tháng cộng hoa hồng."]],"col":["monthly retainer","retainer fee"],"rel":["fixed fee","commission-based"]},{"t":"fixed fee","p":"n","vi":"phí cố định","d":"Mức phí không đổi bất kể kết quả, ví dụ 5 triệu mỗi phiên live.","c":"Thương lượng mô hình phí.","ex":[["We charge a fixed fee of 5 million per session.","Bên mình thu phí cố định 5 triệu mỗi phiên."]],"col":["flat fee","per-session fee"],"rel":["commission-based","retainer"]},{"t":"commission-based","p":"adj","vi":"tính theo hoa hồng","d":"Phí tính theo phần trăm doanh số (thường là GMV hoặc doanh thu thuần). Nên ghi rõ tính trên con số nào.","c":"Thương lượng mô hình phí.","ex":[["The deal is commission-based: 10% of net GMV.","Hợp tác tính theo hoa hồng: 10% GMV thuần."]],"col":["commission rate","revenue share","hybrid model"],"rel":["fixed fee","net revenue"]},{"t":"performance bonus","p":"n","vi":"thưởng hiệu suất","d":"Khoản thưởng thêm khi đạt hoặc vượt chỉ tiêu.","c":"Hợp đồng, chế độ cho host.","ex":[["There's a performance bonus if GMV exceeds 1 billion.","Có thưởng hiệu suất nếu GMV vượt 1 tỷ."]],"col":["KPI bonus","incentive"],"rel":["target","commission-based"]},{"t":"PO","f":"Purchase Order","p":"abbr","vi":"đơn đặt hàng (chứng từ)","d":"Chứng từ client phát hành xác nhận mua dịch vụ hoặc hàng với số tiền cụ thể. Nhiều công ty cần PO trước khi xuất hóa đơn.","c":"Thủ tục thanh toán.","ex":[["We can't start until we receive the PO.","Bọn mình chưa thể bắt đầu cho tới khi nhận PO."]],"col":["issue a PO","PO number"],"rel":["invoice"]},{"t":"invoice","p":"n, v","vi":"hóa đơn","d":"Chứng từ yêu cầu thanh toán. Gửi hóa đơn là send/issue an invoice.","c":"Thanh toán.","ex":[["We'll send the invoice at the end of the month.","Cuối tháng bọn mình gửi hóa đơn."]],"col":["issue an invoice","overdue invoice","VAT invoice"],"rel":["PO","payment terms"]},{"t":"payment terms","p":"n","vi":"điều khoản thanh toán","d":"Quy định thời hạn và cách thanh toán, ví dụ Net 30 là thanh toán trong 30 ngày kể từ ngày hóa đơn.","c":"Hợp đồng.","ex":[["Our payment terms are Net 30.","Điều khoản thanh toán là trong 30 ngày."]],"col":["Net 30","upfront payment","deposit"],"rel":["invoice","contract"]},{"t":"revision","p":"n","vi":"lần chỉnh sửa","d":"Một lần sửa theo góp ý. Hợp đồng thường giới hạn số lần sửa, ví dụ 2 rounds of revisions.","c":"Duyệt nội dung, kịch bản.","ex":[["The price includes two rounds of revisions.","Giá đã gồm hai lần chỉnh sửa."]],"col":["round of revisions","revise"],"rel":["sign-off","content approval"]},{"t":"sign-off","p":"n","vi":"chấp thuận cuối cùng","d":"Xác nhận chính thức để chốt và triển khai. Động từ là sign off on.","c":"Chốt kịch bản, thiết kế, kế hoạch.","ex":[["We need final sign-off on the script by Wednesday.","Cần duyệt chốt kịch bản trước thứ Tư."]],"col":["sign off on","final sign-off"],"rel":["approve","revision"]},{"t":"brand guidelines","p":"n","vi":"cẩm nang thương hiệu","d":"Tài liệu quy định cách dùng logo, màu, phông chữ, giọng điệu, những điều không được nói. Host và designer phải tuân thủ.","c":"Thiết kế, viết kịch bản.","ex":[["The overlay doesn't follow the brand guidelines, the logo is too small.","Lớp phủ không đúng cẩm nang thương hiệu, logo quá nhỏ."]],"col":["brand book","style guide","do's and don'ts"],"rel":["brand identity","brand voice"]},{"t":"product claims","p":"n","vi":"tuyên bố công dụng sản phẩm","d":"Những điều được phép nói về công dụng sản phẩm. Mỹ phẩm, thực phẩm chức năng bị quy định chặt; nói quá công dụng (ví dụ “trị dứt điểm mụn”) có thể bị phạt hoặc khóa live.","c":"Kiểm duyệt kịch bản, đào tạo host.","ex":[["Only use the approved product claims in the script.","Chỉ dùng những tuyên bố công dụng đã được duyệt."],["Saying it cures acne is a medical claim, avoid it.","Nói nó chữa mụn là tuyên bố y tế, tránh nhé."]],"col":["approved claims","misleading claims","medical claim"],"rel":["compliance","live restriction"]},{"t":"compliance","p":"n","vi":"tuân thủ quy định","d":"Đảm bảo hoạt động đúng luật, quy định sàn và quy định nội bộ. Động từ là comply with.","c":"Kiểm duyệt nội dung, quy trình.","ex":[["The legal team checks all scripts for compliance.","Team pháp chế kiểm tra mọi kịch bản về tuân thủ."]],"col":["comply with","compliance check","regulatory"],"rel":["product claims","community guidelines"]},{"t":"partnership","p":"n","vi":"quan hệ hợp tác","d":"Hợp tác giữa hai bên vì lợi ích chung, thường dài hạn.","c":"Giới thiệu, đàm phán.","ex":[["We hope this is the start of a long-term partnership.","Hy vọng đây là khởi đầu của quan hệ hợp tác dài lâu."]],"col":["long-term partnership","strategic partner"],"rel":["client","brand ambassador"]},{"t":"brand manager","p":"n","vi":"quản lý thương hiệu","d":"Người phía brand phụ trách chiến lược và hoạt động của một nhãn hàng.","ex":[["The brand manager approves every live script.","Quản lý thương hiệu duyệt mọi kịch bản live."]],"c":"Làm việc với brand.","col":["BM"],"rel":["client","brand guidelines"]},{"t":"point of contact","p":"n","vi":"đầu mối liên hệ","d":"Người được chỉ định làm việc chính với đối tác.","ex":[["Lan will be your main point of contact.","Lan sẽ là đầu mối liên hệ chính của bên bạn."]],"f":"POC","c":"Phối hợp.","col":["POC","main contact"],"rel":["account manager"]},{"t":"onboarding call","p":"n","vi":"cuộc gọi khởi động hợp tác","d":"Cuộc gọi đầu tiên với khách mới để hiểu yêu cầu, giới thiệu quy trình.","ex":[["Let's schedule an onboarding call next Monday.","Hẹn cuộc gọi khởi động vào thứ Hai tới."]],"c":"Bắt đầu với client mới.","col":["kick-off call"],"rel":["kick-off meeting"]},{"t":"client report","p":"n","vi":"báo cáo cho khách hàng","d":"Báo cáo định kỳ gửi brand về kết quả.","ex":[["The client report goes out every Monday.","Báo cáo khách hàng gửi mỗi thứ Hai."]],"c":"Agency.","col":["monthly client report"],"rel":["weekly report"]},{"t":"client satisfaction","p":"n","vi":"mức hài lòng của khách hàng","d":"Mức brand hài lòng với dịch vụ.","ex":[["Client satisfaction is part of our team KPI.","Mức hài lòng của khách là một phần KPI của team."]],"c":"Agency.","col":["happy client"],"rel":["CSAT"]},{"t":"renewal","p":"n","vi":"gia hạn","d":"Tiếp tục hợp đồng sau khi hết hạn.","ex":[["The contract renewal is due in December.","Hợp đồng đến hạn gia hạn vào tháng 12."]],"c":"Hợp đồng.","col":["renew","contract renewal"],"rel":["contract"]},{"t":"upsell services","p":"phrase","vi":"bán thêm dịch vụ","d":"Đề xuất thêm dịch vụ cho khách hiện tại, ví dụ thêm quảng cáo, thêm KOL.","ex":[["We upsold ads m
