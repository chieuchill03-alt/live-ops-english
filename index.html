"Nghĩ sáng tạo cho chủ đề live Tết."]],"c":"Brainstorm.","col":["creative"],"rel":["brainstorm"]},{"t":"touch and go","p":"phrase","vi":"chưa chắc chắn","d":"Tình huống rủi ro, có thể thành hoặc không.","ex":[["It's touch and go whether the stock arrives in time.","Chưa chắc hàng có về kịp không."]],"c":"Báo cáo tình hình.","col":["uncertain"],"rel":["risk"]},{"t":"cut corners","p":"phrase","vi":"làm ẩu, đi tắt","d":"Bỏ bớt bước để nhanh hoặc rẻ, làm giảm chất lượng.","ex":[["Don't cut corners on the link check.","Đừng làm ẩu bước kiểm tra link."]],"c":"Góp ý.","col":["shortcut"],"rel":["best practice"]},{"t":"back to square one","p":"phrase","vi":"quay lại từ đầu","d":"Phải bắt đầu lại.","ex":[["The brand rejected the concept, we're back to square one.","Brand từ chối ý tưởng, phải làm lại từ đầu."]],"c":"Họp.","col":["start over"],"rel":["revision"]},{"t":"get the ball rolling","p":"phrase","vi":"khởi động","d":"Bắt đầu một việc.","ex":[["Let's get the ball rolling on the 12.12 plan.","Bắt đầu kế hoạch 12.12 thôi."]],"c":"Họp, dự án.","col":["kick off"],"rel":["kick-off meeting"]},{"t":"hit the ground running","p":"phrase","vi":"bắt tay ngay vào việc","d":"Bắt đầu nhanh và hiệu quả ngay.","ex":[["The new host hit the ground running.","Host mới bắt tay vào việc rất nhanh."]],"c":"Nhân sự mới, dự án.","col":["start strong"],"rel":["onboarding"]},{"t":"go the extra mile","p":"phrase","vi":"nỗ lực hơn mong đợi","d":"Làm nhiều hơn yêu cầu.","ex":[["The CS team went the extra mile for VIP customers.","Team CS nỗ lực hết mình cho khách VIP."]],"c":"Ghi nhận, CS.","col":["above and beyond"],"rel":["recognition"]},{"t":"call it a day","p":"phrase","vi":"nghỉ thôi, kết thúc","d":"Dừng làm việc trong ngày.","ex":[["Great live, let's call it a day.","Live tốt lắm, nghỉ thôi."]],"c":"Cuối ngày.","col":["wrap up"],"rel":["Let's wrap up"]},{"t":"in the loop","p":"phrase","vi":"nắm thông tin","d":"Được cập nhật. Out of the loop là không nắm thông tin.","ex":[["Keep the brand in the loop about delays.","Cập nhật cho brand về việc chậm trễ."]],"c":"Công việc.","col":["keep sb in the loop"],"rel":["loop in"]},{"t":"up in the air","p":"phrase","vi":"chưa quyết định","d":"Còn treo, chưa chắc.","ex":[["The KOL date is still up in the air.","Ngày live KOL vẫn chưa chốt."]],"c":"Báo tình hình.","col":["undecided","TBD"],"rel":["TBD / TBC"]},{"t":"the bottom line is","p":"phrase","vi":"điều mấu chốt là","d":"Dẫn vào ý quan trọng nhất.","ex":[["The bottom line is we need more stock.","Điều mấu chốt là cần thêm hàng."]],"c":"Họp, kết luận.","col":["at the end of the day"],"rel":["bottom line"]},{"t":"at the end of the day","p":"phrase","vi":"rốt cuộc, suy cho cùng","d":"Nhấn mạnh điều quan trọng cuối cùng.","ex":[["At the end of the day, the customer decides.","Suy cho cùng, khách hàng quyết định."]],"c":"Thảo luận.","col":["ultimately"],"rel":["the bottom line is"]},{"t":"win over","p":"v","vi":"thuyết phục, chinh phục","d":"Làm ai đó đồng ý hoặc yêu thích.","ex":[["The demo won over skeptical viewers.","Màn demo chinh phục người xem đang nghi ngờ."]],"c":"Bán hàng, đàm phán.","col":["convince"],"rel":["objection handling"]},{"t":"on the fence","p":"phrase","vi":"đang lưỡng lự","d":"Chưa quyết định.","ex":[["If you're on the fence, the free gift should help.","Nếu bạn còn lưỡng lự, quà tặng sẽ giúp bạn quyết."]],"c":"Bán hàng.","col":["undecided","hesitant"],"rel":["objection handling"]},{"t":"a no-brainer","p":"n","vi":"quá dễ để quyết","d":"Lựa chọn hiển nhiên đúng.","ex":[["At 99k, it's a no-brainer.","Giá 99k thì không cần nghĩ nữa."]],"c":"Bán hàng, đề xuất.","col":["easy decision"],"rel":["value for money"]},{"t":"fire-fighting","p":"n","vi":"chữa cháy (xử lý gấp)","d":"Liên tục xử lý vấn đề khẩn thay vì làm việc có kế hoạch.","ex":[["We spent the whole live fire-fighting link errors.","Cả phiên live chỉ lo chữa cháy lỗi link."]],"c":"Mô tả tình trạng làm việc.","col":["put out fires"],"rel":["live incident"]},{"t":"learning curve","p":"n","vi":"đường cong học tập","d":"Mức độ khó và thời gian cần để học một việc mới. Steep learning curve là khó học.","ex":[["There's a steep learning curve with LIVE Manager.","Học dùng LIVE Manager khá khó lúc đầu."]],"c":"Đào tạo.","col":["steep learning curve"],"rel":["onboarding"]},{"t":"moving forward","p":"phrase","vi":"từ nay về sau","d":"Nói về cách làm từ giờ.","ex":[["Moving forward, all deals need brand approval.","Từ nay mọi deal cần brand duyệt."]],"c":"Họp, email.","col":["going forward"],"rel":["Moving forward, we will"]},{"t":"take it with a grain of salt","p":"phrase","vi":"nghe nhưng đừng tin hoàn toàn","d":"Thận trọng với thông tin.","ex":[["Take the platform forecast with a grain of salt.","Dự báo của sàn chỉ nên tham khảo thận trọng."]],"c":"Phân tích.","col":["be skeptical"],"rel":["forecast"]},{"t":"ahead of the curve","p":"phrase","vi":"đi trước xu hướng","d":"Làm trước người khác.","ex":[["Starting live early kept us ahead of the curve.","Bắt đầu live sớm giúp mình đi trước xu hướng."]],"c":"Chiến lược.","col":["ahead of the game"],"rel":["trend"]},{"t":"pain in the neck","p":"phrase","vi":"phiền phức","d":"Việc gây khó chịu (thân mật).","ex":[["Manual reconciliation is a pain in the neck.","Đối soát thủ công thật phiền."]],"c":"Nói chuyện thân mật.","col":["hassle"],"rel":["reconciliation"]},{"t":"a quick sync","p":"phrase","vi":"họp nhanh","d":"Cách nói thân mật cho buổi trao đổi ngắn.","ex":[["Got time for a quick sync at 2?","2 giờ họp nhanh được không?"]],"c":"Tin nhắn.","col":["quick call"],"rel":["sync"]},{"t":"drop the ball","p":"phrase","vi":"để lỡ việc, sơ suất","d":"Quên hoặc làm hỏng việc mình phụ trách.","ex":[["Sorry, I dropped the ball on the voucher setup.","Xin lỗi, mình sơ suất vụ cài voucher."]],"c":"Nhận lỗi, góp ý.","col":["miss"],"rel":["ownership"]}]},{"id":"tools","code":"TOOLS","group":"Công việc","en":"Digital Tools & AI at Work","vi":"Công cụ số và AI trong công việc","intro":"Tên gọi và thao tác với công cụ làm việc, tự động hóa và AI hay gặp trong team live và TMĐT.","terms":[{"t":"workspace","p":"n","vi":"không gian làm việc (phần mềm)","d":"Không gian chung trong công cụ như Slack, Notion, Lark.","ex":[["Join the team workspace on Lark.","Tham gia không gian làm việc của team trên Lark."]],"c":"Công cụ.","col":["Slack","Lark","Notion"],"rel":["shared drive"]},{"t":"channel (chat)","p":"n","vi":"kênh chat","d":"Nhóm trò chuyện theo chủ đề trong Slack, Lark, Teams.","ex":[["Post live incidents in the #live-ops channel.","Đăng sự cố live trong kênh #live-ops."]],"c":"Giao tiếp nội bộ.","col":["group chat","thread"],"rel":["workspace"]},{"t":"thread","p":"n","vi":"luồng trả lời","d":"Chuỗi trả lời bên dưới một tin nhắn, giúp kênh chat gọn gàng.","ex":[["Reply in the thread, not in the main channel.","Trả lời trong luồng, đừng trả lời ở kênh chính."]],"c":"Chat công việc.","col":["reply in thread"],"rel":["channel (chat)"]},{"t":"mention","p":"v, n","vi":"nhắc tên (@)","d":"Gắn @ tên người để họ nhận thông báo.","ex":[["Mention me if you need approval.","Cần duyệt thì @ mình."]],"c":"Chat công việc.","col":["@mention","tag"],"rel":["ping"]},{"t":"access","p":"n, v","vi":"quyền truy cập","d":"Quyền xem hoặc chỉnh sửa file, tài khoản. Request access là xin quyền.","ex":[["Can you give me edit access to the sheet?","Cấp quyền chỉnh sửa file cho mình nhé?"]],"c":"Chia sẻ tài liệu.","col":["view access","edit access","request access"],"rel":["permission"]},{"t":"permission","p":"n","vi":"quyền hạn","d":"Quyền làm một việc trong hệ thống.","ex":[["Only admins have permission to change prices.","Chỉ quản trị viên được quyền đổi giá."]],"c":"Quản lý tài khoản.","col":["admin","role"],"rel":["access"]},{"t":"login credentials","p":"n","vi":"thông tin đăng nhập","d":"Tên đăng nhập và mật khẩu. Không gửi qua chat; dùng trình quản lý mật khẩu.","ex":[["Never share login credentials in group chats.","Không bao giờ gửi thông tin đăng nhập vào nhóm chat."]],"c":"Bảo mật.","col":["password","2FA"],"rel":["two-factor authentication"]},{"t":"two-factor authentication","p":"n","vi":"xác thực hai lớp","d":"Đăng nhập cần thêm mã từ điện thoại, tăng bảo mật.","ex":[["Turn on 2FA for the seller account.","Bật xác thực hai lớp cho tài khoản người bán."]],"f":"2FA","c":"Bảo mật tài khoản.","col":["2FA","OTP"],"rel":["login credentials"]},{"t":"OTP","p":"abbr","vi":"mã xác thực một lần","d":"Mã gửi qua tin nhắn hoặc ứng dụng để xác nhận đăng nhập, giao dịch.","ex":[["Who has the phone that receives the OTP?","Ai giữ điện thoại nhận mã OTP?"]],"f":"One-Time Password","c":"Bảo mật.","col":["verification code"],"rel":["two-factor authentication"]},{"t":"phishing","p":"n","vi":"lừa đảo đánh cắp thông tin","d":"Tin nhắn, email giả mạo để lấy mật khẩu hoặc tiền.","ex":[["That email asking for the shop password is phishing.","Email đòi mật khẩu shop đó là lừa đảo."]],"c":"Bảo mật.","col":["scam","phishing link"],"rel":["login credentials"]},{"t":"AI tool","p":"n","vi":"công cụ AI","d":"Phần mềm dùng trí tuệ nhân tạo để viết, dịch, tóm tắt, tạo hình ảnh.","ex":[["We use an AI tool to draft product descriptions.","Dùng công cụ AI để viết nháp mô tả sản phẩm."]],"c":"Làm việc hiệu quả hơn.","col":["generative AI","AI assistant"],"rel":["prompt"]},{"t":"prompt","p":"n","vi":"câu lệnh cho AI","d":"Yêu cầu bạn gửi cho công cụ AI.","ex":[["Write a clear prompt with the product details and tone.","Viết câu lệnh rõ ràng kèm thông tin sản phẩm và giọng văn."]],"c":"Dùng AI.","col":["prompt engineering"],"rel":["AI tool"]},{"t":"AI-generated","p":"adj","vi":"do AI tạo ra","d":"Nội dung tạo bởi AI. Một số nền tảng yêu cầu gắn nhãn nội dung AI.","ex":[["Label AI-generated videos according to platform rules.","Gắn nhãn video do AI tạo theo quy định nền tảng."]],"c":"Tuân thủ nội dung.","col":["AI label","synthetic media"],"rel":["community guidelines"]},{"t":"virtual host","p":"n","vi":"host ảo","d":"Nhân vật ảo hoặc avatar AI dẫn live. Cần tuân thủ quy định nền tảng về nội dung AI.","ex":[["Some brands test virtual hosts for overnight lives.","Một số brand thử host ảo cho các phiên live đêm."]],"c":"Xu hướng live.","col":["AI host","digital human"],"rel":["host","AI-generated"]},{"t":"auto-translate","p":"n, v","vi":"dịch tự động","d":"Công cụ dịch tự động phụ đề hoặc bình luận.","ex":[["Auto-translate helps us read Thai comments.","Dịch tự động giúp đọc bình luận tiếng Thái."]],"c":"Live quốc tế.","col":["machine translation","live captions"],"rel":["localization"]},{"t":"scheduling tool","p":"n","vi":"công cụ lên lịch đăng","d":"Phần mềm hẹn giờ đăng nội dung tự động.","ex":[["Use a scheduling tool for weekend posts.","Dùng công cụ lên lịch cho bài đăng cuối tuần."]],"c":"Quản lý nội dung.","col":["schedule posts"],"rel":["content calendar"]},{"t":"integration","p":"n","vi":"tích hợp","d":"Kết nối hai phần mềm để dữ liệu tự động chảy qua lại.","ex":[["The integration syncs orders to our sheet every hour.","Tích hợp đồng bộ đơn vào bảng tính mỗi giờ."]],"c":"Hệ thống.","col":["integrate","connector"],"rel":["API"]},{"t":"bug","p":"n","vi":"lỗi phần mềm","d":"Lỗi trong phần mềm, ứng dụng. Glitch là trục trặc tạm thời.","ex":[["There's a bug in the voucher page, report it to the platform.","Trang voucher bị lỗi, báo cho sàn."]],"c":"Báo lỗi.","col":["glitch","report a bug"],"rel":["ticket"]},{"t":"screenshot","p":"n, v","vi":"ảnh chụp màn hình","d":"Ảnh chụp màn hình làm bằng chứng hoặc minh họa. Screen recording là quay màn hình.","ex":[["Send a screenshot of the error message.","Gửi ảnh chụp thông báo lỗi."]],"c":"Báo lỗi, báo cáo.","col":["screen recording","screen grab"],"rel":["bug"]}]},{"id":"verbs","code":"VERBS","group":"Công việc","en":"Action Verbs at Work","vi":"Động từ hành động trong công việc","intro":"Động từ mạnh hay dùng trong báo cáo, CV, email và họp để mô tả việc mình làm và kết quả đạt được.","terms":[{"t":"launch","p":"v, n","vi":"ra mắt, khởi chạy","d":"Bắt đầu một sản phẩm, chiến dịch, tính năng.","ex":[["We launched the new live format in September.","Bọn mình ra mắt định dạng live mới vào tháng 9."]],"c":"Báo cáo, kế hoạch.","col":["launch a campaign","soft launch"],"rel":["product launch"]},{"t":"optimize","p":"v","vi":"tối ưu","d":"Cải thiện để đạt hiệu quả cao nhất. Danh từ optimization.","ex":[["We optimized the script and CR went up 30%.","Tối ưu kịch bản làm tỉ lệ chuyển đổi tăng 30%."]],"c":"Quảng cáo, vận hành.","col":["optimization","optimize for"],"rel":["A/B test"]},{"t":"implement","p":"v","vi":"triển khai","d":"Đưa một kế hoạch, quy trình vào thực tế.","ex":[["We implemented a new pre-live checklist.","Bọn mình triển khai danh sách kiểm tra trước live mới."]],"c":"Báo cáo, dự án.","col":["implementation","roll out"],"rel":["SOP"]},{"t":"roll out","p":"v","vi":"triển khai rộng","d":"Áp dụng dần ra toàn bộ sau thí điểm.","ex":[["We'll roll out the new host training to all studios.","Sẽ triển khai đào tạo host mới cho mọi phòng quay."]],"c":"Dự án.","col":["rollout","phase"],"rel":["pilot"]},{"t":"streamline","p":"v","vi":"tinh gọn","d":"Làm quy trình đơn giản, hiệu quả hơn.","ex":[["We streamlined the approval process from five steps to two.","Tinh gọn quy trình duyệt từ năm bước còn hai."]],"c":"Cải tiến quy trình.","col":["simplify"],"rel":["workflow","bottleneck"]},{"t":"boost","p":"v, n","vi":"thúc đẩy, tăng","d":"Làm tăng nhanh.","ex":[["The mini game boosted engagement by 40%.","Minigame giúp tăng tương tác 40%."]],"c":"Báo cáo, đề xuất.","col":["boost sales","give a boost"],"rel":["increase"]},{"t":"drive","p":"v","vi":"thúc đẩy, mang lại","d":"Tạo ra kết quả. Drive traffic, drive sales.","ex":[["Short videos drive most of our live traffic.","Video ngắn mang lại phần lớn traffic live."]],"c":"Báo cáo, marketing.","col":["drive traffic","drive sales","driver"],"rel":["traffic push"]},{"t":"generate","p":"v","vi":"tạo ra","d":"Tạo ra doanh thu, khách tiềm năng, nội dung.","ex":[["The campaign generated 2 billion in GMV.","Chiến dịch tạo ra 2 tỷ GMV."]],"c":"Báo cáo.","col":["generate revenue","generate leads"],"rel":["drive"]},{"t":"track","p":"v","vi":"theo dõi","d":"Ghi nhận và theo dõi số liệu, tiến độ.","ex":[["We track GMV by host and by hour.","Bọn mình theo dõi GMV theo host và theo giờ."]],"c":"Báo cáo.","col":["tracking","keep track of"],"rel":["monitor"]},{"t":"monitor","p":"v","vi":"giám sát","d":"Theo dõi liên tục để phát hiện vấn đề.","ex":[["The operator monitors comments and stock in real time.","Người vận hành giám sát bình luận và tồn kho theo thời gian thực."]],"c":"Vận hành live.","col":["real-time monitoring"],"rel":["track"]},{"t":"analyze","p":"v","vi":"phân tích","d":"Xem xét chi tiết để hiểu nguyên nhân. Anh Anh viết analyse. Danh từ analysis.","ex":[["I analyzed the replay to find drop-off points.","Mình phân tích bản phát lại để tìm điểm rời bỏ."]],"c":"Báo cáo.","col":["analysis","analyst"],"rel":["deep dive"]},{"t":"evaluate","p":"v","vi":"đánh giá","d":"Xem xét giá trị, hiệu quả.","ex":[["We evaluate each host monthly.","Đánh giá từng host hằng tháng."]],"c":"Đánh giá host, nhà cung cấp.","col":["evaluation","assess"],"rel":["performance review"]},{"t":"identify","p":"v","vi":"xác định, nhận ra","d":"Tìm ra vấn đề, cơ hội.","ex":[["We identified three reasons for the drop.","Đã xác định ba nguyên nhân sụt giảm."]],"c":"Báo cáo.","col":["identify issues","pinpoint"],"rel":["root cause"]},{"t":"coordinate","p":"v","vi":"phối hợp, điều phối","d":"Sắp xếp để nhiều người, bộ phận làm việc ăn khớp.","ex":[["I coordinate between hosts, ads and the warehouse.","Mình điều phối giữa host, quảng cáo và kho."]],"c":"Mô tả công việc.","col":["coordination","coordinator"],"rel":["cross-functional"]},{"t":"manage","p":"v","vi":"quản lý","d":"Phụ trách và điều hành.","ex":[["I manage 25 live sessions a week across three brands.","Mình quản lý 25 phiên live mỗi tuần cho ba brand."]],"c":"CV, mô tả công việc.","col":["management","manager"],"rel":["coordinate"]},{"t":"execute","p":"v","vi":"thực thi","d":"Thực hiện kế hoạch. Danh từ execution.","ex":[["Great plan, now we need flawless execution.","Kế hoạch tốt, giờ cần thực thi hoàn hảo."]],"c":"Mô tả công việc.","col":["execution"],"rel":["implement"]},{"t":"achieve","p":"v","vi":"đạt được","d":"Đạt mục tiêu, kết quả.","ex":[["We achieved 120% of the Q3 target.","Đạt 120% chỉ tiêu quý 3."]],"c":"CV, báo cáo.","col":["achievement"],"rel":[]},{"t":"exceed","p":"v","vi":"vượt quá","d":"Vượt hơn mức đặt ra.","ex":[["GMV exceeded expectations.","GMV vượt kỳ vọng."]],"c":"Báo cáo.","col":["exceed the target","surpass"],"rel":["achieve"]},{"t":"increase","p":"v, n","vi":"tăng","d":"Tăng lên. Increase by (tăng thêm), increase to (tăng lên mức).","ex":[["Orders increased by 15% to 3,000.","Số đơn tăng 15% lên 3.000."]],"c":"Báo cáo.","col":["rise","grow"],"rel":["decrease"]},{"t":"decrease","p":"v, n","vi":"giảm","d":"Giảm xuống. Reduce là chủ động làm giảm.","ex":[["Cancellations decreased after we added prepaid vouchers.","Đơn hủy giảm sau khi thêm voucher trả trước."]],"c":"Báo cáo.","col":["decline","drop","reduce"],"rel":["increase"]},{"t":"reduce","p":"v","vi":"cắt giảm","d":"Chủ động làm giảm (chi phí, thời gian, lỗi).","ex":[["We reduced packing errors by 50%.","Giảm 50% lỗi đóng gói."]],"c":"Báo cáo, đề xuất.","col":["cut","lower"],"rel":["cost saving"]},{"t":"improve","p":"v","vi":"cải thiện","d":"Làm tốt hơn.","ex":[["How can we improve the opening?","Làm sao cải thiện phần mở đầu?"]],"c":"Báo cáo, góp ý.","col":["improvement"],"rel":["optimize"]},{"t":"maintain","p":"v","vi":"duy trì","d":"Giữ ở mức ổn định.","ex":[["We maintained a ROAS above 4 all month.","Giữ ROAS trên 4 suốt tháng."]],"c":"Báo cáo.","col":["maintain","sustain"],"rel":["steady"]},{"t":"allocate","p":"v","vi":"phân bổ","d":"Chia nguồn lực cho các mục đích.","ex":[["Allocate more budget to the evening slot.","Phân bổ thêm ngân sách cho khung tối."]],"c":"Ngân sách, nhân sự.","col":["allocation"],"rel":["budget allocation"]},{"t":"update","p":"v, n","vi":"cập nhật","d":"Làm mới thông tin hoặc báo tin mới.","ex":[["I've updated the deal list with new prices.","Mình đã cập nhật danh sách deal với giá mới."]],"c":"Công việc.","col":["keep sb updated"],"rel":["status update"]},{"t":"finalize","p":"v","vi":"chốt, hoàn thiện","d":"Hoàn tất bản cuối.","ex":[["Let's finalize the lineup by Thursday.","Chốt danh sách sản phẩm trước thứ Năm."]],"c":"Kế hoạch, tài liệu.","col":["final","lock"],"rel":["sign-off"]},{"t":"submit","p":"v","vi":"nộp, gửi","d":"Gửi chính thức (báo cáo, đơn đăng ký, yêu cầu).","ex":[["Submit the campaign nomination before the deadline.","Nộp đăng ký chiến dịch trước hạn."]],"c":"Công việc.","col":["submission"],"rel":["campaign nomination"]},{"t":"resolve","p":"v","vi":"giải quyết","d":"Xử lý xong vấn đề.","ex":[["The issue was resolved within an hour.","Vấn đề được giải quyết trong một giờ."]],"c":"CS, sự cố.","col":["resolution","resolved"],"rel":["resolution"]},{"t":"troubleshoot","p":"v","vi":"khắc phục sự cố","d":"Tìm nguyên nhân và sửa lỗi kỹ thuật.","ex":[["Can you troubleshoot the audio before we go live?","Bạn kiểm tra sửa lỗi âm thanh trước khi live nhé?"]],"c":"Kỹ thuật live.","col":["troubleshooting"],"rel":["live incident"]},{"t":"collaborate","p":"v","vi":"hợp tác, cộng tác","d":"Làm việc cùng nhau. Danh từ collaboration, nói tắt collab.","ex":[["We collaborated with five KOCs for the launch.","Bọn mình hợp tác với năm KOC cho buổi ra mắt."]],"c":"Công việc, KOL.","col":["collaboration","collab"],"rel":["partnership"]},{"t":"facilitate","p":"v","vi":"tạo điều kiện, điều phối","d":"Giúp việc diễn ra thuận lợi, ví dụ điều phối buổi họp.","ex":[["I'll facilitate the post-mortem meeting.","Mình sẽ điều phối buổi họp rút kinh nghiệm."]],"c":"Họp, đào tạo.","col":["facilitator"],"rel":["coordinate"]}]},{"id":"skincare","code":"SKIN","group":"Ngành hàng","en":"Skincare","vi":"Chăm sóc da","intro":"Từ vựng mô tả sản phẩm, thành phần, loại da và vấn đề da khi live mỹ phẩm. Khi nói công dụng, luôn bám sát tuyên bố đã được duyệt.","terms":[{"t":"skincare routine","p":"n","vi":"chu trình chăm sóc da","d":"Các bước chăm da theo thứ tự, ví dụ làm sạch, toner, serum, dưỡng ẩm, chống nắng.","ex":[["Add this serum to your evening skincare routine.","Thêm serum này vào chu trình chăm da buổi tối."]],"c":"Tư vấn khách.","col":["morning routine","night routine"],"rel":["layering"]},{"t":"cleanser","p":"n","vi":"sữa rửa mặt","d":"Sản phẩm làm sạch da. Foaming cleanser là dạng tạo bọt, gel cleanser là dạng gel.","ex":[["This gentle cleanser doesn't dry out your skin.","Sữa rửa mặt dịu nhẹ này không làm khô da."]],"c":"Live mỹ phẩm.","col":["foaming cleanser","gel cleanser"],"rel":["double cleansing"]},{"t":"double cleansing","p":"n","vi":"làm sạch hai bước","d":"Tẩy trang bằng dầu hoặc nước tẩy trang rồi rửa lại bằng sữa rửa mặt.","ex":[["Double cleansing is a must if you wear sunscreen.","Làm sạch hai bước là bắt buộc nếu bạn dùng kem chống nắng."]],"c":"Tư vấn chu trình.","col":["first cleanse","second cleanse"],"rel":["cleanser","makeup remover"]},{"t":"makeup remover","p":"n","vi":"tẩy trang","d":"Sản phẩm làm sạch lớp trang điểm. Micellar water là nước tẩy trang, cleansing oil là dầu tẩy trang.","ex":[["The cleansing oil removes waterproof mascara easily.","Dầu tẩy trang làm sạch mascara chống nước dễ dàng."]],"c":"Live mỹ phẩm.","col":["micellar water","cleansing oil","cleansing balm"],"rel":["double cleansing"]},{"t":"toner","p":"n","vi":"nước cân bằng","d":"Bước sau rửa mặt giúp cân bằng, cấp ẩm nhẹ hoặc tẩy da chết nhẹ tùy loại.","ex":[["Pat the toner gently into your skin.","Vỗ nhẹ toner vào da."]],"c":"Live mỹ phẩm.","col":["hydrating toner","exfoliating toner"],"rel":["essence"]},{"t":"essence","p":"n","vi":"tinh chất dạng lỏng","d":"Sản phẩm lỏng nhẹ cấp ẩm và dưỡng, dùng trước serum, phổ biến trong mỹ phẩm Hàn, Nhật.","ex":[["This essence feels like water but hydrates deeply.","Tinh chất này như nước nhưng cấp ẩm sâu."]],"c":"Live mỹ phẩm.","col":["first essence"],"rel":["serum","toner"]},{"t":"serum","p":"n","vi":"tinh chất đặc trị","d":"Sản phẩm nồng độ hoạt chất cao, nhắm vấn đề cụ thể (thâm, mụn, lão hóa). Còn gọi ampoule nếu đậm đặc hơn.","ex":[["Use two drops of serum after toner.","Dùng hai giọt serum sau toner."]],"c":"Live mỹ phẩm.","col":["ampoule","booster"],"rel":["active ingredient"]},{"t":"moisturizer","p":"n","vi":"kem dưỡng ẩm","d":"Sản phẩm giữ ẩm và bảo vệ hàng rào da. Dạng gel cream nhẹ, dạng cream đặc hơn.","ex":[["This gel moisturizer is perfect for oily skin.","Kem dưỡng dạng gel này rất hợp da dầu."]],"c":"Live mỹ phẩm.","col":["gel cream","day cream","night cream"],"rel":["skin barrier"]},{"t":"sunscreen","p":"n","vi":"kem chống nắng","d":"Bảo vệ da khỏi tia UV. Còn gọi sunblock, SPF.","ex":[["Reapply sunscreen every two to three hours outdoors.","Thoa lại kem chống nắng mỗi hai, ba tiếng khi ở ngoài trời."]],"c":"Live mỹ phẩm.","col":["sunblock","reapply"],"rel":["SPF","PA"]},{"t":"SPF","p":"abbr","vi":"chỉ số chống tia UVB","d":"Chỉ số bảo vệ khỏi tia UVB (gây cháy nắng).","ex":[["It has SPF 50 and PA++++.","Có SPF 50 và PA++++."]],"f":"Sun Protection Factor","c":"Giới thiệu kem chống nắng.","col":["SPF 50","broad spectrum"],"rel":["PA","sunscreen"]},{"t":"PA","p":"abbr","vi":"chỉ số chống tia UVA","d":"Mức bảo vệ khỏi tia UVA (gây lão hóa), từ PA+ đến PA++++.","ex":[["PA++++ is the highest UVA protection.","PA++++ là mức chống UVA cao nhất."]],"c":"Giới thiệu kem chống nắng.","col":["PA++++","UVA"],"rel":["SPF"]},{"t":"physical sunscreen","p":"n","vi":"kem chống nắng vật lý","d":"Dùng khoáng chất (zinc oxide, titanium dioxide) phản xạ tia UV. Chemical sunscreen là kem chống nắng hóa học, hấp thụ tia UV.","ex":[["Physical sunscreen is gentler for sensitive skin.","Kem chống nắng vật lý dịu hơn cho da nhạy cảm."]],"c":"Tư vấn loại kem chống nắng.","col":["mineral sunscreen","chemical sunscreen"],"rel":["white cast"]},{"t":"white cast","p":"n","vi":"vệt trắng","d":"Lớp trắng bệch để lại trên da sau khi thoa kem chống nắng.","ex":[["No white cast, see? It blends right in.","Không vệt trắng, thấy không? Tán là thấm luôn."]],"c":"Giải đáp thắc mắc.","col":["leave a white cast"],"rel":["physical sunscreen"]},{"t":"sheet mask","p":"n","vi":"mặt nạ giấy","d":"Miếng mặt nạ tẩm tinh chất. Clay mask là mặt nạ đất sét, sleeping mask là mặt nạ ngủ.","ex":[["Use the sheet mask for 15 minutes, then pat in the rest.","Đắp mặt nạ giấy 15 phút rồi vỗ phần tinh chất còn lại."]],"c":"Live mỹ phẩm.","col":["clay mask","sleeping mask"],"rel":["essence"]},{"t":"exfoliate","p":"v","vi":"tẩy tế bào chết","d":"Loại bỏ lớp da chết. Physical exfoliant là tẩy dạng hạt; chemical exfoliant dùng axit như AHA, BHA.","ex":[["Exfoliate two to three times a week.","Tẩy tế bào chết hai đến ba lần mỗi tuần."]],"c":"Tư vấn chăm da.","col":["exfoliant","scrub"],"rel":["AHA","BHA"]},{"t":"AHA","p":"abbr","vi":"axit AHA","d":"Nhóm axit (như glycolic, lactic acid) tẩy da chết bề mặt, giúp da sáng mịn.","ex":[["AHA helps with dull, rough skin.","AHA giúp cải thiện da xỉn màu, sần sùi."]],"f":"Alpha Hydroxy Acid","c":"Thành phần.","col":["glycolic acid","lactic acid"],"rel":["exfoliate","BHA"]},{"t":"BHA","p":"abbr","vi":"axit BHA","d":"Thường là salicylic acid, tan trong dầu, làm sạch sâu lỗ chân lông. Phù hợp da dầu mụn.","ex":[["BHA is great for blackheads.","BHA rất tốt cho mụn đầu đen."]],"f":"Beta Hydroxy Acid","c":"Thành phần.","col":["salicylic acid"],"rel":["AHA"]},{"t":"niacinamide","p":"n","vi":"niacinamide (vitamin B3)","d":"Hoạt chất giúp đều màu da, kiểm soát dầu, hỗ trợ hàng rào da.","ex":[["This serum has 10% niacinamide.","Serum này chứa 10% niacinamide."]],"c":"Thành phần.","col":["vitamin B3"],"rel":["active ingredient"]},{"t":"hyaluronic acid","p":"n","vi":"axit hyaluronic","d":"Hoạt chất giữ nước, cấp ẩm cho da.","ex":[["Hyaluronic acid draws moisture into the skin.","Axit hyaluronic hút ẩm vào da."]],"f":"HA","c":"Thành phần.","col":["HA"],"rel":["hydrating"]},{"t":"retinol","p":"n","vi":"retinol","d":"Dẫn xuất vitamin A hỗ trợ chống lão hóa, cải thiện kết cấu da. Dễ gây kích ứng khi mới dùng; nên dùng buổi tối và chống nắng kỹ.","ex":[["Start retinol slowly, two nights a week.","Bắt đầu retinol từ từ, hai tối mỗi tuần."]],"c":"Thành phần, cảnh báo.","col":["retinoid","vitamin A"],"rel":["anti-aging","purging"]},{"t":"vitamin C","p":"n","vi":"vitamin C","d":"Hoạt chất chống oxy hóa, giúp da sáng và đều màu.","ex":[["Use vitamin C in the morning under sunscreen.","Dùng vitamin C buổi sáng trước kem chống nắng."]],"c":"Thành phần.","col":["ascorbic acid"],"rel":["brightening"]},{"t":"ceramide","p":"n","vi":"ceramide","d":"Thành phần lipid giúp phục hồi hàng rào bảo vệ da.","ex":[["Ceramides help repair a damaged skin barrier.","Ceramide giúp phục hồi hàng rào da bị tổn thương."]],"c":"Thành phần.","col":["ceramides"],"rel":["skin barrier"]},{"t":"centella","p":"n","vi":"rau má (centella asiatica)","d":"Chiết xuất rau má làm dịu da, hay có trong mỹ phẩm Hàn. Còn gọi cica.","ex":[["Centella calms red, irritated skin.","Rau má làm dịu da đỏ, kích ứng."]],"c":"Thành phần.","col":["cica"],"rel":["soothing"]},{"t":"active ingredient","p":"n","vi":"hoạt chất","d":"Thành phần chính tạo ra công dụng của sản phẩm.","ex":[["The active ingredient is 2% salicylic acid.","Hoạt chất chính là 2% salicylic acid."]],"c":"Giới thiệu sản phẩm.","col":["actives","key ingredient"],"rel":["serum","ingredient list"]},{"t":"ingredient list","p":"n","vi":"bảng thành phần","d":"Danh sách thành phần trên bao bì, xếp theo nồng độ giảm dần. Còn gọi INCI list.","ex":[["Let me read the ingredient list for you.","Để mình đọc bảng thành phần cho bạn."]],"c":"Giải đáp câu hỏi.","col":["INCI","full ingredients"],"rel":["active ingredient"]},{"t":"fragrance-free","p":"adj","vi":"không hương liệu","d":"Không chứa hương liệu, phù hợp da nhạy cảm.","ex":[["It's fragrance-free and alcohol-free.","Không hương liệu và không cồn."]],"c":"Giới thiệu sản phẩm.","col":["unscented","alcohol-free"],"rel":["sensitive skin"]},{"t":"non-comedogenic","p":"adj","vi":"không gây bít tắc lỗ chân lông","d":"Được thiết kế để không làm tắc lỗ chân lông, hợp da dễ nổi mụn.","ex":[["It's non-comedogenic, so it won't clog your pores.","Sản phẩm không gây bít tắc nên không làm tắc lỗ chân lông."]],"c":"Giới thiệu sản phẩm.","col":["won't clog pores"],"rel":["acne-prone"]},{"t":"dermatologically tested","p":"adj","vi":"đã kiểm nghiệm da liễu","d":"Đã thử nghiệm dưới sự giám sát chuyên môn da liễu. Không có nghĩa là không thể gây kích ứng.","ex":[["The cream is dermatologically tested.","Kem đã được kiểm nghiệm da liễu."]],"c":"Giới thiệu sản phẩm, cần dùng đúng tuyên bố.","col":["clinically tested","hypoallergenic"],"rel":["product claims"]},{"t":"skin type","p":"n","vi":"loại da","d":"Da dầu (oily), da khô (dry), da hỗn hợp (combination), da thường (normal), da nhạy cảm (sensitive).","ex":[["What's your skin type? Comment below.","Da bạn thuộc loại nào? Bình luận nhé."]],"c":"Tư vấn khách.","col":["oily","dry","combination","normal"],"rel":["sensitive skin"]},{"t":"oily skin","p":"n","vi":"da dầu","d":"Da tiết nhiều dầu, bóng nhờn, lỗ chân lông to.","ex":[["This gel is ideal for oily skin.","Gel này rất hợp da dầu."]],"c":"Tư vấn khách.","col":["greasy","shiny"],"rel":["skin type","sebum"]},{"t":"dry skin","p":"n","vi":"da khô","d":"Da thiếu dầu, dễ bong tróc, căng rít.","ex":[["Dry skin needs a richer cream in winter.","Da khô cần kem đặc hơn vào mùa đông."]],"c":"Tư vấn khách.","col":["flaky","tight"],"rel":["skin type"]},{"t":"combination skin","p":"n","vi":"da hỗn hợp","d":"Vùng chữ T dầu, hai bên má thường hoặc khô.","ex":[["Combination skin can use gel cream on the T-zone.","Da hỗn hợp có thể dùng kem dạng gel ở vùng chữ T."]],"c":"Tư vấn khách.","col":["T-zone"],"rel":["skin type"]},{"t":"sensitive skin","p":"n","vi":"da nhạy cảm","d":"Da dễ đỏ, rát, kích ứng.","ex":[["It's safe for sensitive skin.","An toàn cho da nhạy cảm."]],"c":"Tư vấn khách.","col":["reactive skin"],"rel":["fragrance-free","irritation"]},{"t":"acne-prone","p":"adj","vi":"dễ nổi mụn","d":"Da có xu hướng nổi mụn.","ex":[["Great for acne-prone skin.","Rất hợp da dễ nổi mụn."]],"c":"Tư vấn khách.","col":["breakouts"],"rel":["acne","non-comedogenic"]},{"t":"acne","p":"n","vi":"mụn","d":"Tình trạng mụn trên da. Breakout là đợt nổi mụn, pimple là nốt mụn.","ex":[["Avoid saying it cures acne, say it helps reduce the look of breakouts.","Đừng nói chữa khỏi mụn, nói giúp giảm sự xuất hiện của mụn."]],"c":"Tư vấn khách.","col":["pimple","breakout","blackheads","whiteheads"],"rel":["acne-prone","product claims"]},{"t":"dark spots","p":"n","vi":"đốm thâm","d":"Vết thâm sau mụn, nám, tàn nhang. Hyperpigmentation là tăng sắc tố.","ex":[["Vitamin C helps fade dark spots over time.","Vitamin C giúp làm mờ đốm thâm theo thời gian."]],"c":"Tư vấn khách.","col":["hyperpigmentation","post-acne marks","melasma"],"rel":["brightening"]},{"t":"pores","p":"n","vi":"lỗ chân lông","d":"Enlarged pores là lỗ chân lông to, clogged pores là lỗ chân lông bít tắc.","ex":[["It minimizes the look of pores.","Giúp lỗ chân lông trông nhỏ hơn."]],"c":"Tư vấn khách.","col":["enlarged pores","clogged pores"],"rel":["BHA"]},{"t":"fine lines","p":"n","vi":"nếp nhăn nhỏ","d":"Nếp nhăn mảnh, giai đoạn đầu của lão hóa. Wrinkles là nếp nhăn sâu hơn.","ex":[["Retinol helps soften fine lines.","Retinol giúp làm mờ nếp nhăn nhỏ."]],"c":"Sản phẩm chống lão hóa.","col":["wrinkles","crow's feet"],"rel":["anti-aging"]},{"t":"anti-aging","p":"adj","vi":"chống lão hóa","d":"Giúp giảm dấu hiệu lão hóa như nếp nhăn, chảy xệ.","ex":[["This anti-aging cream has peptides.","Kem chống lão hóa này có peptide."]],"c":"Giới thiệu sản phẩm.","col":["anti-wrinkle","firming"],"rel":["retinol","fine lines"]},{"t":"brightening","p":"adj","vi":"làm sáng da","d":"Giúp da sáng và đều màu hơn. Tránh dùng từ “whitening” (làm trắng) vì dễ bị coi là nhạy cảm hoặc vi phạm.","ex":[["It's a brightening serum for dull skin.","Đây là serum làm sáng cho da xỉn màu."]],"c":"Giới thiệu sản phẩm.","col":["radiance","glow"],"rel":["vitamin C","dark spots"]},{"t":"hydrating","p":"adj","vi":"cấp nước","d":"Bổ sung nước cho da. Moisturizing là dưỡng ẩm, giữ ẩm.","ex":[["This hydrating mist is great in air-conditioned rooms.","Xịt khoáng cấp nước này rất hợp phòng máy lạnh."]],"c":"Giới thiệu sản phẩm.","col":["hydration","moisturizing"],"rel":["hyaluronic acid"]},{"t":"soothing","p":"adj","vi":"làm dịu","d":"Giúp giảm cảm giác khó chịu, đỏ rát.","ex":[["A soothing gel for sunburned skin.","Gel làm dịu cho da cháy nắng."]],"c":"Giới thiệu sản phẩm.","col":["calming"],"rel":["centella"]},{"t":"skin barrier","p":"n","vi":"hàng rào bảo vệ da","d":"Lớp ngoài cùng giữ ẩm và bảo vệ da khỏi tác nhân bên ngoài.","ex":[["Over-exfoliating damages the skin barrier.","Tẩy da chết quá nhiều làm hỏng hàng rào da."]],"c":"Tư vấn chăm da.","col":["damaged barrier","barrier repair"],"rel":["ceramide"]},{"t":"sebum","p":"n","vi":"bã nhờn, dầu trên da","d":"Dầu tự nhiên da tiết ra.","ex":[["It controls sebum for up to 8 hours.","Kiểm soát dầu nhờn tới 8 giờ."]],"c":"Tư vấn da dầu.","col":["oil control"],"rel":["oily skin"]},{"t":"irritation","p":"n","vi":"kích ứng","d":"Da đỏ, ngứa, rát khi dùng sản phẩm.","ex":[["Do a patch test to check for irritation.","Thử trước trên một vùng da nhỏ để kiểm tra kích ứng."]],"c":"Cảnh báo, tư vấn.","col":["redness","stinging"],"rel":["patch test"]},{"t":"patch test","p":"n","vi":"thử trên vùng da nhỏ","d":"Thoa thử sản phẩm lên vùng da nhỏ (sau tai, cổ tay) trước khi dùng toàn mặt.","ex":[["Always do a patch test with new actives.","Luôn thử trên vùng da nhỏ với hoạt chất mới."]],"c":"Hướng dẫn an toàn.","col":["test patch"],"rel":["irritation"]},{"t":"purging","p":"n","vi":"đẩy mụn (giai đoạn đầu)","d":"Mụn nổi tạm thời khi mới dùng hoạt chất tăng tốc thay da như retinol, AHA. Khác với kích ứng; nếu kéo dài nên ngưng và hỏi chuyên gia.","ex":[["Some purging is normal in the first weeks of retinol.","Đẩy mụn nhẹ là bình thường trong vài tuần đầu dùng retinol."]],"c":"Giải đáp thắc mắc.","col":["skin purging"],"rel":["retinol","irritation"]},{"t":"layering","p":"n","vi":"thoa chồng nhiều lớp","d":"Thoa nhiều sản phẩm theo thứ tự, thường từ lỏng đến đặc.","ex":[["Layering tip: thinnest to thickest.","Mẹo: thoa từ loại lỏng nhất đến đặc nhất."]],"c":"Hướng dẫn chu trình.","col":["layer products"],"rel":["skincare routine"]},{"t":"absorb","p":"v","vi":"thấm","d":"Sản phẩm thấm vào da. Fast-absorbing là thấm nhanh.","ex":[["It absorbs in seconds, no sticky feeling.","Thấm trong vài giây, không bết dính."]],"c":"Demo sản phẩm.","col":["absorption","fast-absorbing"],"rel":["lightweight"]},{"t":"dewy","p":"adj","vi":"căng bóng, ẩm mượt","d":"Da trông ẩm, căng, có độ bóng khỏe tự nhiên. Ngược lại là matte (lì).","ex":[["It gives a dewy glass-skin finish.","Cho hiệu ứng căng bóng như da thủy tinh."]],"c":"Mô tả hiệu ứng.","col":["glass skin","glowy"],"rel":["matte"]},{"t":"matte","p":"adj","vi":"lì, không bóng","d":"Bề mặt không bóng dầu.","ex":[["A matte finish that lasts all day.","Lớp nền lì giữ cả ngày."]],"c":"Mô tả hiệu ứng.","col":["matte finish","mattifying"],"rel":["dewy"]},{"t":"before-and-after claim","p":"n","vi":"tuyên bố hiệu quả trước sau","d":"Khẳng định thay đổi sau khi dùng. Cần có cơ sở và tuân thủ quy định quảng cáo mỹ phẩm.","ex":[["Remove the before-and-after claim, it hasn't been approved.","Bỏ tuyên bố trước sau, chưa được duyệt."]],"c":"Tuân thủ nội dung.","col":["efficacy claim"],"rel":["before and after","product claims"]},{"t":"shelf life","p":"n","vi":"hạn sử dụng (thời gian bảo quản)","d":"Thời gian sản phẩm dùng tốt. PAO (period after opening) là số tháng dùng sau khi mở nắp, ký hiệu hũ mở nắp 12M.","ex":[["The PAO is 12 months after opening.","Dùng trong 12 tháng sau khi mở nắp."]],"c":"Giải đáp khách.","col":["PAO","12M"],"rel":["expiry date"]},{"t":"K-beauty","p":"n","vi":"mỹ phẩm Hàn","d":"Mỹ phẩm Hàn Quốc. J-beauty là mỹ phẩm Nhật, C-beauty là mỹ phẩm Trung.","ex":[["K-beauty products sell best in our live.","Mỹ phẩm Hàn bán chạy nhất trong live của mình."]],"c":"Phân loại sản phẩm.","col":["J-beauty","C-beauty"],"rel":["skincare routine"]},{"t":"clean beauty","p":"n","vi":"mỹ phẩm sạch","d":"Khái niệm marketing chỉ sản phẩm tránh một số thành phần gây tranh cãi. Không có định nghĩa chuẩn; dùng cẩn thận.","ex":[["Clean beauty claims must be backed by the ingredient list.","Tuyên bố mỹ phẩm sạch phải có cơ sở từ bảng thành phần."]],"c":"Định vị sản phẩm.","col":["vegan","cruelty-free"],"rel":["product claims"]},{"t":"cruelty-free","p":"adj","vi":"không thử nghiệm trên động vật","d":"Sản phẩm không thử nghiệm trên động vật. Vegan là không có thành phần từ động vật.","ex":[["The brand is vegan and cruelty-free.","Thương hiệu thuần chay và không thử nghiệm trên động vật."]],"c":"Định vị sản phẩm.","col":["vegan","not tested on animals"],"rel":["clean beauty"]},{"t":"toner pad","p":"n","vi":"bông tẩm toner","d":"Miếng bông tẩm sẵn toner hoặc hoạt chất.","ex":[["Toner pads are convenient for travel.","Bông tẩm toner tiện mang đi du lịch."]],"c":"Live mỹ phẩm.","col":["cotton pad"],"rel":["toner"]},{"t":"eye cream","p":"n","vi":"kem mắt","d":"Kem dưỡng dành cho vùng da quanh mắt.","ex":[["Tap eye cream gently with your ring finger.","Vỗ nhẹ kem mắt bằng ngón áp út."]],"c":"Live mỹ phẩm.","col":["under-eye","dark circles"],"rel":["fine lines"]},{"t":"dark circles","p":"n","vi":"quầng thâm mắt","d":"Vùng da tối màu dưới mắt.","ex":[["Concealer hides dark circles instantly.","Che khuyết điểm giúp giấu quầng thâm ngay."]],"c":"Tư vấn khách.","col":["under-eye bags","puffiness"],"rel":["eye cream","concealer"]},{"t":"lip care","p":"n","vi":"chăm sóc môi","d":"Son dưỡng, mặt nạ môi, tẩy da chết môi.","ex":[["Use a lip mask overnight for dry lips.","Dùng mặt nạ môi qua đêm cho môi khô."]],"c":"Live mỹ phẩm.","col":["lip balm","lip mask"],"rel":["lipstick"]},{"t":"mist","p":"n","vi":"xịt khoáng","d":"Xịt cấp ẩm, làm dịu da. Facial mist.","ex":[["Spray the mist over your makeup to refresh.","Xịt khoáng lên lớp trang điểm để tươi tắn lại."]],"c":"Live mỹ phẩm.","col":["facial mist","face spray"],"rel":["hydrating"]}]},{"id":"makeup","code":"MAKEUP","group":"Ngành hàng","en":"Makeup, Hair & Body","vi":"Trang điểm, tóc và cơ thể","intro":"Từ vựng mô tả sản phẩm trang điểm, chăm sóc tóc, cơ thể và nước hoa khi live.","terms":[{"t":"foundation","p":"n","vi":"kem nền","d":"Lớp nền đều màu da. Coverage là độ che phủ: sheer (mỏng), medium (vừa), full (cao).","ex":[["This foundation has medium coverage and a natural finish.","Kem nền này che phủ vừa, hoàn thiện tự nhiên."]],"c":"Live trang điểm.","col":["liquid foundation","coverage"],"rel":["cushion","concealer"]},{"t":"cushion","p":"n","vi":"phấn nước cushion","d":"Kem nền dạng nén trong mút, đi kèm bông dặm. Phổ biến ở mỹ phẩm Hàn.","ex":[["The cushion comes with a refill.","Cushion có kèm lõi thay."]],"c":"Live trang điểm.","col":["cushion compact","puff"],"rel":["foundation","refill"]},{"t":"concealer","p":"n","vi":"kem che khuyết điểm","d":"Che quầng thâm, mụn, đốm thâm.","ex":[["Dab concealer under the eyes and blend.","Chấm che khuyết điểm dưới mắt rồi tán đều."]],"c":"Live trang điểm.","col":["under-eye concealer"],"rel":["foundation"]},{"t":"primer","p":"n","vi":"kem lót","d":"Lớp lót trước nền giúp nền mịn, bám lâu.","ex":[["Use primer to make your makeup last longer.","Dùng kem lót để lớp trang điểm lâu trôi hơn."]],"c":"Live trang điểm.","col":["pore primer"],"rel":["foundation","setting spray"]},{"t":"setting powder","p":"n","vi":"phấn phủ","d":"Phấn cố định lớp nền, giảm bóng dầu. Loose powder là phấn bột, pressed powder là phấn nén.","ex":[["Set the T-zone with setting powder.","Phủ phấn vùng chữ T."]],"c":"Live trang điểm.","col":["loose powder","pressed powder"],"rel":["setting spray"]},{"t":"setting spray","p":"n","vi":"xịt khóa nền","d":"Xịt cuối cùng giúp lớp trang điểm bền.","ex":[["Two sprays of setting spray and you're done.","Hai lần xịt khóa nền là xong."]],"c":"Live trang điểm.","col":["makeup fixer"],"rel":["setting powder"]},{"t":"blush","p":"n","vi":"phấn má","d":"Tạo sắc hồng cho má. Cream blush là má dạng kem.","ex":[["A little blush makes you look fresh.","Một chút má hồng giúp bạn trông tươi tắn."]],"c":"Live trang điểm.","col":["cream blush","cheek tint"],"rel":["highlighter"]},{"t":"highlighter","p":"n","vi":"phấn bắt sáng","d":"Tạo điểm sáng trên gò má, sống mũi.","ex":[["Apply highlighter on the high points of your face.","Thoa bắt sáng lên các điểm cao của khuôn mặt."]],"c":"Live trang điểm.","col":["glow","shimmer"],"rel":["contour"]},{"t":"contour","p":"n, v","vi":"tạo khối","d":"Dùng màu tối để tạo đường nét khuôn mặt.","ex":[["Contour under the cheekbones for a slimmer look.","Tạo khối dưới gò má để mặt trông thon hơn."]],"c":"Live trang điểm.","col":["contouring","bronzer"],"rel":["highlighter"]},{"t":"eyeshadow palette","p":"n","vi":"bảng phấn mắt","d":"Hộp nhiều màu phấn mắt. Shimmer là có nhũ, matte là lì.","ex":[["This palette has 12 shades, matte and shimmer.","Bảng này có 12 màu, cả lì lẫn nhũ."]],"c":"Live trang điểm.","col":["eyeshadow","shimmer","glitter"],"rel":["swatch"]},{"t":"eyeliner","p":"n","vi":"kẻ mắt","d":"Sản phẩm kẻ viền mắt: dạng bút lỏng (liquid), chì (pencil), gel.","ex":[["This eyeliner is smudge-proof.","Kẻ mắt này không lem."]],"c":"Live trang điểm.","col":["liquid liner","pencil liner"],"rel":["smudge-proof"]},{"t":"mascara","p":"n","vi":"chuốt mi","d":"Làm mi dày và dài. Waterproof là chống nước.","ex":[["It lengthens without clumping.","Làm dài mi mà không vón cục."]],"c":"Live trang điểm.","col":["waterproof mascara","volumizing"],"rel":["eyeliner"]},{"t":"eyebrow pencil","p":"n","vi":"chì kẻ mày","d":"Dùng tạo dáng chân mày. Brow gel là gel chải mày.","ex":[["The eyebrow pencil has a spoolie on the end.","Chì kẻ mày có đầu chải ở cuối."]],"c":"Live trang điểm.","col":["brow pencil","brow gel"],"rel" ays"],"rel":[]},{"t":"heat protectant","p":"n","vi":"xịt bảo vệ tóc khỏi nhiệt","d":"Dùng trước khi sấy, uốn, duỗi.","ex":[["Spray heat protectant before using the straightener.","Xịt bảo vệ nhiệt trước khi dùng máy duỗi."]],"c":"Live chăm sóc tóc.","col":["heat protection spray"],"rel":["hair dryer"]},{"t":"hair dryer","p":"n","vi":"máy sấy tóc","d":"Thiết bị làm khô tóc. Straightener là máy duỗi, curling iron là máy uốn.","ex":[["This hair dryer has three heat settings.","Máy sấy này có ba mức nhiệt."]],"c":"Live đồ điện làm đẹp.","col":["straightener","curling iron"],"rel":["heat protectant"]},{"t":"body lotion","p":"n","vi":"sữa dưỡng thể","d":"Dưỡng ẩm da toàn thân. Body wash là sữa tắm, body scrub là tẩy da chết toàn thân.","ex":[["The body lotion absorbs quickly and isn't sticky.","Dưỡng thể thấm nhanh, không bết."]],"c":"Live chăm sóc cơ thể.","col":["body wash","body scrub"],"rel":["moisturizer"]},{"t":"deodorant","p":"n","vi":"lăn khử mùi","d":"Sản phẩm giảm mùi cơ thể. Antiperspirant là giảm tiết mồ hôi.","ex":[["It's an aluminum-free deodorant.","Lăn khử mùi không chứa nhôm."]],"c":"Live chăm sóc cơ thể.","col":["antiperspirant"],"rel":["body lotion"]},{"t":"perfume","p":"n","vi":"nước hoa","d":"Eau de parfum (EDP) đậm hơn và lâu hơn eau de toilette (EDT).","ex":[["This EDP lasts six to eight hours.","Bản EDP này lưu hương sáu đến tám giờ."]],"c":"Live nước hoa.","col":["EDP","EDT","body mist"],"rel":["scent","fragrance notes"]},{"t":"scent","p":"n","vi":"mùi hương","d":"Mùi của sản phẩm.","ex":[["The scent is light and fresh, not overpowering.","Mùi nhẹ và tươi mát, không nồng."]],"c":"Mô tả sản phẩm.","col":["smell","fragrance"],"rel":["perfume"]},{"t":"fragrance notes","p":"n","vi":"tầng hương","d":"Các lớp mùi của nước hoa: top notes (hương đầu), middle/heart notes (hương giữa), base notes (hương cuối).","ex":[["Top notes are bergamot, base notes are vanilla and musk.","Hương đầu là cam bergamot, hương cuối là vani và xạ hương."]],"c":"Live nước hoa. ,"d":"Một số ít món dễ phối, đủ mặc cho nhiều dịp.","ex":[["Build a capsule wardrobe with these 10 pieces.","Xây tủ đồ tối giản với 10 món này."]],"c":"Nội dung thời trang.","col":["minimal wardrobe"],"rel":["basics"]},{"t":"T-shirt","p":"n","vi":"áo thun","d":"Áo cổ tròn, tay ngắn. Polo shirt là áo thun có cổ.","ex":[["This oversized T-shirt is 100% cotton.","Áo thun oversize này 100% cotton."]],"c":"Live thời trang.","col":["tee","polo shirt"],"rel":["oversized"]},{"t":"shirt","p":"n","vi":"áo sơ mi","d":"Áo có cổ và cúc. Blouse là áo kiểu nữ.","ex":[["A linen shirt is perfect for summer.","Áo sơ mi linen rất hợp mùa hè."]],"c":"Live thời trang.","col":["button-down","blouse"],"rel":["outfit"]},{"t":"blazer","p":"n","vi":"áo khoác vest (blazer)","d":"Áo khoác dáng vest, mặc công sở hoặc phối thường ngày.","ex":[["The blazer has shoulder pads for a sharp look.","Blazer có độn vai cho dáng sắc nét."]],"c":"Live thời trang.","col":["suit jacket","tailored"],"rel":["outerwear"]},{"t":"outerwear","p":"n","vi":"áo khoác ngoài","d":"Áo khoác các loại: jacket, coat, hoodie, cardigan.","ex":[["Our new outerwear collection drops on Friday.","Bộ sưu tập áo khoác mới ra mắt thứ Sáu."]],"c":"Phân loại.","col":["jacket","coat","cardigan","hoodie"],"rel":["blazer"]},{"t":"dress","p":"n","vi":"váy liền","d":"Váy liền thân. Maxi dress là váy dài, midi dress là váy dài qua gối, mini dress là váy ngắn.","ex":[["This midi dress works for both office and dates.","Váy midi này mặc đi làm hay hẹn hò đều được."]],"c":"Live thời trang.","col":["maxi","midi","mini"],"rel":["skirt"]},{"t":"skirt","p":"n","vi":"chân váy","d":"Chân váy. Pleated skirt là váy xếp ly, A-line skirt là váy chữ A.","ex":[["The pleated skirt has an elastic waist.","Chân váy xếp ly có lưng thun."]],"c":"Live thời trang.","col":["pleated","A-line","pencil skirt"],"rel":["dress"]},{"t":"trousers","p":"n","vi":"quần dài","d":"Quần dài vải. Người Mỹ gọi pants. Wide-leg trousers là quần ống rộng.","ex":[["These wide-leg trousers make your legs look longer.","Quần ống rộng này giúp chân trông dài hơn."]],"c":"Live thời trang.","col":["pants","wide-leg","straight-leg"],"rel":["jeans"]},{"t":"jeans","p":"n","vi":"quần jean","d":"Quần vải denim. Skinny là bó, straight là ống đứng, baggy là rộng.","ex":[["High-waisted jeans flatter most body types.","Quần jean cạp cao tôn dáng hầu hết vóc người."]],"c":"Live thời trang.","col":["skinny","straight","high-waisted"],"rel":["denim"]},{"t":"activewear","p":"n","vi":"đồ thể thao","d":"Đồ tập luyện như legging, áo bra thể thao. Athleisure là đồ thể thao mặc hằng ngày.","ex":[["This activewear set is sweat-wicking.","Bộ đồ tập này thấm hút mồ hôi."]],"c":"Live thời trang thể thao.","col":["athleisure","leggings","sports bra"],"rel":["moisture-wicking"]},{"t":"loungewear","p":"n","vi":"đồ mặc nhà","d":"Đồ thoải mái mặc ở nhà. Sleepwear hay pajamas là đồ ngủ.","ex":[["Soft loungewear sets are our best-sellers.","Bộ đồ mặc nhà mềm là sản phẩm bán chạy."]],"c":"Live thời trang.","col":["pajamas","sleepwear"],"rel":["cotton"]},{"t":"underwear","p":"n","vi":"đồ lót","d":"Đồ mặc bên trong. Lingerie là đồ lót nữ thời trang. Lưu ý quy định nền tảng về hình ảnh khi live.","ex":[["Show underwear on a mannequin to follow platform rules.","Trưng bày đồ lót trên ma-nơ-canh để tuân thủ quy định nền tảng."]],"c":"Live thời trang, tuân thủ.","col":["lingerie","bra"],"rel":["community guidelines"]},{"t":"fabric","p":"n","vi":"chất liệu vải","d":"Loại vải làm nên sản phẩm. Material là chất liệu nói chung.","ex":[["What fabric is it? It's a cotton-linen blend.","Vải gì vậy? Là vải pha cotton và linen."]],"c":"Mô tả sản phẩm.","col":["material","fabric blend"],"rel":["cotton","polyester"]},{"t":"cotton","p":"n","vi":"vải cotton","d":"Vải từ sợi bông tự nhiên, mềm, thấm hút.","ex":[["100% cotton, very breathable.","100% cotton, rất thoáng."]],"c":"Mô tả chất liệu.","col":["organic cotton","combed cotton"],"rel":["breathable"]},{"t":"linen","p":"n","vi":"vải lanh, linen","d":"Vải từ sợi lanh, mát nhưng dễ nhăn.","ex":[["Linen wrinkles easily, that's part of its charm.","Linen dễ nhăn, đó cũng là nét đẹp của nó."]],"c":"Mô tả chất liệu.","col":["wrinkle"],"rel":["cotton"]},{"t":"polyester","p":"n","vi":"vải polyester","d":"Sợi tổng hợp, bền, ít nhăn, giá rẻ, kém thoáng hơn cotton.","ex":[["The polyester blend keeps its shape after washing.","Vải pha polyester giữ dáng sau khi giặt."]],"c":"Mô tả chất liệu.","col":["synthetic"],"rel":["fabric"]},{"t":"silk","p":"n","vi":"lụa","d":"Vải từ tơ tằm, mềm mượt, sang. Satin là vải có bề mặt bóng giống lụa.","ex":[["It's satin, not real silk, so it's easy to wash.","Đây là satin, không phải lụa thật, nên dễ giặt."]],"c":"Mô tả chất liệu.","col":["satin","mulberry silk"],"rel":["fabric"]},{"t":"denim","p":"n","vi":"vải bò, denim","d":"Vải cotton dệt chéo dùng may quần jean, áo khoác.","ex":[["This denim is stretchy and soft.","Vải denim này co giãn và mềm."]],"c":"Mô tả chất liệu.","col":["stretch denim"],"rel":["jeans"]},{"t":"knit","p":"n, adj","vi":"vải dệt kim, đồ len","d":"Vải dệt kim co giãn. Knitwear là đồ len.","ex":[["A cropped knit top for chilly mornings.","Áo len lửng cho buổi sáng se lạnh."]],"c":"Mô tả chất liệu.","col":["knitwear","sweater"],"rel":[]},{"t":"stretchy","p":"adj","vi":"co giãn","d":"Vải có độ giãn. 4-way stretch là co giãn bốn chiều.","ex":[["Very stretchy, so it fits many body types.","Rất co giãn nên vừa nhiều dáng người."]],"c":"Mô tả chất liệu.","col":["elastic","spandex","4-way stretch"],"rel":["fabric"]},{"t":"breathable","p":"adj","vi":"thoáng khí","d":"Không bí, không nóng.","ex":[["It's breathable, perfect for Saigon weather.","Vải thoáng, rất hợp thời tiết Sài Gòn."]],"c":"Mô tả chất liệu.","col":["airy","lightweight"],"rel":["cotton"]},{"t":"moisture-wicking","p":"adj","vi":"thấm hút và thoát ẩm","d":"Hút mồ hôi và giúp khô nhanh.","ex":[["Moisture-wicking fabric keeps you dry while running.","Vải thoát ẩm giữ bạn khô ráo khi chạy."]],"c":"Đồ thể thao.","col":["sweat-wicking","quick-dry"],"rel":["activewear"]},{"t":"see-through","p":"adj","vi":"mỏng, xuyên thấu","d":"Vải mỏng nhìn xuyên được. Khách hay hỏi “có bị lộ không”.","ex":[["It's not see-through, it has a lining.","Không bị lộ đâu, có lớp lót."]],"c":"Giải đáp thắc mắc.","col":["sheer","lining"],"rel":["fabric"]},{"t":"lining","p":"n","vi":"lớp lót","d":"Lớp vải bên trong.","ex":[["The skirt has a full lining.","Chân váy có lót toàn bộ."]],"c":"Mô tả sản phẩm.","col":["lined","unlined"],"rel":["see-through"]},{"t":"fit","p":"n","vi":"độ vừa, phom dáng","d":"Cách đồ ôm cơ thể: slim fit (ôm), regular fit (vừa), relaxed fit (rộng thoải mái).","ex":[["It's a relaxed fit, so take your usual size.","Dáng rộng thoải mái nên lấy size thường mặc."]],"c":"Tư vấn size.","col":["slim fit","regular fit","relaxed fit"],"rel":["true to size"]},{"t":"oversized","p":"adj","vi":"dáng rộng, oversize","d":"Thiết kế rộng hơn size thường.","ex":[["It's oversized, size down if you want a closer fit.","Dáng oversize, giảm một size nếu muốn vừa người hơn."]],"c":"Mô tả dáng.","col":["loose","boxy"],"rel":["fit"]},{"t":"true to size","p":"adj","vi":"đúng size","d":"Size đúng với bảng size thông thường. Runs small là size nhỏ hơn, runs large là size to hơn.","ex":[["These shoes run small, size up by one.","Giày này size nhỏ, tăng lên một size."]],"c":"Tư vấn size.","col":["runs small","runs large","size up"],"rel":["size guide"]},{"t":"size chart","p":"n","vi":"bảng size","d":"Bảng số đo tương ứng từng size.","ex":[["Check the size chart in the product images.","Xem bảng size trong ảnh sản phẩm."]],"c":"Tư vấn size.","col":["measurements"],"rel":["size guide"]},{"t":"measurements","p":"n","vi":"số đo","d":"Kích thước cơ thể hoặc sản phẩm: bust (vòng ngực), waist (vòng eo), hips (vòng mông), length (chiều dài).","ex":[["Comment your height and weight for a size suggestion.","Bình luận chiều cao cân nặng để được tư vấn size."]],"c":"Tư vấn size.","col":["bust","waist","hips","length"],"rel":["size chart"]},{"t":"waistband","p":"n","vi":"cạp quần, lưng quần","d":"Phần eo quần hoặc váy. Elastic waistband là lưng thun.","ex":[["The elastic waistband is very comfortable.","Lưng thun rất thoải mái."]],"c":"Mô tả sản phẩm.","col":["high-waisted","elastic waist"],"rel":["trousers"]},{"t":"neckline","p":"n","vi":"kiểu cổ áo","d":"Hình dạng cổ: V-neck (cổ tim), crew neck (cổ tròn), square neck (cổ vuông), off-shoulder (trễ vai).","ex":[["The square neckline is very flattering.","Cổ vuông rất tôn dáng."]],"c":"Mô tả thiết kế.","col":["V-neck","crew neck","square neck"],"rel":["sleeve"]},{"t":"sleeve","p":"n","vi":"tay áo","d":"Short sleeves (tay ngắn), long sleeves (tay dài), sleeveless (sát nách), puff sleeves (tay phồng).","ex":[["Puff sleeves are trending this season.","Tay phồng đang là xu hướng mùa này."]],"c":"Mô tả thiết kế.","col":["short sleeves","sleeveless","puff sleeves"],"rel":["neckline"]},{"t":"flattering","p":"adj","vi":"tôn dáng","d":"Làm người mặc trông đẹp, cân đối hơn.","ex":[["This cut is flattering on petite figures.","Kiểu cắt này tôn dáng người nhỏ nhắn."]],"c":"Mô tả sản phẩm.","col":["slimming","flatter"],"rel":["fit"]},{"t":"petite","p":"adj","vi":"nhỏ nhắn","d":"Dáng người nhỏ, thấp. Plus size là size lớn.","ex":[["We have a petite length for shorter girls.","Có độ dài dành cho bạn nhỏ nhắn."]],"c":"Tư vấn size.","col":["plus size","curvy"],"rel":["size guide"]},{"t":"wrinkle-free","p":"adj","vi":"chống nhăn","d":"Ít hoặc không nhăn sau khi giặt.","ex":[["Wrinkle-free, no need to iron.","Chống nhăn, không cần ủi."]],"c":"Mô tả chất liệu.","col":["non-iron","crease-resistant"],"rel":["linen"]},{"t":"care instructions","p":"n","vi":"hướng dẫn bảo quản","d":"Cách giặt, phơi, ủi. Machine wash (giặt máy), hand wash (giặt tay), dry clean (giặt khô).","ex":[["Hand wash in cold water and hang dry.","Giặt tay nước lạnh và phơi khô."]],"c":"Giải đáp khách.","col":["care label","machine washable"],"rel":["fabric"]},{"t":"shrink","p":"v","vi":"co rút","d":"Vải co lại sau khi giặt. Pre-shrunk là đã xử lý chống co.","ex":[["It's pre-shrunk, so it won't shrink after washing.","Đã xử lý chống co nên không co sau khi giặt."]],"c":"Giải đáp khách.","col":["pre-shrunk","shrinkage"],"rel":["care instructions"]},{"t":"fade","p":"v","vi":"phai màu","d":"Màu nhạt đi sau khi giặt hoặc phơi nắng. Colorfast là bền màu.","ex":[["The color won't fade, it's colorfast.","Không phai màu đâu, vải bền màu."]],"c":"Giải đáp khách.","col":["colorfast","color bleeding"],"rel":["care instructions"]},{"t":"pattern","p":"n","vi":"họa tiết","d":"Hình in hoặc dệt trên vải: floral (hoa), plaid/check (kẻ ô), stripes (kẻ sọc), polka dot (chấm bi).","ex":[["The floral pattern is perfect for spring.","Họa tiết hoa rất hợp mùa xuân."]],"c":"Mô tả thiết kế.","col":["floral","plaid","stripes","polka dot"],"rel":["print"]},{"t":"print","p":"n","vi":"hình in","d":"Hình in trên áo, vải. Graphic tee là áo thun in hình.","ex":[["The print won't crack after washing.","Hình in không bị nứt sau khi giặt."]],"c":"Mô tả thiết kế.","col":["graphic print","all-over print"],"rel":["pattern"]},{"t":"collection","p":"n","vi":"bộ sưu tập","d":"Nhóm thiết kế ra mắt cùng lúc, thường theo mùa: spring/summer (SS), fall/winter (FW).","ex":[["Our new summer collection drops tonight.","Bộ sưu tập hè mới ra mắt tối nay."]],"c":"Live thời trang.","col":["SS","FW","drop"],"rel":["lookbook","new arrival"]},{"t":"drop","p":"n, v","vi":"đợt ra mắt (sản phẩm)","d":"Đợt ra mắt mẫu mới, thường số lượng giới hạn.","ex":[["The next drop is Friday at 8 PM.","Đợt mẫu mới tiếp theo vào 8 giờ tối thứ Sáu."]],"c":"Live thời trang, streetwear.","col":["new drop","limited drop"],"rel":["collection","limited edition"]},{"t":"streetwear","p":"n","vi":"thời trang đường phố","d":"Phong cách năng động, thường gắn với hoodie, sneaker, áo oversize.","ex":[["Streetwear brands sell well on TikTok.","Thương hiệu streetwear bán tốt trên TikTok."]],"c":"Phân loại.","col":["street style"],"rel":["oversized","sneakers"]},{"t":"accessorize","p":"v","vi":"phối phụ kiện","d":"Thêm phụ kiện để hoàn thiện bộ đồ.","ex":[["Accessorize with gold earrings for a night out.","Phối bông tai vàng khi đi chơi tối."]],"c":"Gợi ý phối đồ.","col":["accessories"],"rel":["jewelry"]},{"t":"dress code","p":"n","vi":"quy định trang phục","d":"Kiểu trang phục yêu cầu cho một dịp: business casual, smart casual, formal.","ex":[["This outfit fits a business casual dress code.","Bộ này hợp quy định trang phục công sở thoải mái."]],"c":"Gợi ý phối đồ.","col":["business casual","smart casual","formal"],"rel":["outfit"]},{"t":"silhouette","p":"n","vi":"dáng tổng thể (trang phục)","d":"Hình dáng chung của trang phục khi mặc, ví dụ dáng suông, dáng ôm.","ex":[["The A-line silhouette suits pear-shaped bodies.","Dáng chữ A hợp người dáng quả lê."]],"c":"Mô tả thiết kế.","col":["shape","cut"],"rel":["fit"]},{"t":"body type","p":"n","vi":"dáng người","d":"Pear (quả lê), apple (quả táo), hourglass (đồng hồ cát), rectangle (chữ nhật).","ex":[["What's your body type? I'll suggest a style.","Dáng bạn thế nào? Mình gợi ý kiểu cho."]],"c":"Tư vấn phối đồ.","col":["body shape"],"rel":["flattering","silhouette"]}]},{"id":"accessories","code":"ACC","group":"Ngành hàng","en":"Shoes, Bags & Accessories","vi":"Giày, túi và phụ kiện","intro":"Từ vựng mô tả giày dép, túi xách, trang sức, đồng hồ và phụ kiện thời trang.","terms":[{"t":"sneakers","p":"n","vi":"giày thể thao","d":"Giày đế cao su đi hằng ngày. Running shoes là giày chạy bộ.","ex":[["These chunky sneakers add 5 cm of height.","Đôi sneaker đế dày này tăng 5 cm chiều cao."]],"c":"Live giày.","col":["trainers","running shoes","chunky"],"rel":["streetwear"]},{"t":"heels","p":"n","vi":"giày cao gót","d":"Block heels là gót vuông, stilettos là gót nhọn, kitten heels là gót thấp nhọn.","ex":[["Block heels are easier to walk in.","Gót vuông dễ đi hơn."]],"c":"Live giày.","col":["block heels","stilettos"],"rel":["flats"]},{"t":"flats","p":"n"," ,"col":["pram","car seat"],"rel":["foldable"]},{"t":"breastfeeding","p":"n","vi":"cho con bú","d":"Nuôi con bằng sữa mẹ. Breast pump là máy hút sữa.","ex":[["This breast pump is quiet and portable.","Máy hút sữa này êm và nhỏ gọn."]],"c":"Live mẹ bé.","col":["breast pump","nursing"],"rel":["newborn"]},{"t":"teething","p":"n","vi":"mọc răng","d":"Giai đoạn bé mọc răng. Teether là gặm nướu.","ex":[["Silicone teethers help soothe teething babies.","Gặm nướu silicone giúp bé dễ chịu khi mọc răng."]],"c":"Live mẹ bé.","col":["teether"],"rel":["age range"]},{"t":"choking hazard","p":"n","vi":"nguy cơ hóc nghẹn","d":"Cảnh báo chi tiết nhỏ có thể gây nghẹn cho trẻ dưới 3 tuổi.","ex":[["Small parts, choking hazard, not for children under 3.","Có chi tiết nhỏ, nguy cơ hóc, không dành cho trẻ dưới 3 tuổi."]],"c":"Đồ chơi, an toàn.","col":["small parts","safety warning"],"rel":["age range"]},{"t":"educational toy","p":"n","vi":"đồ chơi giáo dục","d":"Đồ chơi giúp trẻ phát triển kỹ năng. STEM toy là đồ chơi khoa học, công nghệ.","ex":[["Wooden educational toys are popular with parents.","Đồ chơi giáo dục bằng gỗ được phụ huynh ưa chuộng."]],"c":"Live đồ chơi.","col":["STEM toy","Montessori"],"rel":["age range"]},{"t":"supplement","p":"n","vi":"thực phẩm bổ sung","d":"Thực phẩm chức năng như vitamin, collagen, omega-3. Phải ghi “không phải là thuốc” và không thay thế thuốc chữa bệnh.","ex":[["This supplement is not a medicine.","Sản phẩm này không phải là thuốc."]],"c":"Live sức khỏe, tuân thủ.","col":["dietary supplement","not a medicine"],"rel":["restricted category","product claims"]},{"t":"vitamin","p":"n","vi":"vitamin","d":"Vi chất cần thiết cho cơ thể. Multivitamin là vitamin tổng hợp.","ex":[["Take one multivitamin tablet a day after breakfast.","Uống một viên vitamin tổng hợp mỗi ngày sau bữa sáng."]],"c":"Live sức khỏe.","col":["multivitamin","vitamin D"],"rel":["supplement"]},{"t":"collagen","p":"n","vi":"collagen","d":"Protein có trong da, thường bán dạng bột hoặc nước uống.","ex":[["Mix one sachet of collagen with water.","Pha một gói collagen với nước."]],"c":"Live sức khỏe làm đẹp.","col":["collagen powder","sachet"],"rel":["supplement"]},{"t":"dosage","p":"n","vi":"liều dùng","d":"Lượng dùng mỗi lần và số lần trong ngày. Host chỉ đọc liều theo hướng dẫn trên nhãn.","ex":[["Follow the dosage on the label.","Dùng theo liều trên nhãn."]],"c":"Tuân thủ, hướng dẫn.","col":["recommended dosage","serving size"],"rel":["supplement"]},{"t":"serving size","p":"n","vi":"khẩu phần","d":"Lượng dùng một lần ghi trên nhãn, ví dụ 1 muỗng (scoop).","ex":[["One serving is two scoops.","Một khẩu phần là hai muỗng."]],"c":"Thực phẩm, thực phẩm bổ sung.","col":["scoop","servings per container"],"rel":["dosage"]},{"t":"side effect","p":"n","vi":"tác dụng phụ","d":"Tác động không mong muốn khi dùng.","ex":[["If you have side effects, stop using it and see a doctor.","Nếu có tác dụng phụ, ngưng dùng và đi khám."]],"c":"Giải đáp, cảnh báo.","col":["adverse reaction"],"rel":["irritation"]},{"t":"consult a doctor","p":"phrase","vi":"hỏi ý kiến bác sĩ","d":"Lời khuyên bắt buộc khi khách đang mang thai, cho con bú hoặc có bệnh lý.","ex":[["Pregnant women should consult a doctor before use.","Phụ nữ mang thai nên hỏi ý kiến bác sĩ trước khi dùng."]],"c":"Tuân thủ, an toàn.","col":["ask your doctor","medical advice"],"rel":["side effect"]},{"t":"medical device","p":"n","vi":"thiết bị y tế","d":"Thiết bị như máy đo huyết áp, nhiệt kế. Cần giấy phép lưu hành.","ex":[["A blood pressure monitor is a medical device and needs registration.","Máy đo huyết áp là thiết bị y tế và cần đăng ký."]],"c":"Ngành hạn chế.","col":["thermometer","blood pressure monitor"],"rel":["restricted category"]},{"t":"baby clothes","p":"n","vi":"quần áo trẻ em","d":"Bodysuit là áo liền quần, onesie là bộ liền thân.","ex":[["Soft cotton bodysuits for newborns.","Áo liền quần cotton mềm cho trẻ sơ sinh."]],"c":"Live mẹ bé.","col":["bodysuit","onesie"],"rel":["newborn"]}]},{"id":"food","code":"FOOD","group":"Ngành hàng","en":"Food, Beverage & Pets","vi":"Thực phẩm, đồ uống và thú cưng","intro":"Từ vựng mô tả hương vị, bảo quản, nhãn dinh dưỡng và sản phẩm cho thú cưng khi live.","terms":[{"t":"snack","p":"n","vi":"đồ ăn vặt","d":"Món ăn nhẹ giữa bữa.","ex":[["Our best-selling snack is dried mango.","Món ăn vặt bán chạy nhất là xoài sấy."]],"c":"Live thực phẩm.","col":["healthy snack","snacking"],"rel":["dried fruit"]},{"t":"dried fruit","p":"n","vi":"trái cây sấy","d":"Trái cây đã sấy khô. Freeze-dried là sấy thăng hoa.","ex":[["No added sugar in this dried fruit.","Trái cây sấy này không thêm đường."]],"c":"Live đặc sản.","col":["freeze-dried","no added sugar"],"rel":["snack"]},{"t":"specialty","p":"n","vi":"đặc sản","d":"Món đặc trưng của một vùng. Local specialty là đặc sản địa phương.","ex":[["Tonight we're selling Da Lat specialties.","Tối nay mình bán đặc sản Đà Lạt."]],"c":"Live đặc sản vùng miền.","col":["local specialty","regional"],"rel":["outdoor live"]},{"t":"taste","p":"n, v","vi":"vị, nếm","d":"Vị của món ăn. Taste test là nếm thử trên sóng.","ex":[["Let me do a taste test for you.","Để mình nếm thử cho mọi người xem."]],"c":"Live thực phẩm.","col":["taste test","flavor"],"rel":["flavor"]},{"t":"flavor","p":"n","vi":"hương vị","d":"Vị đặc trưng. Anh Anh viết flavour.","ex":[["It comes in three flavors: original, spicy and cheese.","Có ba vị: truyền thống, cay và phô mai."]],"c":"Mô tả sản phẩm.","col":["flavour","flavors"],"rel":["taste"]},{"t":"crispy","p":"adj","vi":"giòn","d":"Giòn rụm. Crunchy là giòn cứng, chewy là dai.","ex":[["Listen to how crispy it is!","Nghe tiếng giòn nè!"]],"c":"Mô tả món ăn.","col":["crunchy","chewy"],"rel":["texture (food)"]},{"t":"texture (food)","p":"n","vi":"kết cấu món ăn","d":"Cảm giác khi ăn: mềm (soft), dai (chewy), mịn (smooth), sệt (thick).","ex":[["The texture is soft and melts in your mouth.","Kết cấu mềm, tan trong miệng."]],"c":"Mô tả món ăn.","col":["mouthfeel","smooth"],"rel":["crispy"]},{"t":"spicy","p":"adj","vi":"cay","d":"Có vị cay. Mild là cay nhẹ, extra spicy là rất cay.","ex":[["This sauce is mild, not too spicy.","Nước sốt cay nhẹ, không cay lắm."]],"c":"Mô tả món ăn.","col":["mild","medium","hot"],"rel":["flavor"]},{"t":"savory","p":"adj","vi":"mặn, đậm đà","d":"Vị mặn, đậm (không ngọt). Anh Anh viết savoury.","ex":[["A savory snack that goes well with beer.","Món ăn vặt đậm vị rất hợp với bia."]],"c":"Mô tả món ăn.","col":["umami"],"rel":["sweet"]},{"t":"sweet","p":"adj","vi":"ngọt","d":"Vị ngọt. Less sweet là ít ngọt, sugar-free là không đường.","ex":[["We made it less sweet based on your feedback.","Bọn mình giảm ngọt theo góp ý của mọi người."]],"c":"Mô tả món ăn.","col":["sugar-free","less sweet"],"rel":["savory"]},{"t":"homemade","p":"adj","vi":"nhà làm, thủ công","d":"Làm tại nhà hoặc làm thủ công, không công nghiệp.","ex":[["Homemade chili oil, made in small batches.","Sa tế nhà làm, làm theo mẻ nhỏ."]],"c":"Mô tả sản phẩm.","col":["handmade","small batch"],"rel":["specialty"]},{"t":"preservative","p":"n","vi":"chất bảo quản","d":"Chất giữ thực phẩm lâu hỏng. No preservatives là không chất bảo quản.","ex":[["It has no artificial preservatives.","Không chứa chất bảo quản nhân tạo."]],"c":"Mô tả sản phẩm.","col":["preservative-free","additives"],"rel":["shelf life"]},{"t":"best before","p":"phrase","vi":"sử dụng tốt nhất trước","d":"Ngày khuyến nghị dùng tốt nhất. Use by là hạn cuối phải dùng.","ex":[["Best before: 6 months from production date.","Sử dụng tốt nhất trong 6 tháng kể từ ngày sản xuất."]],"c":"Thực phẩm.","col":["use by","BBE"],"rel":["expiry date"]},{"t":"storage instructions","p":"n","vi":"hướng dẫn bảo quản","d":"Cách giữ thực phẩm: refrigerate (để tủ lạnh), store in a cool, dry place (nơi khô mát).","ex":[["Refrigerate after opening.","Bảo quản tủ lạnh sau khi mở."]],"c":"Giải đáp khách.","col":["refrigerate","keep frozen"],"rel":["shelf life"]},{"t":"nutrition facts","p":"n","vi":"thông tin dinh dưỡng","d":"Bảng ghi calo, đạm, béo, đường mỗi khẩu phần.","ex":[["Each pack has 120 calories according to the nutrition facts.","Theo bảng dinh dưỡng, mỗi gói có 120 calo."]],"c":"Giải đáp khách.","col":["calories","protein","nutrition label"],"rel":["serving size"]},{"t":"allergen","p":"n","vi":"chất gây dị ứng","d":"Thành phần có thể gây dị ứng như đậu phộng, sữa, hải sản, gluten.","ex":[["Contains peanuts. Not suitable for people with nut allergies.","Có đậu phộng. Không phù hợp người dị ứng hạt."]],"c":"An toàn thực phẩm.","col":["contains nuts","gluten-free"],"rel":["food safety"]},{"t":"organic","p":"adj","vi":"hữu cơ","d":"Canh tác không dùng hóa chất tổng hợp, có chứng nhận. Chỉ dùng từ này khi có giấy chứng nhận.","ex":[["It's certified organic.","Sản phẩm có chứng nhận hữu cơ."]],"c":"Mô tả sản phẩm, tuân thủ.","col":["certified organic"],"rel":["product claims"]},{"t":"food safety","p":"n","vi":"an toàn thực phẩm","d":"Quy định và tiêu chuẩn bảo đảm thực phẩm an toàn. Food safety certificate là giấy chứng nhận vệ sinh an toàn thực phẩm.","ex":[["Upload the food safety certificate for the listing.","Tải giấy chứng nhận an toàn thực phẩm lên sản phẩm."]],"c":"Tuân thủ.","col":["food safety certificate"],"rel":["compliance certificate"]},{"t":"frozen food","p":"n","vi":"thực phẩm đông lạnh","d":"Thực phẩm giữ ở nhiệt độ đông. Cold chain là chuỗi giao hàng lạnh.","ex":[["Frozen food is only delivered within the city.","Thực phẩm đông lạnh chỉ giao nội thành."]],"c":"Vận chuyển đặc biệt.","col":["cold chain","chilled"],"rel":["shipping zone"]},{"t":"beverage","p":"n","vi":"đồ uống","d":"Thức uống nói chung. Ready-to-drink (RTD) là uống liền.","ex":[["Our ready-to-drink coffee comes in a 24-can carton.","Cà phê uống liền đóng thùng 24 lon."]],"c":"Live đồ uống.","col":["drink","RTD"],"rel":["flavor"]},{"t":"gift basket","p":"n","vi":"giỏ quà","d":"Giỏ quà thực phẩm, đặc biệt dịp Tết, Trung thu.","ex":[["Tet gift baskets sell out by mid-January.","Giỏ quà Tết bán hết vào giữa tháng Một."]],"c":"Live dịp lễ.","col":["hamper","gift box"],"rel":["gift set"]},{"t":"pet food","p":"n","vi":"thức ăn thú cưng","d":"Dry food là hạt khô, wet food là pate, treats là bánh thưởng.","ex":[["This dry food is grain-free for sensitive cats.","Hạt khô không ngũ cốc cho mèo nhạy cảm."]],"c":"Live thú cưng.","col":["dry food","wet food","treats"],"rel":["pet supplies"]},{"t":"pet supplies","p":"n","vi":"đồ dùng thú cưng","d":"Đồ dùng như cát vệ sinh (litter), vòng cổ (collar), dây dắt (leash).","ex":[["Cat litter is our most repeated order.","Cát vệ sinh mèo là đơn mua lại nhiều nhất."]],"c":"Live thú cưng.","col":["litter","collar","leash"],"rel":["pet food"]},{"t":"coffee","p":"n","vi":"cà phê","d":"Ground coffee là cà phê xay, instant coffee là cà phê hòa tan, beans là hạt.","ex":[["Our Robusta beans are roasted in small batches.","Hạt Robusta rang theo mẻ nhỏ."]],"c":"Live đồ uống.","col":["ground coffee","instant coffee","beans"],"rel":["beverage"]},{"t":"tea","p":"n","vi":"trà","d":"Loose-leaf là trà lá, tea bags là trà túi lọc.","ex":[["Each box has 20 tea bags.","Mỗi hộp có 20 túi trà."]],"c":"Live đồ uống.","col":["loose-leaf","tea bags"],"rel":["beverage"]}]},{"id":"descriptors","code":"DESC","group":"Ngành hàng","en":"Product Description Words","vi":"Từ mô tả sản phẩm","intro":"Tính từ và cụm từ giúp host mô tả sản phẩm sinh động, chính xác khi live bằng tiếng Anh.","terms":[{"t":"lightweight","p":"adj","vi":"nhẹ, mỏng nhẹ","d":"Nhẹ khi cầm hoặc nhẹ trên da.","ex":[["It's so lightweight you'll forget you're wearing it.","Nhẹ đến mức bạn quên là đang dùng."]],"c":"Mô tả sản phẩm.","col":["feather-light"],"rel":["compact"]},{"t":"compact","p":"adj","vi":"nhỏ gọn","d":"Kích thước nhỏ, gọn.","ex":[["Compact enough to fit in your pocket.","Nhỏ gọn đủ để bỏ túi."]],"c":"Mô tả sản phẩm.","col":["pocket-sized","travel-friendly"],"rel":["portable"]},{"t":"portable","p":"adj","vi":"di động, mang theo được","d":"Dễ mang theo.","ex":[["A portable fan for outdoor   const s=P.srs[t.key]||{b:0,due:0};
  if(g===0){s.b=0;s.due=now()+10*60e3;}
  else if(g===1){s.b=Math.max(1,s.b);s.due=now()+DAY;}
  else{s.b=Math.min(6,s.b+1);s.due=now()+INTERVAL[s.b]*DAY;}
  P.srs[t.key]=s;save();updateBadge();
}
const dueList=()=>ALL.filter(t=>P.srs[t.key]&&P.srs[t.key].due<=now());
const STATELABEL={new:"Mới",learning:"Đang học",known:"Đã thuộc"};

/* ---------- speech ---------- */
const hasSpeech=typeof window.speechSynthesis!=="undefined";
let speechRate=0.9,voice=null;
function pickVoice(){if(!hasSpeech)return;const v=speechSynthesis.getVoices();voice=v.find(x=>/^en[-_]US/i.test(x.lang)&&/Google|Samantha|Natural|Aria|Jenny/i.test(x.name))||v.find(x=>/^en[-_]US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null;}
if(hasSpeech){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(text){if(!hasSpeech||!text)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/[…]/g,"").replace(/\s*\([^)]*\)/g,"").replace(/\s\/\s/g,", "));u.lang="en-US";u.rate=speechRate;if(voice)u.voice=voice;speechSynthesis.speak(u);}catch(e){}}
const sayTerm=t=>speak(t.f&&/abbr/.test(t.p)?`${t.t}. ${t.f}`:t.t);
document.getElementById("speed").onchange=e=>{speechRate=+e.target.value;};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const fold=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d");
const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,"");
const I={
 spk:'<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-spk"/></svg>',
 star:'<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>',
 starO:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>',
 search:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
 x:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>'
};
function highlight(sentence,term){
  const base=term.t.replace(/\s*\([^)]*\)/g,"").split(" / ")[0];
  const re=new RegExp(reEsc(base),"i");
  const m=sentence.match(re);
  if(!m)return esc(sentence);
  return esc(sentence.slice(0,m.index))+"<mark>"+esc(m[0])+"</mark>"+esc(sentence.slice(m.index+m[0].length));
}
function catProgress(c){let k=0,l=0;c.terms.forEach(t=>{const s=stateOf(t);if(s==="known")k++;else if(s==="learning")l++;});return{k,l,n:c.terms.length};}
function updateBadge(){const n=dueList().length,b=$("#duebadge");b.textContent=n;b.classList.toggle("hidden",!n);}

/* ---------- router ---------- */
let V={view:"home"};
function go(view,opts={}){V=Object.assign({view},opts);render();window.scrollTo(0,0);}
function render(){
  document.querySelectorAll("#navtabs button").forEach(b=>b.setAttribute("aria-current",(b.dataset.v===V.view||(V.view==="cat"&&b.dataset.v==="home"))?"page":"false"));
  ({home,cat:catView,az,review,quiz:quizSetup,saved})[V.view]();
  updateBadge();
}
document.querySelectorAll("#navtabs button").forEach(b=>b.onclick=()=>go(b.dataset.v));
$("#brand").onclick=()=>go("home");

/* ---------- shared row ---------- */
function rowHTML(t,showCat){
  const s=stateOf(t);
  return `<button class="row" data-k="${esc(t.key)}">
    <span class="play" data-say="${esc(t.key)}" role="button" aria-label="Nghe ${esc(t.t)}">${I.spk}</span>
    <span style="min-width:0"><span class="tt">${esc(t.t)}</span>${t.f?`<span class="ff">${esc(t.f)}</span>`:""}<span class="vv">${showCat?`<span class="dot" style="--gc:${GCOL[t.cat.group]};margin-right:6px"></span>`:""}${esc(t.vi)}</span></span>
    <span class="side">${P.star[t.key]?`<span class="star on">${I.star}</span>`:""}<span class="state ${s}">${STATELABEL[s]}</span></span>
  </button>`;
}
function bindRows(root){
  root.querySelectorAll("[data-say]").forEach(b=>b.onclick=e=>{e.stopPropagation();sayTerm(BYKEY[b.dataset.say]);});
  root.querySelectorAll(".row[data-k]").forEach(b=>b.onclick=()=>openDetail(BYKEY[b.dataset.k]));
}
function searchTerms(q){
  q=fold(q.trim());if(!q)return[];
  const score=t=>{const n=fold(t.t),f=fold(t.f||""),v=fold(t.vi);
    if(n===q||f===q)return 0;if(n.startsWith(q))return 1;if(f.startsWith(q)||n.includes(q))return 2;if(v.includes(q))return 3;if(f.includes(q))return 3;
    if(fold(t.d).includes(q)||(t.col||[]).some(c=>fold(c).includes(q)))return 4;return 9;};
  return ALL.map(t=>[score(t),t]).filter(x=>x[0]<9).sort((a,b)=>a[0]-b[0]||a[1].t.localeCompare(b[1].t)).map(x=>x[1]);
}

/* ---------- FLASHCARDS ---------- */
function flashSession(root,list,opt={}){
  let i=0,flip=false;
  if(!list.length){root.innerHTML=`<p class="empty">${opt.emptyMsg||"Không có thẻ nào."}</p>`;return;}
  const draw=()=>{
    if(i>=list.length){root.innerHTML=`<div class="empty"><h3 style="margin-bottom:6px">Xong ${list.length} thẻ</h3><p style="margin:0 0 12px">${opt.doneMsg||"Các thẻ đã được hẹn lịch ôn lại theo mức nhớ của bạn."}</p><button class="btn primary" id="again">Học lại từ đầu</button></div>`;$("#again").onclick=()=>{i=0;flip=false;draw();};if(opt.onDone)opt.onDone();return;}
    const t=list[i],s=stateOf(t);
    root.innerHTML=`<div class="stage">
      ${opt.title?`<p class="note" style="margin:0;text-align:center">${opt.title}</p>`:""}
      <span class="counter">${i+1} / ${list.length} · <span class="state ${s}">${STATELABEL[s]}</span></span>
      <button class="flash${flip?" flipped":""}" id="flash" aria-label="Lật thẻ">
        <div class="inner">
          <div class="face front"><span class="tag"><span class="dot" style="--gc:${GCOL[t.cat.group]};margin-right:6px"></span>${t.cat.code} · ${esc(POS[t.p]||t.p)}</span>
            <div class="dterm">${esc(t.t)}</div>${t.f?`<div class="dfull">${esc(t.f)}</div>`:""}
            <span class="hint">Chạm để xem nghĩa, đoán trước khi lật</span></div>
          <div class="face rear"><div class="dvi">${esc(t.vi)}</div><p style="margin:0">${esc(t.d)}</p>
            ${t.fm?`<div class="formula">${esc(t.fm)}</div>`:""}
            <div class="exs"><b>${highlight(t.ex[0][0],t)}</b><br><span style="color:var(--muted)">${esc(t.ex[0][1])}</span></div>
            <span class="hint">Chạm để lật lại</span></div>
        </div>
      </button>
      <div class="cta-row" style="justify-content:center">
        <button class="btn sm" id="say">${I.spk} Nghe từ</button>
        <button class="btn sm" id="sayex">${I.spk} Nghe câu</button>
        <button class="btn sm" id="more">Xem đầy đủ</button>
        <button class="btn sm ghost" id="skip">Bỏ qua →</button>
      </div>
      <div class="rate">
        <button class="r0" data-g="0">Chưa nhớ<small>ôn lại sau 10 phút</small></button>
        <button class="r1" data-g="1">Hơi nhớ<small>ôn lại ngày mai</small></button>
        <button class="r2" data-g="2">Nhớ rõ<small>giãn lịch ôn</small></button>
      </div>
    </div>`;
    $("#flash").onclick=()=>{flip=!flip;$("#flash").classList.toggle("flipped",flip);};
    $("#say").onclick=()=>sayTerm(t);$("#sayex").onclick=()=>speak(t.ex[0][0]);
    $("#more").onclick=()=>openDetail(t);
    $("#skip").onclick=()=>{i++;flip=false;draw();};
    root.querySelectorAll(".rate button").forEach(b=>b.onclick=()=>{rate(t,+b.dataset.g);i++;flip=false;draw();});
  };
  draw();
}
