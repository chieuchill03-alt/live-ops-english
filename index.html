anagement to two live clients.","Bọn mình bán thêm dịch vụ quảng cáo cho hai khách hàng live."]],"c":"Agency phát triển doanh thu.","col":["expand the account"],"rel":["upsell","key account"]},{"t":"case study","p":"n","vi":"tình huống điển hình","d":"Bài phân tích một dự án thành công làm bằng chứng năng lực.","ex":[["Include the 11.11 case study in the proposal.","Đưa tình huống điển hình 11.11 vào đề xuất."]],"c":"Pitch, marketing agency.","col":["success story"],"rel":["proposal","pitch"]},{"t":"credentials","p":"n","vi":"hồ sơ năng lực","d":"Tài liệu giới thiệu năng lực, khách hàng tiêu biểu của agency. Viết tắt creds.","ex":[["Send our credentials deck to the new brand.","Gửi hồ sơ năng lực cho brand mới."]],"c":"Pitch.","col":["creds deck","company profile"],"rel":["case study"]},{"t":"client expectations","p":"n","vi":"kỳ vọng của khách hàng","d":"Những gì brand mong đợi về kết quả, cách làm việc.","ex":[["Manage client expectations early about the cold start.","Quản lý kỳ vọng của khách từ đầu về giai đoạn khởi đầu."]],"c":"Quản lý khách hàng.","col":["manage expectations"],"rel":["expectation"]},{"t":"deliver results","p":"phrase","vi":"mang lại kết quả","d":"Đạt kết quả như cam kết.","ex":[["Our team consistently delivers results for beauty brands.","Team luôn mang lại kết quả cho các brand làm đẹp."]],"c":"Agency, phỏng vấn.","col":["deliver on promises"],"rel":["achieve"]},{"t":"service level","p":"n","vi":"mức độ dịch vụ","d":"Chất lượng và phạm vi dịch vụ cam kết.","ex":[["The premium package includes a higher service level.","Gói cao cấp có mức dịch vụ cao hơn."]],"c":"Hợp đồng agency.","col":["service tier"],"rel":["SLA"]}]},{"id":"phrases","code":"PHRASE","group":"Công việc","en":"Phrase Bank","vi":"Mẫu câu dùng ngay","intro":"Các mẫu câu hoàn chỉnh để báo cáo số liệu, góp ý, xin duyệt, báo sự cố và nói chuyện với brand. Học như học từ, thay phần trong ngoặc bằng nội dung của bạn.","terms":[{"t":"is up / down X% compared to","p":"pattern","vi":"tăng / giảm X% so với","d":"Mẫu câu cơ bản để báo cáo thay đổi số liệu.","c":"Báo cáo hằng ngày, tuần.","ex":[["GMV is up 12% compared to last week.","GMV tăng 12% so với tuần trước."],["CCU is down 30% compared to yesterday's session.","CCU giảm 30% so với phiên hôm qua."]],"col":["increased by","decreased by","compared to / versus"],"rel":["WoW","growth rate"]},{"t":"This is mainly due to","p":"pattern","vi":"Điều này chủ yếu do","d":"Giải thích nguyên nhân sau khi đưa số liệu. Biến thể: This was driven by…, The main reason is…","c":"Báo cáo, họp.","ex":[["This is mainly due to the voucher running out at 10 PM.","Điều này chủ yếu do voucher hết lúc 10 giờ."],["The growth was driven by two new hero products.","Tăng trưởng đến từ hai sản phẩm chủ lực mới."]],"col":["driven by","caused by","as a result of"],"rel":["root cause","insight"]},{"t":"We exceeded / fell short of the target","p":"pattern","vi":"Vượt / hụt chỉ tiêu","d":"Báo kết quả so với mục tiêu.","c":"Báo cáo KPI.","ex":[["We exceeded the target by 15%.","Mình vượt chỉ tiêu 15%."],["We fell short of the target by 50 million.","Mình hụt chỉ tiêu 50 triệu."]],"col":["hit the target","miss the target","on track to"],"rel":["target","achievement rate"]},{"t":"Moving forward, we will","p":"pattern","vi":"Sắp tới, chúng tôi sẽ","d":"Nêu hành động cải thiện sau khi báo cáo vấn đề. Biến thể: Going forward…, Next time we'll…","c":"Phần kết báo cáo, rút kinh nghiệm.","ex":[["Moving forward, we will check stock levels every hour during the live.","Sắp tới, bọn mình sẽ kiểm tra tồn kho mỗi giờ trong live."]],"col":["going forward","from now on"],"rel":["next steps","lessons learned"]},{"t":"Could you please","p":"pattern","vi":"Bạn có thể vui lòng","d":"Cách nhờ việc lịch sự. Lịch sự hơn: Would you mind + V-ing…? I was wondering if you could…","c":"Tin nhắn, email nhờ việc.","ex":[["Could you please send me the final lineup by 3 PM?","Bạn vui lòng gửi danh sách sản phẩm chốt trước 3 giờ nhé?"],["Would you mind checking the stream setup?","Bạn kiểm tra giúp bố trí kỹ thuật được không?"]],"col":["would you mind","I was wondering if"],"rel":["ASAP"]},{"t":"Just a quick reminder that","p":"pattern","vi":"Nhắc nhẹ là","d":"Nhắc việc mà không gây áp lực.","c":"Nhắc hạn, nhắc lịch.","ex":[["Just a quick reminder that the script is due tomorrow.","Nhắc nhẹ là kịch bản đến hạn ngày mai."]],"col":["gentle reminder","friendly reminder"],"rel":["follow up","deadline"]},{"t":"Could we get approval on","p":"pattern","vi":"Bên mình xin duyệt","d":"Xin brand hoặc cấp trên duyệt một nội dung cụ thể.","c":"Xin duyệt giá, kịch bản, ngân sách.","ex":[["Could we get approval on the deal prices by Wednesday?","Bên mình xin duyệt giá deal trước thứ Tư được không?"]],"col":["seek approval","pending approval"],"rel":["approve","sign-off"]},{"t":"I'd like to propose","p":"pattern","vi":"Mình muốn đề xuất","d":"Đưa ra đề xuất một cách chuyên nghiệp. Biến thể: What if we…? I suggest we…","c":"Họp, email đề xuất.","ex":[["I'd like to propose moving the flash sale to 9 PM.","Mình muốn đề xuất dời flash sale sang 9 giờ."],["What if we add a bundle for the slow-moving SKUs?","Hay mình thêm combo cho các mã bán chậm?"]],"col":["I suggest","what if we","how about"],"rel":["proposal"]},{"t":"We're experiencing an issue with","p":"pattern","vi":"Bên mình đang gặp sự cố với","d":"Báo sự cố một cách bình tĩnh, rõ ràng. Nên kèm mức ảnh hưởng và hướng xử lý.","c":"Báo sự cố cho sàn, brand, kỹ thuật.","ex":[["We're experiencing an issue with the product links, viewers can't add to cart.","Bên mình đang gặp sự cố link sản phẩm, người xem không thêm vào giỏ được."]],"col":["we're aware of","we're looking into it"],"rel":["escalate","lag"]},{"t":"We're looking into it","p":"pattern","vi":"Bên mình đang kiểm tra","d":"Trả lời khi chưa có câu trả lời ngay, cho thấy đang xử lý. Thường kèm hẹn thời gian cập nhật.","c":"Trả lời brand, khách, sếp.","ex":[["We're looking into it and will update you within 30 minutes.","Bên mình đang kiểm tra và sẽ cập nhật trong 30 phút."]],"col":["investigate","get back to you"],"rel":["keep me posted"]},{"t":"I'll get back to you on","p":"pattern","vi":"Mình sẽ phản hồi lại về","d":"Hẹn trả lời sau khi chưa có thông tin.","c":"Họp, tin nhắn.","ex":[["I'll get back to you on the shipping fee by tomorrow.","Mai mình phản hồi lại về phí vận chuyển."]],"col":["get back to sb","circle back"],"rel":["circle back","follow up"]},{"t":"From my perspective","p":"pattern","vi":"Theo góc nhìn của mình","d":"Mở đầu ý kiến cá nhân một cách mềm mỏng. Biến thể: In my view…, I think it might be better to…","c":"Thảo luận, góp ý.","ex":[["From my perspective, the host should spend more time on the demo.","Theo mình, host nên dành nhiều thời gian hơn cho phần demo."]],"col":["in my opinion","in my view"],"rel":["feedback"]},{"t":"One thing that went well was","p":"pattern","vi":"Một điểm làm tốt là","d":"Mở đầu góp ý bằng điểm tích cực trước khi nói điểm cần cải thiện. Tiếp theo: One thing we could improve is…","c":"Góp ý host, rút kinh nghiệm.","ex":[["One thing that went well was the energy in the first hour. One thing we could improve is the closing.","Điểm làm tốt là năng lượng giờ đầu. Điểm có thể cải thiện là phần chốt đơn."]],"col":["could improve","even better if"],"rel":["feedback","post-mortem"]},{"t":"feedback","p":"n","vi":"góp ý, phản hồi","d":"Nhận xét để cải thiện. Feedback là danh từ không đếm được: some feedback, a piece of feedback (không nói a feedback, feedbacks).","c":"Đánh giá, review.","ex":[["Do you have any feedback on the new host?","Bạn có góp ý gì về host mới không?"],["Thanks for the feedback, I'll update the script.","Cảm ơn góp ý, mình sẽ sửa kịch bản."]],"col":["give feedback","constructive feedback","feedback on"],"rel":["revision","one-on-one"],"tip":"Không dùng feedbacks. Nói some feedback hoặc a few points of feedback."},{"t":"Let me double-check","p":"pattern","vi":"Để mình kiểm tra lại","d":"Xin thời gian xác nhận thông tin trước khi trả lời chắc chắn.","c":"Khi chưa chắc số liệu.","ex":[["Let me double-check the stock and confirm in five minutes.","Để mình kiểm tra lại tồn kho và xác nhận trong năm phút."]],"col":["double-check","confirm"],"rel":["We're looking into it"]},{"t":"Just to clarify","p":"pattern","vi":"Cho mình hỏi lại cho rõ","d":"Xác nhận lại để tránh hiểu nhầm. Biến thể: Do you mean…? Just to make sure we're on the same page…","c":"Họp, nhận brief.","ex":[["Just to clarify, is the commission based on GMV or net revenue?","Cho mình hỏi rõ, hoa hồng tính trên GMV hay doanh thu thuần?"]],"col":["on the same page","do you mean"],"rel":["alignment"]},{"t":"Welcome to our live!","p":"host line","vi":"Chào mừng các bạn đến với phiên live!","d":"Câu chào mở đầu của host. Thường tiếp theo bằng lời mời theo dõi và giới thiệu deal hôm nay.","c":"Live tiếng Anh, live quốc tế.","ex":[["Welcome to our live! Hit follow so you don't miss today's deals.","Chào mừng đến với phiên live! Bấm theo dõi để không lỡ deal hôm nay."]],"col":["hit follow","tap the bag"],"rel":["warm-up","hook"]},{"t":"Tap the orange bag","p":"host line","vi":"Bấm vào giỏ hàng màu cam","d":"Lời kêu gọi hành động chuẩn trong live TikTok (giỏ hàng). Biến thể: Click the link, Check out product number 3.","c":"Live tiếng Anh.","ex":[["Tap the orange bag and pick product number 2.","Bấm giỏ hàng màu cam và chọn sản phẩm số 2."]],"col":["shopping bag","product number"],"rel":["call to action"]},{"t":"Only X left in stock!","p":"host line","vi":"Chỉ còn X sản phẩm!","d":"Câu tạo khan hiếm. Biến thể: We're almost sold out! Grab it before it's gone!","c":"Live tiếng Anh.","ex":[["Only 20 left in stock, grab yours now!","Chỉ còn 20 cái, nhanh tay lên!"]],"col":["almost sold out","grab it"],"rel":["scarcity","urgency"]},{"t":"This deal ends in","p":"host line","vi":"Deal này kết thúc sau","d":"Câu tạo gấp gáp về thời gian.","c":"Live tiếng Anh.","ex":[["This deal ends in five minutes, don't miss out!","Deal kết thúc sau năm phút, đừng bỏ lỡ!"]],"col":["don't miss out","last chance"],"rel":["urgency","countdown"]},{"t":"Drop a comment if","p":"host line","vi":"Bình luận nếu","d":"Kêu gọi bình luận để tăng tương tác.","c":"Live tiếng Anh.","ex":[["Drop a 1 in the comments if you want this color!","Gõ 1 nếu bạn muốn màu này!"]],"col":["type 1","let me know in the comments"],"rel":["comment prompt"]},{"t":"Thank you for joining us","p":"host line","vi":"Cảm ơn các bạn đã tham gia","d":"Câu kết phiên. Thường kèm lịch live tiếp theo.","c":"Live tiếng Anh.","ex":[["Thank you for joining us! See you tomorrow at 8 PM.","Cảm ơn các bạn đã tham gia! Hẹn gặp lại 8 giờ tối mai."]],"col":["see you next time","same time tomorrow"],"rel":["wrap-up"]},{"t":"Hi everyone, welcome back!","p":"host line","vi":"Chào mọi người, chào mừng quay lại!","d":"Câu chào quen thuộc với người xem thường xuyên.","ex":[["Hi everyone, welcome back! Today's deals are crazy.","Chào mọi người, chào mừng quay lại! Deal hôm nay cực sốc."]],"c":"Live tiếng Anh.","col":["welcome back"],"rel":["Welcome to our live!"]},{"t":"Where are you watching from?","p":"host line","vi":"Bạn đang xem từ đâu?","d":"Câu hỏi khuấy động bình luận đầu phiên.","ex":[["Where are you watching from? Let me know in the comments!","Bạn đang xem từ đâu? Bình luận cho mình biết nhé!"]],"c":"Live tiếng Anh.","col":["say hi"],"rel":["comment prompt"]},{"t":"Hit the follow button","p":"host line","vi":"Bấm nút theo dõi","d":"Kêu gọi theo dõi kênh.","ex":[["Hit the follow button so you never miss a deal.","Bấm theo dõi để không bỏ lỡ deal nào."]],"c":"Live tiếng Anh.","col":["follow us"],"rel":["Welcome to our live!"]},{"t":"Let me show you","p":"host line","vi":"Để mình cho bạn xem","d":"Dẫn vào phần demo.","ex":[["Let me show you how light the texture is.","Để mình cho bạn xem kết cấu nhẹ thế nào."]],"c":"Live tiếng Anh.","col":["take a look","check this out"],"rel":["product demo"]},{"t":"Check out this texture","p":"host line","vi":"Nhìn kết cấu này nè","d":"Câu demo ặt hàng nè?","d":"Tương tác, tạo bằng chứng xã hội.","ex":[["Who just ordered? Comment 'done' and I'll give you a shout-out!","Ai vừa đặt? Bình luận “xong” để mình gọi tên nhé!"]],"c":"Live tiếng Anh.","col":["comment 'done'"],"rel":["shout-out","social proof"]},{"t":"Great question","p":"host line","vi":"Câu hỏi hay","d":"Câu mở khi trả lời bình luận.","ex":[["Great question, yes, it's safe for sensitive skin.","Câu hỏi hay, đúng vậy, an toàn cho da nhạy cảm."]],"c":"Live tiếng Anh.","col":["good question"],"rel":["Q&A"]},{"t":"Let me answer some questions","p":"host line","vi":"Mình trả lời vài câu hỏi nhé","d":"Chuyển sang phần hỏi đáp.","ex":[["Let me answer some questions from the comments.","Mình trả lời vài câu hỏi trong bình luận nhé."]],"c":"Live tiếng Anh.","col":["Q&A time"],"rel":["Q&A"]},{"t":"We'll be back tomorrow at","p":"host line","vi":"Hẹn gặp lại ngày mai lúc","d":"Thông báo lịch live tiếp theo.","ex":[["We'll be back tomorrow at 8 PM with new deals.","Hẹn mọi người 8 giờ tối mai với deal mới."]],"c":"Live tiếng Anh.","col":["see you tomorrow"],"rel":["Thank you for joining us"]},{"t":"I'm happy to help","p":"pattern","vi":"Mình rất sẵn lòng hỗ trợ","d":"Câu thân thiện trong CS và email.","ex":[["I'm happy to help with your order.","Mình rất sẵn lòng hỗ trợ đơn hàng của bạn."]],"c":"CS, email.","col":["glad to help"],"rel":["customer service"]},{"t":"I understand your concern","p":"pattern","vi":"Mình hiểu băn khoăn của bạn","d":"Thể hiện đồng cảm trước khi xử lý khiếu nại.","ex":[["I understand your concern about the delay.","Mình hiểu bạn lo lắng về việc giao chậm."]],"c":"CS.","col":["I hear you"],"rel":["apology"]},{"t":"Could you share more details","p":"pattern","vi":"Bạn chia sẻ thêm chi tiết được không","d":"Xin thêm thông tin để xử lý.","ex":[["Could you share more details or a photo of the item?","Bạn gửi thêm chi tiết hoặc ảnh sản phẩm được không?"]],"c":"CS, công việc.","col":["tell me more"],"rel":["Just to clarify"]},{"t":"We'll make it right","p":"pattern","vi":"Bên mình sẽ khắc phục","d":"Cam kết xử lý lỗi cho khách.","ex":[["Sorry about that, we'll make it right.","Xin lỗi bạn, bên mình sẽ khắc phục."]],"c":"CS.","col":["fix it"],"rel":["resolution"]},{"t":"Here's a quick update","p":"pattern","vi":"Cập nhật nhanh","d":"Mở đầu tin báo tiến độ.","ex":[["Here's a quick update: stock arrives tomorrow morning.","Cập nhật nhanh: sáng mai hàng về."]],"c":"Tin nhắn công việc.","col":["quick update"],"rel":["status update"]},{"t":"Good news","p":"pattern","vi":"Tin vui","d":"Báo tin tốt.","ex":[["Good news: we hit the monthly target a week early!","Tin vui: mình đạt chỉ tiêu tháng sớm một tuần!"]],"c":"Tin nhắn công việc.","col":["great news"],"rel":["We exceeded / fell short of the target"]},{"t":"Bad news","p":"pattern","vi":"Tin không vui","d":"Báo tin xấu thẳng thắn, nên kèm giải pháp.","ex":[["Bad news: the courier missed today's pickup. We've booked another one for 6 PM.","Tin không vui: vận chuyển không lấy hàng hôm nay. Mình đã đặt chuyến khác lúc 6 giờ."]],"c":"Tin nhắn công việc.","col":["unfortunately"],"rel":["I'm afraid"]},{"t":"What do you think about","p":"pattern","vi":"Bạn nghĩ sao về","d":"Hỏi ý kiến.","ex":[["What do you think about moving the flash sale earlier?","Bạn nghĩ sao về việc dời flash sale sớm hơn?"]],"c":"Thảo luận.","col":["any thoughts on"],"rel":["I'd like to propose"]},{"t":"Let's aim for","p":"pattern","vi":"Hãy nhắm tới","d":"Đặt mục tiêu chung.","ex":[["Let's aim for 1 billion GMV this weekend.","Cuối tuần này nhắm tới 1 tỷ GMV nhé."]],"c":"Lập kế hoạch.","col":["target","goal"],"rel":["target"]},{"t":"Great job, team","p":"pattern","vi":"Làm tốt lắm cả nhóm","d":"Ghi nhận thành tích.","ex":[["Great job, team! Best live of the month.","Làm tốt lắm cả nhóm! Phiên live tốt nhất tháng."]],"c":"Sau live, sau chiến dịch.","col":["well done","kudos"],"rel":["recognition"]},{"t":"Thanks for flagging","p":"pattern","vi":"Cảm ơn đã báo","d":"Cảm ơn ai đó đã phát hiện, báo vấn đề.","ex":[["Thanks for flagging the pricing error.","Cảm ơn đã báo lỗi sai giá."]],"c":"Tin nhắn công việc.","col":["flag an issue"],"rel":["pricing error"]},{"t":"flag","p":"v","vi":"báo, đánh dấu (vấn đề)","d":"Chỉ ra một vấn đề cần chú ý.","ex":[["Please flag any stock issues before the live.","Có vấn đề tồn kho gì thì báo trước live nhé."]],"c":"Công việc.","col":["flag an issue","raise"],"rel":["Thanks for flagging"]},{"t":"I'll take care of it","p":"pattern","vi":"Để mình lo","d":"Nhận xử lý một việc.","ex":[["Don't worry, I'll take care of it.","Đừng lo, để mình lo."]],"c":"Tin nhắn công việc.","col":["leave it with me","I've got it"],"rel":["on it"]},{"t":"No worries","p":"phrase","vi":"Không sao đâu","d":"Đáp lại lời cảm ơn hoặc xin lỗi một cách thân thiện.","ex":[["No worries, these things happen.","Không sao, chuyện này vẫn xảy ra mà."]],"c":"Giao tiếp thường ngày.","col":["no problem","all good"],"rel":["apology"]},{"t":"Sounds good","p":"phrase","vi":"Nghe ổn đấy, đồng ý","d":"Đồng ý nhanh.","ex":[["Sounds good, let's go with plan B.","Ổn đấy, mình làm theo phương án B."]],"c":"Tin nhắn.","col":["works for me","sounds great"],"rel":["noted"]},{"t":"Let's get this party started!","p":"host line","vi":"Bắt đầu cuộc vui thôi!","d":"Câu mở màn tạo không khí sôi động.","ex":[["Let's get this party started! First deal in 3 minutes.","Bắt đầu thôi! Deal đầu tiên sau 3 phút."]],"c":"Live tiếng Anh.","col":["let's go"],"rel":["hype"]},{"t":"Who's ready for the next deal?","p":"host line","vi":"Ai sẵn sàng cho deal tiếp theo?","d":"Khuấy động trước khi công bố deal.","ex":[["Who's ready for the next deal? Type 'ready'!","Ai sẵn sàng cho deal tiếp? Gõ “sẵn sàng” nhé!"]],"c":"Live tiếng Anh.","col":["are you ready"],"rel":["hype","comment prompt"]},{"t":"Can you guess the price?","p":"host line","vi":"Đoán xem giá bao nhiêu?","d":"Mini game đoán giá tăng tương tác.","ex":[["Can you guess the price? Closest guess wins a gift!","Đoán giá đi! Ai gần đúng nhất nhận quà!"]],"c":"Live tiếng Anh.","col":["guess the price game"],"rel":["mini game"]},{"t":"This is a steal","p":"host line","vi":"Giá này như cho","d":"Nhấn mạnh giá cực hời.","ex":[["At 99k, this is a steal!","Giá 99k là như cho luôn!"]],"c":"Live tiếng Anh.","col":["bargain","crazy deal"],"rel":["value for money"]},{"t":"Trust me on this one","p":"host line","vi":"Tin mình đi","d":"Tạo sự tin tưởng dựa trên trải nghiệm cá nhân host.","ex":[["Trust me on this one, I've used it for two years.","Tin mình đi, mình dùng hai năm rồi."]],"c":"Live tiếng Anh.","col":["I swear by it"],"rel":["authentic"]},{"t":"I use this every day","p":"host line","vi":"Mình dùng cái này mỗi ngày","d":"Chia sẻ trải nghiệm thật.","ex":[["I use this every day before work.","Mình dùng cái này mỗi ngày trước khi đi làm."]],"c":"Live tiếng Anh.","col":["daily use"],"rel":["authentic","storytelling"]},{"t":"Let me zoom in","p":"host line","vi":"Để mình phóng to cho xem","d":"Đưa sản phẩm sát camera để thấy chi tiết.","ex":[["Let me zoom in so you can see the stitching.","Để mình đưa gần cho xem đường may."]],"c":"Live tiếng Anh.","col":["close-up"],"rel":["close-up"]},{"t":"Swipe up / tap the link","p":"host line","vi":"Bấm vào link","d":"Kêu gọi bấm link (cách nói cũ trên story là swipe up).","ex":[["Tap the link to shop the look.","Bấm link để mua cả set đồ."]],"c":"Live, story.","col":["tap the link"],"rel":["link in bio"]},{"t":"It's going fast","p":"host line","vi":"Đang bán rất nhanh","d":"Báo hàng đang hết dần.","ex":[["It's going fast, 70% sold already!","Đang bán rất nhanh, đã bán 70% rồi!"]],"c":"Live tiếng Anh.","col":["selling fast"],"rel":["scarcity"]},{"t":"Don't forget to claim your voucher","p":"host line","vi":"Đừng quên lưu voucher","d":"Nhắc lưu mã trước khi mua.","ex":[["Don't forget to claim your voucher before checkout.","Đừng quên lưu voucher trước khi thanh toán."]],"c":"Live tiếng Anh.","col":["claim the voucher"],"rel":["voucher"]},{"t":"Thanks for the love","p":"host line","vi":"Cảm ơn mọi người đã ủng hộ","d":"Cảm ơn người xem thả tim, tặng quà.","ex":[["Thanks for the love, everyone!","Cảm ơn mọi người đã ủng hộ!"]],"c":"Live tiếng Anh.","col":["thanks for the support"],"rel":["gifts","likes"]},{"t":"Welcome, new friends!","p":"host line","vi":"Chào mừng các bạn mới!","d":"Chào người xem mới vào phòng.","ex":[["Welcome, new friends! Here's what you missed.","Chào các bạn mới! Đây là những gì bạn vừa bỏ lỡ."]],"c":"Live tiếng Anh.","col":["newcomers"],"rel":["recap the deal"]}]},{"id":"email","code":"EMAIL","group":"Công việc","en":"Email Writing","vi":"Viết email công việc","intro":"Cấu trúc và mẫu câu email tiếng Anh: mở đầu, nhờ việc, đính kèm, nhắc nhở, xin lỗi, kết thư.","terms":[{"t":"Dear","p":"greeting","vi":"Kính gửi","d":"Mở đầu email trang trọng. Thân mật hơn dùng Hi hoặc Hello kèm tên.","ex":[["Dear Ms. Linh,","Kính gửi chị Linh,"]],"c":"Email với đối tác mới, cấp cao.","col":["Dear Sir or Madam","Hi team"],"rel":["Best regards"]},{"t":"Hi team","p":"greeting","vi":"Chào cả nhóm","d":"Mở đầu email gửi cả nhóm.","ex":[["Hi team, here's the plan for tonight's live.","Chào cả nhóm, đây là kế hoạch live tối nay."]],"c":"Email nội bộ.","col":["Hi all","Hello everyone"],"rel":["Dear"]},{"t":"I hope this email finds you well","p":"pattern","vi":"Hy vọng anh/chị vẫn khỏe","d":"Câu mở lịch sự sau lời chào. Không nên dùng quá nhiều với người quen.","ex":[["I hope this email finds you well. I'm writing to confirm the live schedule.","Hy vọng chị vẫn khỏe. Em viết để xác nhận lịch live."]],"c":"Email đối tác.","col":["I hope you're doing well"],"rel":["I'm writing to"]},{"t":"I'm writing to","p":"pattern","vi":"Tôi viết thư này để","d":"Nêu mục đích email ngay đầu.","ex":[["I'm writing to follow up on the proposal.","Em viết thư để hỏi thêm về bản đề xuất."]],"c":"Mở đầu email.","col":["I'm reaching out to"],"rel":["I hope this email finds you well"]},{"t":"Please find attached","p":"pattern","vi":"Vui lòng xem tệp đính kèm","d":"Câu chuẩn khi gửi file. Biến thể: I've attached…","ex":[["Please find attached the post-live report.","Vui lòng xem báo cáo sau live đính kèm."]],"c":"Gửi file.","col":["attached","attachment"],"rel":["attachment"]},{"t":"attachment","p":"n","vi":"tệp đính kèm","d":"File gửi kèm email.","ex":[["The attachment is too large, I'll share a Drive link.","Tệp đính kèm quá lớn, mình gửi link Drive."]],"c":"Email.","col":["attach","attached file"],"rel":["Please find attached"]},{"t":"As discussed","p":"pattern","vi":"Như đã trao đổi","d":"Nhắc lại nội dung đã bàn trong cuộc họp hoặc cuộc gọi trước.","ex":[["As discussed, we'll move the live to 8 PM.","Như đã trao đổi, mình dời live sang 8 giờ."]],"c":"Email sau họp.","col":["as per our conversation","as agreed"],"rel":["recap"]},{"t":"Further to","p":"pattern","vi":"Tiếp theo (email, cuộc gọi)","d":"Cách trang trọng để nối tiếp chủ đề trước.","ex":[["Further to our call, please see the revised quote.","Tiếp theo cuộc gọi, mời chị xem báo giá đã điều chỉnh."]],"c":"Email trang trọng.","col":["following our call"],"rel":["As discussed"]},{"t":"I would appreciate it if","p":"pattern","vi":"Tôi rất cảm kích nếu","d":"Nhờ vả lịch sự, trang trọng.","ex":[["I would appreciate it if you could confirm by Friday.","Em rất cảm kích nếu chị xác nhận trước thứ Sáu."]],"c":"Email nhờ việc.","col":["it would be great if"],"rel":["Could you please"]},{"t":"at your earliest convenience","p":"phrase","vi":"sớm nhất khi có thể","d":"Cách nói lịch sự thay cho ASAP.","ex":[["Please reply at your earliest convenience.","Vui lòng phản hồi sớm nhất khi có thể."]],"c":"Email trang trọng.","col":["as soon as possible"],"rel":["ASAP"]},{"t":"Please let me know if","p":"pattern","vi":"Hãy cho tôi biết nếu","d":"Mời người nhận phản hồi.","ex":[["Please let me know if you have any questions.","Có câu hỏi gì chị cứ cho em biết nhé."]],"c":"Kết email.","col":["let me know","feel free to"],"rel":["reach out"]},{"t":"Thank you for your patience","p":"pattern","vi":"Cảm ơn sự kiên nhẫn của bạn","d":"Dùng khi phản hồi chậm hoặc khách phải chờ.","ex":[["Thank you for your patience while we check your order.","Cảm ơn bạn đã kiên nhẫn chờ trong lúc bên mình kiểm tra đơn."]],"c":"CS, email.","col":["thanks for waiting"],"rel":["apology"]},{"t":"Apologies for the delay","p":"pattern","vi":"Xin lỗi vì phản hồi chậm","d":"Mở đầu khi trả lời muộn.","ex":[["Apologies for the delayed response.","Xin lỗi vì phản hồi chậm."]],"c":"Email.","col":["sorry for the late reply"],"rel":["apology"]},{"t":"I'm afraid","p":"pattern","vi":"Tôi e là (báo tin không vui)","d":"Làm mềm khi báo tin xấu hoặc từ chối.","ex":[["I'm afraid we can't offer a deeper discount.","Em e là bên em không thể giảm sâu hơn."]],"c":"Từ chối lịch sự.","col":["unfortunately"],"rel":["decline"]},{"t":"Unfortunately","p":"adv","vi":"Rất tiếc","d":"Báo tin không tốt một cách lịch sự.","ex":[["Unfortunately, the item is out of stock.","Rất tiếc, sản phẩm đã hết hàng."]],"c":"Email, CS.","col":["regrettably"],"rel":["I'm afraid"]},{"t":"decline","p":"v","vi":"từ chối (lịch sự)","d":"Không nhận lời mời, đề nghị.","ex":[["We have to decline this offer.","Bên mình phải từ chối đề nghị này."]],"c":"Email, đàm phán.","col":["politely decline","turn down"],"rel":["I'm afraid"]},{"t":"Looking forward to","p":"pattern","vi":"Mong được","d":"Câu kết thể hiện mong chờ. Sau to là danh từ hoặc V-ing.","ex":[["Looking forward to working with you.","Mong được hợp tác cùng anh chị."]],"c":"Kết email.","col":["look forward to hearing from you"],"rel":["Best regards"]},{"t":"Best regards","p":"closing","vi":"Trân trọng","d":"Lời kết email phổ biến. Thân hơn: Best, Thanks, Cheers. Trang trọng hơn: Kind regards, Sincerely.","ex":[["Best regards, Minh – Live Ops Lead","Trân trọng, Minh – Trưởng vận hành live"]],"c":"Kết email.","col":["Kind regards","Sincerely","Best"],"rel":["Dear"]},{"t":"email signature","p":"n","vi":"chữ ký email","d":"Phần thông tin cuối email: tên, chức vụ, công ty, số điện thoại.","ex":[["Add your phone number to your email signature.","Thêm số điện thoại vào chữ ký email."]],"c":"Email.","col":["signature block"],"rel":["Best regards"]},{"t":"CC","p":"abbr","vi":"đồng gửi","d":"Carbon copy: người nhận bản sao để nắm thông tin. BCC là gửi ẩn.","ex":[["Please CC me on the email to the brand.","Nhớ CC mình vào email gửi brand."]],"c":"Email.","col":["BCC","cc'd"],"rel":["loop in"]},{"t":"reply all","p":"v","vi":"trả lời tất cả","d":"Trả lời mọi người trong email. Dùng cẩn thận.","ex":[["Please reply all so everyone stays updated.","Trả lời tất cả để mọi người cùng nắm."]],"c":"Email.","col":["reply","forward"],"rel":["CC"]},{"t":"forward","p":"v","vi":"chuyển tiếp","d":"Gửi email nhận được cho người khác. Viết tắt FW hoặc Fwd.","ex":[["I'll forward you the brand's brief.","Mình chuyển tiếp brief của brand cho bạn."]],"c":"Email.","col":["FW","Fwd"],"rel":["reply all"]},{"t":"email thread","p":"n","vi":"chuỗi email","d":"Các email trả lời qua lại cùng một chủ đề.","ex":[["It's in the email thread from Monday.","Nó nằm trong chuỗi email hôm thứ Hai."]],"c":"Email.","col":["thread"],"rel":["reply all"]},{"t":"out-of-office reply","p":"n","vi":"trả lời tự động khi vắng mặt","d":"Email tự trả lời khi nghỉ phép, cho biết ngày quay lại và người thay thế.","ex":[["Set your out-of-office reply before your holiday.","Cài trả lời tự động trước khi đi nghỉ."]],"c":"Nghỉ phép.","col":["auto-reply","OOO message"],"rel":["OOO"]},{"t":"for your reference","p":"phrase","vi":"để bạn tham khảo","d":"Gửi thông tin để tham khảo, không cần hành động.","ex":[["I've attached last year's report for your reference.","Mình gửi kèm báo cáo năm ngoái để bạn tham khảo."]],"c":"Email.","col":["FYR"],"rel":["FYI"]},{"t":"kindly","p":"adv","vi":"vui lòng","d":"Dùng nhiều trong email châu Á. Người bản xứ thấy hơi trang trọng hoặc cứng; please tự nhiên hơn.","ex":[["Kindly confirm the delivery date.","Vui lòng xác nhận ngày giao."]],"c":"Email.","col":["please"],"rel":["Could you please"]},{"t":"confirm","p":"v","vi":"xác nhận","d":"Khẳng định thông tin là đúng hoặc đã đồng ý.","ex":[["Can you confirm the final price?","Bạn xác nhận giá cuối nhé?"]],"c":"Email, tin nhắn.","col":["confirmation","reconfirm"],"rel":["acknowledge"]},{"t":"clarify","p":"v","vi":"làm rõ","d":"Giải thích hoặc hỏi để rõ ràng hơn.","ex":[["Could you clarify what 'net GMV' includes?","Bạn làm rõ giúp “GMV thuần” gồm những gì?"]],"c":"Email, họp.","col":["clarification"],"rel":["Just to clarify"]}]},{"id":"negotiation","code":"NEGO","group":"Công việc","en":"Negotiation","vi":"Đàm phán","intro":"Từ vựng và mẫu câu khi thương lượng giá, deal, hợp đồng với brand, sàn, nhà cung cấp và KOL.","terms":[{"t":"negotiate","p":"v","vi":"đàm phán, thương lượng","d":"Trao đổi để đạt thỏa thuận có lợi. Danh từ: negotiation.","ex":[["We negotiated a 5% better commission.","Bọn mình thương lượng được hoa hồng tốt hơn 5%."]],"c":"Làm việc với đối tác.","col":["negotiate with","negotiation"],"rel":["counteroffer"]},{"t":"counteroffer","p":"n","vi":"đề nghị ngược lại","d":"Đề xuất đáp lại khi chưa đồng ý đề nghị ban đầu.","ex":[["The brand sent a counteroffer of 8%.","Brand đưa ra đề nghị ngược lại là 8%."]],"c":"Đàm phán.","col":["counter","make a counteroffer"],"rel":["negotiate"]},{"t":"leverage","p":"n, v","vi":"lợi thế đàm phán; tận dụng","d":"Lợi thế giúp có sức nặng khi thương lượng. Động từ: tận dụng.","ex":[["Our live GMV gives us leverage in the negotiation.","GMV live cho bọn mình lợi thế trong đàm phán."]],"c":"Đàm phán, chiến lược.","col":["bargaining power"],"rel":["negotiate"]},{"t":"compromise","p":"n, v","vi":"thỏa hiệp","d":"Mỗi bên nhượng bộ một phần để đạt thỏa thuận.","ex":[["Let's compromise at 7% commission.","Mình thỏa hiệp ở mức 7% hoa hồng nhé."]],"c":"Đàm phán.","col":["meet halfway"],"rel":["win-win"]},{"t":"meet halfway","p":"phrase","vi":"mỗi bên nhường một nửa","d":"Đi đến điểm giữa của hai đề nghị.","ex":[["Can we meet halfway on the shipping cost?","Mình chia đôi phí ship được không?"]],"c":"Đàm phán.","col":["split the difference"],"rel":["compromise"]},{"t":"win-win","p":"adj","vi":"đôi bên cùng có lợi","d":"Kết quả mà cả hai bên đều được lợi.","ex":[["This deal is a win-win for both teams.","Thỏa thuận này có lợi cho cả hai bên."]],"c":"Đàm phán, hợp tác.","col":["mutually beneficial"],"rel":["partnership"]},{"t":"concession","p":"n","vi":"sự nhượng bộ","d":"Điều mình chấp nhận nhường để đổi lấy điều khác.","ex":[["We'll make a concession on price if you extend the contract.","Bên mình nhượng về giá nếu bên bạn gia hạn hợp đồng."]],"c":"Đàm phán.","col":["make a concession"],"rel":["compromise"]},{"t":"deal breaker","p":"n","vi":"điều kiện tiên quyết (không thì hủy)","d":"Điều kiện nếu không đạt thì không thể hợp tác.","ex":[["Exclusivity is a deal breaker for us.","Độc quyền là điều kiện bắt buộc với bên mình."]],"c":"Đàm phán.","col":["non-negotiable"],"rel":["bottom line"]},{"t":"non-negotiable","p":"adj","vi":"không thể thương lượng","d":"Điều kiện cố định, không thay đổi.","ex":[["The price floor is non-negotiable.","Giá sàn là không thể thương lượng."]],"c":"Đàm phán.","col":["fixed"],"rel":["deal breaker"]},{"t":"walk-away point","p":"n","vi":"điểm dừng đàm phán","d":"Mức tệ nhất mình chấp nhận; vượt qua thì rút lui.","ex":[["Our walk-away point is 6% commission.","Điểm dừng của mình là 6% hoa hồng."]],"c":"Chuẩn bị đàm phán.","col":["reservation price"],"rel":["BATNA"]},{"t":"BATNA","p":"abbr","vi":"phương án thay thế tốt nhất","d":"Lựa chọn tốt nhất nếu đàm phán thất bại. BATNA mạnh thì đàm phán mạnh.","ex":[["Our BATNA is to work with the other brand.","Phương án thay thế của mình là làm với brand kia."]],"f":"Best Alternative To a Negotiated Agreement","c":"Chuẩn bị đàm phán.","col":["alternative"],"rel":["walk-away point","leverage"]},{"t":"terms","p":"n","vi":"điều khoản","d":"Các điều kiện của thỏa thuận: giá, thời hạn, thanh toán.","ex":[["We agreed on the terms of the partnership.","Đã thống nhất điều khoản hợp tác."]],"c":"Đàm phán, hợp đồng.","col":["agree on terms","favorable terms"],"rel":["contract","clause"]},{"t":"volume discount","p":"n","vi":"chiết khấu theo số lượng","d":"Giảm giá khi đặt số lượng lớn.","ex":[["Can we get a volume discount for 20 sessions?","Bên mình đặt 20 phiên thì có chiết khấu không?"]],"c":"Đàm phán với nhà cung cấp, KOL.","col":["bulk discount"],"rel":["tiered discount","MOQ"]},{"t":"budget constraint","p":"n","vi":"giới hạn ngân sách","d":"Ngân sách có hạn khiến không thể chi thêm.","ex":[["Due to budget constraints, we can only book two KOLs.","Do giới hạn ngân sách, chỉ book được hai KOL."]],"c":"Đàm phán, từ chối.","col":["limited budget","tight budget"],"rel":["budget"]},{"t":"flexible","p":"adj","vi":"linh hoạt","d":"Có thể điều chỉnh.","ex":[["We're flexible on the dates but not on the price.","Bên mình linh hoạt về ngày nhưng không về giá."]],"c":"Đàm phán.","col":["flexibility"],"rel":["compromise"]},{"t":"What if we","p":"pattern","vi":"Hay là chúng ta","d":"Mở đầu đề xuất phương án trong đàm phán.","ex":[["What if we add two more sessions for the same fee?","Hay mình thêm hai phiên với cùng mức phí?"]],"c":"Đàm phán.","col":["how about","would you consider"],"rel":["counteroffer"]},{"t":"Would you be open to","p":"pattern","vi":"Bên bạn có sẵn lòng","d":"Hỏi mềm mỏng xem đối phương có chấp nhận ý tưởng không.","ex":[["Would you be open to a performance-based fee?","Bên bạn có sẵn lòng tính phí theo hiệu quả không?"]],"c":"Đàm phán.","col":["are you open to"],"rel":["What if we"]},{"t":"That's the best we can do","p":"pattern","vi":"Đó là mức tốt nhất bên tôi có thể","d":"Báo đây là đề nghị cuối.","ex":[["That's the best we can do on price this month.","Đó là mức giá tốt nhất bên mình có thể trong tháng này."]],"c":"Đàm phán.","col":["final offer"],"rel":["non-negotiable"]},{"t":"final offer","p":"n","vi":"đề nghị cuối cùng","d":"Lời đề nghị không thay đổi thêm.","ex":[["This is our final offer.","Đây là đề nghị cuối cùng của bên mình."]],"c":"Đàm phán.","col":["best and final"],"rel":["That's the best we can do"]},{"t":"in principle","p":"phrase","vi":"về nguyên tắc","d":"Đồng ý ý tưởng chung, còn chờ chi tiết.","ex":[["We agree in principle, let's work on the details.","Về nguyên tắc bên mình đồng ý, giờ bàn chi tiết."]],"c":"Đàm phán, họp.","col":["agree in principle"],"rel":["alignment"]},{"t":"MOU","p":"abbr","vi":"biên bản ghi nhớ","d":"Văn bản ghi nhận ý định hợp tác trước khi ký hợp đồng chính thức.","ex":[["We signed an MOU with the platform.","Đã ký biên bản ghi nhớ với sàn."]],"f":"Memorandum Of Understanding","c":"Hợp tác chiến lược.","col":["LOI (letter of intent)"],"rel":["contract"]},{"t":"trial period","p":"n","vi":"giai đoạn thử nghiệm","d":"Thời gian hợp tác thử trước khi cam kết dài hạn.","ex":[["Let's start with a one-month trial period.","Bắt đầu với một tháng thử nghiệm nhé."]],"c":"Đàm phán hợp tác mới.","col":["pilot","trial run"],"rel":["partnership"]},{"t":"pilot","p":"n, adj","vi":"thí điểm","d":"Chạy thử quy mô nhỏ trước khi mở rộng.","ex":[["We'll pilot live sessions on Lazada first.","Thí điểm live trên Lazada trước."]],"c":"Dự án mới.","col":["pilot project","pilot program"],"rel":["trial period"]},{"t":"talking point (negotiation)","p":"n","vi":"luận điểm đàm phán","d":"Ý chính chuẩn bị sẵn để thuyết phục đối tác.","ex":[["Our main talking point is last month's ROAS.","Luận điểm chính là ROAS tháng trước."]],"c":"Chuẩn bị đàm phán.","col":["key argument"],"rel":["leverage"]},{"t":"anchor high","p":"phrase","vi":"đưa mức đầu cao","d":"Chiến thuật đưa đề nghị đầu tiên cao để có chỗ nhượng bộ.","ex":[["Anchor high on the fee, then offer a bonus option.","Đưa phí ban đầu cao, rồi đề xuất thêm phương án thưởng."]],"c":"Đàm phán.","col":["opening offer"],"rel":["counteroffer","anchoring effect"]}]},{"id":"pm","code":"PM","group":"Công việc","en":"Project Management","vi":"Quản lý dự án","intro":"Lên kế hoạch, theo dõi tiến độ và phối hợp nhiều team cho chiến dịch hoặc dự án.","terms":[{"t":"project","p":"n","vi":"dự án","d":"Công việc có mục tiêu, thời hạn và nguồn lực riêng.","ex":[["The 11.11 project kicks off next week.","Dự án 11.11 khởi động tuần sau."]],"c":"Nói chung.","col":["project plan","project manager"],"rel":["campaign"]},{"t":"project manager","p":"n","vi":"quản lý dự án","d":"Người lập kế hoạch, điều phối và theo dõi dự án tới khi hoàn thành.","ex":[["The PM tracks every task in the project board.","Quản lý dự án theo dõi mọi đầu việc trên bảng dự án."]],"f":"PM","c":"Phân vai.","col":["PM"],"rel":["owner"]},{"t":"timeline","p":"n","vi":"mốc thời gian","d":"Lịch các mốc quan trọng của dự án.","ex":[["Here's the timeline for the launch campaign.","Đây là mốc thời gian chiến dịch ra mắt."]],"c":"Lập kế hoạch.","col":["project timeline","tight timeline"],"rel":["milestone","deadline"]},{"t":"milestone","p":"n","vi":"cột mốc","d":"Mốc quan trọng đánh dấu một giai đoạn hoàn thành.","ex":[["The first milestone is the approved script.","Cột mốc đầu tiên là kịch bản được duyệt."]],"c":"Theo dõi dự án.","col":["key milestone","hit a milestone"],"rel":["timeline"]},{"t":"scope","p":"n","vi":"phạm vi","d":"Những gì nằm trong dự án.","ex":[["Influencer content is out of scope.","Nội dung KOL nằm ngoài phạm vi."]],"c":"Lập kế hoạch.","col":["in scope","out of scope"],"rel":["SOW","scope creep"]},{"t":"dependency","p":"n","vi":"sự phụ thuộc","d":"Một việc chỉ làm được khi việc khác đã xong.","ex":[["The live depends on stock arriving, that's our main dependency.","Live phụ thuộc vào hàng về, đó là phụ thuộc chính."]],"c":"Lập kế hoạch.","col":["depend on","dependencies"],"rel":["blocker"]},{"t":"critical path","p":"n","vi":"đường găng","d":"Chuỗi việc dài nhất quyết định thời gian hoàn thành dự án; trễ một việc ở đây là trễ cả dự án.","ex":[["Brand approval is on the critical path.","Bước brand duyệt nằm trên đường găng."]],"c":"Quản lý dự án.","col":["critical path method"],"rel":["dependency"]},{"t":"Gantt chart","p":"n","vi":"biểu đồ Gantt","d":"Biểu đồ thanh ngang thể hiện các việc theo thời gian.","ex":[["Update the Gantt chart after the delay.","Cập nhật biểu đồ Gantt sau khi bị trễ."]],"c":"Lập kế hoạch.","col":["timeline view"],"rel":["timeline"]},{"t":"RACI","p":"abbr","vi":"ma trận RACI","d":"Phân vai cho mỗi việc: Responsible (người làm), Accountable (người chịu trách nhiệm cuối), Consulted (người được hỏi ý kiến), Informed (người được thông báo).","ex":[["Fill in the RACI so everyone knows their role.","Điền ma trận RACI để mọi người biết vai trò."]],"c":"Phân công dự án.","col":["RACI matrix"],"rel":["responsibility","accountable"]},{"t":"kanban","p":"n","vi":"bảng Kanban","d":"Bảng công việc chia cột To do, Doing, Done.","ex":[["Move the card to Done when it's finished.","Xong thì kéo thẻ sang cột Done."]],"c":"Theo dõi việc.","col":["kanban board","To do / Doing / Done"],"rel":["task"]},{"t":"task","p":"n","vi":"đầu việc","d":"Một việc cụ thể cần làm.","ex":[["Assign each task to one owner.","Giao mỗi việc cho một người phụ trách."]],"c":"Quản lý việc.","col":["assign a task","subtask"],"rel":["action items","owner"]},{"t":"assign","p":"v","vi":"giao (việc)","d":"Phân công việc cho ai đó.","ex":[["I've assigned the banner to the designer.","Mình đã giao banner cho designer."]],"c":"Quản lý việc.","col":["assignee"],"rel":["delegate","task"]},{"t":"status","p":"n","vi":"trạng thái","d":"Tình trạng hiện tại của một việc: not started, in progress, done, on hold.","ex":[["What's the status of the voucher setup?","Việc cài voucher đang thế nào?"]],"c":"Theo dõi việc.","col":["in progress","on hold","done"],"rel":["status update"]},{"t":"on hold","p":"adj","vi":"tạm dừng","d":"Tạm hoãn, chưa làm tiếp.","ex":[["The KOL booking is on hold until the budget is approved.","Việc book KOL tạm dừng đến khi duyệt ngân sách."]],"c":"Theo dõi việc.","col":["put on hold"],"rel":["status"]},{"t":"risk","p":"n","vi":"rủi ro","d":"Điều có thể xảy ra gây ảnh hưởng xấu tới dự án.","ex":[["The biggest risk is stock arriving late.","Rủi ro lớn nhất là hàng về muộn."]],"c":"Quản lý dự án.","col":["risk assessment","mitigate"],"rel":["contingency plan"]},{"t":"mitigate","p":"v","vi":"giảm thiểu (rủi ro)","d":"Làm giảm khả năng hoặc mức ảnh hưởng của rủi ro.","ex":[["To mitigate the risk, we'll keep a backup host.","Để giảm rủi ro, mình giữ một host dự phòng."]],"c":"Quản lý rủi ro.","col":["risk mitigation"],"rel":["risk"]},{"t":"contingency plan","p":"n","vi":"kế hoạch dự phòng","d":"Phương án B khi có sự cố.","ex":[["What's our contingency plan if the internet goes down?","Kế hoạch dự phòng nếu mất mạng là gì?"]],"c":"Chuẩn bị chiến dịch.","col":["plan B","backup plan"],"rel":["risk","backup connection"]},{"t":"resource","p":"n","vi":"nguồn lực","d":"Người, tiền, thời gian, công cụ cho dự án.","ex":[["We don't have enough resources for two campaigns.","Không đủ nguồn lực cho hai chiến dịch."]],"c":"Lập kế hoạch.","col":["resource allocation"],"rel":["capacity","headcount"]},{"t":"retrospective","p":"n","vi":"họp nhìn lại","d":"Họp cuối giai đoạn để xem điều gì tốt, chưa tốt, cần cải thiện. Viết tắt retro.","ex":[["In the retrospective, we agreed to start prep earlier.","Ở buổi nhìn lại, mọi người thống nhất chuẩn bị sớm hơn."]],"c":"Sau dự án.","col":["retro"],"rel":["post-mortem"]},{"t":"sprint","p":"n","vi":"chu kỳ làm việc ngắn","d":"Khoảng 1 đến 2 tuần với mục tiêu cố định, từ phương pháp Agile.","ex":[["This sprint focuses on the new storefront.","Chu kỳ này tập trung vào trang shop mới."]],"c":"Làm việc theo Agile.","col":["sprint planning","agile"],"rel":["retrospective"]},{"t":"agile","p":"adj","vi":"linh hoạt (phương pháp Agile)","d":"Cách làm chia nhỏ, làm nhanh, thường xuyên điều chỉnh.","ex":[["We work in an agile way during campaigns.","Trong chiến dịch, bọn mình làm việc kiểu linh hoạt."]],"c":"Mô tả cách làm việc.","col":["agile methodology"],"rel":["sprint"]},{"t":"iterate","p":"v","vi":"lặp lại cải tiến","d":"Làm, đánh giá, sửa rồi làm lại để tốt dần.","ex":[["Let's iterate on the script after each live.","Sau mỗi live mình sửa và cải tiến kịch bản."]],"c":"Cải tiến nội dung, kịch bản.","col":["iteration"],"rel":["A/B test"]},{"t":"go/no-go","p":"n","vi":"quyết định làm hay không","d":"Thời điểm quyết định có tiến hành hay không.","ex":[["Go/no-go meeting is at 5 PM.","Họp quyết định chạy hay không lúc 5 giờ."]],"c":"Trước ra mắt.","col":["go-live decision"],"rel":["milestone"]}]},{"id":"career","code":"CAREER","group":"Công việc","en":"HR, Career & Performance","vi":"Nhân sự, nghề nghiệp và đánh giá","intro":"Từ vựng tuyển dụng, phỏng vấn, đánh giá hiệu suất và phát triển nghề nghiệp, gồm cả cách giới thiệu công việc Operation Livestream bằng tiếng Anh.","terms":[{"t":"job description","p":"n","vi":"mô tả công việc","d":"Tài liệu nêu nhiệm vụ, yêu cầu của một vị trí.","ex":[["The JD for live operator includes real-time data monitoring.","Mô tả công việc vị trí vận hành live có theo dõi số liệu thời gian thực."]],"f":"JD","c":"Tuyển dụng.","col":["JD","requirements"],"rel":["live operator"]},{"t":"resume","p":"n","vi":"sơ yếu lý lịch, CV","d":"Hồ sơ tóm tắt kinh nghiệm, kỹ năng. Anh Anh hay dùng CV.","ex":[["Highlight your GMV results on your resume.","Nêu kết quả GMV trong CV."]],"c":"Ứng tuyển.","col":["CV","cover letter"],"rel":["job description"]},{"t":"cover letter","p":"n","vi":"thư xin việc","d":"Thư gửi kèm CV giải thích vì sao bạn phù hợp.","ex":[["Write a short cover letter for the agency role.","Viết thư xin việc ngắn cho vị trí ở agency."]],"c":"Ứng tuyển.","col":["application letter"],"rel":["resume"]},{"t":"job interview","p":"n","vi":"phỏng vấn xin việc","d":"Buổi trao đổi giữa ứng viên và nhà tuyển dụng.","ex":[["Prepare examples of live campaigns for the job interview.","Chuẩn bị ví dụ các chiến dịch live cho buổi phỏng vấn."]],"c":"Ứng tuyển.","col":["interview","interviewer"],"rel":["Tell me about yourself"]},{"t":"Tell me about yourself","p":"pattern","vi":"Hãy giới thiệu về bản thân","d":"Câu hỏi mở đầu phổ biến khi phỏng vấn.","ex":[["I've worked in live commerce operations for three years, managing 20 sessions a week.","Tôi làm vận hành livestream bán hàng ba năm, quản lý 20 phiên mỗi tuần."]],"c":"Phỏng vấn.","col":["elevator pitch"],"rel":["job interview"]},{"t":"achievement","p":"n","vi":"thành tích","d":"Kết quả nổi bật đạt được, nên có số liệu.","ex":[["My biggest achievement was growing live GMV by 150%.","Thành tích lớn nhất là tăng GMV live 150%."]],"c":"CV, đánh giá.","col":["key achievement","accomplishment"],"rel":["resume"]},{"t":"transferable skills","p":"n","vi":"kỹ năng chuyển đổi","d":"Kỹ năng dùng được ở nhiều công việc: giao tiếp, phân tích, quản lý thời gian.","ex":[["Data analysis is a transferable skill from live ops.","Phân tích dữ liệu là kỹ năng chuyển đổi từ vận hành live."]],"c":"Chuyển ngành, CV.","col":["soft skills","hard skills"],"rel":["resume"]},{"t":"soft skills","p":"n","vi":"kỹ năng mềm","d":"Kỹ năng con người: giao tiếp, làm việc nhóm, giải quyết vấn đề. Hard skills là kỹ năng chuyên môn.","ex":[["Live ops needs strong soft skills under pressure.","Vận hành live cần kỹ năng mềm tốt khi chịu áp lực."]],"c":"CV, đánh giá.","col":["hard skills","interpersonal skills"],"rel":["transferable skills"]},{"t":"probation","p":"n","vi":"thử việc","d":"Thời gian thử việc trước khi ký hợp đồng chính thức.","ex":[["The probation period is two months.","Thời gian thử việc là hai tháng."]],"c":"Nhân sự.","col":["probation period","pass probation"],"rel":["onboarding"]},{"t":"performance review","p":"n","vi":"đánh giá hiệu suất","d":"Buổi đánh giá kết quả làm việc định kỳ.","ex":[["My performance review is next Tuesday.","Buổi đánh giá hiệu suất của mình vào thứ Ba tới."]],"c":"Nhân sự.","col":["appraisal","annual review"],"rel":["KPI","feedback"]},{"t":"appraisal","p":"n","vi":"đánh giá năng lực","d":"Đánh giá nhân viên định kỳ, thường gắn với tăng lương.","ex":[["The annual appraisal decides the salary increase.","Đánh giá hằng năm quyết định mức tăng lương."]],"c":"Nhân sự.","col":["self-appraisal"],"rel":["performance review"]},{"t":"self-assessment","p":"n","vi":"tự đánh giá","d":"Nhân viên tự đánh giá kết quả của mình trước buổi đánh giá.","ex":[["Fill in your self-assessment before Friday.","Điền phần tự đánh giá trước thứ Sáu."]],"c":"Nhân sự.","col":["self-evaluation"],"rel":["performance review"]},{"t":"career path","p":"n","vi":"lộ trình nghề nghiệp","d":"Các bước phát triển nghề nghiệp, ví dụ từ live operator lên live ops lead rồi head of live commerce.","ex":[["What's the career path for a live operator?","Lộ trình nghề nghiệp của người vận hành live là gì?"]],"c":"Phát triển bản thân.","col":["career progression","career ladder"],"rel":["get promoted"]},{"t":"get promoted","p":"v","vi":"được thăng chức","d":"Được nâng lên vị trí cao hơn. Danh từ là promotion, lưu ý promotion còn nghĩa khuyến mãi.","ex":[["She got a promotion to live ops lead.","Cô ấy được thăng chức lên trưởng vận hành live."]],"c":"Nhân sự.","col":["promotion"],"rel":["career path"]},{"t":"salary","p":"n","vi":"lương","d":"Tiền lương cố định. Package là tổng đãi ngộ (lương, thưởng, phúc lợi).","ex":[["The salary is negotiable based on experience.","Lương thương lượng theo kinh nghiệm."]],"c":"Nhân sự.","col":["salary range","package","raise"],"rel":["bonus"]},{"t":"bonus","p":"n","vi":"tiền thưởng","d":"Khoản thưởng thêm ngoài lương.","ex":[["We get a bonus if the team hits the quarterly target.","Có thưởng nếu team đạt chỉ tiêu quý."]],"c":"Nhân sự.","col":["year-end bonus","KPI bonus"],"rel":["performance bonus"]},{"t":"benefits","p":"n","vi":"phúc lợi","d":"Quyền lợi ngoài lương: bảo hiểm, nghỉ phép, đào tạo.","ex":[["Benefits include health insurance and 15 days of leave.","Phúc lợi gồm bảo hiểm sức khỏe và 15 ngày phép."]],"c":"Tuyển dụng.","col":["perks","benefits package"],"rel":["salary"]},{"t":"annual leave","p":"n","vi":"nghỉ phép năm","d":"Số ngày nghỉ có lương mỗi năm. Sick leave là nghỉ ốm.","ex":[["I'd like to take two days of annual leave.","Mình muốn xin nghỉ phép hai ngày."]],"c":"Nhân sự.","col":["sick leave","day off","leave request"],"rel":["OOO"]},{"t":"overtime","p":"n","vi":"làm thêm giờ","d":"Làm ngoài giờ quy định.","ex":[["Mega sale weeks always involve overtime.","Tuần siêu sale luôn phải làm thêm giờ."]],"f":"OT","c":"Lịch làm việc, mùa sale.","col":["OT","work overtime"],"rel":["shift"]},{"t":"work-life balance","p":"n","vi":"cân bằng công việc và cuộc sống","d":"Sự cân đối giữa thời gian làm việc và đời sống cá nhân.","ex":[["Night lives make work-life balance hard.","Live đêm khiến khó cân bằng công việc và cuộc sống."]],"c":"Văn hóa công ty.","col":["balance"],"rel":["burnout"]},{"t":"resign","p":"v","vi":"nghỉ việc","d":"Chủ động thôi việc. Danh từ resignation; notice period là thời gian báo trước.","ex":[["She resigned to join a bigger agency.","Cô ấy nghỉ việc để sang agency lớn hơn."]],"c":"Nhân sự.","col":["resignation letter","notice period"],"rel":["termination"]},{"t":"upskill","p":"v","vi":"nâng cao kỹ năng","d":"Học thêm kỹ năng mới để làm tốt hơn.","ex":[["The team is upskilling in data analysis.","Team đang học thêm phân tích dữ liệu."]],"c":"Phát triển.","col":["reskill","learning and development"],"rel":["coaching"]},{"t":"mentor","p":"n, v","vi":"người hướng dẫn, cố vấn","d":"Người có kinh nghiệm hướng dẫn người khác phát triển.","ex":[["Each new host has a mentor for the first month.","Mỗi host mới có một người hướng dẫn trong tháng đầu."]],"c":"Phát triển.","col":["mentorship","mentee"],"rel":["coaching"]},{"t":"team building","p":"n","vi":"hoạt động gắn kết đội nhóm","d":"Hoạt động giúp team gắn kết hơn.","ex":[["Our team building trip is after the 12.12 campaign.","Chuyến team building sau chiến dịch 12.12."]],"c":"Văn hóa.","col":["team bonding"],"rel":[]},{"t":"company culture","p":"n","vi":"văn hóa công ty","d":"Giá trị, cách làm việc, ứng xử chung trong công ty.","ex":[["What's the company culture like?","Văn hóa công ty như thế nào?"]],"c":"Tuyển dụng, phỏng vấn.","col":["work culture","values"],"rel":["team building"]},{"t":"job title","p":"n","vi":"chức danh","d":"Tên vị trí công việc.","ex":[["My job title is Live Commerce Operations Executive.","Chức danh của tôi là Chuyên viên vận hành live commerce."]],"c":"Hồ sơ, giới thiệu.","col":["position","role"],"rel":["job description"]},{"t":"Live Ops Executive","p":"n","vi":"chuyên viên vận hành live","d":"Chức danh phổ biến cho người vận hành phiên live. Cấp cao hơn: Senior, Lead, Manager, Head of Live Commerce.","ex":[["I'm a Live Ops Executive managing three brand accounts.","Tôi là chuyên viên vận hành live, quản lý ba tài khoản brand."]],"c":"Giới thiệu công việc.","col":["Senior Executive","Team Lead","Head of"],"rel":["job title","career path"]},{"t":"key responsibilities","p":"n","vi":"trách nhiệm chính","d":"Các nhiệm vụ chính của một vị trí, thường liệt kê trong CV và JD.","ex":[["Key responsibilities: run of show, real-time monitoring, post-live reports.","Trách nhiệm chính: kịch bản chạy live, giám sát thời gian thực, báo cáo sau live."]],"c":"CV, phỏng vấn.","col":["duties"],"rel":["job description"]}]},{"id":"meeting","code":"MEET","group":"Công việc","en":"Meetings & Presentations","vi":"Họp và thuyết trình","intro":"Mẫu câu điều phối cuộc họp, góp ý, trình bày slide và trả lời câu hỏi bằng tiếng Anh.","terms":[{"t":"Let's get started","p":"pattern","vi":"Chúng ta bắt đầu nhé","d":"Câu mở đầu cuộc họp.","ex":[["Let's get started, we have 30 minutes.","Mình bắt đầu nhé, có 30 phút."]],"c":"Mở họp.","col":["shall we begin"],"rel":["agenda"]},{"t":"The purpose of this meeting is","p":"pattern","vi":"Mục đích cuộc họp này là","d":"Nêu rõ mục tiêu ngay đầu buổi.","ex":[["The purpose of this meeting is to finalize the 11.11 deals.","Mục đích cuộc họp là chốt deal 11.11."]],"c":"Mở họp.","col":["today's goal"],"rel":["agenda"]},{"t":"Let's move on to","p":"pattern","vi":"Chuyển sang phần","d":"Chuyển chủ đề trong cuộc họp.","ex":[["Let's move on to the ad budget.","Chuyển sang phần ngân sách quảng cáo."]],"c":"Điều phối họp.","col":["next item","moving on"],"rel":["agenda"]},{"t":"Can I add something","p":"pattern","vi":"Cho tôi bổ sung một chút","d":"Xin phép góp ý khi người khác đang nói.","ex":[["Can I add something here? The stock is also limited.","Cho mình bổ sung: hàng cũng có hạn."]],"c":"Tham gia họp.","col":["if I may","sorry to interrupt"],"rel":["From my perspective"]},{"t":"Sorry to interrupt","p":"pattern","vi":"Xin lỗi cắt ngang","d":"Ngắt lời lịch sự.","ex":[["Sorry to interrupt, but the brand is on the line now.","Xin lỗi cắt ngang, brand đang gọi."]],"c":"Họp.","col":["may I jump in"],"rel":["Can I add something"]},{"t":"I see your point, but","p":"pattern","vi":"Tôi hiểu ý bạn, nhưng","d":"Phản biện mềm mỏng.","ex":[["I see your point, but a deeper discount will hurt margin.","Mình hiểu ý bạn, nhưng giảm sâu hơn sẽ ảnh hưởng biên lợi nhuận."]],"c":"Thảo luận, bất đồng.","col":["I understand, however"],"rel":["push back"]},{"t":"I agree with","p":"pattern","vi":"Tôi đồng ý với","d":"Bày tỏ đồng tình.","ex":[["I agree with Linh, let's test the new hook first.","Mình đồng ý với Linh, thử câu mở mới trước."]],"c":"Thảo luận.","col":["exactly","fair point"],"rel":["alignment"]},{"t":"That's a fair point","p":"pattern","vi":"Ý đó hợp lý","d":"Công nhận ý kiến của người khác.","ex":[["That's a fair point, we didn't consider shipping costs.","Ý đó hợp lý, mình chưa tính phí ship."]],"c":"Thảo luận.","col":["good point"],"rel":["I agree with"]},{"t":"Let's take this offline","p":"pattern","vi":"Mình bàn riêng sau","d":"Đề nghị trao đổi vấn đề chi tiết ngoài cuộc họp chung.","ex":[["Let's take this offline and not hold up the meeting.","Mình bàn riêng sau để không kéo dài cuộc họp."]],"c":"Điều phối họp.","col":["discuss separately"],"rel":["parking lot"]},{"t":"To sum up","p":"pattern","vi":"Tóm lại","d":"Mở đầu phần tổng kết.","ex":[["To sum up, we'll go live at 8 with three flash sales.","Tóm lại, mình live lúc 8 giờ với ba flash sale."]],"c":"Kết thúc họp, thuyết trình.","col":["in summary","to wrap up"],"rel":["recap"]},{"t":"Does that make sense","p":"pattern","vi":"Như vậy có rõ không","d":"Kiểm tra người nghe đã hiểu chưa.","ex":[["We pin the product first, then drop the voucher. Does that make sense?","Ghim sản phẩm trước rồi mới thả voucher. Như vậy rõ chưa?"]],"c":"Giải thích, đào tạo.","col":["any questions"],"rel":["Just to clarify"]},{"t":"Any questions","p":"pattern","vi":"Có câu hỏi gì không","d":"Mời đặt câu hỏi.","ex":[["That's all from me. Any questions?","Mình trình bày xong. Có câu hỏi gì không?"]],"c":"Kết thuyết trình.","col":["questions so far"],"rel":["Q&A"]},{"t":"You're on mute","p":"pattern","vi":"Bạn đang tắt mic","d":"Câu kinh điển khi họp online.","ex":[["Sorry Minh, you're on mute.","Minh ơi, bạn đang tắt mic."]],"c":"Họp online.","col":["unmute","can you hear me"],"rel":["mute"]},{"t":"Can you see my screen","p":"pattern","vi":"Bạn có thấy màn hình tôi không","d":"Hỏi khi chia sẻ màn hình.","ex":[["Can you see my screen? I'm sharing the dashboard.","Mọi người thấy màn hình chưa? Mình đang chia sẻ bảng số liệu."]],"c":"Họp online.","col":["share my screen"],"rel":["screen sharing"]},{"t":"screen sharing","p":"n","vi":"chia sẻ màn hình","d":"Cho người khác xem màn hình mình trong cuộc họp online.","ex":[["Turn off notifications before screen sharing.","Tắt thông báo trước khi chia sẻ màn hình."]],"c":"Họp online.","col":["share screen"],"rel":["Can you see my screen"]},{"t":"video call","p":"n","vi":"cuộc gọi video","d":"Họp qua Google Meet, Zoom, Teams.","ex":[["Let's jump on a quick video call.","Gọi video nhanh nhé."]],"c":"Họp online.","col":["jump on a call","Zoom","Google Meet"],"rel":["sync"]},{"t":"presentation","p":"n","vi":"bài thuyết trình","d":"Trình bày nội dung trước người nghe, thường có slide. Deck là bộ slide.","ex":[["I'll walk you through the presentation.","Mình sẽ trình bày qua bài thuyết trình."]],"c":"Báo cáo, pitch.","col":["deck","slides","present"],"rel":["pitch"]},{"t":"walk you through","p":"phrase","vi":"trình bày từng bước","d":"Giải thích lần lượt từng phần.","ex":[["Let me walk you through last month's results.","Để mình trình bày từng phần kết quả tháng trước."]],"c":"Thuyết trình, đào tạo.","col":["walk through"],"rel":["presentation"]},{"t":"slide deck","p":"n","vi":"bộ slide","d":"Tập slide thuyết trình.","ex":[["Send the slide deck after the meeting.","Gửi bộ slide sau cuộc họp nhé."]],"c":"Thuyết trình.","col":["deck","slides"],"rel":["presentation"]},{"t":"As you can see","p":"pattern","vi":"Như các bạn có thể thấy","d":"Dẫn người nghe vào biểu đồ, số liệu.","ex":[["As you can see, GMV peaked on Saturday.","Như mọi người thấy, GMV cao nhất vào thứ Bảy."]],"c":"Thuyết trình số liệu.","col":["this chart shows"],"rel":["presentation"]},{"t":"This chart shows","p":"pattern","vi":"Biểu đồ này cho thấy","d":"Giới thiệu biểu đồ.","ex":[["This chart shows GMV by hour.","Biểu đồ này cho thấy GMV theo giờ."]],"c":"Thuyết trình số liệu.","col":["as you can see"],"rel":["As you can see"]},{"t":"I'll hand over to","p":"pattern","vi":"Tôi xin chuyển lời cho","d":"Chuyển phần trình bày cho người khác.","ex":[["I'll hand over to Lan for the ads results.","Mình chuyển lời cho Lan trình bày kết quả quảng cáo."]],"c":"Thuyết trình nhóm.","col":["over to you"],"rel":["presentation"]},{"t":"That's a good question","p":"pattern","vi":"Câu hỏi hay","d":"Câu mở khi trả lời, cho mình thêm thời gian suy nghĩ.","ex":[["That's a good question. Let me check the data.","Câu hỏi hay. Để mình kiểm tra số liệu."]],"c":"Trả lời câu hỏi.","col":["great question"],"rel":["Let me double-check"]},{"t":"I don't have that number right now","p":"pattern","vi":"Tôi chưa có số đó ngay lúc này","d":"Thừa nhận chưa có số và hẹn gửi sau.","ex":[["I don't have that number right now, I'll send it after the call.","Mình chưa có số đó, sau cuộc gọi mình gửi."]],"c":"Trả lời câu hỏi khó.","col":["I'll follow up"],"rel":["I'll get back to you on"]},{"t":"Let's wrap up","p":"pattern","vi":"Chúng ta kết thúc nhé","d":"Báo hiệu kết thúc cuộc họp.","ex":[["Let's wrap up, thanks everyone.","Mình kết thúc nhé, cảm ơn mọi người."]],"c":"Kết họp.","col":["we're out of time"],"rel":["wrap-up"]},{"t":"brainstorm","p":"v, n","vi":"động não, nghĩ ý tưởng","d":"Cùng nhau đưa ra nhiều ý tưởng mà chưa đánh giá ngay.","ex":[["Let's brainstorm themes for the Tet live.","Cùng nghĩ chủ đề cho live Tết."]],"c":"Họp sáng tạo.","col":["brainstorming session"],"rel":[]},{"t":"consensus","p":"n","vi":"sự đồng thuận","d":"Mọi người cùng đồng ý.","ex":[["We reached a consensus on the host lineup.","Đã đồng thuận về danh sách host."]],"c":"Ra quyết định.","col":["reach consensus"],"rel":["alignment"]}]},{"id":"numbers","code":"NUM","group":"Công việc","en":"Numbers & Business Math Talk","vi":"Đọc số và nói về số liệu","intro":"Cách đọc và viết số, phần trăm, tiền, khoảng giá trị và các phép tính hay dùng khi báo cáo bằng tiếng Anh.","terms":[{"t":"thousand","p":"n","vi":"nghìn","d":"1.000. Viết tắt k trong văn nói và tin nhắn: 199k là 199 nghìn.","ex":[["It's 199k, one hundred ninety-nine thousand dong.","Giá 199k, tức một trăm chín mươi chín nghìn đồng."]],"f":"k","c":"Đọc giá.","col":["k","grand"],"rel":["million"]},{"t":"million","p":"n","vi":"triệu","d":"1.000.000. Viết tắt M hoặc mn: 5M là 5 triệu.","ex":[["Last night's GMV was 850 million VND.","GMV tối qua là 850 triệu đồng."]],"f":"M / mn","c":"Báo cáo doanh thu.","col":["M","mn"],"rel":["billion","thousand"]},{"t":"billion","p":"n","vi":"tỷ","d":"1.000.000.000. Viết tắt B hoặc bn: 2.5B là 2,5 tỷ.","ex":[["Our monthly GMV passed 3 billion VND.","GMV tháng vượt 3 tỷ đồng."]],"f":"B / bn","c":"Báo cáo doanh thu.","col":["B","bn"],"rel":["million"]},{"t":"decimal point","p":"n","vi":"dấu thập phân","d":"Tiếng Anh dùng dấu chấm cho thập phân và dấu phẩy để ngăn nghìn, ngược với tiếng Việt: 1,250.5 là một nghìn hai trăm năm mươi phẩy năm.","ex":[["Write 3.5% with a decimal point, not 3,5%.","Viết 3.5% bằng dấu chấm, không viết 3,5%."]],"c":"Viết số trong báo cáo tiếng Anh.","col":["point","comma separator"],"rel":["percent"],"tip":"Viết số kiểu Anh khi gửi đối tác nước ngoài để tránh nhầm 1,000 (một nghìn) thành 1 phẩy."},{"t":"percent","p":"n","vi":"phần trăm","d":"Đọc 25% là twenty-five percent. Percentage là danh từ chung chỉ tỉ lệ phần trăm.","ex":[["Conversion increased by two percent.","Chuyển đổi tăng hai phần trăm."]],"c":"Báo cáo.","col":["percentage","per cent"],"rel":["percentage point"]},{"t":"double","p":"v, adj","vi":"gấp đôi","d":"Tăng lên hai lần. Triple là gấp ba, quadruple là gấp bốn.","ex":[["GMV doubled compared to last week.","GMV gấp đôi so với tuần trước."]],"c":"Mô tả tăng trưởng.","col":["triple","twofold"],"rel":["growth rate"]},{"t":"halve","p":"v","vi":"giảm một nửa","d":"Giảm còn 50%. Danh từ là half.","ex":[["We halved the ad cost per order.","Mình giảm một nửa chi phí quảng cáo mỗi đơn."]],"c":"Mô tả giảm.","col":["cut in half"],"rel":["double"]},{"t":"times","p":"n","vi":"lần (gấp bao nhiêu lần)","d":"Dùng để so sánh: 3 times higher là cao gấp 3 lần. Viết tắt x: 3x.","ex":[["Live GMV is 3 times higher than video GMV.","GMV live cao gấp 3 lần GMV video."]],"c":"So sánh số liệu.","col":["3x","fold"],"rel":["double"]},{"t":"average","p":"n, adj","vi":"trung bình","d":"Tổng chia số phần tử. Còn gọi mean.","ex":[["The average order value is 280k.","Giá trị đơn trung bình là 280k."]],"c":"Báo cáo.","col":["on average","mean"],"rel":["median"]},{"t":"median","p":"n","vi":"trung vị","d":"Giá trị đứng giữa khi xếp dữ liệu theo thứ tự. Ít bị ảnh hưởng bởi giá trị bất thường hơn trung bình.","ex":[["The median watch time is 45 seconds.","Thời gian xem trung vị là 45 giây."]],"c":"Phân tích.","col":["middle value"],"rel":["average","outlier"]},{"t":"total","p":"n, adj","vi":"tổng","d":"Tổng cộng. Sum là phép cộng, add up là cộng lại.","ex":[["In total, we sold 5,000 units.","Tổng cộng bán được 5.000 sản phẩm."]],"c":"Báo cáo.","col":["sum","in total","add up"],"rel":["average"]},{"t":"ratio","p":"n","vi":"tỉ lệ (giữa hai số)","d":"Quan hệ giữa hai đại lượng, ví dụ LTV:CAC = 3:1, đọc là three to one.","ex":[["Our LTV to CAC ratio is three to one.","Tỉ lệ LTV trên CAC là ba trên một."]],"c":"Phân tích.","col":["3:1","ratio of"],"rel":["LTV"]},{"t":"range","p":"n","vi":"khoảng, dải","d":"Khoảng từ giá trị thấp nhất đến cao nhất.","ex":[["Prices range from 99k to 499k.","Giá dao động từ 99k đến 499k."]],"c":"Báo cáo, dự báo.","col":["range from…to","price range"],"rel":["price tier"]},{"t":"up to","p":"phrase","vi":"lên tới, tối đa","d":"Giới hạn trên. “Giảm tới 50%” là up to 50% off.","ex":[["Get up to 50% off tonight.","Giảm tới 50% tối nay."]],"c":"Khuyến mãi, mô tả.","col":["maximum","at most"],"rel":["at least"]},{"t":"at least","p":"phrase","vi":"ít nhất","d":"Giới hạn dưới.","ex":[["We need at least 3,000 viewers for the KOL live.","Cần ít nhất 3.000 người xem cho live KOL."]],"c":"Điều kiện, mục tiêu.","col":["minimum","no less than"],"rel":["up to"]},{"t":"over / under","p":"prep","vi":"trên / dưới","d":"Over 1 million là trên 1 triệu; under 100k là dưới 100k.","ex":[["Orders over 299k get free shipping.","Đơn trên 299k được miễn phí ship."]],"c":"Mô tả số.","col":["above","below","more than"],"rel":["at least"]},{"t":"per","p":"prep","vi":"mỗi, trên mỗi","d":"Dùng trong đơn vị tỉ lệ: per hour, per order, per person.","ex":[["Cost per order is 30k.","Chi phí mỗi đơn là 30k."]],"c":"Chỉ số.","col":["per unit","per day"],"rel":["cost per order"]},{"t":"net of","p":"phrase","vi":"sau khi trừ","d":"Con số đã trừ đi một khoản.","ex":[["Revenue net of returns was 900 million.","Doanh thu sau khi trừ hàng hoàn là 900 triệu."]],"c":"Báo cáo tài chính.","col":["excluding","after"],"rel":["gross vs net"]},{"t":"including / excluding","p":"prep","vi":"bao gồm / không bao gồm","d":"Nói rõ con số có tính khoản nào. Viết tắt incl. và excl.","ex":[["The price is 500k excluding VAT.","Giá 500k chưa gồm VAT."]],"c":"Báo giá, báo cáo.","col":["incl.","excl."],"rel":["VAT"]},{"t":"round up / round down","p":"v","vi":"làm tròn lên / làm tròn xuống","d":"Làm tròn số. Round to the nearest là làm tròn tới đơn vị gần nhất.","ex":[["Round to the nearest million.","Làm tròn tới triệu gần nhất."]],"c":"Báo cáo.","col":["rounding"],"rel":["roughly"]},{"t":"fraction","p":"n","vi":"phân số","d":"Một phần của tổng: a half (1/2), a third (1/3), a quarter (1/4), two thirds (2/3).","ex":[["A quarter of our buyers are repeat customers.","Một phần tư người mua là khách quay lại."]],"c":"Mô tả tỉ lệ.","col":["half","third","quarter"],"rel":["percent"]},{"t":"quarter","p":"n","vi":"quý; một phần tư","d":"Ba tháng trong năm tài chính (Q1 đến Q4), hoặc 1/4.","ex":[["Q3 was our best quarter.","Quý 3 là quý tốt nhất."]],"c":"Báo cáo.","col":["Q1","Q2","Q3","Q4"],"rel":["QoQ","fraction"]},{"t":"date format","p":"n","vi":"định dạng ngày","d":"Mỹ viết tháng trước (10/12 là 12 tháng 10), Anh và Việt Nam viết ngày trước. Nên viết rõ: Oct 12 hoặc 12 Oct.","ex":[["To avoid confusion, write the date as 12 Oct 2026.","Để tránh nhầm, viết ngày là 12 Oct 2026."]],"c":"Email quốc tế.","col":["MM/DD","DD/MM"],"rel":["time zone"]}]},{"id":"data","code":"DATA","group":"Công việc","en":"Data & Spreadsheet Skills","vi":"Dữ liệu và bảng tính","intro":"Từ vựng làm việc với Excel, Google Sheets và dữ liệu khi làm báo cáo live và TMĐT.","terms":[{"t":"spreadsheet","p":"n","vi":"bảng tính","d":"File dạng bảng như Excel, Google Sheets.","ex":[["Update the spreadsheet after every live.","Cập nhật bảng tính sau mỗi live."]],"c":"Làm báo cáo.","col":["sheet","workbook","tab"],"rel":["dashboard"]},{"t":"column","p":"n","vi":"cột","d":"Hàng dọc trong bảng tính. Row là hàng ngang, cell là ô.","ex":[["Add a column for paid GMV.","Thêm cột GMV đã thanh toán."]],"c":"Bảng tính.","col":["row","cell"],"rel":["spreadsheet"]},{"t":"formula","p":"n","vi":"công thức","d":"Biểu thức tính toán trong ô, bắt đầu bằng dấu =.","ex":[["The formula in column F is broken.","Công thức ở cột F bị lỗi."]],"c":"Bảng tính.","col":["formula error","#REF!"],"rel":["spreadsheet"]},{"t":"pivot table","p":"n","vi":"bảng tổng hợp (pivot)","d":"Công cụ tóm tắt dữ liệu theo nhóm, ví dụ GMV theo host, theo ngày.","ex":[["Make a pivot table of GMV by host and slot.","Làm bảng pivot GMV theo host và khung giờ."]],"c":"Phân tích dữ liệu.","col":["pivot","summarize"],"rel":["breakdown"]},{"t":"VLOOKUP","p":"n","vi":"hàm tra cứu VLOOKUP","d":"Hàm tìm giá trị trong một bảng khác theo mã, ví dụ lấy giá vốn theo SKU. XLOOKUP là bản mới linh hoạt hơn.","ex":[["Use VLOOKUP to pull the cost for each SKU.","Dùng VLOOKUP để lấy giá vốn cho từng SKU."]],"c":"Bảng tính.","col":["XLOOKUP","INDEX MATCH"],"rel":["formula"]},{"t":"filter","p":"n, v","vi":"bộ lọc, lọc","d":"Chỉ hiển thị dòng thỏa điều kiện.","ex":[["Filter the orders by status 'cancelled'.","Lọc đơn theo trạng thái “đã hủy”."]],"c":"Bảng tính.","col":["apply a filter","sort"],"rel":["spreadsheet"]},{"t":"sort","p":"v","vi":"sắp xếp","d":"Xếp dữ liệu tăng dần (ascending) hoặc giảm dần (descending).","ex":[["Sort SKUs by GMV in descending order.","Sắp xếp SKU theo GMV giảm dần."]],"c":"Bảng tính.","col":["ascending","descending"],"rel":["filter"]},{"t":"conditional formatting","p":"n","vi":"định dạng có điều kiện","d":"Tự tô màu ô theo điều kiện, ví dụ ROAS dưới 3 tô đỏ.","ex":[["Use conditional formatting to flag low ROAS.","Dùng định dạng có điều kiện để đánh dấu ROAS thấp."]],"c":"Bảng tính, báo cáo.","col":["highlight cells"],"rel":["dashboard"]},{"t":"raw data","p":"n","vi":"dữ liệu thô","d":"Dữ liệu chưa xử lý, xuất trực tiếp từ hệ thống.","ex":[["Keep the raw data in a separate tab.","Giữ dữ liệu thô ở một tab riêng."]],"c":"Phân tích.","col":["raw export"],"rel":["data cleaning"]},{"t":"export data","p":"v","vi":"xuất dữ liệu","d":"Tải dữ liệu từ hệ thống ra file (CSV, Excel). Import là nhập vào.","ex":[["Export the order report as CSV.","Xuất báo cáo đơn dạng CSV."]],"c":"Lấy số liệu.","col":["CSV","download","import"],"rel":["raw data"]},{"t":"CSV","p":"abbr","vi":"file CSV","d":"Định dạng file dữ liệu dạng chữ, các cột ngăn bằng dấu phẩy.","ex":[["The platform only exports CSV files.","Sàn chỉ xuất file CSV."]],"f":"Comma-Separated Values","c":"Xuất, nhập dữ liệu.","col":["CSV file"],"rel":["export data"]},{"t":"data cleaning","p":"n","vi":"làm sạch dữ liệu","d":"Sửa, loại bỏ dữ liệu sai, trùng, thiếu trước khi phân tích.","ex":[["Data cleaning takes most of the time.","Làm sạch dữ liệu tốn nhiều thời gian nhất."]],"c":"Phân tích.","col":["clean data","duplicates"],"rel":["raw data"]},{"t":"duplicate","p":"n, v","vi":"trùng lặp; nhân bản","d":"Dòng dữ liệu bị lặp, hoặc tạo bản sao.","ex":[["Remove duplicate orders before counting.","Xóa đơn trùng trước khi đếm."]],"c":"Làm sạch dữ liệu.","col":["remove duplicates"],"rel":["data cleaning"]},{"t":"data accuracy","p":"n","vi":"độ chính xác dữ liệu","d":"Mức độ dữ liệu đúng với thực tế.","ex":[["Double-check data accuracy before sending to the brand.","Kiểm tra độ chính xác dữ liệu trước khi gửi brand."]],"c":"Kiểm soát báo cáo.","col":["accurate","discrepancy"],"rel":["stock discrepancy"]},{"t":"discrepancy","p":"n","vi":"sự chênh lệch","d":"Hai nguồn số liệu không khớp nhau.","ex":[["There's a discrepancy between Ads Manager and Seller Center.","Có chênh lệch giữa trình quản lý quảng cáo và kênh người bán."]],"c":"Đối soát.","col":["data discrepancy"],"rel":["attribution","reconciliation"]},{"t":"reconciliation","p":"n","vi":"đối soát","d":"So khớp hai nguồn dữ liệu (đơn, tiền) để đảm bảo đúng.","ex":[["Monthly reconciliation with the platform is due Friday.","Đối soát tháng với sàn hạn thứ Sáu."]],"c":"Tài chính, vận hành.","col":["reconcile"],"rel":["COD reconciliation","payout"]},{"t":"chart","p":"n","vi":"biểu đồ","d":"Hình thể hiện số liệu: line chart (đường), bar chart (cột), pie chart (tròn).","ex":[["Use a line chart to show GMV over time.","Dùng biểu đồ đường thể hiện GMV theo thời gian."]],"c":"Báo cáo.","col":["line chart","bar chart","pie chart"],"rel":["dashboard"]},{"t":"x-axis / y-axis","p":"n","vi":"trục hoành / trục tung","d":"Trục ngang và trục dọc của biểu đồ.","ex":[["The x-axis shows hours, the y-axis shows orders.","Trục ngang là giờ, trục dọc là số đơn."]],"c":"Đọc biểu đồ.","col":["axis","label"],"rel":["chart"]},{"t":"data visualization","p":"n","vi":"trực quan hóa dữ liệu","d":"Biến số liệu thành biểu đồ, hình ảnh dễ hiểu.","ex":[["Good data visualization makes insights obvious.","Trực quan hóa tốt làm nhận định hiện rõ."]],"c":"Báo cáo.","col":["dataviz"],"rel":["chart","dashboard"]},{"t":"metric","p":"n","vi":"chỉ số","d":"Một con số đo lường cụ thể. Metrics là số nhiều.","ex":[["Which metric matters most for the brand?","Chỉ số nào brand quan tâm nhất?"]],"c":"Báo cáo.","col":["key metrics","vanity metric"],"rel":["KPI"]},{"t":"vanity metric","p":"n","vi":"chỉ số phù phiếm","d":"Chỉ số trông đẹp (lượt thích, lượt xem) nhưng không phản ánh kết quả kinh doanh.","ex":[["Likes are a vanity metric if they don't drive sales.","Lượt thích là chỉ số phù phiếm nếu không ra đơn."]],"c":"Đánh giá báo cáo.","col":["actionable metric"],"rel":["metric"]},{"t":"north star metric","p":"n","vi":"chỉ số kim chỉ nam","d":"Một chỉ số quan trọng nhất cả team cùng hướng tới.","ex":[["Paid GMV is our north star metric.","GMV đã thanh toán là chỉ số kim chỉ nam."]],"c":"Chiến lược.","col":["NSM"],"rel":["KPI"]},{"t":"segment","p":"v, n","vi":"phân nhóm dữ liệu","d":"Chia dữ liệu theo nhóm để so sánh.","ex":[["Segment the data by traffic source.","Phân nhóm dữ liệu theo nguồn traffic."]],"c":"Phân tích.","col":["segment by"],"rel":["breakdown","customer segment"]},{"t":"granularity","p":"n","vi":"độ chi tiết dữ liệu","d":"Mức chi tiết: theo ngày, giờ, phút, theo SKU.","ex":[["We need hourly granularity to compare hosts.","Cần dữ liệu chi tiết theo giờ để so sánh host."]],"c":"Phân tích.","col":["granular"],"rel":["breakdown"]},{"t":"time frame","p":"n","vi":"khung thời gian","d":"Khoảng thời gian của dữ liệu hoặc kế hoạch.","ex":[["Use the same time frame for both campaigns.","Dùng cùng khung thời gian cho cả hai chiến dịch."]],"c":"Báo cáo.","col":["period","date range"],"rel":["scenario"]},{"t":"SQL","p":"abbr","vi":"ngôn ngữ truy vấn SQL","d":"Ngôn ngữ lấy dữ liệu từ cơ sở dữ liệu.","ex":[["The data team pulls live orders with SQL.","Team dữ liệu lấy đơn live bằng SQL."]],"c":"Phân tích nâng cao.","col":["query","database"],"rel":["data source"]},{"t":"Looker Studio","p":"n","vi":"công cụ báo cáo Looker Studio","d":"Công cụ miễn phí của Google để làm dashboard từ Google Sheets và nhiều nguồn khác.","ex":[["We built the live dashboard in Looker Studio.","Bọn mình làm dashboard live bằng Looker Studio."]],"c":"Làm dashboard.","col":["Data Studio","Power BI","Tableau"],"rel":["dashboard"]},{"t":"dashboard filter","p":"n","vi":"bộ lọc trên dashboard","d":"Chọn khoảng thời gian, kênh, sản phẩm để xem số liệu.","ex":[["Set the dashboard filter to last 7 days.","Đặt bộ lọc dashboard về 7 ngày gần nhất."]],"c":"Dùng dashboard.","col":["date filter"],"rel":["filter","dashboard"]},{"t":"data refresh","p":"n","vi":"cập nhật dữ liệu","d":"Lúc dữ liệu được làm mới trong báo cáo, dashboard.","ex":[["The data refresh happens every 15 minutes.","Dữ liệu được làm mới mỗi 15 phút."]],"c":"Đọc số liệu.","col":["refresh rate","latency"],"rel":["real-time dashboard"]}]},{"id":"leadership","code":"LEAD","group":"Công việc","en":"Leadership & Team Management","vi":"Lãnh đạo và quản lý đội ngũ","intro":"Từ vựng dành cho trưởng nhóm: giao việc, tạo động lực, góp ý, xử lý mâu thuẫn và phát triển đội ngũ.","terms":[{"t":"team lead","p":"n","vi":"trưởng nhóm","d":"Người dẫn dắt một nhóm nhỏ.","ex":[["The live ops team lead manages six operators.","Trưởng nhóm vận hành live quản lý sáu người."]],"c":"Cơ cấu team.","col":["team leader","supervisor"],"rel":["line manager"]},{"t":"morale","p":"n","vi":"tinh thần (đội nhóm)","d":"Mức hứng khởi, động lực của nhóm.","ex":[["Hitting the target boosted team morale.","Đạt chỉ tiêu giúp tinh thần đội lên cao."]],"c":"Quản lý.","col":["boost morale","low morale"],"rel":["motivation"]},{"t":"motivation","p":"n","vi":"động lực","d":"Lý do và năng lượng thúc đẩy làm việc.","ex":[["Recognition is a strong motivation for hosts.","Được ghi nhận là động lực mạnh với host."]],"c":"Quản lý.","col":["motivate","intrinsic motivation"],"rel":["morale"]},{"t":"recognition","p":"n","vi":"sự ghi nhận","d":"Công nhận đóng góp, thành tích của ai đó.","ex":[["Give public recognition to the host of the month.","Ghi nhận công khai host xuất sắc của tháng."]],"c":"Quản lý.","col":["shout-out","recognize"],"rel":["motivation"]},{"t":"constructive feedback","p":"n","vi":"góp ý mang tính xây dựng","d":"Góp ý cụ thể, có hướng cải thiện, không chỉ trích cá nhân.","ex":[["Constructive feedback helps new hosts improve fast.","Góp ý xây dựng giúp host mới tiến bộ nhanh."]],"c":"Quản lý, đánh giá.","col":["SBI model"],"rel":["feedback"]},{"t":"SBI model","p":"n","vi":"mô hình góp ý SBI","d":"Cách góp ý: Situation (tình huống), Behavior (hành vi), Impact (tác động).","ex":[["In the 9 PM segment (S), you skipped the CTA (B), so orders dropped (I).","Ở đoạn 9 giờ (tình huống), bạn bỏ lời kêu gọi (hành vi), nên đơn giảm (tác động)."]],"c":"Góp ý cho nhân viên.","col":["situation-behavior-impact"],"rel":["constructive feedback"]},{"t":"empower","p":"v","vi":"trao quyền","d":"Cho nhân viên quyền tự quyết trong phạm vi công việc.","ex":[["Empower the operator to drop vouchers when CCU falls.","Trao quyền cho người vận hành tự thả voucher khi CCU giảm."]],"c":"Quản lý.","col":["empowerment"],"rel":["delegate"]},{"t":"micromanage","p":"v","vi":"quản lý vi mô","d":"Kiểm soát từng chi tiết nhỏ của nhân viên, thường gây mất động lực.","ex":[["Try not to micromanage experienced hosts.","Cố đừng quản lý từng li từng tí với host có kinh nghiệm."]],"c":"Phong cách quản lý.","col":["micromanagement"],"rel":["empower"]},{"t":"conflict","p":"n","vi":"mâu thuẫn","d":"Bất đồng giữa người hoặc nhóm. Conflict resolution là giải quyết mâu thuẫn.","ex":[["Resolve the conflict between ads and ops quickly.","Giải quyết nhanh mâu thuẫn giữa team quảng cáo và vận hành."]],"c":"Quản lý.","col":["conflict resolution","resolve"],"rel":["alignment"]},{"t":"expectation","p":"n","vi":"kỳ vọng","d":"Điều mong đợi ở ai đó. Set expectations là nói rõ kỳ vọng từ đầu.","ex":[["Let's set clear expectations for the first month.","Nói rõ kỳ vọng cho tháng đầu nhé."]],"c":"Quản lý, làm việc với brand.","col":["set expectations","meet expectations"],"rel":["alignment"]},{"t":"growth mindset","p":"n","vi":"tư duy phát triển","d":"Tin rằng năng lực có thể cải thiện qua nỗ lực và học hỏi.","ex":[["A growth mindset matters more than experience.","Tư duy phát triển quan trọng hơn kinh nghiệm."]],"c":"Văn hóa đội nhóm.","col":["fixed mindset"],"rel":["upskill"]},{"t":"ownership","p":"n","vi":"tinh thần làm chủ","d":"Chủ động chịu trách nhiệm về công việc như việc của mình.","ex":[["She shows great ownership of the live room.","Cô ấy rất có tinh thần làm chủ phòng live."]],"c":"Đánh giá nhân viên.","col":["take ownership"],"rel":["owner","accountable"]},{"t":"initiative","p":"n","vi":"sự chủ động; sáng kiến","d":"Tự đề xuất và làm mà không cần nhắc. Cũng chỉ một sáng kiến, dự án.","ex":[["He took the initiative to build a new checklist.","Anh ấy chủ động làm checklist mới."]],"c":"Đánh giá, dự án.","col":["take the initiative"],"rel":["ownership"]},{"t":"decision-making","p":"n","vi":"ra quyết định","d":"Quá trình chọn phương án.","ex":[["Fast decision-making is key during the live.","Ra quyết định nhanh là chìa khóa khi đang live."]],"c":"Quản lý.","col":["make a decision"],"rel":["data-driven"]},{"t":"prioritize","p":"v","vi":"ưu tiên","d":"Sắp xếp việc theo mức quan trọng, gấp.","ex":[["Prioritize tasks that affect tonight's live.","Ưu tiên việc ảnh hưởng đến live tối nay."]],"c":"Quản lý thời gian.","col":["prioritization"],"rel":["priority"]},{"t":"time management","p":"n","vi":"quản lý thời gian","d":"Kỹ năng sắp xếp và dùng thời gian hiệu quả.","ex":[["Good time management is essential with back-to-back lives.","Quản lý thời gian tốt rất cần khi live liên tục."]],"c":"Kỹ năng.","col":["manage time"],"rel":["prioritize"]},{"t":"1-on-1 check-in","p":"n","vi":"trò chuyện riêng định kỳ","d":"Buổi gặp ngắn giữa quản lý và từng thành viên để hỏi thăm, gỡ vướng.","ex":[["Weekly 1-on-1 check-ins help spot burnout early.","Trò chuyện riêng hằng tuần giúp phát hiện sớm kiệt sức."]],"c":"Quản lý.","col":["check-in"],"rel":["one-on-one","burnout"]},{"t":"succession plan","p":"n","vi":"kế hoạch kế nhiệm","d":"Chuẩn bị người thay thế cho vị trí quan trọng.","ex":[["We need a succession plan for our top host.","Cần kế hoạch kế nhiệm cho host chính."]],"c":"Quản lý nhân sự.","col":["backup","bench"],"rel":["career path"]}]},{"id":"idioms","code":"IDIOM","group":"Công việc","en":"Business Idioms & Expressions","vi":"Thành ngữ và cách nói công sở","intro":"Thành ngữ và cách nói tự nhiên người bản xứ hay dùng trong họp và tin nhắn công việc.","terms":[{"t":"on the same page","p":"phrase","vi":"cùng hiểu một ý","d":"Mọi người có cùng thông tin và cách hiểu.","ex":[["Let's make sure we're on the same page about the deal.","Đảm bảo mọi người cùng hiểu về deal."]],"c":"Họp, thống nhất.","col":["get on the same page"],"rel":["alignment"]},{"t":"ballpark","p":"n, adj","vi":"ước chừng","d":"Con số áng chừng. In the ballpark là gần đúng.","ex":[["500 million is in the ballpark.","500 triệu là con số gần đúng."]],"c":"Thảo luận nhanh.","col":["ballpark figure"],"rel":["estimate"]},{"t":"think outside the box","p":"phrase","vi":"tư duy sáng tạo","d":"Nghĩ khác lối mòn.","ex":[["Think outside the box for the Tet live theme.",
