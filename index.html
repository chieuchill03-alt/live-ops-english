<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131722">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Live Ops EN">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Live Ops English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a broadcast control-room reference desk — mono "channel" codes, a red ON-AIR accent used sparingly, entries laid out like cue sheets; bottom bar on phone, top bar on desktop */
:root{
  --bg:#f2f3f6; --surface:#ffffff; --sunk:#e9ebf0; --raise:#fafbfc;
  --ink:#131722; --muted:#596173; --faint:#8a92a3; --line:#d8dce5;
  --live:#d7213a; --live-soft:#fde7ea; --live-ink:#ffffff;
  --btn:#131722; --btn-ink:#ffffff;
  --good:#137a46; --good-bg:#e0f3e8; --warn:#9a5b00; --warn-bg:#fdf1dc; --bad:#c22a3c; --bad-bg:#fbe4e7;
  --g-live:#d7213a; --g-ecom:#1f6fd1; --g-mkt:#8a3fd1; --g-work:#0f8a7a; --g-prod:#b86200;
  --f-display:"Lexend","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --navh:60px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1117; --surface:#161a23; --sunk:#1d2230; --raise:#1a1f2a;
  --ink:#eceef4; --muted:#9ba3b6; --faint:#6e7689; --line:#2a3041;
  --live:#ff4d62; --live-soft:#3b1820; --live-ink:#16080b;
  --btn:#eceef4; --btn-ink:#0e1117;
  --good:#5ccf8f; --good-bg:#132e20; --warn:#f0b454; --warn-bg:#33270f; --bad:#ff7d8b; --bad-bg:#3a1920;
  --g-live:#ff5e72; --g-ecom:#5ea3ff; --g-mkt:#b88aff; --g-work:#3fd1bd; --g-prod:#f0a64a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1117; --surface:#161a23; --sunk:#1d2230; --raise:#1a1f2a;
  --ink:#eceef4; --muted:#9ba3b6; --faint:#6e7689; --line:#2a3041;
  --live:#ff4d62; --live-soft:#3b1820; --live-ink:#16080b;
  --btn:#eceef4; --btn-ink:#0e1117;
  --good:#5ccf8f; --good-bg:#132e20; --warn:#f0b454; --warn-bg:#33270f; --bad:#ff7d8b; --bad-bg:#3a1920;
  --g-live:#ff5e72; --g-ecom:#5ea3ff; --g-mkt:#b88aff; --g-work:#3fd1bd; --g-prod:#f0a64a; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--live);outline-offset:2px}
mark{background:var(--live-soft);color:inherit;border-radius:3px;padding:0 2px}
.tag{font-family:var(--f-body);font-size:.68rem;letter-spacing:.1em;font-weight:600;color:var(--muted);text-transform:uppercase}
.label{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gc,var(--live));flex:none}
.hidden{display:none!important}

/* NAV: top on desktop, bottom on phone */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-in{max-width:980px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:14px;height:var(--navh)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:1.05rem;white-space:nowrap;background:none;border:none;padding:0}
.brand .onair{width:9px;height:9px;border-radius:50%;background:var(--live);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.navtabs{display:flex;gap:2px;margin-left:auto}
.navtabs button{border:none;background:none;padding:8px 12px;border-radius:8px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px;position:relative}
.navtabs button[aria-current="page"]{color:var(--ink);background:var(--sunk)}
.navtabs svg{width:20px;height:20px}
.badge{font-family:var(--f-mono);font-size:.66rem;background:var(--live);color:var(--live-ink);border-radius:20px;padding:1px 6px;line-height:1.4}
.speed{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 6px;font-size:.8rem;color:var(--muted)}
@media (max-width:719px){
  .nav{border-bottom:none;backdrop-filter:none;background:var(--surface)}
  .navtabs{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
  .navtabs button{flex-direction:column;gap:2px;font-size:.68rem;padding:6px 4px;flex:1}
  .navtabs button[aria-current="page"]{background:none;color:var(--live)}
  .navtabs .badge{position:absolute;top:0;right:calc(50% - 22px)}
  .speed{margin-left:auto}
  main{padding-bottom:84px!important}
}

main{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:flex;flex-direction:column;gap:22px}

/* HOME */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;align-items:end}
@media (max-width:719px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(2rem,6.4vw,3rem);font-weight:700;letter-spacing:-.025em}
.hero h1 em{font-style:normal;color:var(--live)}
.hero p{color:var(--muted);margin:8px 0 0;max-width:54ch}
.meters{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.meters div{padding:12px 10px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.meters div:first-child{border-left:none}
.meters b{font-family:var(--f-mono);font-weight:500;font-size:1.25rem;font-variant-numeric:tabular-nums}
.meters span{font-size:.72rem;color:var(--muted);line-height:1.25}
.meters .due b{color:var(--live)}

.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:0 14px}
.search:focus-within{border-color:var(--ink)}
.search input{flex:1;min-width:0;border:none;background:none;font:inherit;padding:13px 0;color:var(--ink)}
.search input:focus{outline:none}
.search svg{color:var(--muted);flex:none}

.cta-row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 15px;font-weight:600;display:inline-flex;align-items:center;gap:7px;line-height:1.3}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.btn.live{background:var(--live);border-color:var(--live);color:var(--live-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.sm{padding:6px 11px;font-size:.85rem;border-radius:8px}
.btn:disabled{opacity:.4;cursor:default}
.btn svg{width:17px;height:17px;flex:none}

.group{display:flex;flex-direction:column;gap:10px}
.group-h{display:flex;align-items:center;gap:8px}
.group-h h2{font-size:1.05rem;font-weight:600}
.group-h .count{font-family:var(--f-mono);font-size:.75rem;color:var(--faint)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.cat{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;transition:border-color .15s,transform .15s}
.cat:hover{border-color:var(--gc);transform:translateY(-2px)}
.cat .top{display:flex;justify-content:space-between;align-items:center}
.cat h3{font-size:1.08rem;font-weight:600}
.cat .vi{color:var(--muted);font-size:.86rem;margin-top:-3px}
.cat .meta{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;justify-content:space-between}
.bar{height:5px;border-radius:3px;background:var(--sunk);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .m{background:var(--gc,var(--live))}
.bar .l{background:color-mix(in srgb,var(--gc,var(--live)) 35%,transparent)}

/* CATEGORY */
.back{align-self:flex-start;background:none;border:none;color:var(--muted);font-weight:600;padding:2px 0;display:flex;align-items:center;gap:4px}
.back:hover{color:var(--ink)}
.cathead{display:flex;flex-direction:column;gap:6px;border-left:4px solid var(--gc);padding-left:14px}
.cathead h1{font-size:clamp(1.6rem,5.5vw,2.2rem);font-weight:700;letter-spacing:-.02em}
.cathead p{margin:0;color:var(--muted);max-width:62ch}
.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--line);overflow-x:auto}
.tabs button{border:none;background:none;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--live)}

/* Term rows */
.rows{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);text-align:left;background:none;border-left:none;border-right:none;border-bottom:none;width:100%}
.row:first-child{border-top:none}
.row:hover{background:var(--raise)}
.row .tt{font-family:var(--f-display);font-weight:600;font-size:1.02rem}
.row .ff{font-family:var(--f-mono);font-size:.72rem;color:var(--faint);margin-left:6px}
.row .vv{font-size:.88rem;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .side{display:flex;align-items:center;gap:8px}
.state{font-size:.68rem;font-weight:600;border-radius:20px;padding:2px 8px;white-space:nowrap}
.state.new{color:var(--faint);background:var(--sunk)}
.state.learning{color:var(--warn);background:var(--warn-bg)}
.state.known{color:var(--good);background:var(--good-bg)}
.star{color:var(--faint)} .star.on{color:#e0a400}
.play{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--raise);display:grid;place-items:center;flex:none}
.play svg{width:16px;height:16px}

/* A–Z */
.azbar{display:flex;flex-wrap:wrap;gap:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--navh));z-index:5;background:var(--bg);padding-block:8px}
@media (max-width:719px){.azbar{top:calc(env(safe-area-inset-top,0px) + var(--navh))}}
.azbar button{font-family:var(--f-mono);font-size:.78rem;width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--surface)}
.azbar button:disabled{opacity:.3;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 11px;font-size:.8rem;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.letter{font-family:var(--f-display);font-weight:700;font-size:1.4rem;color:var(--live);padding:14px 0 6px}

/* DETAIL sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.45);z-index:40}
.sheet{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);border-left:1px solid var(--line);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px calc(env(safe-area-inset-bottom,0px) + 30px);display:flex;flex-direction:column;gap:16px;animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.4}}
.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dterm{font-family:var(--f-display);font-weight:700;font-size:clamp(1.9rem,8vw,2.6rem);line-height:1.08;letter-spacing:-.02em}
.dfull{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.dpos{font-style:italic;color:var(--faint);font-size:.85rem}
.dvi{font-family:var(--f-display);font-weight:600;font-size:1.3rem;color:var(--live)}
.sec{display:flex;flex-direction:column;gap:6px}
.sec p{margin:0}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.formula{font-family:var(--f-mono);font-size:.86rem;background:var(--sunk);border-radius:8px;padding:10px 12px;line-height:1.6;overflow-x:auto}
.exlist{display:flex;flex-direction:column;gap:8px}
.ex{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.ex .en{font-weight:600}
.ex .vi{color:var(--muted);font-size:.9rem}
.ex mark{background:var(--live-soft);color:inherit;border-radius:3px;padding:0 2px}
.tip{border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));background:var(--warn-bg);border-radius:10px;padding:10px 12px;font-size:.92rem}
.tip b{color:var(--warn)}
.colchips span{font-family:var(--f-mono);font-size:.78rem;background:var(--sunk);border-radius:6px;padding:3px 8px}
.rel{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;font-size:.85rem;font-weight:600}
.rel:hover{border-color:var(--ink)}

/* Flashcards */
.stage{display:flex;flex-direction:column;align-items:center;gap:12px}
.flash{width:100%;max-width:600px;background:none;border:none;padding:0;perspective:1400px;text-align:left}
.inner{display:grid;transition:transform .45s;transform-style:preserve-3d}
.flash.flipped .inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:22px 20px 36px;display:flex;flex-direction:column;gap:10px;min-height:280px;position:relative}
.face.front{align-items:center;justify-content:center;text-align:center}
.face.rear{transform:rotateY(180deg)}
.face .hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:.72rem;color:var(--faint)}
.face .exs{font-size:.92rem}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:600px}
.rate button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 6px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:1px}
.rate button small{font-weight:400;font-size:.72rem;color:var(--muted)}
.rate .r0:hover{border-color:var(--bad)} .rate .r1:hover{border-color:var(--warn)} .rate .r2:hover{border-color:var(--good)}
.counter{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* Quiz */
.quiz{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;max-width:680px;width:100%;margin:0 auto}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.pbar{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--live)}
.qprompt{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0}
.qprompt .big{font-family:var(--f-display);font-weight:700;font-size:clamp(1.4rem,6vw,2rem);line-height:1.2}
.qprompt .sent{font-size:1.1rem;font-weight:600;max-width:48ch}
.gap{display:inline-block;min-width:6ch;border-bottom:2.5px solid var(--live);height:1.1em;vertical-align:-2px}
.qprompt .sub{color:var(--muted);font-size:.9rem;max-width:52ch}
.bigplay{width:72px;height:72px;border-radius:50%;background:var(--live);color:var(--live-ink);border:none;display:grid;place-items:center}
.bigplay svg{width:32px;height:32px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt{border:1.5px solid var(--line);background:var(--raise);border-radius:10px;padding:12px;font-weight:600;min-height:52px;text-align:center}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.typebox{display:flex;gap:8px}
.typebox input{flex:1;min-width:0;font:inherit;font-size:1.05rem;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--raise);color:var(--ink)}
.fb{font-weight:600;text-align:center;min-height:1.4em}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
.explain{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:.9rem}
.score{font-family:var(--f-mono);font-size:3rem;color:var(--live);line-height:1;text-align:center}
.setup{display:flex;flex-direction:column;gap:14px;max-width:680px;width:100%;margin:0 auto}

.empty{color:var(--muted);text-align:center;padding:28px 12px;background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.note{font-size:.85rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="nav"><div class="nav-in">
  <button class="brand" id="brand" aria-label="Trang chủ"><span class="onair"></span>Live Ops English</button>
  <nav class="navtabs" id="navtabs">
    <button data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Chủ đề</span></button>
    <button data-v="az"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zm0 0a2 2 0 0 0 2 2h13"/><path d="M9 7h6M9 11h4"/></svg><span>Từ điển A–Z</span></button>
    <button data-v="review"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg><span>Ôn tập</span><span class="badge hidden" id="duebadge"></span></button>
    <button data-v="quiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg><span>Kiểm tra</span></button>
    <button data-v="saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg><span>Sổ tay</span></button>
  </nav>
  <select class="speed" id="speed" aria-label="Tốc độ đọc"><option value="0.7">Đọc chậm</option><option value="0.9" selected>Đọc vừa</option><option value="1.05">Đọc thường</option></select>
</div></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="i-spk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></symbol></svg>
<main id="app"></main>
<div id="sheetwrap"></div>

<script>
const CATS = [{"id":"liveops","code":"LIVE-OPS","group":"Livestream","en":"Live Session Operation","vi":"Vận hành phiên live","intro":"Các thuật ngữ dùng hằng ngày khi lên kế hoạch, chạy và kết thúc một phiên livestream bán hàng.","terms":[{"t":"go live","p":"v","vi":"lên sóng, bắt đầu live","d":"Bắt đầu phát trực tiếp. Quá khứ là went live. Khi đang phát thì nói be live hoặc be on air. Kết thúc live là end the live hoặc go offline.","c":"Báo giờ lên sóng, đếm ngược trong nhóm chat, báo cáo thời lượng live.","ex":[["We go live at 8 PM sharp, please be in position by 7:45.","Mình lên sóng đúng 8 giờ, mọi người vào vị trí trước 7 giờ 45."],["We've been live for two hours and CCU is still stable.","Mình đã live được hai tiếng và CCU vẫn ổn định."]],"col":["go live on TikTok","go live at + giờ","be live / be on air","end the live"],"rel":["livestream session","live schedule","pre-live checklist"]},{"t":"livestream session","p":"n","vi":"phiên livestream","d":"Một lần phát trực tiếp tính từ lúc lên sóng đến lúc tắt. Trong công việc hay nói ngắn là session, live hoặc stream.","c":"Lập lịch, đếm số phiên, so sánh hiệu quả giữa các phiên.","ex":[["We run three livestream sessions a day on the main account.","Kênh chính chạy ba phiên live mỗi ngày."],["The morning session usually has lower GMV but better conversion.","Phiên buổi sáng thường GMV thấp hơn nhưng chuyển đổi tốt hơn."]],"col":["run a session","a 4-hour session","back-to-back sessions"],"rel":["live slot","live schedule","post-live report"]},{"t":"live slot","p":"n","vi":"khung giờ live","d":"Khoảng thời gian cố định dành cho một phiên live, ví dụ 19:00 đến 23:00. Brand hay mua hoặc đặt slot với agency.","c":"Xếp lịch host, đặt lịch với brand, so sánh hiệu quả theo khung giờ.","ex":[["The 8 PM to 11 PM slot is already booked by another brand.","Khung 8 đến 11 giờ tối đã có brand khác đặt rồi."],["Let's test a lunchtime slot next week.","Tuần sau thử khung giờ trưa nhé."]],"col":["book a slot","time slot","evening slot","slot allocation"],"rel":["prime time","live schedule"]},{"t":"prime time","p":"n","vi":"giờ vàng","d":"Khung giờ có nhiều người xem nhất, với live bán hàng thường là buổi tối (khoảng 19:00 đến 23:00) và các mốc 0h, 12h trong ngày siêu sale.","c":"Xếp host giỏi và deal mạnh nhất vào giờ vàng.","ex":[["Put our best host on prime time.","Xếp host giỏi nhất vào giờ vàng."],["Ad costs are higher during prime time, so watch the ROAS.","Chi phí quảng cáo giờ vàng cao hơn, nên theo dõi ROAS."]],"col":["prime-time slot","during prime time","off-peak hours"],"rel":["live slot","CPM"],"tip":"Ngược lại là off-peak (giờ thấp điểm)."},{"t":"run of show","f":"ROS","p":"n","vi":"kịch bản chạy live theo mốc thời gian","d":"Bảng lịch trình chi tiết của phiên: từng mốc giờ giới thiệu sản phẩm nào, deal gì, khi nào thả voucher, chơi minigame, ai phụ trách. Đây là tài liệu điều phối cho cả team.","c":"Gửi cho host, mod, live operator trước phiên; cập nhật khi brand đổi deal.","ex":[["I've updated the run of show with the new flash sale slot at 9:30.","Mình đã cập nhật kịch bản với khung flash sale mới lúc 9 rưỡi."],["Please stick to the run of show unless the GMV drops.","Cứ bám theo kịch bản trừ khi GMV tụt."]],"col":["update the run of show","stick to the run of show","ROS template"],"rel":["live script","product lineup","pre-live checklist"],"tip":"Run of show là lịch trình (cái gì, lúc nào). Live script là lời thoại (nói gì)."},{"t":"live script","p":"n","vi":"kịch bản lời thoại live","d":"Nội dung host sẽ nói: câu mở đầu, cách giới thiệu từng sản phẩm, câu xử lý thắc mắc, câu chốt đơn. Thường viết thành các khối lặp lại theo chu kỳ.","c":"Đào tạo host mới, chuẩn hóa lời thoại theo yêu cầu brand.","ex":[["The brand wants to review the live script before Friday.","Brand muốn xem lại kịch bản lời thoại trước thứ Sáu."],["Don't read the live script word for word, keep it natural.","Đừng đọc nguyên văn kịch bản, nói tự nhiên thôi."]],"col":["write a script","script review","sales script","word for word"],"rel":["run of show","hook","closing"]},{"t":"product lineup","p":"n","vi":"danh sách và thứ tự sản phẩm lên live","d":"Các sản phẩm được chọn bán trong phiên và thứ tự xuất hiện. Một lineup tốt thường xen kẽ sản phẩm kéo traffic, sản phẩm chủ lực và sản phẩm tăng giá trị đơn.","c":"Họp chuẩn bị live, làm việc với brand chọn sản phẩm.","ex":[["Can you send me the final product lineup for tonight?","Gửi mình danh sách sản phẩm chốt cho tối nay nhé?"],["We should move the hero product earlier in the lineup.","Nên đưa sản phẩm chủ lực lên sớm hơn."]],"col":["finalize the lineup","product mix","lineup order"],"rel":["hero product","loss leader","run of show"]},{"t":"hero product","p":"n","vi":"sản phẩm chủ lực","d":"Sản phẩm bán chạy nhất hoặc được đầu tư đẩy mạnh nhất, đóng góp phần lớn doanh thu. Còn gọi là best-seller hoặc key product.","c":"Lên lineup, phân bổ thời lượng, chạy quảng cáo.","ex":[["Our hero product accounts for 40% of GMV.","Sản phẩm chủ lực chiếm 40% GMV."],["Spend at least 15 minutes demoing the hero product.","Dành ít nhất 15 phút demo sản phẩm chủ lực."]],"col":["hero SKU","key product","best-seller"],"rel":["product lineup","loss leader"]},{"t":"loss leader","p":"n","vi":"sản phẩm chịu lỗ để kéo khách","d":"Sản phẩm bán giá rất thấp, thậm chí lỗ, để thu hút người xem vào phòng và mua thêm sản phẩm khác. Trong live hay gọi là traffic driver hoặc deal sốc 1k, 9k.","c":"Lên deal giữ chân người xem, tính toán ngân sách khuyến mãi.","ex":[["The 1k lipstick is our loss leader to pull traffic.","Thỏi son 1k là sản phẩm chịu lỗ để kéo traffic."],["Limit the loss leader to 100 units per session.","Giới hạn sản phẩm kéo khách 100 cái mỗi phiên."]],"col":["traffic driver","doorbuster","use as a loss leader"],"rel":["hero product","flash sale","subsidy"]},{"t":"host","p":"n","vi":"người dẫn live, streamer","d":"Người đứng trước camera giới thiệu sản phẩm, tương tác và chốt đơn. Ở Việt Nam hay gọi là host hoặc idol live. Từ chỉ việc làm host là to host.","c":"Phân công, đánh giá, đào tạo người dẫn.","ex":[["The host needs to talk about the price every three minutes.","Host cần nhắc giá mỗi ba phút."],["Who's hosting tonight's session?","Ai dẫn phiên tối nay?"]],"col":["main host","host rotation","to host a session"],"rel":["co-host","live script","moderator"]},{"t":"co-host","p":"n","vi":"người dẫn phụ","d":"Người hỗ trợ host chính: đọc bình luận, cầm và đưa sản phẩm, tạo không khí, thay host khi nghỉ.","c":"Phiên dài, phiên có nhiều sản phẩm, livestream đôi.","ex":[["The co-host will read comments and hand products to the host.","Người dẫn phụ sẽ đọc bình luận và đưa sản phẩm cho host."]],"col":["co-host with sb","assistant host"],"rel":["host","moderator"]},{"t":"moderator","f":"mod","p":"n","vi":"người quản lý bình luận","d":"Người theo dõi khu bình luận: ghim thông tin quan trọng, trả lời câu hỏi, chặn và xóa bình luận spam hoặc tiêu cực.","c":"Phân việc cho team hậu trường.","ex":[["The moderator should pin the voucher code in the comments.","Mod ghim mã voucher trong phần bình luận nhé."],["Ask the mod to mute users who spam links.","Bảo mod chặn những người spam link."]],"col":["pin a comment","mute a user","comment moderation"],"rel":["pinned comment","host"]},{"t":"pinned comment","p":"n","vi":"bình luận được ghim","d":"Bình luận cố định ở đầu khu chat, dùng để hiển thị thông tin quan trọng như mã giảm giá, quy định minigame, giờ flash sale.","c":"Nhắc mod cập nhật thông tin ghim theo từng giai đoạn của phiên.","ex":[["Update the pinned comment with the new voucher code.","Cập nhật bình luận ghim với mã voucher mới."]],"col":["pin / unpin a comment"],"rel":["moderator","pinned product"]},{"t":"live operator","p":"n","vi":"người vận hành phòng live","d":"Người điều khiển hậu trường: bật tắt sản phẩm, ghim sản phẩm, đổi giá, kích hoạt voucher và flash sale, theo dõi số liệu thời gian thực và báo cho host.","c":"Mô tả công việc của team Operation Livestream.","ex":[["The live operator will activate the flash sale when the host gives the cue.","Người vận hành sẽ kích hoạt flash sale khi host ra hiệu."],["As a live operator, I monitor CCU and GMV in real time.","Là người vận hành, tôi theo dõi CCU và GMV theo thời gian thực."]],"col":["live ops","backstage team","operate the live room"],"rel":["cue","real-time dashboard","pinned product"]},{"t":"cue","p":"n, v","vi":"tín hiệu, ra hiệu","d":"Dấu hiệu báo cho ai đó bắt đầu làm gì. Trong live, host ra cue để team bật deal, hoặc team ra cue (bằng bảng, tin nhắn) để host chuyển sản phẩm.","c":"Phối hợp host và hậu trường.","ex":[["Wait for my cue before you drop the voucher.","Đợi mình ra hiệu rồi mới thả voucher."],["Cue the host to switch to the next product.","Ra hiệu cho host chuyển sang sản phẩm tiếp."]],"col":["give a cue","on cue","cue card"],"rel":["live operator","run of show"]},{"t":"rehearsal","p":"n","vi":"buổi tập dượt","d":"Buổi chạy thử trước phiên live thật để host quen kịch bản và team kiểm tra kỹ thuật. Chạy thử toàn bộ còn gọi là dry run.","c":"Trước phiên lớn, phiên ra mắt sản phẩm, phiên có KOL.","ex":[["We'll have a rehearsal at 3 PM before the launch live.","Mình tập dượt lúc 3 giờ trước phiên ra mắt."],["Let's do a quick dry run of the new overlay.","Chạy thử nhanh lớp hiển thị mới nhé."]],"col":["dry run","test stream","run through"],"rel":["pre-live checklist","stream setup"]},{"t":"pre-live checklist","p":"n","vi":"danh sách kiểm tra trước live","d":"Danh sách các mục phải kiểm tra trước khi lên sóng: mạng, đèn, mic, link sản phẩm, giá, tồn kho, voucher, bối cảnh, host.","c":"Quy trình chuẩn của team vận hành.","ex":[["Has everyone gone through the pre-live checklist?","Mọi người đã kiểm tra hết danh sách trước live chưa?"],["Add stock levels to the pre-live checklist.","Thêm mục tồn kho vào danh sách kiểm tra trước live."]],"col":["go through the checklist","tick off","SOP"],"rel":["rehearsal","stream setup","inventory"]},{"t":"pinned product","p":"n","vi":"sản phẩm được ghim","d":"Sản phẩm đang hiển thị nổi trên màn hình live để người xem bấm mua ngay. Phải đổi theo sản phẩm host đang nói.","c":"Phối hợp giữa host và live operator.","ex":[["Make sure the pinned product changes when the host switches items.","Nhớ đổi sản phẩm ghim khi host chuyển món."],["The pinned product got 3,000 clicks in ten minutes.","Sản phẩm ghim có 3.000 lượt nhấp trong mười phút."]],"col":["pin a product","product card","product link"],"rel":["product click","live operator"]},{"t":"flash sale","p":"n","vi":"giảm giá chớp nhoáng","d":"Giảm giá sâu trong thời gian rất ngắn với số lượng giới hạn, tạo cảm giác phải mua ngay.","c":"Lên deal, cài đặt trên seller center, nhắc trong kịch bản.","ex":[["The flash sale starts at 9 PM and lasts 15 minutes.","Flash sale bắt đầu lúc 9 giờ và kéo dài 15 phút."],["We sold out the flash sale stock in two minutes.","Hàng flash sale hết sạch trong hai phút."]],"col":["run a flash sale","flash sale price","flash sale stock"],"rel":["urgency","scarcity","countdown"]},{"t":"voucher drop","p":"n","vi":"thả voucher","d":"Tung mã giảm giá vào giữa phiên live, thường gắn với mốc người xem hoặc mốc thời gian, để giữ chân và kích người xem mua.","c":"Kịch bản giữ CCU, khi số người xem tụt.","ex":[["We'll do a voucher drop when viewers reach 1,000.","Mình thả voucher khi người xem đạt 1.000."],["CCU jumped right after the voucher drop.","CCU tăng vọt ngay sau khi thả voucher."]],"col":["drop a voucher","claim a voucher","limited vouchers"],"rel":["shop voucher","CCU"]},{"t":"giveaway","p":"n","vi":"tặng quà, minigame có thưởng","d":"Hoạt động tặng quà miễn phí cho người xem qua bốc thăm, trả lời câu hỏi, bình luận. Mục đích là tăng tương tác và giữ chân.","c":"Lên kịch bản tương tác, thông báo luật chơi.","ex":[["We'll run a giveaway every hour to keep people watching.","Mỗi giờ có một minigame tặng quà để giữ người xem."],["Make sure the giveaway rules follow platform policy.","Đảm bảo luật tặng quà tuân thủ quy định sàn."]],"col":["run a giveaway","lucky draw","giveaway winner"],"rel":["mini game","engagement rate"]},{"t":"mini game","p":"n","vi":"trò chơi nhỏ trong live","d":"Trò chơi ngắn như đoán giá, bình luận nhanh, trả lời câu hỏi, thường kèm phần thưởng. Thường dùng ở phần khởi động hoặc khi người xem giảm.","c":"Kịch bản tương tác.","ex":[["Start with a mini game to warm up the room.","Mở đầu bằng một minigame để làm nóng phòng."]],"col":["guess the price game","comment game"],"rel":["giveaway","warm-up"]},{"t":"shout-out","p":"n","vi":"gọi tên, cảm ơn người xem","d":"Khi host gọi tên một người xem cụ thể để chào, cảm ơn hoặc trả lời. Giúp người xem thấy được quan tâm.","c":"Kỹ năng tương tác của host.","ex":[["Give a shout-out to viewers who just placed an order.","Gọi tên cảm ơn những bạn vừa đặt đơn."]],"col":["give a shout-out to","shout out"],"rel":["engagement rate","rapport"]},{"t":"warm-up","p":"n","vi":"phần khởi động đầu phiên","d":"Mấy phút đầu dùng để kéo người vào phòng và tạo tương tác (chào hỏi, minigame, giới thiệu deal sắp tới) trước khi bán chính. Động từ là warm up.","c":"Kịch bản đầu phiên.","ex":[["Use the first five minutes as a warm-up with a mini game.","Dùng năm phút đầu để khởi động bằng minigame."]],"col":["warm up the room","warm-up segment"],"rel":["hook","mini game"]},{"t":"wrap-up","p":"n","vi":"phần kết, chốt phiên","d":"Đoạn cuối phiên: nhắc deal còn lại, nhắc hạn voucher, cảm ơn và hẹn lịch live sau. Cũng dùng cho phần tổng kết cuối cuộc họp. Động từ là wrap up.","c":"Cuối live, cuối họp.","ex":[["During the wrap-up, remind viewers about the next live schedule.","Phần kết nhớ nhắc lịch live tiếp theo."],["Let's wrap up the meeting, we're out of time.","Mình chốt cuộc họp nhé, hết giờ rồi."]],"col":["wrap up","that's a wrap"],"rel":["warm-up","live schedule"]},{"t":"dead air","p":"n","vi":"khoảng lặng trên sóng","d":"Thuật ngữ phát sóng chỉ lúc không có tiếng nói hoặc không có gì xảy ra trên màn hình. Trong live bán hàng, dead air làm người xem rời phòng.","c":"Góp ý cho host, rút kinh nghiệm sau phiên.","ex":[["There were 30 seconds of dead air when the host looked for the product.","Có 30 giây im lặng khi host đi tìm sản phẩm."],["Avoid dead air, keep talking while the team changes the price.","Tránh im lặng, cứ nói tiếp trong lúc team đổi giá."]],"col":["avoid dead air","fill the dead air"],"rel":["pacing","viewer retention"]},{"t":"live schedule","p":"n","vi":"lịch live","d":"Lịch các phiên live sắp tới, thông báo nội bộ và cho người xem.","c":"Đăng lịch lên kênh, nhắc cuối phiên, chia ca host.","ex":[["The live schedule for next week is in the shared folder.","Lịch live tuần sau ở thư mục chung."],["Post the live schedule on the shop page.","Đăng lịch live lên trang shop."]],"col":["weekly schedule","pre-announce","live reminder"],"rel":["live slot","live booking"]},{"t":"live booking","p":"n","vi":"đặt lịch live trước","d":"Tính năng tạo sự kiện live trước để người xem bấm nhắc, khi lên sóng họ nhận thông báo.","c":"Tăng người xem đầu phiên.","ex":[["Create a live booking two days before the mega sale.","Tạo đặt lịch live trước siêu sale hai ngày."]],"col":["event reminder","set a reminder"],"rel":["live schedule"]},{"t":"replay","p":"n","vi":"bản phát lại","d":"Video ghi lại toàn bộ phiên live, xem lại để rút kinh nghiệm hoặc cắt clip ngắn. Còn gọi là recording hoặc VOD.","c":"Đánh giá host, cắt nội dung tái sử dụng.","ex":[["Watch the replay and note where viewers dropped off.","Xem lại bản phát lại và ghi chú chỗ người xem rời đi."]],"col":["live replay","recording","VOD"],"rel":["highlight clip","drop-off"]},{"t":"highlight clip","p":"n","vi":"đoạn cắt nổi bật","d":"Đoạn video ngắn cắt từ phiên live, ví dụ đoạn demo hay hoặc lúc chốt đơn sôi nổi, đăng lại làm video ngắn.","c":"Tái sử dụng nội dung live.","ex":[["Can you cut three highlight clips from last night's live?","Cắt giúp ba đoạn nổi bật từ phiên tối qua nhé?"]],"col":["cut clips","repurpose"],"rel":["replay","repurpose"]},{"t":"post-live report","p":"n","vi":"báo cáo sau live","d":"Báo cáo kết quả của phiên: GMV, đơn, người xem, chỉ số chuyển đổi, sự cố, nhận xét host, đề xuất cải thiện.","c":"Gửi quản lý hoặc brand sau mỗi phiên.","ex":[["Please send the post-live report by 10 AM tomorrow.","Gửi báo cáo sau live trước 10 giờ sáng mai."],["The post-live report shows conversion dropped after 10 PM.","Báo cáo cho thấy chuyển đổi giảm sau 10 giờ tối."]],"col":["session report","daily report","recap"],"rel":["GMV","insight","next steps"]},{"t":"live restriction","p":"n","vi":"bị hạn chế quyền live","d":"Nền tảng giới hạn hoặc khóa tính năng live vì vi phạm quy định, ví dụ nói quá công dụng, sản phẩm cấm, hình ảnh không phù hợp.","c":"Xử lý sự cố, đào tạo host về quy định.","ex":[["Our account got a 7-day live restriction for misleading claims.","Tài khoản bị hạn chế live 7 ngày vì nói sai công dụng."]],"col":["get restricted","appeal","violation"],"rel":["community guidelines","product claims","policy violation"]},{"t":"community guidelines","p":"n","vi":"tiêu chuẩn cộng đồng","d":"Bộ quy định của nền tảng về nội dung được phép và bị cấm. Vi phạm có thể bị gỡ live, giảm phân phối hoặc khóa tài khoản.","c":"Đào tạo host, kiểm duyệt kịch bản.","ex":[["Check the script against TikTok's community guidelines.","Đối chiếu kịch bản với tiêu chuẩn cộng đồng của TikTok."]],"col":["violate the guidelines","comply with"],"rel":["live restriction","policy violation"]},{"t":"simulcast","p":"n, v","vi":"phát đồng thời nhiều nền tảng","d":"Phát cùng một phiên live trên nhiều nền tảng cùng lúc (ví dụ TikTok, Shopee, Facebook). Còn gọi là multistreaming.","c":"Tối ưu nguồn lực host và bối cảnh.","ex":[["We simulcast on Shopee and TikTok to save studio time.","Mình phát đồng thời trên Shopee và TikTok để tiết kiệm phòng quay."]],"col":["multistream","multi-platform"],"rel":["RTMP","stream setup"],"tip":"Kiểm tra quy định từng sàn, một số sàn hạn chế hiển thị nội dung có dấu hiệu phát lại từ nơi khác."},{"t":"on air","p":"adj","vi":"đang phát sóng","d":"Trạng thái đang live. Biển ON AIR thường bật trong phòng quay để mọi người giữ im lặng.","ex":[["Please keep quiet, we're on air.","Giữ im lặng nhé, đang lên sóng."]],"c":"Nhắc team giữ trật tự trong phòng quay.","col":["be on air","off air"],"rel":["go live"]},{"t":"go offline","p":"v","vi":"tắt live, kết thúc phát","d":"Dừng phát trực tiếp. Còn nói end the stream, wrap the live.","ex":[["We'll go offline at 11 PM after the last deal.","Mình tắt live lúc 11 giờ sau deal cuối."]],"c":"Báo kết thúc phiên.","col":["end the stream","sign off"],"rel":["go live","wrap-up"]},{"t":"live room","p":"n","vi":"phòng live","d":"Không gian phát trực tiếp trên nền tảng, nơi người xem vào xem, bình luận và mua hàng. Đôi khi chỉ cả phòng quay thực tế.","ex":[["The live room got crowded right after the voucher drop.","Phòng live đông hẳn ngay sau khi thả voucher."]],"c":"Nói về traffic, không khí phòng live.","col":["enter the live room","live room traffic"],"rel":["entry rate","CCU"]},{"t":"live session plan","p":"n","vi":"kế hoạch phiên live","d":"Tài liệu tổng hợp trước phiên: mục tiêu GMV, sản phẩm, deal, host, ngân sách quảng cáo, kịch bản.","ex":[["Please share the live session plan with the brand by Thursday.","Gửi brand kế hoạch phiên live trước thứ Năm."]],"c":"Họp chuẩn bị, gửi brand duyệt.","col":["session plan","live plan"],"rel":["run of show","product lineup"]},{"t":"live calendar","p":"n","vi":"lịch live tháng","d":"Lịch tổng các phiên trong tháng: ngày, khung giờ, host, brand, chủ đề. Khác live schedule thường hướng tới người xem.","ex":[["Block the 11.11 slots in the live calendar now.","Giữ chỗ các khung 11.11 trong lịch live ngay."]],"c":"Điều phối nhiều brand và host.","col":["monthly calendar","block a slot"],"rel":["live schedule","live slot"]},{"t":"theme live","p":"n","vi":"live theo chủ đề","d":"Phiên live có chủ đề riêng như Live Tết, Live sinh nhật brand, Live chăm da mùa hanh khô, giúp nội dung và deal gắn kết.","ex":[["Next Friday is a theme live for back-to-school.","Thứ Sáu tới là live chủ đề mùa tựu trường."]],"c":"Lên ý tưởng phiên.","col":["themed session"],"rel":["campaign"]},{"t":"marathon live","p":"n","vi":"live xuyên ngày, live dài","d":"Phiên live kéo dài nhiều giờ liên tục (8, 12, 24 giờ), thường vào siêu sale, có nhiều host luân phiên.","ex":[["We're running a 12-hour marathon live on 11.11.","Mình chạy live xuyên 12 tiếng ngày 11.11."]],"c":"Siêu sale, sự kiện lớn.","col":["24-hour live","nonstop live"],"rel":["host rotation","mega sale"]},{"t":"host rotation","p":"n","vi":"luân phiên host","d":"Cách chia ca cho nhiều host trong một phiên dài để giữ năng lượng ổn định.","ex":[["Host rotation every two hours keeps the energy high.","Đổi host mỗi hai tiếng giúp giữ năng lượng."]],"c":"Lên lịch phiên dài.","col":["rotate hosts","shift"],"rel":["host","marathon live"]},{"t":"shift","p":"n","vi":"ca làm việc","d":"Một khoảng thời gian làm việc cố định. Ca sáng morning shift, ca tối night shift.","ex":[["I'm on the night shift this week.","Tuần này mình làm ca tối."]],"c":"Xếp ca team live.","col":["morning shift","night shift","swap shifts"],"rel":["host rotation","handover"]},{"t":"live brief","p":"n","vi":"bản brief phiên live","d":"Thông tin ngắn gọn gửi host trước phiên: sản phẩm, điểm bán, giá, deal, điều cấm nói.","ex":[["Read the live brief before you go on air.","Đọc brief phiên live trước khi lên sóng."]],"c":"Chuẩn bị cho host.","col":["host brief"],"rel":["live script","product claims"]},{"t":"product training","p":"n","vi":"đào tạo sản phẩm","d":"Buổi brand hoặc trưởng nhóm hướng dẫn host và team về sản phẩm: thành phần, công dụng, cách dùng, câu hỏi hay gặp.","ex":[["The brand will run product training for all hosts on Monday.","Brand sẽ đào tạo sản phẩm cho tất cả host vào thứ Hai."]],"c":"Trước khi bán sản phẩm mới.","col":["product knowledge","training session"],"rel":["live brief","product claims"]},{"t":"product knowledge","p":"n","vi":"kiến thức sản phẩm","d":"Mức hiểu biết về sản phẩm để tư vấn chính xác và tự tin.","ex":[["Her product knowledge is excellent, she answers every question.","Kiến thức sản phẩm của cô ấy rất tốt, câu nào cũng trả lời được."]],"c":"Đánh giá host, CS.","col":["strong product knowledge"],"rel":["product training"]},{"t":"product segment","p":"n","vi":"đoạn giới thiệu một sản phẩm","d":"Một vòng trong phiên dành cho một sản phẩm, thường 5 đến 15 phút, lặp lại nhiều lần.","ex":[["Each product segment should end with a clear CTA.","Mỗi đoạn sản phẩm nên kết thúc bằng lời kêu gọi rõ ràng."]],"c":"Thiết kế kịch bản.","col":["segment length","rotate segments"],"rel":["run of show","call to action"]},{"t":"loop","p":"n, v","vi":"vòng lặp kịch bản","d":"Chu kỳ lặp lại nội dung (chào, giới thiệu, deal, chốt) để người mới vào phòng vẫn theo kịp.","ex":[["The script runs in 15-minute loops.","Kịch bản chạy theo vòng lặp 15 phút."]],"c":"Thiết kế kịch bản live dài.","col":["script loop","repeat the loop"],"rel":["live script","pacing"]},{"t":"deal list","p":"n","vi":"danh sách deal","d":"Bảng tổng hợp các ưu đãi trong phiên: sản phẩm, giá gốc, giá live, số lượng, giờ mở.","ex":[["Double-check the deal list against the seller center.","Đối chiếu danh sách deal với kênh người bán."]],"c":"Chuẩn bị và đối chiếu với brand.","col":["deal sheet","final deal list"],"rel":["product lineup","flash sale"]},{"t":"price list","p":"n","vi":"bảng giá","d":"Bảng giá sản phẩm, trong live thường dán cạnh camera để host nhìn.","ex":[["Stick the price list next to the camera.","Dán bảng giá cạnh camera."]],"c":"Hỗ trợ host.","col":["price sheet"],"rel":["deal list","teleprompter"]},{"t":"link check","p":"n","vi":"kiểm tra link sản phẩm","d":"Bước kiểm tra mọi sản phẩm trong giỏ live có đúng giá, đúng phân loại, còn hàng, voucher áp dụng được không.","ex":[["Do a link check 30 minutes before going live.","Kiểm tra link sản phẩm 30 phút trước khi lên sóng."]],"c":"Trước live.","col":["test order","price check"],"rel":["pre-live checklist"]},{"t":"test order","p":"n","vi":"đơn thử","d":"Đặt thử một đơn để kiểm tra giá cuối, voucher, phí ship trước khi mở deal thật.","ex":[["Place a test order to confirm the final price is 199k.","Đặt đơn thử để chắc giá cuối là 199k."]],"c":"Kiểm tra deal.","col":["place a test order"],"rel":["link check","final price"]},{"t":"stock allocation","p":"n","vi":"phân bổ hàng cho live","d":"Số lượng hàng dành riêng cho phiên live hoặc cho từng deal, tách khỏi tồn kho bán thường.","ex":[["Stock allocation for the flash sale is 300 units.","Hàng phân bổ cho flash sale là 300 cái."]],"c":"Chuẩn bị deal.","col":["allocate stock","campaign stock"],"rel":["inventory","flash sale"]},{"t":"sold out","p":"adj","vi":"đã bán hết","d":"Hết hàng sau khi bán. Trong live, sold out là tin vui, host nên thông báo để tạo hiệu ứng khan hiếm cho deal sau.","ex":[["The first batch is sold out, we'll open 100 more at 9 PM.","Đợt đầu đã hết, 9 giờ mở thêm 100 suất."]],"c":"Thông báo trong live.","col":["sell out","completely sold out"],"rel":["out of stock","scarcity"]},{"t":"restock live","p":"n","vi":"mở thêm suất trong live","d":"Bổ sung số lượng deal giữa phiên khi bán hết nhanh, thường do người xem yêu cầu.","ex":[["So many requests, let's restock live with 50 more units.","Nhiều người hỏi quá, mở thêm 50 suất nhé."]],"c":"Phản ứng nhanh khi bán chạy.","col":["add more stock"],"rel":["sold out","restock"]},{"t":"order spike","p":"n","vi":"đơn tăng đột biến","d":"Số đơn tăng vọt trong thời gian ngắn, thường ngay sau công bố giá hoặc thả voucher.","ex":[["We saw an order spike right after the price reveal.","Đơn tăng vọt ngay sau khi công bố giá."]],"c":"Theo dõi dashboard.","col":["traffic spike","sales spike"],"rel":["price reveal","CCU"]},{"t":"traffic push","p":"n","vi":"đẩy traffic","d":"Hoạt động kéo thêm người vào phòng live: chạy quảng cáo, đăng video, thả voucher, mời creator chia sẻ.","ex":[["We need a traffic push before the 9 PM flash sale.","Cần đẩy traffic trước flash sale 9 giờ."]],"c":"Khi CCU thấp.","col":["boost traffic","push traffic"],"rel":["paid traffic","voucher drop"]},{"t":"peak hour","p":"n","vi":"giờ cao điểm","d":"Giờ có nhiều người xem và đơn nhất trong phiên hoặc trong ngày.","ex":[["Our peak hour is 9 to 10 PM.","Giờ cao điểm của mình là 9 đến 10 giờ tối."]],"c":"Phân tích, xếp lịch.","col":["peak time","off-peak"],"rel":["prime time","hourly GMV"]},{"t":"live performance","p":"n","vi":"hiệu quả phiên live","d":"Kết quả tổng thể của phiên qua các chỉ số GMV, đơn, người xem, chuyển đổi.","ex":[["Live performance improved after we changed the opening script.","Hiệu quả live tốt hơn sau khi đổi kịch bản mở đầu."]],"c":"Báo cáo, đánh giá.","col":["track performance","performance review"],"rel":["post-live report","GMV"]},{"t":"live review","p":"n","vi":"họp đánh giá sau live","d":"Buổi họp ngắn sau phiên để xem lại số liệu, đoạn replay và rút kinh nghiệm cho phiên sau.","ex":[["Let's do a 15-minute live review after we go offline.","Tắt live xong họp đánh giá 15 phút nhé."]],"c":"Sau mỗi phiên.","col":["session review","debrief"],"rel":["post-mortem","replay"]},{"t":"debrief","p":"n, v","vi":"họp tổng kết nhanh","d":"Buổi trao đổi ngay sau sự kiện để ghi nhận chuyện gì đã xảy ra. Ngược với brief trước sự kiện.","ex":[["Quick debrief: the lag at 9:10 cost us around 50 orders.","Tổng kết nhanh: giật live lúc 9h10 làm mất khoảng 50 đơn."]],"c":"Sau live, sau sự kiện.","col":["team debrief"],"rel":["brief","live review"]},{"t":"live incident","p":"n","vi":"sự cố trong live","d":"Vấn đề bất ngờ khi đang phát: mất mạng, sai giá, host nói sai, bị cảnh báo vi phạm.","ex":[["Log every live incident in the incident sheet.","Ghi lại mọi sự cố live vào bảng sự cố."]],"c":"Báo cáo, quy trình xử lý.","col":["incident log","incident report"],"rel":["lag","live restriction"]},{"t":"pricing error","p":"n","vi":"lỗi sai giá","d":"Sản phẩm bị cài sai giá (quá thấp hoặc quá cao). Cần dừng bán và xử lý ngay.","ex":[["There's a pricing error on SKU 03, unlist it now.","SKU 03 sai giá, gỡ ngay."]],"c":"Sự cố khẩn.","col":["wrong price","price glitch"],"rel":["live incident","link check"]},{"t":"unlist","p":"v","vi":"gỡ sản phẩm khỏi giỏ live","d":"Tạm gỡ sản phẩm khỏi giỏ hàng hoặc ngừng hiển thị trên sàn. Ngược lại là list hoặc relist.","ex":[["Unlist the red variant until stock arrives.","Gỡ phân loại màu đỏ cho đến khi hàng về."]],"c":"Xử lý sai giá, hết hàng.","col":["relist","delist"],"rel":["listing","pricing error"]},{"t":"warning","p":"n","vi":"cảnh báo vi phạm","d":"Thông báo từ nền tảng rằng nội dung live có dấu hiệu vi phạm. Có thể kèm hạn chế tạm thời.","ex":[["We got a warning for showing a competitor's logo.","Bị cảnh báo vì để lộ logo đối thủ."]],"c":"Đào tạo host, xử lý sự cố.","col":["receive a warning","strike"],"rel":["live restriction","community guidelines"]},{"t":"banned words","p":"n","vi":"từ cấm","d":"Danh sách từ ngữ host không được nói vì vi phạm quy định nền tảng hoặc quảng cáo, ví dụ “chữa khỏi”, “số 1”, “rẻ nhất”.","ex":[["Add 'best in the world' to the banned words list.","Thêm “tốt nhất thế giới” vào danh sách từ cấm."]],"c":"Kiểm duyệt kịch bản.","col":["prohibited words","sensitive words"],"rel":["product claims","compliance"]},{"t":"filler talk","p":"n","vi":"lời nói lấp chỗ trống","d":"Câu nói để tránh khoảng lặng khi team đang đổi giá, tìm sản phẩm. Nên chuẩn bị sẵn nội dung có ích.","ex":[["Prepare some filler talk about skincare tips.","Chuẩn bị sẵn vài câu nói về mẹo chăm da để lấp chỗ trống."]],"c":"Đào tạo host.","col":["small talk"],"rel":["dead air"]},{"t":"viewer","p":"n","vi":"người xem","d":"Người đang xem phòng live. Người xem quen thuộc là regular viewer.","ex":[["Say hi to new viewers every few minutes.","Chào người xem mới vài phút một lần."]],"c":"Nói chuyện chung.","col":["regular viewer","new viewer"],"rel":["unique viewers","CCU"]},{"t":"audience","p":"n","vi":"khán giả, tệp người xem","d":"Nhóm người xem nói chung, hoặc tệp khách mục tiêu.","ex":[["Our live audience is mostly women aged 25 to 34.","Khán giả live chủ yếu là nữ 25 đến 34 tuổi."]],"c":"Phân tích, nội dung.","col":["live audience","audience profile"],"rel":["target audience"]},{"t":"viewer demographics","p":"n","vi":"nhân khẩu học người xem","d":"Thông tin tuổi, giới tính, khu vực của người xem trong phân tích nền tảng.","ex":[["Check the viewer demographics before choosing products.","Xem nhân khẩu học người xem trước khi chọn sản phẩm."]],"c":"Phân tích tệp người xem.","col":["age and gender","location"],"rel":["audience","segmentation"]},{"t":"live commerce agency","p":"n","vi":"agency livestream","d":"Công ty chuyên vận hành live bán hàng cho brand: host, phòng quay, kịch bản, quảng cáo, báo cáo.","ex":[["We hired a live commerce agency for our TikTok Shop.","Bọn mình thuê một agency livestream cho TikTok Shop."]],"c":"Mô tả mô hình.","col":["live agency","MCN"],"rel":["agency","MCN"]},{"t":"self-broadcast","p":"n","vi":"brand tự live","d":"Brand tự vận hành live bằng đội ngũ nội bộ thay vì thuê agency hay KOL.","ex":[["Self-broadcast helps the brand build its own audience.","Tự live giúp brand xây tệp người xem riêng."]],"c":"Chiến lược vận hành.","col":["in-house live","brand live"],"rel":["live commerce agency"]},{"t":"live room layout","p":"n","vi":"bố trí phòng live","d":"Cách sắp xếp host, sản phẩm, đèn, màn hình trong phòng quay.","ex":[["Change the live room layout so products are within reach.","Đổi bố trí phòng để sản phẩm trong tầm tay host."]],"c":"Thiết kế phòng.","col":["set layout"],"rel":["backdrop","props"]},{"t":"product display","p":"n","vi":"trưng bày sản phẩm","d":"Cách bày sản phẩm phía sau hoặc trước host để người xem thấy rõ.","ex":[["Put the hero product in the center of the display.","Đặt sản phẩm chủ lực ở giữa khu trưng bày."]],"c":"Thiết kế phòng.","col":["display shelf","merchandising"],"rel":["merchandising"]},{"t":"live account","p":"n","vi":"tài khoản live","d":"Tài khoản dùng để phát live bán hàng.","ex":[["Our main live account has 500,000 followers.","Tài khoản live chính có 500.000 người theo dõi."]],"c":"Vận hành.","col":["main account","sub-account"],"rel":["account matrix"]}]},{"id":"tech","code":"TECH","group":"Livestream","en":"Streaming Tech & Studio","vi":"Kỹ thuật, thiết bị và phòng quay","intro":"Từ vựng làm việc với team kỹ thuật: phần mềm phát, chất lượng hình, âm thanh, ánh sáng, bố cục khung hình.","terms":[{"t":"stream setup","p":"n","vi":"bố trí kỹ thuật live","d":"Toàn bộ thiết bị và cấu hình cho phiên live: máy quay hoặc điện thoại, đèn, mic, mạng, phần mềm phát, bố cục khung hình.","c":"Kiểm tra trước giờ lên sóng, bàn giao giữa các ca.","ex":[["Let's check the stream setup one hour before going live.","Kiểm tra bố trí kỹ thuật trước giờ lên sóng một tiếng."],["The new stream setup uses two cameras.","Bố trí mới dùng hai máy quay."]],"col":["set up the stream","studio setup","rig"],"rel":["pre-live checklist","streaming software"]},{"t":"streaming software","p":"n","vi":"phần mềm phát live","d":"Phần mềm trên máy tính dùng để ghép nguồn hình, tiếng, lớp hiển thị rồi đẩy lên nền tảng. Phổ biến là OBS Studio, TikTok LIVE Studio.","c":"Phát live bằng máy tính thay vì điện thoại.","ex":[["We switched from phone streaming to streaming software for better quality.","Mình chuyển từ live bằng điện thoại sang phần mềm phát để hình đẹp hơn."]],"col":["OBS","LIVE Studio","broadcast software"],"rel":["OBS","scene","encoder"]},{"t":"OBS","f":"Open Broadcaster Software","p":"abbr","vi":"phần mềm phát live OBS","d":"Phần mềm miễn phí, mã nguồn mở phổ biến nhất để phát trực tiếp và quay màn hình.","c":"Cài đặt cảnh, lớp phủ, nguồn video.","ex":[["Add the price banner as a new source in OBS.","Thêm banner giá thành một nguồn mới trong OBS."]],"col":["OBS scene","OBS source","OBS settings"],"rel":["scene","overlay","stream key"]},{"t":"encoder","p":"n","vi":"bộ mã hóa","d":"Phần mềm hoặc phần cứng nén tín hiệu video để truyền lên mạng. Encoder yếu gây giật, rớt khung.","c":"Xử lý sự cố chất lượng, chọn cấu hình máy.","ex":[["The encoder is overloaded, lower the resolution.","Bộ mã hóa quá tải, giảm độ phân giải xuống."]],"col":["hardware encoder","software encoder","encoder overload"],"rel":["bitrate","frame drop"]},{"t":"bitrate","p":"n","vi":"tốc độ bit","d":"Lượng dữ liệu truyền mỗi giây, tính bằng kbps. Bitrate cao thì hình nét hơn nhưng cần mạng tải lên mạnh hơn.","c":"Cài đặt chất lượng phát, xử lý hình mờ hoặc giật.","fm":"Gợi ý chung: 1080p cần khoảng 4.000 đến 6.000 kbps; 720p khoảng 2.500 đến 4.000 kbps. Tốc độ tải lên nên gấp khoảng 1,5 lần bitrate.","ex":[["Set the bitrate to 4,500 kbps for 1080p.","Đặt bitrate 4.500 kbps cho 1080p."],["The picture is blurry because the bitrate is too low.","Hình bị mờ vì bitrate quá thấp."]],"col":["video bitrate","lower the bitrate","kbps"],"rel":["resolution","upload speed","encoder"]},{"t":"resolution","p":"n","vi":"độ phân giải","d":"Số điểm ảnh của khung hình, ví dụ 720p (1280×720), 1080p (1920×1080). Live dọc thì là 1080×1920.","c":"Cài đặt chất lượng hình.","ex":[["Stream in 1080p if the connection is stable.","Phát 1080p nếu mạng ổn định."]],"col":["high resolution","720p","1080p","full HD"],"rel":["bitrate","aspect ratio"]},{"t":"frame rate","f":"fps, frames per second","p":"n","vi":"tốc độ khung hình","d":"Số khung hình mỗi giây. 30 fps là đủ cho live bán hàng, 60 fps mượt hơn nhưng tốn băng thông.","c":"Cài đặt phát, xử lý hình bị khựng.","ex":[["Keep the frame rate at 30 fps to save bandwidth.","Giữ 30 khung hình mỗi giây để tiết kiệm băng thông."]],"col":["30 fps","60 fps"],"rel":["frame drop","bitrate"]},{"t":"aspect ratio","p":"n","vi":"tỉ lệ khung hình","d":"Tỉ lệ chiều ngang với chiều dọc. Live bán hàng trên điện thoại dùng 9:16 (dọc), video YouTube dùng 16:9 (ngang).","c":"Thiết kế bố cục, banner, cắt clip.","ex":[["All overlays must be designed for a 9:16 aspect ratio.","Mọi lớp phủ phải thiết kế theo tỉ lệ 9:16."]],"col":["9:16","16:9","vertical format"],"rel":["vertical video","overlay"]},{"t":"vertical video","p":"n","vi":"video dọc","d":"Video quay theo chiều dọc, phù hợp xem trên điện thoại. Là định dạng chuẩn của TikTok, Reels, Shorts và live bán hàng.","c":"Quay, dựng nội dung cho mạng xã hội.","ex":[["Shoot everything in vertical video for TikTok.","Quay toàn bộ dạng dọc cho TikTok."]],"col":["shoot vertical","portrait mode"],"rel":["aspect ratio","short-form video"]},{"t":"latency","p":"n","vi":"độ trễ","d":"Khoảng thời gian từ lúc sự việc diễn ra ở phòng quay tới lúc người xem thấy. Độ trễ cao làm host trả lời bình luận bị lệch.","c":"Giải thích vì sao host phản hồi chậm, chọn cấu hình.","ex":[["There's about a 5-second latency, so don't rush the countdown.","Có độ trễ khoảng 5 giây, đừng đếm ngược quá nhanh."]],"col":["low latency","high latency","delay"],"rel":["lag","buffering"]},{"t":"lag","p":"n, v","vi":"giật, chậm, trễ","d":"Hình hoặc tiếng bị chậm, khựng do mạng yếu, máy yếu. Trong nói chuyện thường dùng it's lagging.","c":"Báo lỗi khẩn trong lúc live.","ex":[["The stream is lagging, please check the internet connection.","Live đang giật, kiểm tra kết nối mạng giúp mình."],["Viewers are complaining about lag.","Người xem đang phàn nàn bị giật."]],"col":["it's lagging","laggy","lag spike"],"rel":["buffering","latency","frame drop"]},{"t":"buffering","p":"n","vi":"đang tải, quay vòng","d":"Phía người xem phải chờ video tải, màn hình hiện vòng quay. Thường do mạng phát hoặc mạng người xem.","c":"Xử lý phàn nàn của người xem.","ex":[["Several viewers said the live keeps buffering.","Nhiều người xem nói live cứ quay vòng tải."]],"col":["keeps buffering","buffer"],"rel":["lag","bitrate"]},{"t":"frame drop","p":"n","vi":"rớt khung hình","d":"Một số khung hình không được gửi đi do mạng hoặc máy quá tải, làm hình bị khựng. OBS hiển thị tỉ lệ dropped frames.","c":"Chẩn đoán sự cố kỹ thuật.","ex":[["OBS shows 10% dropped frames, the network is unstable.","OBS báo rớt 10% khung hình, mạng không ổn định."]],"col":["dropped frames","skipped frames"],"rel":["encoder","upload speed"]},{"t":"upload speed","p":"n","vi":"tốc độ tải lên","d":"Tốc độ mạng đẩy dữ liệu lên, quan trọng nhất khi live. Đo bằng Mbps.","c":"Kiểm tra mạng, chọn gói internet cho phòng quay.","ex":[["We need at least 10 Mbps upload speed for two streams.","Cần tối thiểu 10 Mbps tải lên cho hai luồng live."]],"col":["upload bandwidth","speed test","Mbps"],"rel":["bitrate","backup connection"]},{"t":"backup connection","p":"n","vi":"đường truyền dự phòng","d":"Mạng thứ hai (4G, 5G, mạng khác nhà mạng) sẵn sàng thay thế khi mạng chính gặp sự cố. Khái niệm chung là redundancy.","c":"Chuẩn bị cho phiên quan trọng, siêu sale.","ex":[["Always have a 5G backup connection for mega sale lives.","Luôn có đường 5G dự phòng cho các phiên siêu sale."]],"col":["failover","redundancy","bonded connection"],"rel":["upload speed","pre-live checklist"]},{"t":"stream key","p":"n","vi":"khóa luồng phát","d":"Mã bí mật nền tảng cấp để phần mềm phát biết đẩy video vào tài khoản nào. Lộ stream key thì người khác có thể phát lên kênh của bạn.","c":"Cài đặt phát bằng phần mềm.","ex":[["Never share the stream key in group chats.","Đừng bao giờ gửi khóa luồng vào nhóm chat."],["Copy the server URL and stream key into OBS.","Dán địa chỉ máy chủ và khóa luồng vào OBS."]],"col":["server URL","reset the stream key"],"rel":["RTMP","OBS"]},{"t":"RTMP","f":"Real-Time Messaging Protocol","p":"abbr","vi":"giao thức truyền phát RTMP","d":"Giao thức phổ biến để đẩy luồng video từ phần mềm phát lên nền tảng. Nền tảng sẽ cấp RTMP URL và stream key.","c":"Cài đặt phát trên máy tính, phát đồng thời.","ex":[["TikTok gives us an RTMP link only for eligible accounts.","TikTok chỉ cấp link RTMP cho tài khoản đủ điều kiện."]],"col":["RTMP URL","RTMP server"],"rel":["stream key","simulcast"]},{"t":"scene","p":"n","vi":"cảnh (trong phần mềm phát)","d":"Một bố cục màn hình gồm nhiều nguồn (camera, ảnh, chữ). Team chuyển cảnh khi đổi phần trong phiên, ví dụ cảnh chờ, cảnh bán hàng, cảnh cận sản phẩm.","c":"Điều khiển phần mềm phát.","ex":[["Switch to the close-up scene when the host shows the texture.","Chuyển sang cảnh cận khi host cho xem kết cấu sản phẩm."]],"col":["switch scenes","scene transition","starting soon scene"],"rel":["OBS","overlay","close-up"]},{"t":"overlay","p":"n","vi":"lớp phủ hình ảnh","d":"Hình ảnh hoặc chữ đặt chồng lên video: banner giá, logo, khung, mã voucher, đồng hồ đếm ngược.","c":"Thiết kế nhận diện cho phòng live.","ex":[["Update the price overlay before the flash sale starts.","Cập nhật lớp giá trước khi flash sale bắt đầu."],["The overlay covers the product, move it up.","Lớp phủ che mất sản phẩm, đẩy lên trên."]],"col":["price overlay","banner","graphics"],"rel":["lower third","scene"]},{"t":"lower third","p":"n","vi":"dải chữ phía dưới màn hình","d":"Thanh thông tin ở khoảng một phần ba dưới khung hình, thường ghi tên sản phẩm, giá, ưu đãi hoặc tên host. Thuật ngữ gốc từ truyền hình.","c":"Thiết kế hình ảnh trên sóng.","ex":[["Show the product name and price in the lower third.","Hiện tên và giá sản phẩm ở dải chữ phía dưới."]],"col":["lower-third graphic"],"rel":["overlay"]},{"t":"green screen","p":"n","vi":"phông xanh","d":"Phông màu xanh lá giúp phần mềm xóa nền và thay bằng hình khác. Kỹ thuật này gọi là chroma key.","c":"Thay nền phòng live theo chiến dịch.","ex":[["Use the green screen to show the Tet campaign background.","Dùng phông xanh để hiện nền chiến dịch Tết."]],"col":["chroma key","virtual background","key out"],"rel":["scene","backdrop"]},{"t":"backdrop","p":"n","vi":"phông nền, bối cảnh phía sau","d":"Phần nền phía sau host: tường in logo, kệ sản phẩm, phông in. Bối cảnh tổng thể còn gọi là set.","c":"Dựng phòng live theo nhận diện brand.","ex":[["The brand wants a pink backdrop with their logo.","Brand muốn phông nền hồng có logo."]],"col":["set design","branded backdrop"],"rel":["green screen","brand guidelines"]},{"t":"three-point lighting","p":"n","vi":"bố trí ánh sáng ba điểm","d":"Cách đánh đèn cơ bản: key light (đèn chính chiếu mặt), fill light (đèn phụ làm dịu bóng), backlight (đèn sau tách người khỏi nền).","c":"Dựng ánh sáng phòng quay.","ex":[["Use three-point lighting so the host doesn't look flat.","Dùng ánh sáng ba điểm để host không bị phẳng hình."]],"col":["key light","fill light","backlight"],"rel":["key light","ring light","softbox"]},{"t":"key light","p":"n","vi":"đèn chính","d":"Đèn mạnh nhất, chiếu trực tiếp vào chủ thể (host hoặc sản phẩm), đặt chéo 45 độ phía trước.","c":"Chỉnh ánh sáng.","ex":[["The key light is too harsh, add a diffuser.","Đèn chính gắt quá, thêm tấm tản sáng."]],"col":["fill light","diffuser"],"rel":["three-point lighting","softbox"]},{"t":"ring light","p":"n","vi":"đèn vòng","d":"Đèn hình tròn đặt quanh camera, cho ánh sáng đều lên mặt, mắt có đốm sáng tròn. Phổ biến khi live bằng điện thoại.","c":"Live đơn giản, live cận mặt (mỹ phẩm).","ex":[["A ring light is enough for close-up makeup lives.","Một đèn vòng là đủ cho live trang điểm cận mặt."]],"col":["ring light stand"],"rel":["key light","close-up"]},{"t":"softbox","p":"n","vi":"hộp tản sáng","d":"Đèn có hộp vải bao quanh giúp ánh sáng mềm, ít bóng gắt. Dùng phổ biến trong phòng live chuyên nghiệp.","c":"Mua sắm, dựng ánh sáng.","ex":[["Two softboxes make the product colors look more accurate.","Hai hộp tản sáng giúp màu sản phẩm lên chuẩn hơn."]],"col":["diffused light","soft light"],"rel":["three-point lighting","white balance"]},{"t":"white balance","p":"n","vi":"cân bằng trắng","d":"Cài đặt giúp màu trắng hiển thị đúng là trắng, tránh hình bị ám vàng hoặc ám xanh. Rất quan trọng với mỹ phẩm, thời trang vì khách mua theo màu.","c":"Chỉnh máy quay, xử lý phàn nàn sai màu.","ex":[["The lipstick looks orange on camera, fix the white balance.","Son lên hình bị cam, chỉnh lại cân bằng trắng."]],"col":["color temperature","Kelvin","color accuracy"],"rel":["exposure","softbox"]},{"t":"exposure","p":"n","vi":"độ phơi sáng","d":"Độ sáng tối của hình. Overexposed là cháy sáng, underexposed là tối.","c":"Chỉnh camera.","ex":[["The white packaging is overexposed, lower the exposure.","Bao bì trắng bị cháy sáng, giảm phơi sáng xuống."]],"col":["overexposed","underexposed","lock exposure"],"rel":["white balance","key light"]},{"t":"lavalier mic","f":"lav mic","p":"n","vi":"mic cài áo","d":"Micro nhỏ kẹp trên áo host, thu tiếng rõ và ổn định khi host di chuyển. Thường là loại không dây.","c":"Thiết bị âm thanh.","ex":[["Clip the lav mic higher, the voice is too low.","Kẹp mic cao lên, tiếng nhỏ quá."]],"col":["wireless mic","clip-on mic"],"rel":["audio feedback","audio sync"]},{"t":"audio feedback","p":"n","vi":"tiếng hú (hú mic)","d":"Tiếng rít khi mic thu lại âm thanh từ loa. Lưu ý: feedback còn nghĩa là góp ý trong công việc.","c":"Sự cố âm thanh.","ex":[["Turn off the speaker, we're getting audio feedback.","Tắt loa đi, đang bị hú."]],"col":["echo","howling"],"rel":["lavalier mic"],"tip":"Phân biệt với feedback (góp ý) trong giao tiếp công việc."},{"t":"audio sync","p":"n","vi":"đồng bộ tiếng và hình","d":"Tiếng khớp với khẩu hình. Khi lệch thì nói out of sync, chỉnh bằng audio delay trong phần mềm.","c":"Xử lý lỗi kỹ thuật.","ex":[["The audio is out of sync, add a 200 ms delay.","Tiếng bị lệch, thêm độ trễ 200 ms."]],"col":["out of sync","lip sync","audio delay"],"rel":["lavalier mic","latency"]},{"t":"capture card","p":"n","vi":"card thu hình","d":"Thiết bị đưa tín hiệu từ máy ảnh hoặc máy quay vào máy tính để phát live.","c":"Dùng máy ảnh chuyên nghiệp thay webcam.","ex":[["We need a capture card to use the Sony camera for the live.","Cần card thu hình để dùng máy Sony cho live."]],"col":["HDMI capture"],"rel":["streaming software"]},{"t":"close-up","p":"n","vi":"cảnh cận","d":"Góc quay sát để thấy rõ chi tiết sản phẩm: kết cấu kem, đường may, chất liệu. Thường có máy quay riêng cho cảnh cận.","c":"Demo sản phẩm, chuyển cảnh.","ex":[["Give me a close-up of the stitching.","Cho mình cảnh cận đường may."]],"col":["close-up shot","macro","wide shot"],"rel":["scene","product demo"]},{"t":"teleprompter","p":"n","vi":"máy nhắc chữ","d":"Màn hình hiển thị lời thoại hoặc thông tin (giá, mã, ưu đãi) đặt gần camera để host nhìn.","c":"Hỗ trợ host nhớ thông tin.","ex":[["Put the voucher codes on the teleprompter.","Đưa mã voucher lên máy nhắc chữ."]],"col":["prompter","cue card"],"rel":["live script","cue"]},{"t":"camera angle","p":"n","vi":"góc máy","d":"Vị trí và hướng đặt máy quay so với chủ thể: ngang tầm mắt, từ trên xuống, từ dưới lên.","ex":[["Lower the camera angle to eye level.","Hạ góc máy ngang tầm mắt."]],"c":"Bố trí phòng quay.","col":["eye level","high angle","low angle"],"rel":["framing","close-up"]},{"t":"framing","p":"n","vi":"bố cục khung hình","d":"Cách sắp xếp host và sản phẩm trong khung hình: khoảng trống phía trên đầu, sản phẩm nằm đâu.","ex":[["The framing cuts off the top of her head.","Bố cục đang cắt mất đỉnh đầu host."]],"c":"Chỉnh hình ảnh.","col":["headroom","frame the shot"],"rel":["camera angle","rule of thirds"]},{"t":"rule of thirds","p":"n","vi":"quy tắc một phần ba","d":"Chia khung hình thành lưới 3x3, đặt chủ thể ở các đường hoặc giao điểm để hình cân đối, dễ nhìn.","ex":[["Use the rule of thirds when placing the product.","Đặt sản phẩm theo quy tắc một phần ba."]],"c":"Bố cục hình ảnh.","col":["grid lines"],"rel":["framing"]},{"t":"wide shot","p":"n","vi":"cảnh toàn","d":"Góc quay rộng thấy cả người host và bối cảnh.","ex":[["Switch to a wide shot for the outfit try-on.","Chuyển cảnh toàn khi mặc thử trang phục."]],"c":"Chuyển cảnh, thời trang.","col":["full shot","medium shot"],"rel":["close-up","scene"]},{"t":"medium shot","p":"n","vi":"cảnh trung","d":"Góc quay từ khoảng ngực hoặc thắt lưng trở lên, phổ biến nhất trong live bán hàng.","ex":[["Keep the host in a medium shot most of the time.","Phần lớn thời gian giữ host ở cảnh trung."]],"c":"Thiết lập góc máy.","col":["mid shot"],"rel":["wide shot","close-up"]},{"t":"focus","p":"n, v","vi":"lấy nét","d":"Độ rõ của chủ thể. Out of focus là bị mờ nét. Autofocus là tự động lấy nét.","ex":[["The product is out of focus, tap to focus.","Sản phẩm bị mờ nét, chạm để lấy nét."]],"c":"Chỉnh camera khi cận sản phẩm.","col":["autofocus","out of focus","lock focus"],"rel":["close-up","depth of field"]},{"t":"depth of field","p":"n","vi":"độ sâu trường ảnh","d":"Vùng rõ nét trước và sau chủ thể. Nông thì nền mờ (xóa phông), sâu thì mọi thứ đều rõ.","ex":[["A shallow depth of field makes the product stand out.","Độ sâu trường ảnh nông giúp sản phẩm nổi bật."]],"c":"Chọn ống kính, cài đặt máy.","col":["shallow","bokeh"],"rel":["focus"]},{"t":"color grading","p":"n","vi":"chỉnh màu","d":"Điều chỉnh tông màu hình ảnh để đẹp và đúng nhận diện. Trong live thường dùng bộ lọc hoặc LUT.","ex":[["Don't over-do color grading, the product colors must stay accurate.","Đừng chỉnh màu quá, màu sản phẩm phải giữ đúng."]],"c":"Hậu kỳ, cài đặt phát.","col":["LUT","color correction"],"rel":["white balance"]},{"t":"beauty filter","p":"n","vi":"bộ lọc làm đẹp","d":"Hiệu ứng làm mịn da, chỉnh khuôn mặt. Cần cẩn thận khi bán mỹ phẩm vì có thể bị coi là gây hiểu nhầm.","ex":[["Turn off the beauty filter during the skincare demo.","Tắt bộ lọc làm đẹp khi demo chăm da."]],"c":"Quy định live mỹ phẩm.","col":["face filter","skin smoothing"],"rel":["product claims","before and after"]},{"t":"backlight","p":"n","vi":"đèn hậu, ánh sáng sau","d":"Đèn đặt sau chủ thể để tạo viền sáng, tách người khỏi nền. Cũng chỉ tình trạng ngược sáng khi nguồn sáng ở phía sau.","ex":[["The window behind the host causes backlight, close the curtain.","Cửa sổ sau host gây ngược sáng, kéo rèm lại."]],"c":"Ánh sáng phòng quay.","col":["backlit","hair light"],"rel":["three-point lighting","key light"]},{"t":"fill light","p":"n","vi":"đèn phụ","d":"Đèn yếu hơn đèn chính, đặt ở phía đối diện để làm dịu bóng đổ trên mặt.","ex":[["Add a fill light to soften the shadows.","Thêm đèn phụ để làm dịu bóng."]],"c":"Chỉnh ánh sáng.","col":["fill"],"rel":["key light","three-point lighting"]},{"t":"diffuser","p":"n","vi":"tấm tản sáng","d":"Vật liệu mờ đặt trước đèn để ánh sáng mềm hơn, giảm bóng gắt.","ex":[["Put a diffuser on the key light.","Gắn tấm tản sáng lên đèn chính."]],"c":"Chỉnh ánh sáng.","col":["soften the light"],"rel":["softbox","key light"]},{"t":"color temperature","p":"n","vi":"nhiệt độ màu","d":"Độ ấm lạnh của ánh sáng, đo bằng Kelvin: khoảng 3200K ấm vàng, 5600K trắng ban ngày. Không nên trộn đèn khác nhiệt độ màu.","ex":[["All lights should be set to 5600K.","Mọi đèn nên đặt 5600K."]],"c":"Mua đèn, chỉnh máy.","col":["Kelvin","warm light","cool light"],"rel":["white balance"]},{"t":"glare","p":"n","vi":"chói, lóa","d":"Ánh sáng phản chiếu mạnh trên bề mặt bóng như chai thủy tinh, bao bì nhựa, kính.","ex":[["There's glare on the bottle, tilt it a little.","Chai đang bị lóa, nghiêng nhẹ một chút."]],"c":"Quay sản phẩm.","col":["reflection","anti-glare"],"rel":["key light"]},{"t":"tripod","p":"n","vi":"chân máy","d":"Giá ba chân giữ máy quay hoặc điện thoại cố định.","ex":[["Use a tripod so the image doesn't shake.","Dùng chân máy để hình không rung."]],"c":"Thiết bị.","col":["phone holder","mount"],"rel":[]},{"t":"gimbal","p":"n","vi":"tay cầm chống rung","d":"Thiết bị giữ máy ổn định khi di chuyển, hay dùng khi live ngoài trời, live tại kho hoặc chợ.","ex":[["Use a gimbal for the warehouse tour live.","Dùng tay cầm chống rung khi live tham quan kho."]],"c":"Live di động.","col":["stabilizer"],"rel":["tripod"]},{"t":"outdoor live","p":"n","vi":"live ngoài trời","d":"Phiên live quay bên ngoài phòng quay: tại vườn, nhà máy, chợ, cửa hàng. Tạo cảm giác thật nhưng khó kiểm soát âm thanh, mạng.","ex":[["Our outdoor live at the tea farm doubled engagement.","Live ngoài trời ở đồi chè làm tương tác tăng gấp đôi."]],"c":"Live trải nghiệm, live nguồn hàng.","col":["on-location live","factory live"],"rel":["gimbal","backup connection"]},{"t":"multi-camera","p":"adj","vi":"nhiều máy quay","d":"Thiết lập dùng hai máy trở lên (toàn, cận, góc host), chuyển cảnh bằng phần mềm hoặc bàn trộn.","ex":[["A multi-camera setup makes the live look like TV shopping.","Thiết lập nhiều máy quay làm live trông như truyền hình mua sắm."]],"c":"Live chuyên nghiệp.","col":["two-camera setup","switcher"],"rel":["scene","video switcher"]},{"t":"video switcher","p":"n","vi":"bàn trộn hình","d":"Thiết bị chuyển đổi giữa các nguồn camera khi phát. Còn gọi vision mixer.","ex":[["The operator uses a video switcher to cut to the close-up.","Người vận hành dùng bàn trộn để chuyển sang cảnh cận."]],"c":"Live nhiều máy quay.","col":["vision mixer","ATEM"],"rel":["multi-camera"]},{"t":"audio mixer","p":"n","vi":"bàn trộn âm thanh","d":"Thiết bị chỉnh âm lượng và chất lượng từng mic, nhạc nền.","ex":[["Turn the music down on the audio mixer.","Giảm nhạc nền trên bàn trộn âm thanh."]],"c":"Live nhiều mic.","col":["mixer","audio levels"],"rel":["lavalier mic"]},{"t":"background music","p":"n","vi":"nhạc nền","d":"Nhạc phát nhỏ trong live tạo không khí. Phải dùng nhạc có bản quyền hoặc thư viện nhạc của nền tảng.","ex":[["Use background music from the platform library to avoid copyright strikes.","Dùng nhạc nền trong thư viện nền tảng để tránh vi phạm bản quyền."]],"f":"BGM","c":"Cài đặt live.","col":["BGM","royalty-free music"],"rel":["copyright"]},{"t":"copyright","p":"n","vi":"bản quyền","d":"Quyền sở hữu với nhạc, hình ảnh, video. Dùng nội dung có bản quyền khi chưa được phép có thể bị tắt tiếng, gỡ hoặc hạn chế live.","ex":[["The live was muted for copyright music.","Live bị tắt tiếng vì nhạc có bản quyền."]],"c":"Quy định nội dung.","col":["copyright strike","copyright-free"],"rel":["community guidelines"]},{"t":"echo","p":"n","vi":"tiếng vang","d":"Âm thanh dội lại trong phòng trống. Giảm bằng thảm, rèm, tấm tiêu âm.","ex":[["The room has too much echo, add some foam panels.","Phòng vang quá, thêm vài tấm tiêu âm."]],"c":"Xử lý âm thanh phòng quay.","col":["reverb","acoustic panels"],"rel":["audio feedback"]},{"t":"background noise","p":"n","vi":"tiếng ồn nền","d":"Âm thanh không mong muốn như quạt, xe cộ, người nói chuyện.","ex":[["Turn on noise suppression to cut the background noise.","Bật lọc ồn để giảm tiếng ồn nền."]],"c":"Xử lý âm thanh.","col":["noise suppression","noise gate"],"rel":["echo"]},{"t":"audio levels","p":"n","vi":"mức âm lượng","d":"Độ lớn của tín hiệu âm thanh. Quá cao thì bị rè (clipping), quá thấp thì người xem không nghe rõ.","ex":[["Check the audio levels, the host is peaking.","Kiểm tra mức âm lượng, host đang bị vượt ngưỡng."]],"c":"Chỉnh âm thanh.","col":["clipping","peaking","gain"],"rel":["audio mixer"]},{"t":"mute","p":"v","vi":"tắt tiếng","d":"Tắt âm thanh của mic hoặc của cả phiên. Unmute là bật lại.","ex":[["You're on mute, we can't hear you.","Bạn đang tắt tiếng, không nghe được."]],"c":"Sự cố âm thanh.","col":["unmute","on mute"],"rel":["audio levels"]},{"t":"second monitor","p":"n","vi":"màn hình phụ","d":"Màn hình thêm cho live operator theo dõi bình luận và số liệu, hoặc cho host xem lại hình đang phát.","ex":[["Put the comment feed on the second monitor facing the host.","Đặt màn hình phụ hiện bình luận hướng về host."]],"c":"Bố trí phòng quay.","col":["confidence monitor","dual screens"],"rel":["real-time dashboard"]},{"t":"preview","p":"n, v","vi":"xem trước","d":"Xem hình trước khi phát. Trong phần mềm phát, chế độ preview cho phép chỉnh cảnh mà người xem không thấy.","ex":[["Set up the next scene in preview first.","Dựng cảnh tiếp theo ở chế độ xem trước."]],"c":"Chỉnh cảnh khi đang phát.","col":["preview mode","program"],"rel":["scene","OBS"]},{"t":"test stream","p":"n","vi":"phát thử","d":"Phát ở chế độ riêng tư hoặc tài khoản phụ để kiểm tra hình, tiếng, mạng trước khi live thật.","ex":[["Run a private test stream at 7 PM.","Phát thử ở chế độ riêng tư lúc 7 giờ."]],"c":"Trước phiên quan trọng.","col":["private stream","dry run"],"rel":["rehearsal"]},{"t":"stream health","p":"n","vi":"tình trạng luồng phát","d":"Chỉ báo chất lượng kết nối trong phần mềm hoặc nền tảng: tốt, trung bình, kém.","ex":[["Stream health turned red, switch to the backup connection.","Tình trạng luồng chuyển đỏ, chuyển sang đường dự phòng."]],"c":"Giám sát kỹ thuật.","col":["connection status"],"rel":["backup connection","frame drop"]},{"t":"ethernet","p":"n","vi":"mạng dây","d":"Kết nối internet bằng cáp, ổn định hơn wifi. Luôn ưu tiên khi live.","ex":[["Always stream over ethernet, not wifi.","Luôn phát bằng mạng dây, đừng dùng wifi."]],"c":"Thiết lập mạng.","col":["wired connection","LAN cable"],"rel":["upload speed"]},{"t":"power backup","p":"n","vi":"nguồn điện dự phòng","d":"UPS, máy phát điện hoặc sạc dự phòng để live không bị gián đoạn khi mất điện.","ex":[["The UPS gives us 30 minutes of power backup.","Bộ lưu điện cho mình 30 phút điện dự phòng."]],"c":"Chuẩn bị phòng quay.","col":["UPS","generator","power bank"],"rel":["backup connection"]},{"t":"phone streaming","p":"n","vi":"live bằng điện thoại","d":"Phát trực tiếp bằng ứng dụng trên điện thoại. Dễ dùng, linh hoạt nhưng ít tùy chỉnh hơn phần mềm máy tính.","ex":[["For outdoor lives we use phone streaming.","Live ngoài trời bọn mình dùng điện thoại."]],"c":"Thiết lập đơn giản.","col":["mobile live"],"rel":["streaming software"]},{"t":"studio","p":"n","vi":"phòng quay, studio","d":"Không gian dựng sẵn để livestream hoặc quay nội dung.","ex":[["We have four studios running at the same time.","Bọn mình có bốn phòng quay chạy cùng lúc."]],"c":"Thuê, đặt lịch phòng quay.","col":["live studio","studio booking"],"rel":["backdrop","stream setup"]},{"t":"props","p":"n","vi":"đạo cụ","d":"Vật dụng hỗ trợ demo và trang trí: bình xịt, khăn, gương, mẫu da, bảng giá.","ex":[["Prepare all props before the rehearsal.","Chuẩn bị hết đạo cụ trước buổi tập."]],"c":"Chuẩn bị phòng quay.","col":["prop table","demo props"],"rel":["product demo"]},{"t":"camera feed","p":"n","vi":"nguồn hình camera","d":"Tín hiệu hình từ một máy quay vào phần mềm phát.","ex":[["Camera 2's feed is frozen.","Nguồn hình máy 2 bị đứng."]],"c":"Kỹ thuật.","col":["video feed","source"],"rel":["scene"]},{"t":"frozen","p":"adj","vi":"đứng hình","d":"Hình không chuyển động nữa do lỗi.","ex":[["The stream is frozen on viewers' side.","Live bị đứng hình phía người xem."]],"c":"Báo lỗi.","col":["freeze","stuck"],"rel":["lag"]},{"t":"black screen","p":"n","vi":"màn hình đen","d":"Không có hình hiển thị.","ex":[["Viewers see a black screen, check the capture card.","Người xem thấy màn hình đen, kiểm tra card thu hình."]],"c":"Báo lỗi.","col":["no signal"],"rel":["capture card"]},{"t":"restart","p":"v","vi":"khởi động lại","d":"Tắt và mở lại thiết bị hoặc phần mềm.","ex":[["Restart the encoder and go live again.","Khởi động lại bộ mã hóa rồi phát lại."]],"c":"Xử lý sự cố.","col":["reboot","relaunch"],"rel":["troubleshoot"]},{"t":"overheating","p":"n","vi":"quá nhiệt","d":"Thiết bị nóng quá mức, có thể làm điện thoại tự tắt hoặc giảm chất lượng.","ex":[["The phone is overheating, add a cooling fan.","Điện thoại đang quá nóng, thêm quạt tản nhiệt."]],"c":"Live bằng điện thoại.","col":["cooling fan","overheat"],"rel":["phone streaming"]}]},{"id":"sell","code":"SELL","group":"Livestream","en":"Live Selling & Scripting","vi":"Kỹ năng bán hàng và kịch bản","intro":"Ngôn ngữ của nghệ thuật chốt đơn: tâm lý người mua, cấu trúc lời thoại, kỹ thuật tạo gấp gáp và xử lý từ chối.","terms":[{"t":"hook","p":"n","vi":"câu móc, điểm thu hút đầu","d":"Câu nói, hành động hoặc hình ảnh trong vài giây đầu để giữ người xem lại. Ví dụ một câu hỏi gây tò mò, một con số sốc, một màn demo.","c":"Mở đầu phiên, mở đầu mỗi vòng giới thiệu sản phẩm, video ngắn.","ex":[["Start with a strong hook: Only 50 sets at this price tonight!","Mở đầu bằng câu móc mạnh: Chỉ 50 set giá này tối nay!"],["The hook in the first three seconds decides if people stay.","Câu móc trong ba giây đầu quyết định người ta có ở lại không."]],"col":["strong hook","opening hook",
